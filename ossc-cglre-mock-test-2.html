<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gyana Education Service – OSSC CGLRE (Specialist) 2025 Preliminary Examination – Free Online CBT Mock Test-2 (TCS pattern)">
<title>OSSC CGLRE (Specialist) Prelim – Mock Test-2 | Gyana Education Service</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: TCS iON-style exam console — header strip, question pane left, palette right; light-only by design (mirrors the real exam screen) */
:root{
  --ink:#1b2430; --muted:#5d6b7c; --line:#cfd8e3; --paper:#ffffff; --wash:#eef3f8;
  --brand:#0b4f8a; --brand-2:#1167b1; --brand-ink:#ffffff; --head:#e9eef4;
  --ans:#2e9e3f; --nans:#e2502b; --nv:#e3e6ea; --nv-b:#b9c1cb; --mark:#6a3fb5; --gold:#f4b400;
  --ok:#1f8a3b; --ok-wash:#e5f5e8; --bad:#c8352a; --bad-wash:#fdeceb; --info-wash:#fff8e1;
  --f:Arial, "Helvetica Neue", Helvetica, "Noto Sans", sans-serif;
  color-scheme: light;
}
html,body{height:100%}
#app{height:100%}
body{background:var(--wash);color:var(--ink);font-family:var(--f);font-size:14px;}
*{box-sizing:border-box}
button{font-family:var(--f);cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.screen{min-height:100%;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top brand strip */
.topbar{background:var(--brand);color:var(--brand-ink);padding-block:8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px;border:2px solid var(--gold);flex:none}
.tb-text{min-width:0;flex:1 1 220px}
.tb-org{font-weight:700;letter-spacing:1.2px;font-size:15px}
.tb-exam{font-size:12.5px;opacity:.92}
.tb-right{font-size:12px;text-align:right;opacity:.92}

/* login */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding-block:28px}
.login{display:grid;grid-template-columns:1fr 1fr;max-width:860px;width:100%;background:var(--paper);border:1px solid var(--line);box-shadow:0 2px 10px rgba(11,79,138,.08)}
.login-info{background:var(--head);padding:24px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line)}
.login-info .row{display:flex;gap:8px;font-size:13.5px}
.login-info .k{color:var(--muted);min-width:118px}
.login-info .v{font-weight:700}
.login-form{padding:24px;display:flex;flex-direction:column;gap:12px}
.login-form h2{margin:0 0 4px;font-size:18px;color:var(--brand)}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:9px 10px;border:1px solid var(--nv-b);border-radius:3px;font-size:14px;font-family:var(--f)}
.btn{border:1px solid var(--nv-b);background:var(--paper);color:var(--ink);padding:9px 16px;border-radius:3px;font-size:13.5px}
.btn:hover{background:var(--head)}
.btn-primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff;font-weight:700}
.btn-primary:hover{background:var(--brand)}
.btn-primary:disabled{background:#9db8d3;border-color:#9db8d3;cursor:not-allowed}
.btn-green{background:var(--ans);border-color:var(--ans);color:#fff;font-weight:700}
.btn-green:hover{filter:brightness(.92)}
.note{font-size:12px;color:var(--muted);line-height:1.5}

/* instructions */
.instr{flex:1;padding-block:18px;display:flex;justify-content:center}
.instr-card{background:var(--paper);border:1px solid var(--line);max-width:980px;width:100%;display:flex;flex-direction:column}
.instr-head{background:var(--head);padding:12px 18px;font-weight:700;color:var(--brand);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.instr-body{padding:16px 22px;line-height:1.6;font-size:13.5px;overflow:auto}
.instr-body h3{font-size:14px;margin:14px 0 6px;color:var(--brand)}
.instr-body ol{padding-left:22px;margin:6px 0}
.instr-body li{margin-bottom:5px}
.legend-list{display:grid;gap:8px;margin:8px 0 8px 4px}
.legend-list div{display:flex;align-items:center;gap:10px}
.pattern{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.pattern th,.pattern td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.pattern th{background:var(--head)}
.pattern td.n{text-align:center;font-variant-numeric:tabular-nums}
.instr-foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;flex-direction:column;gap:12px}
.declare{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5}
.declare input{margin-top:3px;width:16px;height:16px;flex:none}
.instr-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* exam */
.exam{height:100%;display:flex;flex-direction:column}
.exam-main{flex:1;display:flex;min-height:0}
.qpane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper);border-right:1px solid var(--line)}
.secbar{display:flex;align-items:center;gap:8px;background:var(--head);border-bottom:1px solid var(--line);padding-block:6px;flex-wrap:wrap}
.secbar .lbl{font-weight:700;font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.tab{border:1px solid var(--nv-b);background:var(--paper);padding:6px 10px;font-size:12.5px;border-radius:3px 3px 0 0;color:var(--brand)}
.tab.on{background:var(--brand-2);color:#fff;border-color:var(--brand-2);font-weight:700}
.timer{font-weight:700;font-size:13px;background:var(--paper);border:1px solid var(--nv-b);padding:6px 10px;border-radius:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer b{color:var(--brand)}
.timer.low b{color:var(--bad)}
.qtype{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;padding-block:7px;border-bottom:1px solid var(--line);color:var(--muted)}
.qtype .mk span{color:var(--ok);font-weight:700}
.qtype .mk em{color:var(--bad);font-style:normal;font-weight:700}
.qhead{display:flex;justify-content:space-between;align-items:center;padding-block:9px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.qhead h2{margin:0;font-size:15px}
.qhead .lang{font-size:12px;color:var(--muted)}
.qhead select{font-size:12px;padding:2px 4px}
.qbody{flex:1;overflow:auto;padding-block:14px 20px;min-height:0}
.qtext{font-size:calc(15.5px*var(--fs,1));line-height:1.65;max-width:78ch}
.qtext b{font-weight:700}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px;max-width:78ch}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border:1px solid transparent;border-radius:3px;cursor:pointer;font-size:calc(15px*var(--fs,1));line-height:1.5}
.opt:hover{background:#f3f7fb;border-color:var(--line)}
.opt input{margin-top:4px;width:16px;height:16px;flex:none;accent-color:var(--brand-2)}
.opt.sel{background:#eaf2fb;border-color:#a9c6e6}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--head);padding-block:9px;padding-bottom:max(9px,env(safe-area-inset-bottom,0px))}
.actions .l{display:flex;gap:8px;flex-wrap:wrap}

/* palette */
.palette{width:300px;flex:none;display:flex;flex-direction:column;background:#f7f9fc;min-height:0}
.cand{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.cand svg{width:50px;height:58px;flex:none;border:1px solid var(--line);background:var(--head)}
.cand .nm{font-weight:700;font-size:13.5px;word-break:break-word}
.cand .roll{font-size:12px;color:var(--muted)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:11.5px;line-height:1.25}
.legend .it{display:flex;align-items:center;gap:6px}
.legend .it.wide{grid-column:1/-1}
.pal-sec{background:var(--brand-2);color:#fff;font-weight:700;font-size:12.5px;padding:6px 12px}
.pal-choose{font-size:12px;color:var(--muted);padding:8px 12px 2px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:9px 6px;padding:8px 12px 12px;align-content:start;min-height:0}
.pal-foot{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:var(--head);padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.pal-foot .btn-green{grid-column:1/-1}

/* status shapes */
.st{width:38px;height:33px;display:inline-grid;place-items:center;font-size:12.5px;font-weight:700;position:relative;border:1px solid transparent;font-variant-numeric:tabular-nums;flex:none;padding:0}
.st.sm{width:28px;height:25px;font-size:11px}
.st.nv{background:var(--nv);border-color:var(--nv-b);color:var(--ink);border-radius:3px}
.st.na{background:var(--nans);color:#fff;border-radius:2px 2px 14px 14px / 2px 2px 9px 9px}
.st.an{background:var(--ans);color:#fff;border-radius:14px 14px 2px 2px / 9px 9px 2px 2px}
.st.mk{background:var(--mark);color:#fff;border-radius:50%}
.st.am{background:var(--mark);color:#fff;border-radius:50%}
.st.am::after{content:"";position:absolute;right:-3px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--ans);border:2px solid #fff;box-sizing:border-box}
.st.sm.am::after{width:10px;height:10px;right:-3px;bottom:-2px}
.grid .st{justify-self:center;cursor:pointer}
.grid .st.cur{outline:2px solid var(--gold);outline-offset:2px}

/* figures */
.fig{margin:14px 0 4px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.word{font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:30px;letter-spacing:2px;color:#13294b;padding:6px 14px;border:1px dashed var(--nv-b);background:#fff}
.mirror-line{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:2px}
.mirror-line i{display:block;width:4px;height:58px;background:linear-gradient(#6aa3db,#2b6cb0)}
.water-wrap{display:flex;flex-direction:column;gap:3px}
.water-line{height:5px;background:repeating-linear-gradient(90deg,#4a90d9 0 10px,#9cc5ef 10px 20px);border-radius:3px}
.optfig{display:inline-block;font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:22px;letter-spacing:2px;color:#13294b}
.optfig.M{transform:scaleX(-1)} .optfig.W{transform:scaleY(-1)} .optfig.R{transform:rotate(180deg)}
.dice{display:flex;gap:26px;flex-wrap:wrap}
.dice figure{margin:0;text-align:center;font-size:12px;color:var(--muted)}
.dice svg{width:120px;height:120px;display:block}

.figimg{display:block;max-width:100%;height:auto;border:1px solid var(--line);background:#fff;margin:8px 0;cursor:zoom-in}
.zoomwrap{overflow:auto;max-height:75vh}.zoomwrap img{display:block;width:760px;max-width:none;height:auto}
.zhint{font-size:11.5px;color:var(--muted);margin:2px 0 0}
.passage{background:#f6f9fd;border:1px solid #c9d8ea;border-left:4px solid var(--brand-2);padding:10px 12px;margin:0 0 14px;font-size:calc(14px*var(--fs,1));line-height:1.6;max-width:78ch}
.passage summary{cursor:pointer;font-weight:700;color:var(--brand)}
.ptitle{font-weight:700;color:var(--brand);margin-bottom:4px}
.ptbl{overflow-x:auto;margin-top:8px}
.ptbl table{border-collapse:collapse;font-size:13.5px;background:#fff;min-width:320px}
.ptbl th,.ptbl td{border:1px solid #b9c7d8;padding:5px 9px;text-align:center}
.ptbl th{background:#e3ecf6}
.ptbl td:first-child{text-align:left;font-weight:700}
.fsz{display:inline-flex;gap:4px;align-items:center;margin-left:8px}
.fsz button{padding:2px 8px;font-size:12px}
.btn-out{border-color:#c8352a;color:#c8352a;font-weight:700}
.btn-out:hover{background:#fdeceb}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,30,50,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--paper);max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal-h{background:var(--brand);color:#fff;padding:10px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-h button{background:transparent;border:0;color:#fff;font-size:20px;line-height:1}
.modal-b{padding:14px 16px;overflow:auto}
.modal-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
.sumtbl{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.sumtbl th,.sumtbl td{border:1px solid var(--line);padding:7px 8px;text-align:center;font-variant-numeric:tabular-nums}
.sumtbl th{background:var(--head);font-size:12px}
.sumtbl td:first-child,.sumtbl th:first-child{text-align:left}
.sumtbl tr.tot td{font-weight:700;background:#f7f9fc}
.qp-item{border-bottom:1px solid var(--line);padding:10px 0;font-size:13.5px;line-height:1.55}
.qp-item .n{font-weight:700;color:var(--brand)}

/* result */
.result{flex:1;padding-block:18px 30px;display:flex;flex-direction:column;align-items:center;gap:16px}
.rcard{background:var(--paper);border:1px solid var(--line);max-width:1000px;width:100%}
.rhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.rhead h2{margin:0;font-size:18px;color:var(--brand)}
.score-row{display:grid;grid-template-columns:auto 1fr;gap:22px;padding:18px;align-items:center}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:30px;display:block;font-variant-numeric:tabular-nums}
.ring .c span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;width:100%}
.stat{border:1px solid var(--line);padding:10px 12px}
.stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.stat.ok .v{color:var(--ok)} .stat.bad .v{color:var(--bad)}
.verdict{margin:0 18px 16px;padding:10px 14px;background:var(--info-wash);border:1px solid #f1d68a;font-size:13.5px;line-height:1.5}
.secbars{padding:4px 18px 18px;display:grid;gap:10px}
.sb{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.sb .bar{height:14px;background:var(--nv);position:relative;overflow:hidden;border-radius:2px}
.sb .bar i{position:absolute;inset:0 auto 0 0;background:var(--brand-2)}
.sb .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center}
.chip{border:1px solid var(--nv-b);background:var(--paper);padding:5px 10px;border-radius:14px;font-size:12.5px}
.chip.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.sol{padding:14px 18px;border-bottom:1px solid var(--line)}
.sol-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.pill{padding:2px 8px;border-radius:10px;font-weight:700;font-size:11.5px}
.pill.ok{background:var(--ok-wash);color:var(--ok)} .pill.bad{background:var(--bad-wash);color:var(--bad)} .pill.skip{background:var(--nv);color:var(--muted)}
.sol .qtext{font-size:14.5px}
.sopts{display:grid;gap:6px;margin:10px 0}
.sopt{padding:7px 10px;border:1px solid var(--line);border-radius:3px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.sopt .L{font-weight:700;color:var(--muted);flex:none}
.sopt.right{background:var(--ok-wash);border-color:#9fd3ac}
.sopt.wrong{background:var(--bad-wash);border-color:#efb1ab}
.sopt .tag{margin-left:auto;font-size:11.5px;font-weight:700;white-space:nowrap}
.sopt.right .tag{color:var(--ok)} .sopt.wrong .tag{color:var(--bad)}
.exp{background:#f4f8fc;border-left:3px solid var(--brand-2);padding:9px 12px;font-size:13.5px;line-height:1.6}
.exp h4{margin:0 0 4px;font-size:12px;letter-spacing:.6px;color:var(--brand);text-transform:uppercase}
.empty{padding:22px 18px;color:var(--muted)}

.palette-toggle{display:none}
.site-foot{flex:none;min-height:64px;display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;background:#0a3f6e;color:#dbe8f6;font-size:12px;padding-block:8px;padding-right:max(210px,env(safe-area-inset-right,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.site-foot b{color:#fff}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff8e1;border:1px solid #f1d68a;color:#5b4300;padding:10px 16px;font-weight:700;font-size:13.5px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.15);max-width:calc(100% - 32px);text-align:center}
.cta{margin:0 18px 16px;padding:12px 14px;border:1px solid #9fc0e3;background:#eef5fc;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:13.5px;line-height:1.5}
.cta a,.ractions a{text-decoration:none}
.btn-wa{background:#1f9d55;border-color:#1f9d55;color:#fff;font-weight:700;display:inline-block}
.btn-wa:hover{filter:brightness(.92)}
.topics{padding:0 18px 18px}
.topics h3{font-size:14px;margin:0 0 8px;color:var(--brand)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid #efb1ab;background:var(--bad-wash);color:#7a1f17;padding:4px 10px;border-radius:12px;font-size:12.5px}
.tchip b{font-variant-numeric:tabular-nums}
.ractions{display:flex;gap:8px;flex-wrap:wrap}
.result{padding-bottom:84px}
@media print{.topbar .tb-right,.site-foot,.ractions,#filters,.cta,#logout,#retake,.toast{display:none!important}body{background:#fff}.rcard{border:0}.sol{break-inside:avoid}}
@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login-info{border-right:0;border-bottom:1px solid var(--line)}
  .palette{position:fixed;top:0;right:0;bottom:0;width:min(320px,88vw);z-index:40;box-shadow:-6px 0 18px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px)}
  .palette.open{transform:none}
  .palette{bottom:64px}
  .site-foot{padding-right:max(170px,env(safe-area-inset-right,0px));font-size:11px}
  .site-foot span:nth-child(2){display:none}
  .palette-toggle{display:inline-block}
  .tb-right{flex:1 1 100%;text-align:left}
  .exam .tb-right{display:none}
  .secbar .lbl{display:none}
  .tabs{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .tab{white-space:nowrap;flex:none}
  .timer{margin-right:auto}
  .score-row{grid-template-columns:1fr;justify-items:center}
  .sb{grid-template-columns:110px 1fr 56px}
  .qtext{font-size:calc(15px*var(--fs,1))}
  .secbar{gap:6px}
  .timer{font-size:12.5px;padding:5px 8px}
}
@media (prefers-reduced-motion:reduce){.palette{transition:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const DATA = {"sections": [["A", "Arithmetic"], ["B", "Data Interpretation"], ["C", "Reasoning & GMA"], ["D", "Current Events"], ["E", "Computer Awareness"]], "qs": [{"s": "A", "t": "Number System", "q": "What is the largest 4-digit number exactly divisible by 88?", "o": ["9900", "9988", "9856", "9944"], "a": 3, "e": "9999 ÷ 88 leaves remainder 55 (88 × 113 = 9944). Largest 4-digit multiple = 9999 − 55 = <b>9944</b>.", "f": null, "p": null}, {"s": "A", "t": "LCM & HCF", "q": "Three ropes of lengths 84 m, 98 m and 126 m are to be cut into pieces of equal length, as long as possible. How many pieces will be obtained in all?", "o": ["21", "22", "24", "14"], "a": 1, "e": "Piece length = HCF(84, 98, 126) = 14 m. Pieces = (84 + 98 + 126) ÷ 14 = 308 ÷ 14 = <b>22</b>.", "f": null, "p": null}, {"s": "A", "t": "Approximation", "q": "What approximate value should come in place of ?<br>449.98 ÷ 14.99 × 4.01 + (19.97)² = ?", "o": ["560", "520", "500", "480"], "a": 1, "e": "≈ 450 ÷ 15 × 4 + 20² = 30 × 4 + 400 = <b>520</b>.", "f": null, "p": null}, {"s": "A", "t": "Indices & Surds", "q": "Find the value of (256)<sup>0.16</sup> × (16)<sup>0.18</sup>.", "o": ["8", "4", "2", "16"], "a": 1, "e": "256 = 2⁸ and 16 = 2⁴ ⇒ 2<sup>8×0.16</sup> × 2<sup>4×0.18</sup> = 2<sup>1.28 + 0.72</sup> = 2² = <b>4</b>.", "f": null, "p": null}, {"s": "A", "t": "Number Series", "q": "Find the next term of the series: 5, 9, 25, 61, 125, ?", "o": ["225", "221", "189", "230"], "a": 0, "e": "Differences: 4, 16, 36, 64 = 2², 4², 6², 8². Next difference = 10² = 100 ⇒ 125 + 100 = <b>225</b>.", "f": null, "p": null}, {"s": "A", "t": "Average", "q": "The average weight of 8 persons increases by 2.5 kg when a new person comes in place of one of them weighing 65 kg. What is the weight of the new person?", "o": ["75 kg", "90 kg", "80 kg", "85 kg"], "a": 3, "e": "Total increase = 8 × 2.5 = 20 kg ⇒ new person = 65 + 20 = <b>85 kg</b>.", "f": null, "p": null}, {"s": "A", "t": "Average", "q": "The average age of 30 students of a class is 15 years. When the teacher's age is also included, the average increases by 1 year. What is the age of the teacher?", "o": ["45 years", "47 years", "31 years", "46 years"], "a": 3, "e": "Total of 30 students = 450. With the teacher, 31 × 16 = 496 ⇒ teacher = 496 − 450 = <b>46 years</b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage", "q": "One number is 20% more than another, and the second number is 12 less than the first. What is the sum of the two numbers?", "o": ["144", "120", "108", "132"], "a": 3, "e": "Let the second = x ⇒ first = 1.2x ⇒ 0.2x = 12 ⇒ x = 60, first = 72. Sum = <b>132</b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage – Savings", "q": "Ravi spends 75% of his income. If his income increases by 20% and his expenditure increases by 10%, by what per cent do his savings increase?", "o": ["45%", "50%", "40%", "30%"], "a": 1, "e": "Income 100 → 120; expenditure 75 → 82.5; savings 25 → 37.5 ⇒ increase = 12.5/25 × 100 = <b>50%</b>.", "f": null, "p": null}, {"s": "A", "t": "Ratio & Proportion", "q": "The ratio of boys to girls in a class is 5 : 4. If 6 boys leave and 6 girls join, the ratio becomes 1 : 1. How many students were there in the class originally?", "o": ["96", "120", "108", "90"], "a": 2, "e": "5x − 6 = 4x + 6 ⇒ x = 12 ⇒ original strength = 9x = <b>108</b>.", "f": null, "p": null}, {"s": "A", "t": "Partnership", "q": "A and B are partners. A, the working partner, gets 10% of the profit as salary, and the rest is shared between A and B in the ratio 3 : 2. If the total profit is ₹50,000, what does A get in all?", "o": ["₹27,000", "₹30,000", "₹35,000", "₹32,000"], "a": 3, "e": "Salary = ₹5,000; remaining ₹45,000 × 3/5 = ₹27,000. A gets 5,000 + 27,000 = <b>₹32,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Profit & Loss", "q": "A dealer sold an article at a profit of 12%. Had he sold it for ₹90 more, he would have gained 18%. What is the cost price?", "o": ["₹1,350", "₹1,200", "₹1,800", "₹1,500"], "a": 3, "e": "18% − 12% = 6% of CP = ₹90 ⇒ CP = <b>₹1,500</b>.", "f": null, "p": null}, {"s": "A", "t": "Discount", "q": "A shopkeeper marks his goods 50% above the cost price and allows two successive discounts of 10% and 20%. What is his profit per cent?", "o": ["8%", "12%", "10%", "6%"], "a": 0, "e": "CP 100 ⇒ MP 150 ⇒ SP = 150 × 0.9 × 0.8 = 108 ⇒ profit = <b>8%</b>.", "f": null, "p": null}, {"s": "A", "t": "Simple Interest", "q": "A sum lent at simple interest amounts to ₹9,800 in 5 years and ₹12,005 in 8 years. What is the rate of interest per annum?", "o": ["15%", "12%", "10%", "9%"], "a": 1, "e": "Interest for 3 years = 12,005 − 9,800 = 2,205 ⇒ 735 per year. Principal = 9,800 − 5 × 735 = 6,125.<br>Rate = 735/6,125 × 100 = <b>12%</b>.", "f": null, "p": null}, {"s": "A", "t": "Compound Interest", "q": "What is the compound interest on ₹10,000 for 3 years at 10% per annum, compounded annually?", "o": ["₹3,310", "₹3,210", "₹3,410", "₹3,000"], "a": 0, "e": "Amount = 10,000 × 1.1³ = 13,310 ⇒ CI = <b>₹3,310</b>.", "f": null, "p": null}, {"s": "A", "t": "CI vs SI", "q": "What is the ratio of compound interest to simple interest on a sum for 2 years at 10% per annum?", "o": ["11 : 10", "20 : 21", "21 : 20", "10 : 9"], "a": 2, "e": "On ₹100: CI = 21, SI = 20 ⇒ <b>21 : 20</b>.", "f": null, "p": null}, {"s": "A", "t": "Time & Work", "q": "12 men can complete a work in 10 days, and 15 women can complete it in 12 days. In how many days will 6 men and 5 women together complete it?", "o": ["11 3/7 days", "12 days", "13 days", "12 6/7 days"], "a": 3, "e": "1 man's day = 1/120, 1 woman's day = 1/180. 6/120 + 5/180 = 1/20 + 1/36 = 14/180 = 7/90 ⇒ 90/7 = <b>12 6/7 days</b>.", "f": null, "p": null}, {"s": "A", "t": "Time & Work", "q": "A can do a job in 10 days and B in 15 days. If they work on alternate days, beginning with A, in how many days will the job be finished?", "o": ["11 days", "12.5 days", "12 days", "13 days"], "a": 2, "e": "Work in 2 days = 1/10 + 1/15 = 1/6 ⇒ 6 such pairs = 12 days finish the job exactly ⇒ <b>12 days</b>.", "f": null, "p": null}, {"s": "A", "t": "Pipes & Cisterns", "q": "A tap fills a tank in 6 hours. After half the tank is filled, three more similar taps are opened. What is the total time taken to fill the tank?", "o": ["3 h 30 min", "3 h 45 min", "4 h 15 min", "4 h"], "a": 1, "e": "First half: 3 h. Then 4 taps fill 4/6 per hour ⇒ half takes ½ ÷ 4/6 = ¾ h = 45 min. Total = <b>3 h 45 min</b>.", "f": null, "p": null}, {"s": "A", "t": "Trains", "q": "A train running at 72 km/h crosses a 250 m long platform in 25 seconds. What is the length of the train?", "o": ["300 m", "225 m", "250 m", "200 m"], "a": 2, "e": "72 km/h = 20 m/s ⇒ distance = 20 × 25 = 500 m = train + platform ⇒ train = <b>250 m</b>.", "f": null, "p": null}, {"s": "A", "t": "Time & Distance", "q": "Two trains start at the same time from stations A and B, 360 km apart, towards each other at 50 km/h and 40 km/h. At what distance from A will they meet?", "o": ["210 km", "180 km", "200 km", "160 km"], "a": 2, "e": "Time to meet = 360/(50 + 40) = 4 h ⇒ distance from A = 50 × 4 = <b>200 km</b>.", "f": null, "p": null}, {"s": "A", "t": "Boats & Streams", "q": "A man rows 12 km downstream in 2 hours and comes back in 3 hours. What is his speed in still water?", "o": ["6 km/h", "4.5 km/h", "5 km/h", "1 km/h"], "a": 2, "e": "Downstream = 6 km/h, upstream = 4 km/h ⇒ still water = (6 + 4)/2 = <b>5 km/h</b>.", "f": null, "p": null}, {"s": "A", "t": "Races", "q": "In a 200 m race, A gives B a start of 20 m and still beats him by 10 m. What is the ratio of the speeds of A and B?", "o": ["20 : 17", "17 : 20", "10 : 9", "19 : 17"], "a": 0, "e": "While A runs 200 m, B runs 200 − 20 − 10 = 170 m ⇒ ratio = 200 : 170 = <b>20 : 17</b>.", "f": null, "p": null}, {"s": "A", "t": "Mixture & Alligation", "q": "Two vessels contain milk and water in the ratios 3 : 1 and 5 : 3. In what ratio should they be mixed to get a mixture with milk and water in the ratio 2 : 1?", "o": ["2 : 1", "1 : 2", "3 : 2", "1 : 3"], "a": 1, "e": "Milk fractions: 3/4 and 5/8; required 2/3. Alligation: (2/3 − 5/8) : (3/4 − 2/3) = 1/24 : 1/12 = <b>1 : 2</b>.", "f": null, "p": null}, {"s": "A", "t": "Mixture", "q": "Tea costing ₹120 per kg is mixed with tea costing ₹150 per kg in the ratio 2 : 3. What is the cost price of the mixture per kg?", "o": ["₹140", "₹132", "₹138", "₹135"], "a": 2, "e": "(2 × 120 + 3 × 150) ÷ 5 = 690 ÷ 5 = <b>₹138</b>.", "f": null, "p": null}, {"s": "A", "t": "Depreciation", "q": "A car bought for ₹5,00,000 depreciates by 20% in the first year and by 10% every year after that. What will its value be after 3 years?", "o": ["₹3,24,000", "₹3,60,000", "₹3,00,000", "₹3,20,000"], "a": 0, "e": "5,00,000 × 0.8 × 0.9 × 0.9 = <b>₹3,24,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Ratio – Numbers", "q": "Three numbers are in the ratio 2 : 3 : 5 and the sum of their squares is 1,368. What is the largest number?", "o": ["18", "36", "30", "25"], "a": 2, "e": "4x² + 9x² + 25x² = 38x² = 1,368 ⇒ x² = 36 ⇒ x = 6 ⇒ largest = 5 × 6 = <b>30</b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "The diagonal of a square is 20 cm. What is its area?", "o": ["100 cm²", "220 cm²", "200 cm²", "400 cm²"], "a": 2, "e": "Area = d²/2 = 400/2 = <b>200 cm²</b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "What is the capacity in litres of a cylindrical tank of radius 7 m and height 10 m? (π = 22/7)", "o": ["1,54,000 litres", "15,40,000 litres", "15,400 litres", "1,54,00,000 litres"], "a": 1, "e": "V = 22/7 × 49 × 10 = 1,540 m³ = 1,540 × 1,000 = <b>15,40,000 litres</b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "What is the area of a triangle whose sides are 13 cm, 14 cm and 15 cm?", "o": ["96 cm²", "78 cm²", "91 cm²", "84 cm²"], "a": 3, "e": "s = 21 ⇒ Area = √(21 × 8 × 7 × 6) = √7056 = <b>84 cm²</b>.", "f": null, "p": null}, {"s": "A", "t": "Wrong Term in Series", "q": "Find the wrong term in the series: 1, 2, 6, 24, 120, 700", "o": ["24", "6", "120", "700"], "a": 3, "e": "Rule: × 2, × 3, × 4, × 5, × 6 (factorials) ⇒ 120 × 6 = 720.<br>So <b>700</b> is wrong.", "f": null, "p": null}, {"s": "A", "t": "Number System", "q": "How many factors (divisors) does 360 have?", "o": ["24", "20", "30", "18"], "a": 0, "e": "360 = 2³ × 3² × 5 ⇒ number of factors = (3 + 1)(2 + 1)(1 + 1) = <b>24</b>.", "f": null, "p": null}, {"s": "A", "t": "Problems on Ages", "q": "A father's present age is 3 years more than three times his son's age. Three years hence, the father's age will be 10 years more than twice the son's age. What is the father's present age?", "o": ["39 years", "36 years", "33 years", "30 years"], "a": 2, "e": "f = 3s + 3 and f + 3 = 2(s + 3) + 10 ⇒ 3s + 6 = 2s + 16 ⇒ s = 10 ⇒ f = <b>33 years</b>.", "f": null, "p": null}, {"s": "A", "t": "Profit & Loss", "q": "The cost price of 20 articles is equal to the selling price of x articles. If the profit is 25%, what is x?", "o": ["16", "15", "25", "18"], "a": 0, "e": "SP(x) = CP(20) ⇒ SP/CP = 20/x = 1.25 ⇒ x = <b>16</b>.", "f": null, "p": null}, {"s": "A", "t": "Simplification", "q": "Find the value of 3/4 of 2/3 of 3/5 of 1500.", "o": ["400", "600", "450", "500"], "a": 2, "e": "1500 × 3/5 = 900 → × 2/3 = 600 → × 3/4 = <b>450</b>.", "f": null, "p": null}, {"s": "B", "t": "DI – Caselet", "q": "How many households use neither mobile data nor broadband?", "o": ["250", "150", "200", "100"], "a": 1, "e": "Mobile only = 60 − 20 = 40% (400); broadband only = 45 − 20 = 25% (250); both = 20% (200). Users = 850 ⇒ neither = <b>150</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Caselet", "q": "How many mobile-data-only households are in rural wards?", "o": ["240", "120", "200", "160"], "a": 3, "e": "40% of the 400 mobile-only households = <b>160</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Caselet", "q": "What is the total number of internet-using households in rural wards?", "o": ["210", "250", "260", "230"], "a": 3, "e": "Rural: mobile only 160 + broadband only 20% of 250 = 50 + both 10% of 200 = 20 ⇒ <b>230</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Caselet", "q": "Households using only broadband form approximately what per cent of all internet-using households?", "o": ["25%", "27.5%", "31.2%", "29.4%"], "a": 3, "e": "250/850 × 100 ≈ <b>29.4%</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Caselet", "q": "What is the ratio of urban mobile-only households to urban broadband-only households?", "o": ["5 : 6", "6 : 5", "4 : 3", "3 : 2"], "a": 1, "e": "Urban mobile only = 400 − 160 = 240; urban broadband only = 250 − 50 = 200 ⇒ 240 : 200 = <b>6 : 5</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Table", "q": "What were the total sales of company R in the five months?", "o": ["210 thousand", "180 thousand", "200 thousand", "190 thousand"], "a": 2, "e": "40 + 38 + 42 + 36 + 44 = <b>200 thousand</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Table", "q": "In which month were the total sales of the four companies the highest?", "o": ["March", "April", "May", "January"], "a": 2, "e": "Totals: Jan 115, Feb 118, Mar 124, Apr 134, May 149 ⇒ <b>May</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Table", "q": "The sales of company P in May were approximately what per cent more than its sales in February?", "o": ["60.7%", "58.3%", "55.6%", "62.5%"], "a": 0, "e": "(45 − 28)/28 × 100 = 17/28 × 100 ≈ <b>60.7%</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Table", "q": "What were the average monthly sales of company S?", "o": ["24 thousand", "22 thousand", "20 thousand", "21 thousand"], "a": 1, "e": "(18 + 22 + 20 + 25 + 25) ÷ 5 = 110 ÷ 5 = <b>22 thousand</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Table", "q": "What is the ratio of the total sales of company Q to that of company S?", "o": ["3 : 2", "15 : 11", "11 : 15", "5 : 4"], "a": 1, "e": "Q = 150, S = 110 ⇒ <b>15 : 11</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Pie Chart", "q": "How many students are in the Engineering stream?", "o": ["1,200", "900", "1,100", "1,000"], "a": 3, "e": "20% of 5,000 = <b>1,000</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "By how many does the number of Science students exceed the number of Commerce students?", "o": ["400", "600", "450", "500"], "a": 3, "e": "(28 − 18)% of 5,000 = 10% of 5,000 = <b>500</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "What is the central angle of the sector representing Arts?", "o": ["79.2°", "72°", "81.6°", "86.4°"], "a": 0, "e": "22% of 360° = <b>79.2°</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "If 40% of the Management students are girls, how many girls are there in Management?", "o": ["300", "240", "200", "360"], "a": 1, "e": "Management = 12% of 5,000 = 600 ⇒ 40% = <b>240</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "What is the ratio of Arts students to Management students?", "o": ["6 : 11", "11 : 6", "5 : 3", "11 : 9"], "a": 1, "e": "22 : 12 = <b>11 : 6</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Bar Chart", "q": "What was the profit per cent of the company in 2023? (Profit % = (Income − Expenditure)/Expenditure × 100)", "o": ["33⅓%", "16⅔%", "25%", "30%"], "a": 0, "e": "(72 − 54)/54 × 100 = 18/54 × 100 = <b>33⅓%</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Bar Chart", "q": "In which year was the profit amount (Income − Expenditure) the highest?", "o": ["2025", "2023", "2021", "2022"], "a": 1, "e": "Profit: 2021 = 10, 2022 = 12, 2023 = 18, 2024 = 10, 2025 = 15 ⇒ <b>2023</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Bar Chart", "q": "What was the total income of the company over the five years?", "o": ["₹342 lakh", "₹332 lakh", "₹362 lakh", "₹352 lakh"], "a": 3, "e": "50 + 60 + 72 + 80 + 90 = <b>₹352 lakh</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Bar Chart", "q": "What is the percentage increase in expenditure from 2021 to 2025?", "o": ["87.5%", "112.5%", "75%", "80%"], "a": 0, "e": "(75 − 40)/40 × 100 = <b>87.5%</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Bar Chart", "q": "In how many years was the profit per cent at least 25%?", "o": ["4", "1", "3", "2"], "a": 2, "e": "2021: 10/40 = 25% ✓; 2022: 12/48 = 25% ✓; 2023: 33⅓% ✓; 2024: 10/70 ≈ 14.3%; 2025: 15/75 = 20% ⇒ <b>3</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Line Graph", "q": "What was the pass percentage in 2024?", "o": ["80%", "75%", "70%", "85%"], "a": 0, "e": "28/35 × 100 = <b>80%</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Line Graph", "q": "In which year was the pass percentage the lowest?", "o": ["2021", "2025", "2023", "2020"], "a": 2, "e": "Pass %: 2020 60, 2021 62.5, 2022 70, 2023 50, 2024 80, 2025 75 ⇒ lowest in <b>2023</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Line Graph", "q": "What was the total number of students who passed in the six years?", "o": ["11,500", "13,000", "12,500", "12,000"], "a": 3, "e": "12 + 15 + 21 + 14 + 28 + 30 = 120 hundred = <b>12,000</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Line Graph", "q": "What was the average number of students who appeared per year?", "o": ["2,950", "3,050", "2,900", "2,850"], "a": 0, "e": "(20 + 24 + 30 + 28 + 35 + 40) = 177 hundred ⇒ 17,700 ÷ 6 = <b>2,950</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Line Graph", "q": "What is the percentage increase in the number of students who passed from 2020 to 2025?", "o": ["100%", "180%", "125%", "150%"], "a": 3, "e": "12 → 30 hundred ⇒ (30 − 12)/12 × 100 = <b>150%</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "Data Sufficiency", "q": "What is Rohan's present age?<br>I. Rohan is twice as old as his sister.<br>II. His sister will be 12 years old after 4 years.", "o": ["Both I and II together are needed", "Either I or II alone is sufficient", "Statement I alone is sufficient", "Even I and II together are not sufficient"], "a": 0, "e": "I gives a relation only; II gives the sister's age = 8. Together: Rohan = 16 ⇒ <b>both I and II are needed</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "What is the value of x?<br>I. x² − 5x + 6 = 0<br>II. x is an even prime number.", "o": ["Statement II alone is sufficient", "Even I and II together are not sufficient", "Both I and II together are needed", "Statement I alone is sufficient"], "a": 0, "e": "I gives x = 2 or 3 (not unique). II: the only even prime is 2.<br><b>Statement II alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "What is the circumference of the circle?<br>I. The area of the circle is 154 cm².<br>II. The diameter of the circle is 14 cm.", "o": ["Statement I alone is sufficient", "Either I or II alone is sufficient", "Even I and II together are not sufficient", "Both I and II together are needed"], "a": 1, "e": "I: r = 7 cm ⇒ 44 cm. II: r = 7 cm ⇒ 44 cm.<br><b>Either I or II alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "On which day of the week did 1 March fall in a certain year?<br>I. 1 February of that year was a Monday.<br>II. That year was a leap year.", "o": ["Either I or II alone is sufficient", "Statement I alone is sufficient", "Even I and II together are not sufficient", "Both I and II together are needed"], "a": 3, "e": "I alone fails because February may have 28 or 29 days. With II, February has 29 days ⇒ 1 March = Monday + 29 days = Tuesday ⇒ <b>both are needed</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "What is the average of x, y and z?<br>I. x + y + z = 45<br>II. x + y = 30", "o": ["Statement I alone is sufficient", "Both I and II together are needed", "Even I and II together are not sufficient", "Statement II alone is sufficient"], "a": 0, "e": "I: average = 45/3 = 15. II does not give z.<br><b>Statement I alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "C", "t": "Analogy", "q": "Select the number that will replace the question mark: 7 : 50 :: 9 : ?", "o": ["81", "72", "82", "90"], "a": 2, "e": "7² + 1 = 50 ⇒ 9² + 1 = <b>82</b>.", "f": null, "p": null}, {"s": "C", "t": "Analogy", "q": "Select the option related to the third letter-cluster as the second is related to the first: CEG : DFH :: PRT : ?", "o": ["RTV", "PSU", "QRT", "QSU"], "a": 3, "e": "Each letter moves +1: C→D, E→F, G→H ⇒ P→Q, R→S, T→U ⇒ <b>QSU</b>.", "f": null, "p": null}, {"s": "C", "t": "Classification", "q": "Find the odd one out: 27, 64, 125, 144, 216", "o": ["125", "144", "216", "27"], "a": 1, "e": "27, 64, 125, 216 are perfect cubes (3³, 4³, 5³, 6³); <b>144</b> = 12² is not a cube.", "f": null, "p": null}, {"s": "C", "t": "Coding–Decoding", "q": "If DELHI is coded as 73541 and CALCUTTA as 82589662, how will CALICUT be coded?", "o": ["8521896", "8251986", "8251896", "8252896"], "a": 2, "e": "From the codes: C = 8, A = 2, L = 5, I = 1, U = 9, T = 6.<br>CALICUT = 8 2 5 1 8 9 6 ⇒ <b>8251896</b>.", "f": null, "p": null}, {"s": "C", "t": "Coded Relations", "q": "'A + B' means A is the mother of B; 'A − B' means A is the brother of B; 'A % B' means A is the father of B; 'A × B' means A is the sister of B. Which expression shows that P is the maternal uncle of Q?", "o": ["P − M + Q", "P % M − Q", "P + M − Q", "P × M % Q"], "a": 0, "e": "P − M + Q: P is the brother of M and M is the mother of Q ⇒ P is Q's <b>maternal uncle</b>.<br>(P + M − Q ⇒ P is Q's mother; P × M % Q ⇒ paternal aunt; P % M − Q ⇒ P is Q's father.)", "f": null, "p": null}, {"s": "C", "t": "Direction Sense", "q": "Raj starts facing East and walks 10 m, turns left and walks 5 m, turns left and walks 15 m, and then turns left and walks 5 m. Where is he now with respect to his starting point?", "o": ["15 m West", "10 m West", "5 m West", "5 m East"], "a": 2, "e": "E 10 → N 5 → W 15 → S 5 ⇒ net 10 − 15 = −5 (West), 5 − 5 = 0 ⇒ <b>5 m West</b>.", "f": null, "p": null}, {"s": "C", "t": "Direction Sense", "q": "A man is facing West. He turns 45° clockwise, then 180° clockwise and then 270° anticlockwise. Which direction is he facing now?", "o": ["South-West", "North-West", "North-East", "South-East"], "a": 0, "e": "West (270°) + 45° = 315° (NW) → + 180° = 135° (SE) → − 270° = −135° = 225° ⇒ <b>South-West</b>.", "f": null, "p": null}, {"s": "C", "t": "Calendar", "q": "On what day of the week did 26 January 1950 fall?", "o": ["Friday", "Sunday", "Wednesday", "Thursday"], "a": 3, "e": "Up to 1900: 1 odd day; 1901–1949: 49 years with 12 leap years ⇒ 61 ≡ 5 odd days; up to 26 Jan 1950 ⇒ 26 ≡ 5. Total 1 + 5 + 5 = 11 ≡ 4 ⇒ <b>Thursday</b>.", "f": null, "p": null}, {"s": "C", "t": "Clock", "q": "How many times in a day (24 hours) are the hands of a clock at right angles?", "o": ["44", "24", "48", "22"], "a": 0, "e": "They are at right angles 22 times in 12 hours (twice every hour except at 3 and 9, which count once each) ⇒ <b>44</b> times a day.", "f": null, "p": null}, {"s": "C", "t": "Number Series", "q": "Find the next term: 3, 5, 9, 17, 33, ?", "o": ["64", "65", "63", "66"], "a": 1, "e": "Rule: × 2 − 1 ⇒ 33 × 2 − 1 = <b>65</b>.", "f": null, "p": null}, {"s": "C", "t": "Letter Series", "q": "Find the next term: ACE, GIK, MOQ, ?", "o": ["TVX", "STV", "RTV", "SUW"], "a": 3, "e": "Each group takes alternate letters, continuing the alphabet: A C E, G I K, M O Q ⇒ <b>S U W</b>.", "f": null, "p": null}, {"s": "C", "t": "Letter–Number Coding", "q": "If A = 26, B = 25, C = 24 … Z = 1, what is the sum of the letter values of the word ODISHA?", "o": ["108", "110", "106", "104"], "a": 2, "e": "O 12 + D 23 + I 18 + S 8 + H 19 + A 26 = <b>106</b>.", "f": null, "p": null}, {"s": "C", "t": "Logical Sequence", "q": "Arrange in a meaningful order: 1. Infant &nbsp;2. Old &nbsp;3. Adolescent &nbsp;4. Child &nbsp;5. Adult", "o": ["1, 4, 5, 3, 2", "1, 4, 3, 5, 2", "4, 1, 3, 5, 2", "1, 3, 4, 5, 2"], "a": 1, "e": "Infant → Child → Adolescent → Adult → Old ⇒ <b>1, 4, 3, 5, 2</b>.", "f": null, "p": null}, {"s": "C", "t": "Ranking", "q": "In a row of 40 students, A is 15th from the left and B is 30th from the right. How many students are there between A and B?", "o": ["5", "2", "3", "4"], "a": 2, "e": "B from the left = 40 − 30 + 1 = 11th. Between 11th and 15th: 12th, 13th, 14th ⇒ <b>3</b>.", "f": null, "p": null}, {"s": "C", "t": "Seating Arrangement", "q": "Six persons P, Q, R, S, T and U sit in a row facing North. Q is at the extreme left. R is second to the right of Q. T is to the immediate right of R. U is neither at an end nor next to Q. S is not at an end. Who sits at the extreme right?", "o": ["P", "T", "S", "U"], "a": 0, "e": "Q = 1, R = 3, T = 4. U is not 2 (next to Q) and not 6 (end) ⇒ U = 5. S is not at an end ⇒ S = 2 ⇒ P = 6.<br>Extreme right ⇒ <b>P</b>.", "f": null, "p": null}, {"s": "C", "t": "Problems on Ages", "q": "The present ages of A and B are in the ratio 5 : 7. Four years ago, the ratio was 3 : 5. What is A's present age?", "o": ["15 years", "14 years", "20 years", "10 years"], "a": 3, "e": "(5x − 4)/(7x − 4) = 3/5 ⇒ 25x − 20 = 21x − 12 ⇒ x = 2 ⇒ A = <b>10 years</b>.", "f": null, "p": null}, {"s": "C", "t": "Counting", "q": "How many squares of all sizes are there on a 4 × 4 grid of small squares?", "o": ["30", "25", "36", "16"], "a": 0, "e": "1×1: 16, 2×2: 9, 3×3: 4, 4×4: 1 ⇒ <b>30</b>.", "f": null, "p": null}, {"s": "C", "t": "Arithmetical Reasoning", "q": "Trees are planted around a circular track of 600 m at intervals of 15 m. How many trees are planted?", "o": ["39", "45", "40", "41"], "a": 2, "e": "On a closed path, number of trees = number of gaps = 600/15 = <b>40</b>.", "f": null, "p": null}, {"s": "C", "t": "Coded Inequality", "q": "If 'P # Q' means P > Q, 'P @ Q' means P < Q and 'P $ Q' means P = Q, and A # B, B $ C and C @ D, which of the following is definitely true?", "o": ["A @ D", "A $ D", "D @ B", "A # C"], "a": 3, "e": "A > B = C < D ⇒ A > C is certain ⇒ <b>A # C</b>. A and D cannot be compared; D > B, so 'D @ B' is false.", "f": null, "p": null}, {"s": "C", "t": "Clock", "q": "What is the angle between the hands of a clock at 3:40?", "o": ["130°", "120°", "140°", "125°"], "a": 0, "e": "θ = |30 × 3 − 5.5 × 40| = |90 − 220| = <b>130°</b>.", "f": null, "p": null}, {"s": "C", "t": "Arithmetical Reasoning", "q": "Ram had ₹2,000. He spent 30% on clothes and 25% of the remaining money on food. How much money is left with him?", "o": ["₹950", "₹1,050", "₹900", "₹1,100"], "a": 1, "e": "2,000 × 0.70 = 1,400 → 1,400 × 0.75 = <b>₹1,050</b>.", "f": null, "p": null}, {"s": "C", "t": "Arithmetical Reasoning", "q": "A library charges a fixed annual fee plus a fixed amount for each book borrowed. A member who borrowed 12 books paid ₹400 and one who borrowed 20 books paid ₹560. How much will a member who borrows 30 books pay?", "o": ["₹780", "₹760", "₹740", "₹800"], "a": 1, "e": "Per book = (560 − 400)/8 = ₹20; fixed fee = 400 − 240 = ₹160 ⇒ 160 + 30 × 20 = <b>₹760</b>.", "f": null, "p": null}, {"s": "C", "t": "Dictionary Order", "q": "Arrange the words in dictionary order:<br>1. Constant &nbsp;2. Consonant &nbsp;3. Consider &nbsp;4. Construct &nbsp;5. Consult", "o": ["3, 2, 1, 4, 5", "3, 2, 4, 1, 5", "3, 1, 2, 4, 5", "2, 3, 1, 4, 5"], "a": 0, "e": "Consi- < Conso- < Consta- < Constr- < Consu- ⇒ Consider, Consonant, Constant, Construct, Consult ⇒ <b>3, 2, 1, 4, 5</b>.", "f": null, "p": null}, {"s": "C", "t": "Coded Sentences", "q": "In a code language, 'sky is blue' is written as 'ra ta pa', 'blue sea water' as 'pa ki zo' and 'water is pure' as 'zo ta me'. What is the code for 'sea'?", "o": ["zo", "pa", "me", "ki"], "a": 3, "e": "blue = pa (1st & 2nd), water = zo (2nd & 3rd) ⇒ remaining word of the 2nd sentence: sea = <b>ki</b>.", "f": null, "p": null}, {"s": "C", "t": "Syllogism", "q": "Statements: All teachers are graduates. No graduate is illiterate.<br>Conclusions: I. No teacher is illiterate. &nbsp;II. Some graduates are teachers.", "o": ["Only I follows", "Neither I nor II follows", "Only II follows", "Both I and II follow"], "a": 3, "e": "Teachers lie inside graduates, and graduates and illiterates do not overlap ⇒ I follows. 'All teachers are graduates' ⇒ some graduates are teachers ⇒ II follows ⇒ <b>both follow</b>.", "f": null, "p": null}, {"s": "C", "t": "Statement & Assumption", "q": "Statement: 'Buy this pen — it writes for 2 kilometres!' — an advertisement.<br>Assumptions: I. People prefer pens that write longer. &nbsp;II. People read advertisements.", "o": ["Only I is implicit", "Neither I nor II is implicit", "Both I and II are implicit", "Only II is implicit"], "a": 2, "e": "The claim is made because buyers value long-writing pens (I), and an advertisement is issued only if people read it (II) ⇒ <b>both are implicit</b>.", "f": null, "p": null}, {"s": "C", "t": "Cube & Cuboid", "q": "A cube of edge 6 cm, painted on all faces, is cut into cubes of edge 1 cm. How many small cubes have exactly two faces painted?", "o": ["96", "48", "64", "24"], "a": 1, "e": "n = 6 ⇒ two faces painted = 12(n − 2) = 12 × 4 = <b>48</b>.", "f": null, "p": null}, {"s": "C", "t": "Missing Number", "q": "Find the missing number:<br>Row 1: 6, 4, 14<br>Row 2: 7, 5, 23<br>Row 3: 8, 3, ?", "o": ["15", "13", "21", "11"], "a": 1, "e": "Third = (first × second) − (first + second): 24 − 10 = 14; 35 − 12 = 23 ⇒ 24 − 11 = <b>13</b>.", "f": null, "p": null}, {"s": "C", "t": "Water Image (Non-verbal)", "q": "Choose the correct water image of the given figure (the water surface is below it).", "o": ["@W", "@R", "@M", "@P"], "a": 0, "e": "In a water image, top and bottom are interchanged while left and right stay the same — the characters stand upside down in the same order.", "f": {"kind": "water", "text": "NOV 2026"}, "p": null}, {"s": "C", "t": "Dice (Non-verbal)", "q": "Two positions of the same die are shown. Which number is on the face opposite to 1?", "o": ["4", "6", "2", "5"], "a": 1, "e": "The numbers 2 and 3 appear in both positions. When two faces are common, the remaining faces are opposite: 1 (in i) and 6 (in ii) ⇒ 1 is opposite <b>6</b>.", "f": {"kind": "dice", "a": [2, 1, 3], "b": [3, 6, 2]}, "p": null}, {"s": "C", "t": "Sign Interchange", "q": "Which two signs should be interchanged to make the following equation correct?<br>16 + 4 × 3 − 6 ÷ 2 = 8", "o": ["× and −", "× and ÷", "+ and −", "+ and ÷"], "a": 3, "e": "Interchanging + and ÷: 16 ÷ 4 × 3 − 6 + 2 = 12 − 6 + 2 = <b>8</b> ✓.<br>(× and − gives 11; + and − gives 7; × and ÷ gives 5.33.)", "f": null, "p": null}, {"s": "C", "t": "Logical Deduction", "q": "All roses are flowers. Some flowers fade quickly. Based on these statements, the statement 'Some roses fade quickly' is:", "o": ["Uncertain", "Data contradictory", "False", "True"], "a": 0, "e": "The flowers that fade quickly may or may not include roses ⇒ <b>uncertain</b>.", "f": null, "p": null}, {"s": "C", "t": "Blood Relations", "q": "Pointing to a girl, Arun said, \"Her mother is the only daughter of my mother-in-law.\" How is the girl related to Arun?", "o": ["Sister", "Niece", "Daughter", "Granddaughter"], "a": 2, "e": "The only daughter of Arun's mother-in-law is Arun's wife; her daughter is Arun's <b>daughter</b>.", "f": null, "p": null}, {"s": "C", "t": "Figure Series (Non-verbal)", "q": "Select the figure that will come next in the series of problem figures.", "o": ["(1)", "(2)", "(3)", "(4)"], "a": 1, "e": "The black dot moves one cell clockwise each step (TL → TR → BR → BL → <b>TL</b>), and the cross moves one cell anticlockwise (TR → TL → BL → BR → <b>TR</b>).<br>So the next figure has the dot at top-left and the cross at top-right ⇒ figure <b>(2)</b>.", "f": {"kind": "img", "id": "series2"}, "p": null}, {"s": "C", "t": "Classification", "q": "Find the odd one out: Mercury, Venus, Mars, Moon", "o": ["Mercury", "Mars", "Venus", "Moon"], "a": 3, "e": "Mercury, Venus and Mars are planets; the <b>Moon</b> is a natural satellite.", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "The Union Cabinet fixed the Minimum Support Price of wheat for Rabi Marketing Season 2027-28 at:", "o": ["₹2,585 per quintal", "₹2,700 per quintal", "₹2,425 per quintal", "₹2,610 per quintal"], "a": 3, "e": "Wheat MSP was raised by ₹25 to <b>₹2,610 per quintal</b> — the smallest hike in about 17 years; pulses and oilseeds got bigger increases.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "Who became the first Indian woman golfer to win a gold medal at the Asian Games (Aichi–Nagoya 2026)?", "o": ["Tvesa Malik", "Aditi Ashok", "Pranavi Urs", "Diksha Dagar"], "a": 2, "e": "<b>Pranavi Urs</b> won the women's individual gold; India also took the women's team silver with Aditi Ashok and Diksha Dagar.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "At the 46th Chess Olympiad in Samarkand (2026), which 11-year-old became the youngest player to earn the Woman Grandmaster title?", "o": ["Rameshbabu Vaishali", "Bodhana Sivanandan", "Divya Deshmukh", "Vantika Agrawal"], "a": 1, "e": "England's <b>Bodhana Sivanandan</b> (of Indian origin) earned the WGM title at 11 — recognised by Guinness World Records as the youngest ever.", "f": null, "p": null}, {"s": "D", "t": "Appointments 2026", "q": "Who was appointed MD & CEO of HDFC Bank in 2026 — the first person from outside the bank to lead it?", "o": ["Ashok Vaswani", "Sashidhar Jagdishan", "Anup Bagchi", "Sandeep Bakhshi"], "a": 2, "e": "<b>Anup Bagchi</b> (earlier with ICICI) was appointed MD & CEO of HDFC Bank for three years.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "In September 2026, Fatima Ezzahra El Mansouri became the first woman Prime Minister of which country?", "o": ["Algeria", "Egypt", "Morocco", "Tunisia"], "a": 2, "e": "King Mohammed VI appointed her as <b>Morocco</b>'s first woman Prime Minister after the September 2026 elections.", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "'NPS Swasthya', launched on NPS Diwas (1 October 2026), was introduced by which regulator?", "o": ["PFRDA", "SEBI", "RBI", "IRDAI"], "a": 0, "e": "The Pension Fund Regulatory and Development Authority (<b>PFRDA</b>) launched NPS Swasthya, linking pension savings with health cover.", "f": null, "p": null}, {"s": "D", "t": "Polity 2026", "q": "The Bankers' Books Evidence Act, 2026, which came into force on 1 October 2026, replaced an Act of which year?", "o": ["1872", "1934", "1949", "1891"], "a": 3, "e": "It replaced the Bankers' Books Evidence Act, <b>1891</b>.", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "Which organisation launched India's first 'blue bond' in 2026?", "o": ["SIDBI", "Sagarmala Finance Corporation", "NABARD", "Indian Railway Finance Corporation"], "a": 1, "e": "<b>Sagarmala Finance Corporation</b> launched India's first blue bond (₹600 crore base issue) to fund maritime and ocean-economy projects.", "f": null, "p": null}, {"s": "D", "t": "Environment 2026", "q": "Green Energy Corridor Phase-III, approved by the Union Cabinet in 2026, aims to evacuate how much renewable energy capacity?", "o": ["100 GW", "50 GW", "175 GW", "135 GW"], "a": 3, "e": "GEC-III (outlay over ₹1.86 lakh crore) targets evacuation of <b>135 GW</b> of renewable power and includes 50 GWh of battery storage.", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "India Energy Week 2027 will be held from 28 to 31 January 2027 in which city?", "o": ["Bengaluru", "Kolkata", "Goa", "New Delhi"], "a": 1, "e": "India Energy Week 2027 will be hosted in <b>Kolkata</b>.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "DRDO's Kaveri dry engine, which delivered 48.5 kN of thrust in trials in 2026, is being developed to power which platform?", "o": ["LCH Prachand", "Ghatak UCAV", "Tejas Mk-2", "AMCA"], "a": 1, "e": "The Kaveri dry engine is meant for the <b>Ghatak</b> stealth unmanned combat aerial vehicle.", "f": null, "p": null}, {"s": "D", "t": "Science 2026", "q": "India's first free-space Quantum Key Distribution (QKD) link of 5.56 km was demonstrated in 2026 by QNu Labs, BISAG-N and:", "o": ["IISc Bengaluru", "IIT Madras", "IIT Gandhinagar", "IIT Bombay (Powai)"], "a": 2, "e": "The demonstration was done with <b>IIT Gandhinagar</b> (Gujarat).", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "INS Nipun, commissioned in Mumbai on 31 August 2026, is the Indian Navy's second ship of which class?", "o": ["Arnala-class ASW craft", "Kolkata-class destroyer", "Nilgiri-class stealth guided-missile frigate", "Nistar-class Diving Support Vessel"], "a": 3, "e": "INS Nipun is the second indigenous <b>Nistar-class Diving Support Vessel</b>, after INS Nistar.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "Aero India 2027 will be held from 8 to 12 February 2027 at:", "o": ["Hindon, Ghaziabad", "Yelahanka, Bengaluru", "Air Force Station Lohegaon, Pune", "Begumpet, Hyderabad"], "a": 1, "e": "Aero India is held at Air Force Station <b>Yelahanka, Bengaluru</b>.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "In 2026, Türkiye became the 71st country to sign which agreement on the exploration of the Moon and space?", "o": ["Artemis Accords", "Outer Space Treaty", "Paris Agreement", "Moon Agreement"], "a": 0, "e": "Türkiye joined the US-led <b>Artemis Accords</b> as the 71st signatory; India signed in 2023.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "In September 2026, the UN General Assembly designated which day as the International Day for the Elimination of Child Marriage?", "o": ["27 November", "8 March", "20 November", "11 October"], "a": 0, "e": "The UNGA designated <b>27 November</b> for the observance.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "Who succeeded Tim Cook as the CEO of Apple in September 2026?", "o": ["Greg Joswiak", "John Ternus", "Craig Federighi", "Jeff Williams"], "a": 1, "e": "Hardware engineering chief <b>John Ternus</b> took over as Apple CEO, ending Tim Cook's 15-year tenure.", "f": null, "p": null}, {"s": "D", "t": "Environment 2026", "q": "With the addition of Sukhna Wetland and Sauj Jheel in October 2026, India's number of Ramsar sites rose to:", "o": ["105", "98", "103", "101"], "a": 2, "e": "India's Ramsar tally reached <b>103</b>; Sauj Jheel is in Uttar Pradesh and Sukhna Wetland in Chandigarh.", "f": null, "p": null}, {"s": "D", "t": "Awards 2026", "q": "The European Parliament's Sakharov Prize for Freedom of Thought 2026 was awarded to:", "o": ["UNHCR", "International Court of Justice", "Amnesty International", "International Criminal Court"], "a": 3, "e": "The <b>International Criminal Court</b> and its officials received the 2026 Sakharov Prize.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "In October 2026, India and Mauritius amended their Double Taxation Avoidance Agreement to add a:", "o": ["Principal Purpose Test", "Tax holiday clause", "Limitation on benefits waiver", "Capital gains exemption"], "a": 0, "e": "The protocol adds a <b>Principal Purpose Test</b> to stop treaty misuse for tax avoidance.", "f": null, "p": null}, {"s": "D", "t": "Environment 2026", "q": "According to a 2026 study, Asiatic lions have returned after about 144 years to which wildlife sanctuary in Gujarat?", "o": ["Barda", "Nal Sarovar", "Velavadar", "Jessore"], "a": 0, "e": "Lions have naturally dispersed to <b>Barda</b> Wildlife Sanctuary (Porbandar–Devbhumi Dwarka); Gir's lion count was 891 in 2025.", "f": null, "p": null}, {"s": "D", "t": "Environment 2026", "q": "The 17th Conference of the Parties (COP17) to the UN Convention on Biological Diversity in 2026 was held in:", "o": ["Nairobi, Kenya", "Montreal, Canada", "Cali, Colombia", "Yerevan, Armenia"], "a": 3, "e": "CBD COP17 was hosted by <b>Yerevan, Armenia</b>; COP16 was in Cali, Colombia (2024).", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "At the 2026 Asian Games, who won India's gold medal in women's individual recurve archery?", "o": ["Deepika Kumari", "Kumkum Mohod", "Bhajan Kaur", "Ankita Bhakat"], "a": 1, "e": "17-year-old <b>Kumkum Mohod</b> beat South Korea's archer to become India's first Asian Games women's individual recurve champion.", "f": null, "p": null}, {"s": "D", "t": "Banking 2026", "q": "Which bank won the 'World's Best Consumer Bank 2026' award, for the second year running?", "o": ["ICICI Bank", "State Bank of India", "Bank of Baroda (BoB)", "HDFC Bank"], "a": 1, "e": "<b>SBI</b> retained the title; its YONO app also crossed 10 crore registered users.", "f": null, "p": null}, {"s": "D", "t": "Appointments 2026", "q": "Who was approved as the Chairman of ONGC for a three-year term in October 2026?", "o": ["Arvinder Singh Sahney", "G. Krishnakumar", "Arun Kumar Singh", "Sunil Kumar"], "a": 3, "e": "The ACC approved <b>Sunil Kumar</b> as ONGC Chairman — the first Executive Director to rise directly to the top post.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "The 'Unified Pension Management Portal (UPMP)', launched by CM Mohan Charan Majhi on 10 November 2026 at Baleshwar, is for which scheme?", "o": ["Madhu Babu Pension Yojana", "Biju Swasthya Kalyan Yojana", "Mukhyamantri Kalyan Yojana", "Subhadra Yojana"], "a": 0, "e": "UPMP serves the <b>Madhu Babu Pension Yojana</b>; 5.05 lakh new beneficiaries were added, taking the total to about 41.8 lakh.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "Under the Madhu Babu Pension Yojana, what monthly pension is now given automatically on reaching the age of 80?", "o": ["₹3,500", "₹3,000", "₹2,500", "₹4,000"], "a": 0, "e": "Beneficiaries get the enhanced pension of <b>₹3,500</b> a month at 80 without a fresh application.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "The 'Godabarish Mishra Adarsha Prathamik Vidyalaya Yojana' of Odisha, whose third phase was launched in November 2026, is for setting up:", "o": ["Residential colleges", "Model primary schools", "Teacher training centres", "Rural libraries"], "a": 1, "e": "The scheme sets up <b>model primary schools</b> — 630 planned statewide in this phase, with a target of 2,200 by 2029.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "In September 2026, the Odisha State Disaster Management Authority (OSDMA) signed an MoU with UNDP for a hazard, risk and vulnerability assessment covering:", "o": ["Only 10 districts", "Only coastal districts", "All 30 districts", "Bhubaneswar city only"], "a": 2, "e": "The UNDP study covers <b>all 30 districts</b>; CivicDataLab will build an IDS-DRR platform for floods, coastal flooding and heatwaves.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "On Local Self-Government Day in November 2026, CM Majhi launched 593 urban projects in Odisha. The number of Urban Local Bodies in the State has now risen to:", "o": ["130", "152", "143", "115"], "a": 2, "e": "Urban Local Bodies increased from 115 to <b>143</b>; projects worth ₹323 crore were launched across 62 urban areas.", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "In MS Word, which shortcut applies double line spacing to the selected paragraph?", "o": ["Ctrl + 1", "Ctrl + 2", "Ctrl + D", "Ctrl + 5"], "a": 1, "e": "<b>Ctrl + 2</b> = double spacing; Ctrl + 1 = single; Ctrl + 5 = 1.5 lines; Ctrl + D opens the Font dialog.", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "In MS Word, the shortcut Ctrl + K is used to insert a:", "o": ["Hyperlink", "Cross-reference", "Comment", "Bookmark"], "a": 0, "e": "<b>Ctrl + K</b> opens the Insert Hyperlink dialog.", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "In MS Word, the Thesaurus (to find synonyms) is available in which tab?", "o": ["Review", "Home", "Insert", "References"], "a": 0, "e": "<b>Review</b> → Proofing group → Thesaurus (shortcut Shift + F7).", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "In MS Word, 'Drop Cap' is available in which tab?", "o": ["Design", "Insert", "Layout", "Home"], "a": 1, "e": "<b>Insert</b> → Text group → Drop Cap.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "What will =LEFT(\"BHUBANESWAR\", 4) return in MS Excel?", "o": ["BHUB", "HUBA", "BHUBA", "SWAR"], "a": 0, "e": "LEFT returns the given number of characters from the start ⇒ <b>BHUB</b>.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "What will =SQRT(144) + ABS(-8) return in MS Excel?", "o": ["20", "-4", "4", "152"], "a": 0, "e": "SQRT(144) = 12; ABS(-8) = 8 ⇒ 12 + 8 = <b>20</b>.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "Which MS Excel function returns the current date and time together?", "o": ["=TIME()", "=TODAY()", "=DATE()", "=NOW()"], "a": 3, "e": "<b>=NOW()</b> returns date and time; =TODAY() returns only the date.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "In MS Excel, a cell showing '#####' usually means:", "o": ["The cell is locked", "The column is too narrow", "The formula has an error", "The sheet is protected"], "a": 1, "e": "'#####' appears when the column is <b>too narrow</b> to display the number or date (or a date is negative).", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "In MS Excel, 'Merge & Center' is located on which tab?", "o": ["Data", "View", "Home", "Review"], "a": 2, "e": "<b>Home</b> → Alignment group → Merge &amp; Center.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "What will =INT(7.8) return in MS Excel?", "o": ["7.8", "0.8", "7", "8"], "a": 2, "e": "INT rounds a number down to the nearest integer ⇒ <b>7</b>.", "f": null, "p": null}, {"s": "E", "t": "MS PowerPoint", "q": "In MS PowerPoint, 'Morph' is a type of:", "o": ["Animation", "Slide layout", "Transition", "Theme"], "a": 2, "e": "<b>Morph</b> is a slide transition that animates smooth movement of objects between two slides.", "f": null, "p": null}, {"s": "E", "t": "MS PowerPoint", "q": "In MS Word and MS PowerPoint, which shortcut inserts a new comment?", "o": ["Ctrl + Shift + C", "Ctrl + Alt + M", "Alt + M", "Ctrl + M"], "a": 1, "e": "<b>Ctrl + Alt + M</b> inserts a comment (Review → New Comment).", "f": null, "p": null}, {"s": "E", "t": "MS PowerPoint", "q": "In MS PowerPoint, Presenter View lets the presenter see:", "o": ["A list of all files", "Only the current slide", "Speaker notes and the next slide", "Audience polls and comments from viewers"], "a": 2, "e": "Presenter View shows the current slide, the <b>speaker notes, the next slide</b> and a timer, while the audience sees only the slide.", "f": null, "p": null}, {"s": "E", "t": "MS Access", "q": "In MS Access, relationships between tables are created from which tab?", "o": ["Database Tools", "External Data", "Create", "Table Design view"], "a": 0, "e": "<b>Database Tools</b> → Relationships.", "f": null, "p": null}, {"s": "E", "t": "MS Access", "q": "Which MS Access data type should be used for a field that stores 'Date of Birth'?", "o": ["Date/Time", "Short Text", "Number", "Currency"], "a": 0, "e": "<b>Date/Time</b> stores dates and allows date calculations and sorting.", "f": null, "p": null}, {"s": "E", "t": "E-mail", "q": "Which symbol separates the user name from the domain name in an e-mail address?", "o": ["&", "#", "@", "$"], "a": 2, "e": "In name<b>@</b>domain.com, '@' separates the user name and the domain.", "f": null, "p": null}, {"s": "E", "t": "Internet", "q": "In the URL https://www.example.com/index.html, what is 'index.html'?", "o": ["Domain name", "Protocol", "Top-level domain name", "File (page) name"], "a": 3, "e": "'https' is the protocol, 'www.example.com' the domain, and <b>index.html</b> the file (page) name.", "f": null, "p": null}, {"s": "E", "t": "Cyber Security", "q": "Which of the following is the strongest password?", "o": ["ilovemyodisha2026", "12345678", "odisha2026", "Gr8#Odisha!26"], "a": 3, "e": "<b>Gr8#Odisha!26</b> mixes upper- and lower-case letters, digits and symbols; length alone (ilovemyodisha2026) is weaker without variety.", "f": null, "p": null}, {"s": "E", "t": "Computer Basics", "q": "Which of the following is an input device?", "o": ["Projector", "Speaker", "Barcode reader", "Dot-matrix printer"], "a": 2, "e": "A <b>barcode reader</b> inputs data; const $ = (s,el=document)=>el.querySelector(s);
const esc = t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function legendItems(){
  return `<div class="legend-list">
  <div><span class="st nv">1</span>You have not visited the question yet.</div>
  <div><span class="st na">3</span>You have not answered the question.</div>

}
function patternTable(){
  let rows = SECS.map((s,i)=>{const n=secRange[i][1]-secRange[i][0]+1;return `<tr><td>${s[1]}</td><td class="n">${secRange[i][0]+1}–${secRange[i][1]+1}</td><td class="n">${n}</td><td class="n">${n*EXAM.plus}</td></tr>`}).join("");
  return `<div class="tbl-wrap"><table class="pattern"><thead><tr><th>Section</th><th>Q. Nos.</th><th>Questions</th><th>Marks</th></tr></thead><tbody>${rows}<tr><td><b>Total</b></td><td></td><td class="n"><b>${QS.length}</b></td><td class="n"><b>${QS.length*EXAM.plus}</b></td></tr></tbody></table></div>`;
}
function instrHTML(){
  return `<h3>General Instructions</h3><ol>
  <li>Total duration of the examination is <b>${EXAM.minutes} minutes</b>. There are <b>${QS.length} multiple-choice questions</b>, each with four options and only one correct answer.</li>
