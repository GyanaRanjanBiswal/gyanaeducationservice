<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gyana Education Service – OSSC CGLRE (Specialist) 2025 Preliminary Examination – Free Online CBT Mock Test-6 (TCS pattern)">
<title>OSSC CGLRE (Specialist) Prelim – Mock Test-6 | Gyana Education Service</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: TCS iON-style exam console — header strip, question pane left, palette right; light-only by design (mirrors the real exam screen) */
:root{
  --ink:#1b2430; --muted:#5d6b7c; --line:#cfd8e3; --paper:#ffffff; --wash:#eef3f8;
  --brand:#0b4f8a; --brand-2:#1167b1; --brand-ink:#ffffff; --head:#e9eef4;
  --ans:#2e9e3f; --nans:#e2502b; --nv:#e3e6ea; --nv-b:#b9c1cb; --mark:#6a3fb5; --gold:#f4b400;
  --ok:#1f8a3b; --ok-wash:#e5f5e8; --bad:#c8352a; --bad-wash:#fdeceb; --info-wash:#fff8e1;
  --f:Arial, "Helvetica Neue", Helvetica, "Noto Sans", sans-serif;
  color-scheme: light;
}
html,body{height:100%}
#app{height:100%}
body{background:var(--wash);color:var(--ink);font-family:var(--f);font-size:14px;}
*{box-sizing:border-box}
button{font-family:var(--f);cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.screen{min-height:100%;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top brand strip */
.topbar{background:var(--brand);color:var(--brand-ink);padding-block:8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px;border:2px solid var(--gold);flex:none}
.tb-text{min-width:0;flex:1 1 220px}
.tb-org{font-weight:700;letter-spacing:1.2px;font-size:15px}
.tb-exam{font-size:12.5px;opacity:.92}
.tb-right{font-size:12px;text-align:right;opacity:.92}

/* login */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding-block:28px}
.login{display:grid;grid-template-columns:1fr 1fr;max-width:860px;width:100%;background:var(--paper);border:1px solid var(--line);box-shadow:0 2px 10px rgba(11,79,138,.08)}
.login-info{background:var(--head);padding:24px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line)}
.login-info .row{display:flex;gap:8px;font-size:13.5px}
.login-info .k{color:var(--muted);min-width:118px}
.login-info .v{font-weight:700}
.login-form{padding:24px;display:flex;flex-direction:column;gap:12px}
.login-form h2{margin:0 0 4px;font-size:18px;color:var(--brand)}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:9px 10px;border:1px solid var(--nv-b);border-radius:3px;font-size:14px;font-family:var(--f)}
.btn{border:1px solid var(--nv-b);background:var(--paper);color:var(--ink);padding:9px 16px;border-radius:3px;font-size:13.5px}
.btn:hover{background:var(--head)}
.btn-primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff;font-weight:700}
.btn-primary:hover{background:var(--brand)}
.btn-primary:disabled{background:#9db8d3;border-color:#9db8d3;cursor:not-allowed}
.btn-green{background:var(--ans);border-color:var(--ans);color:#fff;font-weight:700}
.btn-green:hover{filter:brightness(.92)}
.note{font-size:12px;color:var(--muted);line-height:1.5}

/* instructions */
.instr{flex:1;padding-block:18px;display:flex;justify-content:center}
.instr-card{background:var(--paper);border:1px solid var(--line);max-width:980px;width:100%;display:flex;flex-direction:column}
.instr-head{background:var(--head);padding:12px 18px;font-weight:700;color:var(--brand);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.instr-body{padding:16px 22px;line-height:1.6;font-size:13.5px;overflow:auto}
.instr-body h3{font-size:14px;margin:14px 0 6px;color:var(--brand)}
.instr-body ol{padding-left:22px;margin:6px 0}
.instr-body li{margin-bottom:5px}
.legend-list{display:grid;gap:8px;margin:8px 0 8px 4px}
.legend-list div{display:flex;align-items:center;gap:10px}
.pattern{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.pattern th,.pattern td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.pattern th{background:var(--head)}
.pattern td.n{text-align:center;font-variant-numeric:tabular-nums}
.instr-foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;flex-direction:column;gap:12px}
.declare{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5}
.declare input{margin-top:3px;width:16px;height:16px;flex:none}
.instr-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* exam */
.exam{height:100%;display:flex;flex-direction:column}
.exam-main{flex:1;display:flex;min-height:0}
.qpane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper);border-right:1px solid var(--line)}
.secbar{display:flex;align-items:center;gap:8px;background:var(--head);border-bottom:1px solid var(--line);padding-block:6px;flex-wrap:wrap}
.secbar .lbl{font-weight:700;font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.tab{border:1px solid var(--nv-b);background:var(--paper);padding:6px 10px;font-size:12.5px;border-radius:3px 3px 0 0;color:var(--brand)}
.tab.on{background:var(--brand-2);color:#fff;border-color:var(--brand-2);font-weight:700}
.timer{font-weight:700;font-size:13px;background:var(--paper);border:1px solid var(--nv-b);padding:6px 10px;border-radius:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer b{color:var(--brand)}
.timer.low b{color:var(--bad)}
.qtype{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;padding-block:7px;border-bottom:1px solid var(--line);color:var(--muted)}
.qtype .mk span{color:var(--ok);font-weight:700}
.qtype .mk em{color:var(--bad);font-style:normal;font-weight:700}
.qhead{display:flex;justify-content:space-between;align-items:center;padding-block:9px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.qhead h2{margin:0;font-size:15px}
.qhead .lang{font-size:12px;color:var(--muted)}
.qhead select{font-size:12px;padding:2px 4px}
.qbody{flex:1;overflow:auto;padding-block:14px 20px;min-height:0}
.qtext{font-size:calc(15.5px*var(--fs,1));line-height:1.65;max-width:78ch}
.qtext b{font-weight:700}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px;max-width:78ch}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border:1px solid transparent;border-radius:3px;cursor:pointer;font-size:calc(15px*var(--fs,1));line-height:1.5}
.opt:hover{background:#f3f7fb;border-color:var(--line)}
.opt input{margin-top:4px;width:16px;height:16px;flex:none;accent-color:var(--brand-2)}
.opt.sel{background:#eaf2fb;border-color:#a9c6e6}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--head);padding-block:9px;padding-bottom:max(9px,env(safe-area-inset-bottom,0px))}
.actions .l{display:flex;gap:8px;flex-wrap:wrap}

/* palette */
.palette{width:300px;flex:none;display:flex;flex-direction:column;background:#f7f9fc;min-height:0}
.cand{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.cand svg{width:50px;height:58px;flex:none;border:1px solid var(--line);background:var(--head)}
.cand .nm{font-weight:700;font-size:13.5px;word-break:break-word}
.cand .roll{font-size:12px;color:var(--muted)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:11.5px;line-height:1.25}
.legend .it{display:flex;align-items:center;gap:6px}
.legend .it.wide{grid-column:1/-1}
.pal-sec{background:var(--brand-2);color:#fff;font-weight:700;font-size:12.5px;padding:6px 12px}
.pal-choose{font-size:12px;color:var(--muted);padding:8px 12px 2px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:9px 6px;padding:8px 12px 12px;align-content:start;min-height:0}
.pal-foot{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:var(--head);padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.pal-foot .btn-green{grid-column:1/-1}

/* status shapes */
.st{width:38px;height:33px;display:inline-grid;place-items:center;font-size:12.5px;font-weight:700;position:relative;border:1px solid transparent;font-variant-numeric:tabular-nums;flex:none;padding:0}
.st.sm{width:28px;height:25px;font-size:11px}
.st.nv{background:var(--nv);border-color:var(--nv-b);color:var(--ink);border-radius:3px}
.st.na{background:var(--nans);color:#fff;border-radius:2px 2px 14px 14px / 2px 2px 9px 9px}
.st.an{background:var(--ans);color:#fff;border-radius:14px 14px 2px 2px / 9px 9px 2px 2px}
.st.mk{background:var(--mark);color:#fff;border-radius:50%}
.st.am{background:var(--mark);color:#fff;border-radius:50%}
.st.am::after{content:"";position:absolute;right:-3px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--ans);border:2px solid #fff;box-sizing:border-box}
.st.sm.am::after{width:10px;height:10px;right:-3px;bottom:-2px}
.grid .st{justify-self:center;cursor:pointer}
.grid .st.cur{outline:2px solid var(--gold);outline-offset:2px}

/* figures */
.fig{margin:14px 0 4px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.word{font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:30px;letter-spacing:2px;color:#13294b;padding:6px 14px;border:1px dashed var(--nv-b);background:#fff}
.mirror-line{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:2px}
.mirror-line i{display:block;width:4px;height:58px;background:linear-gradient(#6aa3db,#2b6cb0)}
.water-wrap{display:flex;flex-direction:column;gap:3px}
.water-line{height:5px;background:repeating-linear-gradient(90deg,#4a90d9 0 10px,#9cc5ef 10px 20px);border-radius:3px}
.optfig{display:inline-block;font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:22px;letter-spacing:2px;color:#13294b}
.optfig.M{transform:scaleX(-1)} .optfig.W{transform:scaleY(-1)} .optfig.R{transform:rotate(180deg)}
.dice{display:flex;gap:26px;flex-wrap:wrap}
.dice figure{margin:0;text-align:center;font-size:12px;color:var(--muted)}
.dice svg{width:120px;height:120px;display:block}

.figimg{display:block;max-width:100%;height:auto;border:1px solid var(--line);background:#fff;margin:8px 0;cursor:zoom-in}
.zoomwrap{overflow:auto;max-height:75vh}.zoomwrap img{display:block;width:760px;max-width:none;height:auto}
.zhint{font-size:11.5px;color:var(--muted);margin:2px 0 0}
.passage{background:#f6f9fd;border:1px solid #c9d8ea;border-left:4px solid var(--brand-2);padding:10px 12px;margin:0 0 14px;font-size:calc(14px*var(--fs,1));line-height:1.6;max-width:78ch}
.passage summary{cursor:pointer;font-weight:700;color:var(--brand)}
.ptitle{font-weight:700;color:var(--brand);margin-bottom:4px}
.ptbl{overflow-x:auto;margin-top:8px}
.ptbl table{border-collapse:collapse;font-size:13.5px;background:#fff;min-width:320px}
.ptbl th,.ptbl td{border:1px solid #b9c7d8;padding:5px 9px;text-align:center}
.ptbl th{background:#e3ecf6}
.ptbl td:first-child{text-align:left;font-weight:700}
.fsz{display:inline-flex;gap:4px;align-items:center;margin-left:8px}
.fsz button{padding:2px 8px;font-size:12px}
.btn-out{border-color:#c8352a;color:#c8352a;font-weight:700}
.btn-out:hover{background:#fdeceb}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,30,50,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--paper);max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal-h{background:var(--brand);color:#fff;padding:10px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-h button{background:transparent;border:0;color:#fff;font-size:20px;line-height:1}
.modal-b{padding:14px 16px;overflow:auto}
.modal-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
.sumtbl{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.sumtbl th,.sumtbl td{border:1px solid var(--line);padding:7px 8px;text-align:center;font-variant-numeric:tabular-nums}
.sumtbl th{background:var(--head);font-size:12px}
.sumtbl td:first-child,.sumtbl th:first-child{text-align:left}
.sumtbl tr.tot td{font-weight:700;background:#f7f9fc}
.qp-item{border-bottom:1px solid var(--line);padding:10px 0;font-size:13.5px;line-height:1.55}
.qp-item .n{font-weight:700;color:var(--brand)}

/* result */
.result{flex:1;padding-block:18px 30px;display:flex;flex-direction:column;align-items:center;gap:16px}
.rcard{background:var(--paper);border:1px solid var(--line);max-width:1000px;width:100%}
.rhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.rhead h2{margin:0;font-size:18px;color:var(--brand)}
.score-row{display:grid;grid-template-columns:auto 1fr;gap:22px;padding:18px;align-items:center}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:30px;display:block;font-variant-numeric:tabular-nums}
.ring .c span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;width:100%}
.stat{border:1px solid var(--line);padding:10px 12px}
.stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.stat.ok .v{color:var(--ok)} .stat.bad .v{color:var(--bad)}
.verdict{margin:0 18px 16px;padding:10px 14px;background:var(--info-wash);border:1px solid #f1d68a;font-size:13.5px;line-height:1.5}
.secbars{padding:4px 18px 18px;display:grid;gap:10px}
.sb{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.sb .bar{height:14px;background:var(--nv);position:relative;overflow:hidden;border-radius:2px}
.sb .bar i{position:absolute;inset:0 auto 0 0;background:var(--brand-2)}
.sb .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center}
.chip{border:1px solid var(--nv-b);background:var(--paper);padding:5px 10px;border-radius:14px;font-size:12.5px}
.chip.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.sol{padding:14px 18px;border-bottom:1px solid var(--line)}
.sol-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.pill{padding:2px 8px;border-radius:10px;font-weight:700;font-size:11.5px}
.pill.ok{background:var(--ok-wash);color:var(--ok)} .pill.bad{background:var(--bad-wash);color:var(--bad)} .pill.skip{background:var(--nv);color:var(--muted)}
.sol .qtext{font-size:14.5px}
.sopts{display:grid;gap:6px;margin:10px 0}
.sopt{padding:7px 10px;border:1px solid var(--line);border-radius:3px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.sopt .L{font-weight:700;color:var(--muted);flex:none}
.sopt.right{background:var(--ok-wash);border-color:#9fd3ac}
.sopt.wrong{background:var(--bad-wash);border-color:#efb1ab}
.sopt .tag{margin-left:auto;font-size:11.5px;font-weight:700;white-space:nowrap}
.sopt.right .tag{color:var(--ok)} .sopt.wrong .tag{color:var(--bad)}
.exp{background:#f4f8fc;border-left:3px solid var(--brand-2);padding:9px 12px;font-size:13.5px;line-height:1.6}
.exp h4{margin:0 0 4px;font-size:12px;letter-spacing:.6px;color:var(--brand);text-transform:uppercase}
.empty{padding:22px 18px;color:var(--muted)}

.palette-toggle{display:none}
.site-foot{flex:none;min-height:64px;display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;background:#0a3f6e;color:#dbe8f6;font-size:12px;padding-block:8px;padding-right:max(210px,env(safe-area-inset-right,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.site-foot b{color:#fff}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff8e1;border:1px solid #f1d68a;color:#5b4300;padding:10px 16px;font-weight:700;font-size:13.5px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.15);max-width:calc(100% - 32px);text-align:center}
.cta{margin:0 18px 16px;padding:12px 14px;border:1px solid #9fc0e3;background:#eef5fc;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:13.5px;line-height:1.5}
.cta a,.ractions a{text-decoration:none}
.btn-wa{background:#1f9d55;border-color:#1f9d55;color:#fff;font-weight:700;display:inline-block}
.btn-wa:hover{filter:brightness(.92)}
.topics{padding:0 18px 18px}
.topics h3{font-size:14px;margin:0 0 8px;color:var(--brand)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid #efb1ab;background:var(--bad-wash);color:#7a1f17;padding:4px 10px;border-radius:12px;font-size:12.5px}
.tchip b{font-variant-numeric:tabular-nums}
.ractions{display:flex;gap:8px;flex-wrap:wrap}
.result{padding-bottom:84px}
@media print{.topbar .tb-right,.site-foot,.ractions,#filters,.cta,#logout,#retake,.toast{display:none!important}body{background:#fff}.rcard{border:0}.sol{break-inside:avoid}}
@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login-info{border-right:0;border-bottom:1px solid var(--line)}
  .palette{position:fixed;top:0;right:0;bottom:0;width:min(320px,88vw);z-index:40;box-shadow:-6px 0 18px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px)}
  .palette.open{transform:none}
  .palette{bottom:64px}
  .site-foot{padding-right:max(170px,env(safe-area-inset-right,0px));font-size:11px}
  .site-foot span:nth-child(2){display:none}
  .palette-toggle{display:inline-block}
  .tb-right{flex:1 1 100%;text-align:left}
  .exam .tb-right{display:none}
  .secbar .lbl{display:none}
  .tabs{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .tab{white-space:nowrap;flex:none}
  .timer{margin-right:auto}
  .score-row{grid-template-columns:1fr;justify-items:center}
  .sb{grid-template-columns:110px 1fr 56px}
  .qtext{font-size:calc(15px*var(--fs,1))}
  .secbar{gap:6px}
  .timer{font-size:12.5px;padding:5px 8px}
}
@media (prefers-reduced-motion:reduce){.palette{transition:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const DATA = {"sections": [["A", "Arithmetic"], ["B", "Data Interpretation"], ["C", "Reasoning & GMA"], ["D", "Current Events"], ["E", "Computer Awareness"]], "qs": [{"s": "A", "t": "Number System", "q": "What is the smallest number which leaves a remainder of 7 when divided by 12, 15 and 20, and is exactly divisible by 11?", "o": ["187", "127", "367", "247"], "a": 0, "e": "LCM(12, 15, 20) = 60, so the number is 60k + 7. 60k + 7 ≡ 5k + 7 ≡ 0 (mod 11) ⇒ k = 3 ⇒ 60 × 3 + 7 = <b>187</b> = 11 × 17.", "f": null, "p": null}, {"s": "A", "t": "LCM & HCF", "q": "What is the smallest five-digit number that is exactly divisible by 12, 15 and 18?", "o": ["10,260", "10,020", "10,080", "10,800"], "a": 2, "e": "LCM(12, 15, 18) = 180. 10,000 ÷ 180 = 55.5… ⇒ 180 × 56 = <b>10,080</b>.", "f": null, "p": null}, {"s": "A", "t": "Number System", "q": "What is the sum of all two-digit numbers that are divisible by 7?", "o": ["756", "714", "735", "728"], "a": 3, "e": "14, 21, …, 98: n = 13 terms ⇒ sum = 13 × (14 + 98)/2 = <b>728</b>.", "f": null, "p": null}, {"s": "A", "t": "Number System", "q": "How many prime numbers are there between 50 and 100?", "o": ["12", "9", "10", "11"], "a": 2, "e": "53, 59, 61, 67, 71, 73, 79, 83, 89, 97 ⇒ <b>10</b>.", "f": null, "p": null}, {"s": "A", "t": "Number System", "q": "A number leaves a remainder of 3 when divided by 5. What remainder will its square leave when divided by 5?", "o": ["9", "1", "3", "4"], "a": 3, "e": "N = 5k + 3 ⇒ N² = 25k² + 30k + 9 ⇒ remainder = 9 mod 5 = <b>4</b>.", "f": null, "p": null}, {"s": "A", "t": "Fractions", "q": "What is the value of 0.444… + 0.373737… expressed as a fraction?", "o": ["7/9", "9/11", "81/90", "4/11"], "a": 1, "e": "0.4̅ = 4/9 = 44/99 and 0.3̅7̅ = 37/99 ⇒ sum = 81/99 = <b>9/11</b>.", "f": null, "p": null}, {"s": "A", "t": "Algebra", "q": "If x + 1/x = 5, what is the value of x³ + 1/x³?", "o": ["110", "140", "115", "125"], "a": 0, "e": "x³ + 1/x³ = (x + 1/x)³ − 3(x + 1/x) = 125 − 15 = <b>110</b>.", "f": null, "p": null}, {"s": "A", "t": "Algebra", "q": "If a + b + c = 12 and a² + b² + c² = 50, what is the value of ab + bc + ca?", "o": ["38", "47", "52", "94"], "a": 1, "e": "(a + b + c)² = a² + b² + c² + 2(ab + bc + ca) ⇒ 144 = 50 + 2S ⇒ S = <b>47</b>.", "f": null, "p": null}, {"s": "A", "t": "Indices", "q": "What is the value of (243)<sup>0.4</sup> × (32)<sup>0.2</sup>?", "o": ["18", "36", "27", "12"], "a": 0, "e": "243 = 3⁵ ⇒ 3<sup>5 × 0.4</sup> = 3² = 9; 32 = 2⁵ ⇒ 2<sup>5 × 0.2</sup> = 2 ⇒ 9 × 2 = <b>18</b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage", "q": "The price of petrol rises by 20%, and a man increases his expenditure on petrol by only 8%. By what per cent does his consumption fall?", "o": ["15%", "10%", "12%", "8%"], "a": 1, "e": "New consumption = 1.08 ÷ 1.20 = 0.90 of the old ⇒ fall = <b>10%</b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage", "q": "In an examination, 35% of the candidates failed in English, 25% failed in Mathematics and 10% failed in both. If 1,000 candidates passed in both subjects, how many appeared?", "o": ["2,000", "1,800", "1,600", "2,500"], "a": 0, "e": "Failed in at least one = 35 + 25 − 10 = 50% ⇒ passed in both = 50% = 1,000 ⇒ total = <b>2,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Profit & Loss", "q": "A shopkeeper uses a weight of 900 g instead of 1 kg and sells at the cost price. What is his gain per cent?", "o": ["9 1/11%", "11 1/9%", "12 1/2%", "10%"], "a": 1, "e": "He gains 100 g on 900 g ⇒ 100/900 × 100 = <b>11 1/9%</b>.", "f": null, "p": null}, {"s": "A", "t": "Profit & Loss", "q": "By selling an article at three-fourths of its marked price, a trader still gains 20%. What will be his gain per cent if he sells it at the marked price?", "o": ["45%", "60%", "75%", "50%"], "a": 1, "e": "0.75 MP = 1.2 CP ⇒ MP = 1.6 CP ⇒ gain at MP = <b>60%</b>.", "f": null, "p": null}, {"s": "A", "t": "Simple Interest", "q": "₹4,000 is lent at 8% per annum simple interest for 2 years, and the interest so earned is then lent at the same rate for 1 more year. What is the total interest earned?", "o": ["₹640.00", "₹691.20", "₹960.00", "₹704.00"], "a": 1, "e": "First interest = 4,000 × 8% × 2 = ₹640; interest on ₹640 for 1 year = ₹51.20 ⇒ total = <b>₹691.20</b>.", "f": null, "p": null}, {"s": "A", "t": "Compound Interest", "q": "A sum of ₹1,600 is lent at 12.5% per annum compound interest. What is the interest for the second year alone?", "o": ["₹225", "₹200", "₹425", "₹250"], "a": 0, "e": "1st-year interest = ₹200 ⇒ amount ₹1,800 ⇒ 2nd-year interest = 12.5% of 1,800 = <b>₹225</b>.", "f": null, "p": null}, {"s": "A", "t": "Compound Interest", "q": "A sum amounts to ₹6,050 in 2 years and to ₹6,655 in 3 years at compound interest. What is the sum?", "o": ["₹4,800", "₹5,000", "₹5,500", "₹4,500"], "a": 1, "e": "Rate = (6,655 − 6,050)/6,050 = 10% ⇒ P = 6,050 ÷ (1.1)² = <b>₹5,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Ratio", "q": "If 40% of A is equal to three-fifths of B, what is A : B?", "o": ["5 : 3", "4 : 3", "3 : 2", "2 : 3"], "a": 2, "e": "0.4A = 0.6B ⇒ A/B = 6/4 = <b>3 : 2</b>.", "f": null, "p": null}, {"s": "A", "t": "Partnership", "q": "P and Q invest ₹24,000 and ₹30,000. After 6 months P adds ₹6,000 more. Out of a profit of ₹19,000 at the end of the year, what is P's share?", "o": ["₹10,000", "₹9,000", "₹9,500", "₹8,500"], "a": 1, "e": "P = 24,000 × 6 + 30,000 × 6 = 3,24,000; Q = 30,000 × 12 = 3,60,000 ⇒ 9 : 10 ⇒ P = 9/19 × 19,000 = <b>₹9,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Average", "q": "A batsman's average increases by 3 runs after he scores 87 runs in his 17th innings. What is his average after the 17th innings?", "o": ["42", "36", "39", "40"], "a": 2, "e": "16a + 87 = 17(a + 3) ⇒ a = 36 ⇒ new average = <b>39</b>.", "f": null, "p": null}, {"s": "A", "t": "Problems on Ages", "q": "The ratio of the present ages of a father and his son is 7 : 2. After 10 years it will be 9 : 4. What is the father's present age?", "o": ["28 years", "35 years", "42 years", "40 years"], "a": 1, "e": "(7x + 10)/(2x + 10) = 9/4 ⇒ 28x + 40 = 18x + 90 ⇒ x = 5 ⇒ father = <b>35 years</b>.", "f": null, "p": null}, {"s": "A", "t": "Problems on Ages", "q": "A mother's present age is 8 years more than four times her daughter's age. After 6 years the mother will be three times as old as the daughter. What is the daughter's present age?", "o": ["5 years", "6 years", "3 years", "4 years"], "a": 3, "e": "M = 4d + 8; M + 6 = 3(d + 6) ⇒ 4d + 14 = 3d + 18 ⇒ d = <b>4 years</b> (mother 24).", "f": null, "p": null}, {"s": "A", "t": "Time & Work", "q": "4 men and 6 women finish a work in 8 days, while 3 men and 7 women finish it in 10 days. In how many days will 10 women finish it?", "o": ["45 days", "40 days", "36 days", "50 days"], "a": 1, "e": "8(4m + 6w) = 10(3m + 7w) ⇒ 2m = 22w ⇒ m = 11w. Work = 8 × 50w = 400 woman-days ⇒ 10 women take <b>40 days</b>.", "f": null, "p": null}, {"s": "A", "t": "Time & Work", "q": "A, B and C can do a piece of work in 10, 12 and 15 days respectively. They start together, but A leaves after 2 days. In how many days in all will the work be finished?", "o": ["5 2/3 days", "6 days", "5 1/3 days", "4 2/3 days"], "a": 2, "e": "In 2 days all three do 2 × 15/60 = 1/2. B + C do 9/60 a day ⇒ remaining 1/2 takes 10/3 days ⇒ total = 2 + 10/3 = <b>5 1/3 days</b>.", "f": null, "p": null}, {"s": "A", "t": "Pipes & Cisterns", "q": "A pipe can fill a tank in 6 hours. Because of a leak at the bottom, it takes 8 hours to fill. In how many hours can the leak alone empty the full tank?", "o": ["14 hours", "24 hours", "48 hours", "12 hours"], "a": 1, "e": "Leak = 1/6 − 1/8 = 1/24 ⇒ <b>24 hours</b>.", "f": null, "p": null}, {"s": "A", "t": "Speed & Distance", "q": "Two trains start at the same time from two stations towards each other at 60 km/h and 40 km/h. When they meet, one has travelled 100 km more than the other. What is the distance between the stations?", "o": ["450 km", "400 km", "500 km", "600 km"], "a": 2, "e": "Difference in distance per hour = 20 km ⇒ time = 5 h ⇒ distance = (60 + 40) × 5 = <b>500 km</b>.", "f": null, "p": null}, {"s": "A", "t": "Trains", "q": "A man standing on a platform finds that a train takes 9 seconds to pass him and 30 seconds to pass the 315 m long platform. What is the length of the train?", "o": ["150 m", "120 m", "180 m", "135 m"], "a": 3, "e": "The extra 21 s are for 315 m ⇒ speed = 15 m/s ⇒ length = 15 × 9 = <b>135 m</b>.", "f": null, "p": null}, {"s": "A", "t": "Boats & Streams", "q": "A boat whose speed in still water is 9 km/h takes 3 hours more to go 36 km upstream than to come back downstream. What is the speed of the stream?", "o": ["3 km/h", "4.5 km/h", "2 km/h", "4 km/h"], "a": 0, "e": "36/(9 − s) − 36/(9 + s) = 3 ⇒ 72s = 3(81 − s²) ⇒ s² + 24s − 81 = 0 ⇒ s = <b>3 km/h</b>.", "f": null, "p": null}, {"s": "A", "t": "Mixture", "q": "A 30-litre mixture contains 70% milk and the rest water. How much milk must be added so that water becomes 25% of the new mixture?", "o": ["9 litres", "8 litres", "5 litres", "6 litres"], "a": 3, "e": "Water = 9 L. If 9 L is 25%, the new total = 36 L ⇒ milk added = <b>6 litres</b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "The diagonals of a rhombus are 24 cm and 10 cm. What is its perimeter?", "o": ["52 cm", "56 cm", "68 cm", "48 cm"], "a": 0, "e": "Side = √(12² + 5²) = 13 cm ⇒ perimeter = <b>52 cm</b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "A cone has a base radius of 7 cm and a slant height of 25 cm. What is its volume? (π = 22/7)", "o": ["1,540 cm³", "3,696 cm³", "1,232 cm³", "1,078 cm³"], "a": 2, "e": "h = √(25² − 7²) = 24 cm ⇒ V = 1/3 × 22/7 × 49 × 24 = <b>1,232 cm³</b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "How many lead balls of radius 1 cm can be made by melting a solid lead sphere of radius 4 cm?", "o": ["48", "32", "16", "64"], "a": 3, "e": "Number = (4/1)³ = <b>64</b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "A rectangular plot 50 m × 40 m has a 2.5 m wide path inside it along its boundary. What is the cost of gravelling the path at ₹20 per m²?", "o": ["₹7,500", "₹8,500", "₹9,000", "₹8,000"], "a": 1, "e": "Path area = 50 × 40 − 45 × 35 = 2,000 − 1,575 = 425 m² ⇒ cost = 425 × 20 = <b>₹8,500</b>.", "f": null, "p": null}, {"s": "A", "t": "Probability", "q": "A card is drawn at random from a pack of 52 cards. What is the probability that it is a king or a heart?", "o": ["17/52", "1/4", "4/13", "5/13"], "a": 2, "e": "13 hearts + 4 kings − 1 (king of hearts) = 16 ⇒ 16/52 = <b>4/13</b>.", "f": null, "p": null}, {"s": "A", "t": "Permutation", "q": "In how many ways can the letters of the word ODISHA be arranged so that the vowels always come together?", "o": ["144", "216", "72", "720"], "a": 0, "e": "Vowels O, I, A form one unit ⇒ 4! × 3! = 24 × 6 = <b>144</b>.", "f": null, "p": null}, {"s": "A", "t": "Approximation", "q": "What approximate value will come in place of ?: 1,749.88 ÷ 34.97 + 12.03% of 899.9 = ?", "o": ["148", "168", "158", "138"], "a": 2, "e": "≈ 1,750 ÷ 35 + 12% of 900 = 50 + 108 = <b>158</b>.", "f": null, "p": null}, {"s": "B", "t": "DI – Bar Graph", "q": "What is the total number of students in college D?", "o": ["3,800", "3,500", "3,400", "3,600"], "a": 3, "e": "10 + 12 + 14 = 36 hundred = <b>3,600</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Bar Graph", "q": "What is the ratio of the total number of Science students to the total number of Commerce students in the five colleges?", "o": ["13 : 9", "45 : 61", "4 : 3", "61 : 45"], "a": 3, "e": "Science = 10 + 14 + 9 + 12 + 16 = 61; Commerce = 6 + 10 + 8 + 14 + 7 = 45 ⇒ <b>61 : 45</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Bar Graph", "q": "Arts students in college C are approximately what per cent of all students in college C?", "o": ["48.4%", "44.4%", "42.6%", "46.9%"], "a": 3, "e": "15 ÷ (15 + 9 + 8) = 15/32 ≈ <b>46.9%</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Bar Graph", "q": "What is the average number of Science students per college?", "o": ["1,240", "1,260", "1,180", "1,220"], "a": 3, "e": "61 hundred ÷ 5 = 12.2 hundred = <b>1,220</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Bar Graph", "q": "In how many colleges is the number of Science students greater than the number of Arts and Commerce students taken together?", "o": ["Three", "None", "Two", "One"], "a": 1, "e": "A 10 vs 18, B 14 vs 18, C 9 vs 23, D 12 vs 24, E 16 vs 16 (equal, not greater) ⇒ <b>none</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Line Graph", "q": "In which year was the number of unsold units (production − sales) the highest?", "o": ["2021", "2023", "2020", "2022"], "a": 1, "e": "Unsold: 5, 3, 4, 8, 3, 3 ⇒ highest in <b>2023</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Line Graph", "q": "What is the total number of unsold units over the six years?", "o": ["28,000", "26,000", "22,000", "24,000"], "a": 1, "e": "5 + 3 + 4 + 8 + 3 + 3 = 26 thousand = <b>26,000</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Line Graph", "q": "By approximately what per cent did sales increase from 2020 to 2025?", "o": ["58.3%", "60.0%", "62.9%", "65.7%"], "a": 2, "e": "(57 − 35)/35 × 100 ≈ <b>62.9%</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Line Graph", "q": "Sales in 2024 were approximately what per cent of production in 2024?", "o": ["94.5%", "92.7%", "91.8%", "96.2%"], "a": 0, "e": "52 ÷ 55 × 100 ≈ <b>94.5%</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Line Graph", "q": "What is the ratio of the total production in 2020–2022 to the total sales in 2023–2025?", "o": ["149 : 135", "9 : 10", "27 : 29", "135 : 149"], "a": 3, "e": "Production (40 + 45 + 50) = 135; sales (40 + 52 + 57) = 149 ⇒ <b>135 : 149</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Pie Chart", "q": "How much is spent on Infrastructure?", "o": ["₹90,000 crore", "₹80,000 crore", "₹96,000 crore", "₹75,000 crore"], "a": 0, "e": "₹3,60,000 crore ÷ 360° = ₹1,000 crore per degree ⇒ 90° = <b>₹90,000 crore</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "Spending on Education is what per cent of the total budget?", "o": ["22.5%", "20%", "25%", "18%"], "a": 1, "e": "72/360 × 100 = <b>20%</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "By how much does the combined spending on Health and Social Welfare exceed the spending on Agriculture?", "o": ["₹27,000 crore", "₹45,000 crore", "₹36,000 crore", "₹31,500 crore"], "a": 2, "e": "(54 + 45) − 63 = 36° = <b>₹36,000 crore</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "What is the ratio of spending on Agriculture to spending on Others?", "o": ["7 : 4", "9 : 5", "4 : 7", "5 : 3"], "a": 0, "e": "63 : 36 = <b>7 : 4</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "If the Education budget is increased by 15% next year, what will it be?", "o": ["₹82,800 crore", "₹80,800 crore", "₹84,600 crore", "₹79,200 crore"], "a": 0, "e": "Education = ₹72,000 crore ⇒ × 1.15 = <b>₹82,800 crore</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Table", "q": "What were the total sales of all four companies in March?", "o": ["6,350", "6,250", "6,450", "6,150"], "a": 0, "e": "1,350 + 2,000 + 1,300 + 1,700 = <b>6,350</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Table", "q": "By what per cent did the sales of company P increase from January to April?", "o": ["35.0%", "40.0%", "32.5%", "37.5%"], "a": 3, "e": "(1,650 − 1,200)/1,200 × 100 = <b>37.5%</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Table", "q": "Which company had the highest total sales over the four months?", "o": ["S", "P", "R", "Q"], "a": 3, "e": "P 5,700; Q 7,600; R 4,300; S 6,200 ⇒ <b>Q</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Table", "q": "What were the average monthly sales of company R?", "o": ["1,050", "1,125", "1,100", "1,075"], "a": 3, "e": "(900 + 1,100 + 1,300 + 1,000) ÷ 4 = 4,300 ÷ 4 = <b>1,075</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Table", "q": "In February, the sales of company S were what per cent less than those of company Q?", "o": ["14.3%", "12.5%", "15.0%", "10.0%"], "a": 1, "e": "(1,600 − 1,400)/1,600 × 100 = <b>12.5%</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Stacked Bar", "q": "What is the total number of employees in the company?", "o": ["445", "425", "435", "455"], "a": 2, "e": "Male 270 + female 165 = <b>435</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Stacked Bar", "q": "What percentage of the employees in the IT department are female (approximately)?", "o": ["40.0%", "33.3%", "30.0%", "50.0%"], "a": 1, "e": "40 ÷ (80 + 40) × 100 ≈ <b>33.3%</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Stacked Bar", "q": "Which department has the highest proportion of female employees?", "o": ["Sales", "HR", "Operations", "Finance"], "a": 3, "e": "HR 40%, Finance 35/80 = 43.75%, IT 33.3%, Sales 45/105 ≈ 42.9%, Operations 31.25% ⇒ <b>Finance</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Stacked Bar", "q": "What is the ratio of male employees in Sales to female employees in Finance?", "o": ["12 : 7", "4 : 3", "7 : 12", "3 : 2"], "a": 0, "e": "60 : 35 = <b>12 : 7</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Stacked Bar", "q": "If 20% of the male employees of Operations are transferred to HR, how many male employees will HR have?", "o": ["44", "41", "36", "40"], "a": 1, "e": "20% of 55 = 11 ⇒ HR males = 30 + 11 = <b>41</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "Data Sufficiency", "q": "What is the value of x + y?<br>I. x − y = 4<br>II. x² − y² = 32", "o": ["Either I or II alone is sufficient", "Both I and II together are needed", "Statement I alone is sufficient", "Statement II alone is sufficient"], "a": 1, "e": "Neither alone is enough. Together: (x + y)(x − y) = 32 ⇒ x + y = 32 ÷ 4 = 8 ⇒ <b>both together are needed</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "n is an integer. Is n divisible by 6?<br>I. n is divisible by 3.<br>II. n is divisible by 12.", "o": ["Both I and II together are needed", "Statement I alone is sufficient", "Either I or II alone is sufficient", "Statement II alone is sufficient"], "a": 3, "e": "I: 9 is divisible by 3 but not by 6 ⇒ not sufficient. II: every multiple of 12 is a multiple of 6 ⇒ <b>Statement II alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "What is the profit per cent on an article?<br>I. Its cost price is 80% of its selling price.<br>II. Its selling price is ₹500.", "o": ["Statement II alone is sufficient", "Either I or II alone is sufficient", "Both I and II together are needed", "Statement I alone is sufficient"], "a": 3, "e": "I: CP = 0.8 SP ⇒ profit = 0.2 SP = 25% of CP ⇒ sufficient. II gives no cost ⇒ <b>Statement I alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "What is the area of a square?<br>I. Its diagonal is 10 cm.<br>II. Its perimeter is 20√2 cm.", "o": ["Statement I alone is sufficient", "Statement II alone is sufficient", "Even I and II together are not sufficient", "Either I or II alone is sufficient"], "a": 3, "e": "I: area = d²/2 = 50 cm². II: side = 5√2 ⇒ area = 50 cm² ⇒ <b>either alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "Who is the tallest among A, B, C and D?<br>I. A is taller than both B and C.<br>II. D is shorter than C.", "o": ["Statement I alone is sufficient", "Statement II alone is sufficient", "Either I or II alone is sufficient", "Both I and II together are needed"], "a": 3, "e": "I leaves D unknown; II alone says nothing about A or B. Together: A &gt; C &gt; D and A &gt; B ⇒ A is tallest ⇒ <b>both together are needed</b>.", "f": null, "p": "P6"}, {"s": "C", "t": "Analogy", "q": "Pen : Writer :: Scalpel : ?", "o": ["Surgeon", "Butcher", "Tailor", "Barber"], "a": 0, "e": "A writer works with a pen; a <b>surgeon</b> operates with a scalpel.", "f": null, "p": null}, {"s": "C", "t": "Number Analogy", "q": "7 : 50 :: 9 : ?", "o": ["81", "90", "80", "82"], "a": 3, "e": "7² + 1 = 50 ⇒ 9² + 1 = <b>82</b>.", "f": null, "p": null}, {"s": "C", "t": "Letter Analogy", "q": "DEAF : FGCH :: BLUE : ?", "o": ["DNXG", "CMVF", "DNWG", "DMWG"], "a": 2, "e": "Each letter moves 2 places forward: D→F, E→G, A→C, F→H. So B→D, L→N, U→W, E→G ⇒ <b>DNWG</b>.", "f": null, "p": null}, {"s": "C", "t": "Classification", "q": "Find the odd pair: (3, 27), (4, 64), (5, 125), (6, 196), (7, 343)", "o": ["(5, 125)", "(7, 343)", "(6, 196)", "(4, 64)"], "a": 2, "e": "In every other pair the second number is the cube of the first; 6³ = 216, not 196 ⇒ <b>(6, 196)</b>.", "f": null, "p": null}, {"s": "C", "t": "Number Series", "q": "Find the next term: 120, 99, 80, 63, 48, ?", "o": ["33", "36", "34", "35"], "a": 3, "e": "11² − 1, 10² − 1, 9² − 1, 8² − 1, 7² − 1 ⇒ next 6² − 1 = <b>35</b>.", "f": null, "p": null}, {"s": "C", "t": "Letter Series", "q": "Find the next letter: C, F, J, O, ?", "o": ["W", "V", "U", "T"], "a": 2, "e": "Gaps of +3, +4, +5, +6 ⇒ O (15) + 6 = <b>U</b> (21).", "f": null, "p": null}, {"s": "C", "t": "Wrong Number", "q": "Find the wrong number in the series: 3, 8, 15, 24, 34, 48", "o": ["48", "34", "15", "24"], "a": 1, "e": "Terms are n² − 1: 3, 8, 15, 24, <b>35</b>, 48 ⇒ 34 is wrong.", "f": null, "p": null}, {"s": "C", "t": "Coding–Decoding", "q": "If GARDEN is coded as HZSCFM, how is FLOWER coded in that language?", "o": ["GMPVFS", "EKPXDQ", "GKPVFQ", "GKNVFQ"], "a": 2, "e": "Letters alternate +1, −1: G+1 = H, A−1 = Z, R+1 = S, D−1 = C, E+1 = F, N−1 = M. FLOWER ⇒ <b>GKPVFQ</b>.", "f": null, "p": null}, {"s": "C", "t": "Coding–Decoding", "q": "In a code language, 'tee see pee' means 'drink fruit juice', 'see kee lee' means 'juice is sweet' and 'lee ree mee' means 'he is intelligent'. Which word means 'sweet'?", "o": ["kee", "ree", "lee", "see"], "a": 0, "e": "'see' = juice (statements 1 & 2); 'lee' = is (statements 2 & 3) ⇒ sweet = <b>kee</b>.", "f": null, "p": null}, {"s": "C", "t": "Coded Blood Relation", "q": "A + B means A is the mother of B; A − B means A is the brother of B; A × B means A is the father of B; A ÷ B means A is the sister of B. Which expression shows that P is the maternal uncle of Q?", "o": ["P − R × Q", "P × R − Q", "P ÷ R + Q", "P − R + Q"], "a": 3, "e": "P − R: P is the brother of R; R + Q: R is the mother of Q ⇒ P is Q's mother's brother = <b>maternal uncle</b>.", "f": null, "p": null}, {"s": "C", "t": "Blood Relation", "q": "Pointing to a woman, Rakesh said, \"Her mother's only son is my father.\" How is the woman related to Rakesh?", "o": ["Mother", "Sister", "Aunt", "Grandmother"], "a": 2, "e": "Her mother's only son = her brother = Rakesh's father ⇒ she is his father's sister ⇒ <b>aunt</b>.", "f": null, "p": null}, {"s": "C", "t": "Direction Sense", "q": "Rita walks 6 km West, turns left and walks 5 km, turns left again and walks 10 km, and then turns left and walks 2 km. How far and in which direction is she from her starting point?", "o": ["5 km, North-East", "7 km, South-East", "5 km, South-East", "3 km, South-West"], "a": 2, "e": "West 6 → South 5 → East 10 → North 2 ⇒ she is 4 km East and 3 km South ⇒ √(4² + 3²) = <b>5 km, South-East</b>.", "f": null, "p": null}, {"s": "C", "t": "Direction Sense", "q": "In the evening, Mohan stands facing his house and his shadow falls exactly behind him. In which direction is the house from Mohan?", "o": ["North", "West", "East", "South"], "a": 1, "e": "In the evening the sun is in the West, so shadows fall towards the East. His shadow is behind him ⇒ he faces <b>West</b>.", "f": null, "p": null}, {"s": "C", "t": "Ranking", "q": "In a queue, A is 10th from the front and B is 25th from the back, and there are 8 persons between them. What is the minimum number of persons in the queue?", "o": ["27", "25", "34", "43"], "a": 1, "e": "For the minimum, B is ahead of A: B is at position 10 − 9 = 1. B being 25th from the back ⇒ total = <b>25</b>. (If B were behind A, the total would be 43.)", "f": null, "p": null}, {"s": "C", "t": "Syllogism", "q": "Statements: No pen is a pencil. All pencils are erasers.<br>Conclusions: I. Some erasers are not pens. II. Some erasers are pencils.", "o": ["Only II follows", "Both I and II follow", "Only I follows", "Neither I nor II follows"], "a": 1, "e": "The erasers that are pencils are not pens ⇒ I follows. 'All pencils are erasers' ⇒ some erasers are pencils ⇒ II follows ⇒ <b>both follow</b>.", "f": null, "p": null}, {"s": "C", "t": "Syllogism", "q": "Statements: All mangoes are fruits. Some fruits are sweet. No sweet thing is bitter.<br>Conclusions: I. Some fruits are not bitter. II. Some mangoes are sweet.", "o": ["Only I follows", "Only II follows", "Neither follows", "Both I and II follow"], "a": 0, "e": "The fruits that are sweet are not bitter ⇒ I follows. The sweet fruits need not be mangoes ⇒ II does not follow ⇒ <b>only I follows</b>.", "f": null, "p": null}, {"s": "C", "t": "Calendar", "q": "How many Sundays are there in the year 2028?", "o": ["52", "54", "53", "51"], "a": 2, "e": "2028 is a leap year beginning on a Saturday, so both Saturday and Sunday occur 53 times ⇒ <b>53</b>.", "f": null, "p": null}, {"s": "C", "t": "Linear Arrangement", "q": "Seven persons A, B, C, D, E, F and G sit in a row facing North. D sits exactly in the middle. A sits third to the left of D. F sits immediately to the right of D. B sits at one of the ends. C is an immediate neighbour of both F and B. E sits immediately to the left of D. Who sits second to the left of D?", "o": ["A", "G", "C", "E"], "a": 1, "e": "From left: A, G, E, D, F, C, B. Second to the left of D is <b>G</b>.", "f": null, "p": null}, {"s": "C", "t": "Linear Arrangement", "q": "In the same arrangement, how many persons sit between A and C?", "o": ["Five", "Four", "Three", "Two"], "a": 1, "e": "A (1st) and C (6th) have G, E, D, F between them ⇒ <b>four</b>.", "f": null, "p": null}, {"s": "C", "t": "Inequality", "q": "If P ≥ Q &gt; R = S ≥ T, which of the following is definitely true?<br>I. P &gt; S &nbsp; II. Q &gt; T", "o": ["Neither I nor II is true", "Only I is true", "Both I and II are true", "Only II is true"], "a": 2, "e": "P ≥ Q &gt; R = S ⇒ P &gt; S. Q &gt; R = S ≥ T ⇒ Q &gt; T ⇒ <b>both are true</b>.", "f": null, "p": null}, {"s": "C", "t": "Course of Action", "q": "Statement: Many students of a rural school fail in English every year.<br>Courses of action: I. The school should appoint a trained English teacher. II. English should be removed from the syllabus.", "o": ["Only I follows", "Both I and II follow", "Neither follows", "Only II follows"], "a": 0, "e": "I tackles the cause of the problem; II avoids it and harms students ⇒ <b>only I follows</b>.", "f": null, "p": null}, {"s": "C", "t": "Cause & Effect", "q": "Statement I: The State government has raised the minimum support price of paddy.<br>Statement II: Farmers in the State have decided to increase the area under paddy.", "o": ["II is the cause and I is its effect", "I is the cause and II is its effect", "Both are effects of a common cause", "Both are independent causes"], "a": 1, "e": "A higher MSP makes paddy more profitable, so farmers grow more of it ⇒ <b>I is the cause, II the effect</b>.", "f": null, "p": null}, {"s": "C", "t": "Mathematical Operation", "q": "If 3 @ 4 = 19 and 5 @ 6 = 41, then 7 @ 8 = ?", "o": ["64", "71", "73", "56"], "a": 1, "e": "a @ b = ab + a + b: 12 + 7 = 19, 30 + 11 = 41 ⇒ 56 + 15 = <b>71</b>.", "f": null, "p": null}, {"s": "C", "t": "Alpha-numeric Series", "q": "In the series R 4 T % 7 M E 9 @ 3 K 2 # P 5 U, how many symbols are immediately followed by a number?", "o": ["1", "2", "0", "3"], "a": 1, "e": "% 7 and @ 3 qualify; # is followed by P ⇒ <b>2</b>.", "f": null, "p": null}, {"s": "C", "t": "Missing Number", "q": "Find the missing number: (3, 4, 11), (4, 5, 39), (5, 6, ?)", "o": ["79", "91", "99", "89"], "a": 3, "e": "Third = first³ − second²: 27 − 16 = 11, 64 − 25 = 39 ⇒ 125 − 36 = <b>89</b>.", "f": null, "p": null}, {"s": "C", "t": "Venn Problem", "q": "In a class of 50 students, 28 play cricket, 22 play football and 7 play neither game. How many students play only cricket?", "o": ["7", "15", "28", "21"], "a": 3, "e": "Play at least one = 43 ⇒ both = 28 + 22 − 43 = 7 ⇒ only cricket = 28 − 7 = <b>21</b>.", "f": null, "p": null}, {"s": "C", "t": "Counting", "q": "How many numbers from 1 to 100 contain the digit 7 at least once?", "o": ["19", "18", "20", "10"], "a": 0, "e": "Units digit 7: 10 numbers (7, 17, …, 97); tens digit 7: 70–79 = 10; 77 counted twice ⇒ <b>19</b>.", "f": null, "p": null}, {"s": "C", "t": "Dice (Non-verbal)", "q": "Two positions of the same dice are shown. Which number is opposite to 2?", "o": ["3", "1", "6", "5"], "a": 2, "e": "In both positions 4 is on top. In the first, 1 is in front and 2 on the right; in the second, 6 is in front and 1 on the right — the face that was on the left (6) has come to the front.<br>So 6 is on the face opposite 2 ⇒ <b>6</b>.", "f": {"kind": "dice", "a": [4, 1, 2], "b": [4, 6, 1]}, "p": null}, {"s": "C", "t": "Figure Series (Non-verbal)", "q": "Which answer figure will continue the series of problem figures?", "o": ["(1)", "(2)", "(3)", "(4)"], "a": 0, "e": "The arrow turns 45° clockwise at each step (up → up-right → right → down-right → <b>down</b>), and the dot moves one corner clockwise (top-left → top-right → bottom-right → bottom-left → <b>top-left</b>) ⇒ figure <b>(1)</b>.", "f": {"kind": "img", "id": "series6"}, "p": null}, {"s": "C", "t": "Mirror Image (Non-verbal)", "q": "Choose the correct mirror image of the given figure when the mirror is placed to its right.", "o": ["@P", "@W", "@M", "@R"], "a": 2, "e": "In a mirror image, left and right are interchanged: the order of the characters is reversed and each character is laterally inverted.", "f": {"kind": "mirror", "text": "LOGIC 58"}, "p": null}, {"s": "C", "t": "Puzzle", "q": "Five persons K, L, M, N and O live on the five floors of a building, one on each floor (floor 1 is the lowest). L lives on the top floor. M lives on an even-numbered floor. K lives immediately above M. O does not live on floor 1. Who lives on floor 4?", "o": ["N", "O", "K", "M"], "a": 1, "e": "M cannot be on floor 4 (K would then be on 5, which is L's). So M = 2, K = 3; O ≠ 1 ⇒ O = 4, N = 1 ⇒ floor 4: <b>O</b>.", "f": null, "p": null}, {"s": "C", "t": "Puzzle", "q": "In the same building, who lives immediately below K?", "o": ["M", "O", "N", "L"], "a": 0, "e": "Floors 1–5: N, M, K, O, L ⇒ below K is <b>M</b>.", "f": null, "p": null}, {"s": "C", "t": "Puzzle", "q": "In the same building, how many persons live between N and L?", "o": ["4", "1", "2", "3"], "a": 3, "e": "M, K and O live between N (1) and L (5) ⇒ <b>3</b>.", "f": null, "p": null}, {"s": "C", "t": "Statement & Assumption", "q": "Statement: The railway has announced special trains to Puri during the Rath Yatra.<br>Assumptions: I. A large number of people travel to Puri during the Rath Yatra. II. Regular trains to Puri will be cancelled.", "o": ["Both I and II are implicit", "Only II is implicit", "Only I is implicit", "Neither is implicit"], "a": 2, "e": "Special trains are run because of the expected rush (I). Nothing suggests regular trains will stop (II) ⇒ <b>only I is implicit</b>.", "f": null, "p": null}, {"s": "C", "t": "Alphabet Test", "q": "How many letters of the English alphabet lie between the 5th letter from the left and the 9th letter from the right?", "o": ["12", "11", "13", "14"], "a": 0, "e": "5th from left = E (5); 9th from right = R (18) ⇒ letters between = 18 − 5 − 1 = <b>12</b>.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "In November 2026, India was re-elected to the Council of the International Telecommunication Union (ITU) for 2027–2030 at the Plenipotentiary Conference held in:", "o": ["Geneva, Switzerland", "Bucharest, Romania", "Doha, Qatar", "Riyadh, Saudi Arabia"], "a": 2, "e": "India was re-elected to the 48-member ITU Council at the Plenipotentiary Conference in <b>Doha, Qatar</b>.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "India has been chosen to host the ITU Plenipotentiary Conference in which year?", "o": ["2030", "2027", "2034", "2028"], "a": 0, "e": "The ITU Council backed India's bid to host the Plenipotentiary Conference in <b>2030</b> (PP-30).", "f": null, "p": null}, {"s": "D", "t": "Science 2026", "q": "In November 2026, which spacecraft became the first human-made object to reach a distance of one light-day (about 25.9 billion km) from Earth?", "o": ["Voyager 1", "New Horizons", "Pioneer 10", "Voyager 2"], "a": 0, "e": "NASA's <b>Voyager 1</b> (launched 1977) reached one light-day on 18 November 2026, so a command now takes a full day to reach it.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "Lakshya Sen became the first Indian to win which BWF Super 500 title in November 2026, beating Koki Watanabe in the final?", "o": ["China Masters", "Japan Open", "Hong Kong Open Super 500", "Kumamoto Masters Japan"], "a": 3, "e": "Lakshya Sen won the <b>Kumamoto Masters Japan</b> 2026, coming back from a game down against Koki Watanabe.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "In November 2026, who was reappointed unopposed as Chairman of the International Cricket Council (ICC) for a second term?", "o": ["Greg Barclay", "Roger Binny", "Mithun Manhas", "Jay Shah"], "a": 3, "e": "<b>Jay Shah</b> was reappointed for a second consecutive term; this was confirmed at the ICC Board meetings in Bali.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "According to the cricket calendar approved by the ICC in November 2026, India will host the ICC Champions Trophy in:", "o": ["2030", "2033", "2029", "2028"], "a": 2, "e": "India will host the <b>2029</b> Champions Trophy and co-host the 2031 ODI World Cup with Bangladesh.", "f": null, "p": null}, {"s": "D", "t": "Miscellaneous 2026", "q": "Which word was chosen by Collins Dictionary as its Word of the Year 2026?", "o": ["Mogging", "Brain rot", "Vibe coding", "Rizz"], "a": 0, "e": "<b>'Mogging'</b> — 'the act of outshining or outperforming someone or something' — is Collins' Word of the Year 2026.", "f": null, "p": null}, {"s": "D", "t": "Awards 2026", "q": "The Chennai-based organisation REACH became the first Indian civil society group to win the Kochon Prize 2026 for its work on:", "o": ["Malaria", "HIV/AIDS", "Tuberculosis", "Kala-azar (visceral leishmaniasis)"], "a": 2, "e": "The Kochon Prize, given by Korea's Kochon Foundation with the Stop TB Partnership, honours work against <b>tuberculosis</b>. REACH shared the 2026 prize with groups from Kenya and the Marshall Islands.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "In November 2026, the Defence Ministry signed a ₹1,976-crore contract with Israel Aerospace Industries to upgrade which missile system of the Indian Navy?", "o": ["Barak", "BrahMos", "Akash", "Shtil"], "a": 0, "e": "The contract (signed 18 November 2026) covers upgrade and obsolescence management of the <b>Barak</b> point-defence missile systems on Navy warships.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "JAIMEX-26, in which INS Sahyadri took part with JS Ise in November 2026, is a maritime exercise between India and:", "o": ["Japan", "Jordan", "Jamaica", "Indonesia"], "a": 0, "e": "JAIMEX-26 was an India–<b>Japan</b> naval exercise with the Japan Maritime Self-Defense Force, held south of Honshu on 13–14 November 2026.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "The Quad Leaders' Summit held in November 2026, which marked the 10th anniversary of the Free and Open Indo-Pacific vision, took place in:", "o": ["Tokyo", "Manila", "New Delhi", "Canberra"], "a": 1, "e": "Quad leaders met in <b>Manila</b>, Philippines, and announced initiatives on maritime security, AI and cybersecurity.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "In November 2026, India and nine other countries signed the 'San Francisco Declaration' under the US-led Pax Silica initiative. It is mainly about:", "o": ["Protecting the high seas biodiversity", "Securing AI and technology supply chains", "Ending tariffs on farm and fisheries products worldwide", "Phasing out coal-based power plants"], "a": 1, "e": "The Pax Silica declaration aims to <b>secure AI and critical technology supply chains</b> and infrastructure.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "'Neelamani' is the mascot of the Khelo India Youth Games 2026, to be held in December 2026 in which State?", "o": ["Bihar", "Telangana", "Uttarakhand", "Odisha"], "a": 1, "e": "The 8th Khelo India Youth Games (11–22 December 2026) will be held in <b>Telangana</b> for the first time; the logo and mascot Neelamani were unveiled in November 2026.", "f": null, "p": null}, {"s": "D", "t": "Culture 2026", "q": "The Ranivas (Raniwas) Mound, declared a monument of national importance by the ASI in November 2026, is in which State?", "o": ["Madhya Pradesh", "Bihar", "Uttar Pradesh", "Jharkhand"], "a": 1, "e": "The mound is near the Kesariya Stupa in East Champaran, <b>Bihar</b>, an area with remains of an ancient Buddhist monastic establishment.", "f": null, "p": null}, {"s": "D", "t": "Culture 2026", "q": "The 100 Drums Wangala Festival, which set a Guinness World Record at its golden jubilee in November 2026, is a harvest festival of the Garo people of:", "o": ["Meghalaya", "Nagaland", "Mizoram", "Arunachal Pradesh"], "a": 0, "e": "The 50th Hundred Drums Wangala Festival at Chibragre, West Garo Hills, <b>Meghalaya</b>, set the record for the largest Wangala dance, with over 1,000 Dama (drum) players.", "f": null, "p": null}, {"s": "D", "t": "Environment 2026", "q": "In November 2026, five new horned frog species, including India's first documented snail-eating frog, were described from which State?", "o": ["Kerala", "Andaman and Nicobar Islands", "Arunachal Pradesh", "Sikkim"], "a": 2, "e": "The species of the genus <i>Jingophrys</i> were found in <b>Arunachal Pradesh</b> by Delhi University and Harvard researchers.", "f": null, "p": null}, {"s": "D", "t": "Environment 2026", "q": "The name of Cyclone 'Akvan', which formed over the Bay of Bengal in November 2026, was suggested by:", "o": ["Myanmar", "Pakistan", "Oman", "Iran"], "a": 3, "e": "'Akvan' was contributed by <b>Iran</b> to the North Indian Ocean cyclone-naming list; it comes from a figure in the Persian epic Shahnameh.", "f": null, "p": null}, {"s": "D", "t": "Business 2026", "q": "Who was named interim CEO of NVIDIA in November 2026 after co-founder Jensen Huang resigned?", "o": ["Debora Shoquist", "Lisa Su", "Jayshree Ullal", "Colette Kress"], "a": 3, "e": "CFO <b>Colette Kress</b> was named interim CEO.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "'Maitri Setu Yatra', a 3,500-km NCC cycling expedition flagged off in November 2026, will travel from Colombo to New Delhi with cadets of India and:", "o": ["Maldives", "Nepal", "Bangladesh", "Sri Lanka"], "a": 3, "e": "24 NCC cadets of India and <b>Sri Lanka</b> were flagged off from Galle Face Green, Colombo.", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "The 62nd Session and Ministerial Meeting of the International Coconut Community was hosted by India in November 2026 at:", "o": ["Port Blair", "Mangaluru", "Kochi", "Thiruvananthapuram"], "a": 2, "e": "India hosted the meeting in <b>Kochi</b>, Kerala (17–20 November 2026), with the Coconut Development Board.", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "Which became the first Indian sectoral index futures contract approved by the US Commodity Futures Trading Commission (CFTC) in November 2026?", "o": ["Nifty Bank", "BSE Sensex", "BSE BANKEX", "Nifty IT"], "a": 2, "e": "BSE's <b>BANKEX</b> futures were cleared for offer and sale to eligible US investors.", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "In November 2026, the DGFT prohibited the export of 'black mass'. Black mass is obtained from:", "o": ["Used lithium-ion batteries", "Iron ore beneficiation tailings", "Coal washery rejects", "Crude oil refining"], "a": 0, "e": "Black mass is the powder recovered from shredded <b>lithium-ion batteries</b>, rich in lithium, cobalt, nickel and manganese.", "f": null, "p": null}, {"s": "D", "t": "Books 2026", "q": "'Sabr: Finding My Way in Cricket and Life', released in November 2026, is the autobiography of:", "o": ["Usman Khawaja", "Shaheen Shah Afridi", "Hashim Amla", "Moeen Ali"], "a": 0, "e": "It is the autobiography of former Australia opener <b>Usman Khawaja</b>.", "f": null, "p": null}, {"s": "D", "t": "Obituary 2026", "q": "Sanjit 'Bunker' Roy, who died in November 2026 at 81, founded which institution at Tilonia, Rajasthan?", "o": ["Barefoot College", "SEWA", "Lok Jagriti Kendra", "Seva Mandir"], "a": 0, "e": "Bunker Roy founded <b>Barefoot College</b> (originally the Social Work and Research Centre) in 1972, known for training rural women as solar engineers.", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "The 31st CII Partnership Summit was held on 12–13 November 2026 in:", "o": ["Bhubaneswar", "Thiruvananthapuram", "Gandhinagar", "Visakhapatnam"], "a": 3, "e": "Andhra Pradesh hosted the summit at <b>Visakhapatnam</b>.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "In November 2026, the Odisha Cabinet approved the 600 MW Upper Indravati Pumped Storage Project (₹4,708 crore). It is in which district?", "o": ["Rayagada", "Koraput", "Kalahandi", "Nabarangpur"], "a": 2, "e": "The project at Ranibahal in <b>Kalahandi</b> district will be implemented by OHPC through MEIL.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "Under which Odisha scheme, approved in November 2026, will students of 601 government and aided colleges get free Wi-Fi with up to 1 GB of data a day?", "o": ["Digital Utkal", "Odisha Shikshanet", "Mo College Connect", "Odisha Vidya Setu"], "a": 1, "e": "The <b>Odisha Shikshanet</b> scheme has an outlay of about ₹393.62 crore.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "In November 2026, the Odisha Cabinet removed the limit on the number of attempts for eligible candidates in which examination?", "o": ["OSSC Combined Graduate Level Examination", "Odisha Police SI Examination", "Odisha Teacher Eligibility Test", "Odisha Civil Services Examination"], "a": 3, "e": "The cap on attempts in the <b>Odisha Civil Services (OCS) Examination</b> was removed for eligible candidates.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "In November 2026, the Odisha Chief Minister launched robotic labs, costing about ₹164 crore, in how many government schools?", "o": ["375", "601", "807", "1,000"], "a": 2, "e": "Robotic labs were opened in <b>807</b> schools for Classes 6–10, along with the NIPUN app for foundational learning.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "The Odisha Bovine Breeding (Regulation) Bill, 2026, approved by the State Cabinet in November 2026, mainly seeks to regulate:", "o": ["Export of fish and prawns", "Breeding of cattle and buffaloes", "Sale of poultry feed", "Licensing of slaughter houses in towns"], "a": 1, "e": "The Bill sets up a framework for scientific <b>breeding of bovines (cattle and buffaloes)</b>, with quality assurance and traceability of breeding services, to raise livestock productivity.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "Which MS Excel function counts only the cells that contain numbers in a range?", "o": ["COUNTA", "COUNTIF", "COUNTBLANK", "COUNT"], "a": 3, "e": "<b>COUNT</b> counts numeric cells; COUNTA counts all non-empty cells and COUNTBLANK counts empty ones.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "In MS Excel, what does =MOD(17, 5) return?", "o": ["3.4", "3", "2", "5"], "a": 2, "e": "MOD gives the remainder: 17 = 5 × 3 + <b>2</b>.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "Which MS Excel function joins the text of two or more cells into one?", "o": ["TRIM", "VLOOKUP", "CONCATENATE", "NETWORKDAYS"], "a": 2, "e": "<b>CONCATENATE</b> (or CONCAT) joins text; TRIM removes extra spaces.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "Which of the following is NOT a valid cell reference in MS Excel?", "o": ["AA100", "1A", "$B$2", "A1"], "a": 1, "e": "A reference is column letter(s) followed by a row number, so <b>1A</b> is invalid.", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "In MS Word, what does the shortcut Ctrl + ] do to the selected text?", "o": ["Increases font size by 1 point", "Inserts a page break", "Applies superscript", "Decreases font size by 1 point"], "a": 0, "e": "Ctrl + ] <b>increases</b> and Ctrl + [ decreases the font size by 1 point.", "f": null, "p": null}, {"s": "E", "t": "Windows", "q": "Which shortcut directly opens the Task Manager in Windows?", "o": ["Windows + Ctrl + D", "Ctrl + Alt + Tab", "Alt + F4", "Ctrl + Shift + Esc"], "a": 3, "e": "<b>Ctrl + Shift + Esc</b> opens Task Manager directly; Alt + F4 closes the active window.", "f": null, "p": null}, {"s": "E", "t": "Windows", "q": "In Windows 10/11, which shortcut captures the whole screen and saves it automatically as an image file?", "o": ["Windows + PrtScn", "Windows + Shift + S", "Ctrl + P", "Alt + PrtScn"], "a": 0, "e": "<b>Windows + PrtScn</b> saves the screenshot in Pictures › Screenshots; Windows + Shift + S opens the snipping tool.", "f": null, "p": null}, {"s": "E", "t": "Hardware", "q": "Which unit of the CPU performs arithmetic and logical operations?", "o": ["MAR", "CU", "PC", "ALU"], "a": 3, "e": "The <b>Arithmetic Logic Unit</b> does calculations and comparisons; the Control Unit directs operations.", "f": null, "p": null}, {"s": "E", "t": "Storage", "q": "Which storage device has no moving parts?", "o": ["HDD", "Optical disc drive", "SSD", "Floppy disk drive"], "a": 2, "e": "A <b>solid-state drive</b> uses flash memory chips, unlike spinning hard disks.", "f": null, "p": null}, {"s": "E", "t": "Hardware", "q": "In a computer, the BIOS/firmware that starts the system is stored mainly in:", "o": ["ROM", "RAM", "Cache memory", "Hard disk"], "a": 0, "e": "Firmware is kept in non-volatile <b>ROM</b> (flash ROM) on the motherboard.", "f": null, "p": null}, {"s": "E", "t": "Networking", "q": "How many bits are there in an IPv6 address?", "o": ["64 bits", "32 bits", "128 bits", "256 bits"], "a": 2, "e": "IPv6 addresses are <b>128 bits</b> long; IPv4 addresses are 32 bits.", "f": null, "p": null}, {"s": "E", "t": "Internet", "q": "HTTPS secures communication between a browser and a website by using:", "o": ["DNS caching", "FTP tunnelling protocol", "SSL/TLS encryption", "IPv6 addressing"], "a": 2, "e": "HTTPS is HTTP over <b>SSL/TLS</b>, which encrypts the data.", "f": null, "p": null}, {"s": "E", "t": "Cyber Security", "q": "Fraud attempted through voice phone calls to obtain bank details is called:", "o": ["Phishing", "Smishing", "Spoofing", "Vishing"], "a": 3, "e": "<b>Vishing</b> = voice phishing; smishing uses SMS; phishing uses e-mail or websites.", "f": null, "p": null}, {"s": "E", "t": "Internet", "q": "What is a 'cookie' in the context of websites?", "o": ["Small data stored by the browser", "A virus that slows the computer", "A tool that compresses images", "A program that blocks pop-up windows"], "a": 0, "e": "A cookie is a <b>small text file the website stores in your browser</b> to remember logins and preferences.", "f": null, "p": null}, {"s": "E", "t": "Internet", "q": "Which key is commonly used to refresh a web page in a browser?", "o": ["F5", "F7", "F12", "F2"], "a": 0, "e": "<b>F5</b> reloads the page; F12 opens developer tools.", "f": null, "p": null}, {"s": "E", "t": "Windows", "q": "In Windows, files deleted from the hard disk are first moved to the:", "o": ["Recycle Bin", "Clipboard", "Control Panel", "Task Manager"], "a": 0, "e": "Deleted files go to the <b>Recycle Bin</b>, from where they can be restored until it is emptied.", "f": null, "p": null}, {"s": "E", "t": "Networking", "q": "Which wireless technology lets a smartphone make contactless payments by tapping it on a card machine?", "o": ["GPS", "NFC", "IrDA", "Wi-Fi"], "a": 1, "e": "<b>Near Field Communication</b> works over a few centimetres.", "f": null, "p": null}, {"s": "E", "t": "Input Devices", "q": "Which device is used to read the marks made on OMR answer sheets?", "o": ["MICR reader", "Barcode reader", "OMR reader", "Light pen"], "a": 2, "e": "An <b>Optical Mark Reader</b> senses shaded bubbles; MICR reads magnetic-ink characters on cheques.", "f": null, "p": null}, {"s": "E", "t": "Input Devices", "q": "Which technology converts printed text on paper into editable digital text with the help of a scanner and software?", "o": ["OMR", "RFID", "MICR", "OCR"], "a": 3, "e": "<b>Optical Character Recognition</b> turns scanned text into editable text.", "f": null, "p": null}, {"s": "E", "t": "Software", "q": "Which of the following is a free and open-source office suite?", "o": ["LibreOffice", "WPS Office", "Microsoft Office", "iWork"], "a": 0, "e": "<b>LibreOffice</b> is free and open source; MS Office and WPS are proprietary; iWork is Apple's free but closed-source suite.", "f": null, "p": null}], "passages": {"P1": "<div class=\"ptitle\">Directions (Q.36–40)</div><div>The bar graph shows the number of students (in hundreds) in three streams in five colleges A to E (hypothetical data).</div><img class=\"figimg\" alt=\"Chart for Directions (Q.36–40)\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAtYAAAGtCAYAAAAyHTNZAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAQ6wAAEOsBUJTofAAAnjZJREFUeJzs3XVYVNkbB/AvMHSXtImFHWCArWt3t6651hprrR1rd3d3YbfY3S0WKiAgPTTMcH9/8GPW2SF1hgH8fp7HR+bcc+95b8zwcubcczUEQRBAREREREQ/RVPdARARERER5QdMrImIiIiIlICJNRERERGREjCxJiIiIiJSAibWRERERERKwMSaiIiIiEgJmFgTERERESkBE2siIiIiIiV }

/* ---------- EXAM ---------- */
let tick=null;
function visit(i){ if(S.status[i]==="nv") S.status[i]="na"; S.cur=i; S.pending=S.saved[i]; }
function counts(from=0,to=QS.length-1){
  const c={an:0,na:0,nv:0,mk:0,am:0};
  for(let i=from;i<=to;i++) c[S.status[i]]++;
  return c;
}
function figHTML(q){
  const f=q.f; if(!f) return "";
  if(f.kind==="mirror") return `<div class="fig"><span class="word">${esc(f.text)}</span><span class="mirror-line"><span>M</span><i></i><span>N</span></span></div>`;
  if(f.kind==="water") return `<div class="fig"><div class="water-wrap"><span class="word">${esc(f.text)}</span><div class="water-line"></div><span class="note" style="text-align:center">water surface</span></div></div>`;
  if(f.kind==="img") return `<div class="fig" style="display:block"><img class="figimg" alt="Figure" src="${IMG[f.id]}"><p class="zhint">Tap the figure to enlarge.</p></div>`;
  if(f.kind==="dice") return `<div class="fig dice"><figure>${dieSVG(f.a)}<figcaption>Position (i)</figcaption></figure><figure>${dieSVG(f.b)}<figcaption>Position (ii)</figcaption></figure></div>`;
  return "";
}
function dieSVG([top,front,right]){
  return `<svg viewBox="0 0 120 120" role="img" aria-label="Die showing ${top} on top, ${front} in front, ${right} on the right">
  <polygon points="20,38 60,18 100,38 60,58" fill="#dbe8f6" stroke="#13294b" stroke-width="2"/>
  <polygon points="20,38 60,58 60,108 20,88" fill="#ffffff" stroke="#13294b" stroke-width="2"/>
  <polygon points="60,58 100,38 100,88 60,108" fill="#c3d6ec" stroke="#13294b" stroke-width="2"/>
  <text x="60" y="44" text-anchor="middle" font-size="17" font-weight="700" fill="#13294b" font-family="Arial">${top}</text>
  <text x="40" y="81" text-anchor="middle" font-size="20" font-weight="700" fill="#13294b" font-family="Arial">${front}</text>
  <text x="80" y="81" text-anchor="middle" font-size="20" font-weight="700" fill="#13294b" font-family="Arial">${right}</text></svg>`;
}
function pasHTML(q,open){
  if(!q.p||!PAS[q.p]) return "";
  return open===false ? `<details class="passage"><summary>Show the data / directions</summary>${PAS[q.p]}</details>` : `<div class="passage">${PAS[q.p]}</div>`;
}
function optHTML(q,o){
  if(o[0]==="@" && q.f){
    const t=q.f.text, code=o[1];
    if(code==="P") return `<span class="optfig">${esc(t.split("").reverse().join(""))}</span>`;
    return `<span class="optfig ${code}">${esc(t)}</span>`;
  }
  return o;
}
function secOf(i){return secIdx[QS[i].s];}
function renderExam(){
  const i=S.cur, q=QS[i], si=secOf(i), [a,b]=secRange[si], c=counts();

    </aside>
  </div>${footer()}</div>`;
  app.querySelectorAll('input[name="opt"]').forEach(r=>{

  });

  app.querySelectorAll(".grid .st").forEach(t=>t.onclick=()=>{go(+t.dataset.q);});
  $("#save").onclick=()=>{ if(S.pending!==null){S.saved[i]=S.pending;S.status[i]="an";} else {S.saved[i]=null;S.status[i]="na";} next(); };
  $("#mark").onclick=()=>{ if(S.pending!==null){S.saved[i]=S.pending;S.status[i]="am";} else {S.saved[i]=null;S.status[i]="mk";} next(); };
  $("#clear").onclick=()=>{ S.pending=null; S.saved[i]=null; S.status[i]="na"; persist(); renderExam(); };
  $("#sub").onclick=()=>confirmSubmit();

  $("#fsp").onclick=()=>{S.fs=Math.min(1.4,+((S.fs||1)+0.1).toFixed(2));applyFs();persist();};
  $("#xlogout").onclick=()=>examLogout();
  $("#pclose").onclick=()=>$("#pal").classList.remove("open");

function applyFs(){ document.documentElement.style.setProperty("--fs", S.fs||1); }
function examLogout(){
  const d=modal("Logout", `<p>Do you want to leave the test?</p><ul style="line-height:1.7;padding-left:20px"><li><b>Submit &amp; Logout</b> — your test is submitted and you will see your score card and solutions.</li><li><b>Exit without saving</b> — this attempt is cleared from this device and the login screen opens.</li></ul>`,
    `<button class="btn" data-close>Cancel</button><button class="btn btn-out" id="lx">Exit without saving</button><button class="btn btn-primary" id="ls">Submit &amp; Logout</button>`);
  $("#ls",d).onclick=()=>{d.remove(); finish(false);};
  $("#lx",d).onclick=()=>{d.remove(); clearInterval(tick); tick=null; S=fresh(); try{localStorage.removeItem(KEY);}catch(e){} render();};
}
function go(k){ visit(k); persist(); renderExam(); const qb=$(".qbody"); if(qb) qb.scrollTop=0; }
function next(){ go(S.cur < QS.length-1 ? S.cur+1 : 0); }
function updateTimer(){
  const left=Math.max(0, S.endAt-Date.now()), m=Math.floor(left/60000), s=Math.floor(left/1000)%60;
  const t=$("#timer"); if(t){ t.innerHTML=`Time Left: <b>${pad2(m)}:${pad2(s)}</b>`; t.classList.toggle("low", left<5*60000); }
  if(S.stage==="exam"){
    if(left<=10*60000 && left>5*60000 && !S.w10){ S.w10=true; persist(); toast("Only 10 minutes left. Review your marked questions."); }
    if(left<=5*60000 && left>0 && !S.w5){ S.w5=true; persist(); toast("Only 5 minutes left! The test will be submitted automatically at 00:00."); }
  }
  if(left<=0 && S.stage==="exam"){ finish(true); }
}

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),6000); }
/* ---------- MODALS ---------- */
function modal(title, body, foot){
  const d=document.createElement("div"); d.className="scrim";
  d.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><span>${title}</span><button data-close aria-label="Close">×</button></div><div class="modal-b">${body}</div>${foot?`<div class="modal-f">${foot}</div>`:""}</div>`;
  document.body.appendChild(d);
  d.addEventListener("click",e=>{ if(e.target===d || e.target.hasAttribute("data-close")) d.remove(); });
  return d;
}
function summaryTable(){
  let rows="", T={an:0,na:0,nv:0,mk:0,am:0,n:0};
  SECS.forEach((s,k)=>{const [a,b]=secRange[k], c=counts(a,b), n=b-a+1; for(const x in c) T[x]+=c[x]; T.n+=n;
    rows+=`<tr><td>${s[1]}</td><td>${n}</td><td>${c.an}</td><td>${c.na}</td><td>${c.mk}</td><td>${c.am}</td><td>${c.nv}</td></tr>`;});
  rows+=`<tr class="tot"><td>Total</td><td>${T.n}</td><td>${T.an}</td><td>${T.na}</td><td>${T.mk}</td><td>${T.am}</td><td>${T.nv}</td></tr>`;

function finish(auto){
  if(S.stage!=="exam") return;

/* ---------- RESULT ---------- */
function evalAll(){
  const per=SECS.map(()=>({n:0,c:0,w:0,u:0}));
  let c=0,w=0,u=0;
  QS.forEach((q,k)=>{const p=per[secOf(k)]; p.n++; const a=S.saved[k];
    if(a===null||a===undefined){u++;p.u++;} else if(a===q.a){c++;p.c++;} else {w++;p.w++;}});
  return {c,w,u,per,score:c*EXAM.plus-w*EXAM.minus};
}
function fmtDur(ms){const t=Math.round(ms/1000);return `${Math.floor(t/60)} min ${pad2(t%60)} s`;}

  const R=evalAll(), att=R.c+R.w, acc=att?Math.round(R.c/att*100):0, pct=Math.max(0,R.score)/QS.length;

    pct>=0.6?"Good attempt. Focus on the sections with the lowest score below, then take the next mock.":

  const sec=SECS.map((s,k)=>{const p=R.per[k];return `<tr><td>${s[1]}</td><td>${p.n}</td><td>${p.c+p.w}</td><td style="color:var(--ok);font-weight:700">${p.c}</td><td style="color:var(--bad);font-weight:700">${p.w}</td><td>${p.u}</td><td><b>${fmt(p.c*EXAM.plus-p.w*EXAM.minus)}</b></td></tr>`}).join("");
  app.innerHTML = `<div class="screen">${topbar(`Candidate: <b>${esc(S.name)}</b> &nbsp;|&nbsp; Roll No: ${esc(S.roll)}`)}
  <main class="result pad">
    <section class="rcard">

      <div class="score-row">

          <div class="c"><div><b>${fmt(R.score)}</b><span>out of ${QS.length}</span></div></div></div>
        <div class="stats">
          <div class="stat ok"><div class="k">Correct</div><div class="v">${R.c}</div></div>
          <div class="stat bad"><div class="k">Wrong</div><div class="v">${R.w}</div></div>
          <div class="stat"><div class="k">Not attempted</div><div class="v">${R.u}</div></div>
          <div class="stat bad"><div class="k">Negative marks</div><div class="v">−${fmt(R.w*EXAM.minus)}</div></div>
          <div class="stat"><div class="k">Accuracy</div><div class="v">${acc}%</div></div>
          <div class="stat"><div class="k">Time taken</div><div class="v" style="font-size:16px">${fmtDur(S.submittedAt-S.startedAt)}</div></div>

        </div>

    $("#lo",d).onclick=()=>{S=fresh(); try{localStorage.removeItem(KEY);}catch(e){} d.remove(); render();};
  };

    const d=modal("Retake Test", `<p>Your current answers and score will be cleared and a fresh ${EXAM.minutes}-minute test will start from the login screen.</p>`, `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="rt">Clear and retake</button>`);

function topicsHTML(){
  const m={};
  QS.forEach((q,k)=>{ const a=S.saved[k]; const miss = a===null||a===undefined||a!==q.a; const t=q.t.replace(/\s*\(.*\)$/,"").replace(/\s*–.*$/,""); if(!m[t]) m[t]={miss:0,n:0}; m[t].n++; if(miss) m[t].miss++; });
  const list=Object.entries(m).filter(([t,v])=>v.miss>0).sort((x,y)=>y[1].miss-x[1].miss||x[0].localeCompare(y[0])).slice(0,12);
  if(!list.length) return `<div class="topics"><h3>Topics to revise</h3><p class="note">No weak topics — every question was answered correctly!</p></div>`;
  return `<div class="topics"><h3>Topics to revise (wrong or not attempted)</h3><div class="tchips">${list.map(([t,v])=>`<span class="tchip">${esc(t)} · <b>${v.miss}/${v.n}</b></span>`).join("")}</div></div>`;
}
function renderSolutions(){
  const F=[["all","All"],["wrong","Wrong"],["skip","Not attempted"],["right","Correct"]];
  const secs=[["all","All sections"]].concat(SECS.map(s=>[s[0],s[1]]));
  $("#filters").innerHTML = F.map(f=>`<button class="chip ${S.filter===f[0]?"on":""}" data-f="${f[0]}">${f[1]}</button>`).join("") +
    `<span style="width:10px"></span>` + secs.map(s=>`<button class="chip ${S.fsec===s[0]?"on":""}" data-s="${s[0]}">${s[1]}</button>`).join("");
  $("#filters").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;persist();renderSolutions();});
  $("#filters").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.fsec=b.dataset.s;persist();renderSolutions();});
  let html="";
  QS.forEach((q,k)=>{
    const a=S.saved[k], st = a===null||a===undefined ? "skip" : (a===q.a?"right":"wrong");
    if(S.filter!=="all" && S.filter!==st) return;
    if(S.fsec!=="all" && S.fsec!==q.s) return;
    const pill = st==="right"?`<span class="pill ok">Correct +${EXAM.plus}</span>`:st==="wrong"?`<span class="pill bad">Wrong</span>`:`<span class="pill skip">Not attempted</span>`;
    const opts=q.o.map((o,j)=>{const cls=j===q.a?"right":(j===a?"wrong":""); const tag=j===q.a?"Correct answer":(j===a?"Your answer":""); return `<div class="sopt ${cls}"><span class="L">${j+1}.</span><span>${optHTML(q,o)}</span>${tag?`<span class="tag">${tag}${j===q.a&&j===a?" · Your answer":""}</span>`:""}</div>`;}).join("");
    html+=`<article class="sol"><div class="sol-top"><span><b style="color:var(--ink)">Q${k+1}</b> · ${SECS[secOf(k)][1]} · ${q.t}</span>${pill}</div>
      ${pasHTML(q,false)}<div class="qtext">${q.q}</div>${figHTML(q)}<div class="sopts">${opts}</div><div class="exp"><h4>Explanation</h4>${q.e}</div></article>`;
  });
  $("#sollist").innerHTML = html || `<p class="empty">No questions match this filter.</p>`;
}

/* ---------- ROUTER ---------- */
const app=$("#app");
document.addEventListener("click",e=>{ const im=e.target.closest&&e.target.closest(".figimg"); if(!im) return; modal("Figure (scroll / pinch to zoom)", `<div class="zoomwrap"><img alt="Enlarged figure" src="${im.getAttribute("src")}"></div>`, `<button class="btn btn-primary" data-close>Close</button>`); });
function render(){
  window.scrollTo(0,0); applyFs();
  if(S.stage==="exam" && S.endAt && Date.now()>=S.endAt){ finish(true); return; }
  if(S.stage==="login") renderLogin();
  else if(S.stage==="instr") renderInstr();
  else if(S.stage==="exam"){ if(S.pending===undefined) S.pending=S.saved[S.cur]; renderExam(); if(!tick) tick=setInterval(updateTimer,1000); }
  else renderResult();
}
render();
</script>
</body>
</html>
