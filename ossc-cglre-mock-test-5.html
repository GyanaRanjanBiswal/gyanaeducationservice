<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gyana Education Service – OSSC CGLRE (Specialist) 2025 Preliminary Examination – Free Online CBT Mock Test-5 (TCS pattern)">
<title>OSSC CGLRE (Specialist) Prelim – Mock Test-5 | Gyana Education Service</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: TCS iON-style exam console — header strip, question pane left, palette right; light-only by design (mirrors the real exam screen) */
:root{
  --ink:#1b2430; --muted:#5d6b7c; --line:#cfd8e3; --paper:#ffffff; --wash:#eef3f8;
  --brand:#0b4f8a; --brand-2:#1167b1; --brand-ink:#ffffff; --head:#e9eef4;
  --ans:#2e9e3f; --nans:#e2502b; --nv:#e3e6ea; --nv-b:#b9c1cb; --mark:#6a3fb5; --gold:#f4b400;
  --ok:#1f8a3b; --ok-wash:#e5f5e8; --bad:#c8352a; --bad-wash:#fdeceb; --info-wash:#fff8e1;
  --f:Arial, "Helvetica Neue", Helvetica, "Noto Sans", sans-serif;
  color-scheme: light;
}
html,body{height:100%}
#app{height:100%}
body{background:var(--wash);color:var(--ink);font-family:var(--f);font-size:14px;}
*{box-sizing:border-box}
button{font-family:var(--f);cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.screen{min-height:100%;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top brand strip */
.topbar{background:var(--brand);color:var(--brand-ink);padding-block:8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px;border:2px solid var(--gold);flex:none}
.tb-text{min-width:0;flex:1 1 220px}
.tb-org{font-weight:700;letter-spacing:1.2px;font-size:15px}
.tb-exam{font-size:12.5px;opacity:.92}
.tb-right{font-size:12px;text-align:right;opacity:.92}

/* login */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding-block:28px}
.login{display:grid;grid-template-columns:1fr 1fr;max-width:860px;width:100%;background:var(--paper);border:1px solid var(--line);box-shadow:0 2px 10px rgba(11,79,138,.08)}
.login-info{background:var(--head);padding:24px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line)}
.login-info .row{display:flex;gap:8px;font-size:13.5px}
.login-info .k{color:var(--muted);min-width:118px}
.login-info .v{font-weight:700}
.login-form{padding:24px;display:flex;flex-direction:column;gap:12px}
.login-form h2{margin:0 0 4px;font-size:18px;color:var(--brand)}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:9px 10px;border:1px solid var(--nv-b);border-radius:3px;font-size:14px;font-family:var(--f)}
.btn{border:1px solid var(--nv-b);background:var(--paper);color:var(--ink);padding:9px 16px;border-radius:3px;font-size:13.5px}
.btn:hover{background:var(--head)}
.btn-primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff;font-weight:700}
.btn-primary:hover{background:var(--brand)}
.btn-primary:disabled{background:#9db8d3;border-color:#9db8d3;cursor:not-allowed}
.btn-green{background:var(--ans);border-color:var(--ans);color:#fff;font-weight:700}
.btn-green:hover{filter:brightness(.92)}
.note{font-size:12px;color:var(--muted);line-height:1.5}

/* instructions */
.instr{flex:1;padding-block:18px;display:flex;justify-content:center}
.instr-card{background:var(--paper);border:1px solid var(--line);max-width:980px;width:100%;display:flex;flex-direction:column}
.instr-head{background:var(--head);padding:12px 18px;font-weight:700;color:var(--brand);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.instr-body{padding:16px 22px;line-height:1.6;font-size:13.5px;overflow:auto}
.instr-body h3{font-size:14px;margin:14px 0 6px;color:var(--brand)}
.instr-body ol{padding-left:22px;margin:6px 0}
.instr-body li{margin-bottom:5px}
.legend-list{display:grid;gap:8px;margin:8px 0 8px 4px}
.legend-list div{display:flex;align-items:center;gap:10px}
.pattern{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.pattern th,.pattern td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.pattern th{background:var(--head)}
.pattern td.n{text-align:center;font-variant-numeric:tabular-nums}
.instr-foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;flex-direction:column;gap:12px}
.declare{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5}
.declare input{margin-top:3px;width:16px;height:16px;flex:none}
.instr-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* exam */
.exam{height:100%;display:flex;flex-direction:column}
.exam-main{flex:1;display:flex;min-height:0}
.qpane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper);border-right:1px solid var(--line)}
.secbar{display:flex;align-items:center;gap:8px;background:var(--head);border-bottom:1px solid var(--line);padding-block:6px;flex-wrap:wrap}
.secbar .lbl{font-weight:700;font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.tab{border:1px solid var(--nv-b);background:var(--paper);padding:6px 10px;font-size:12.5px;border-radius:3px 3px 0 0;color:var(--brand)}
.tab.on{background:var(--brand-2);color:#fff;border-color:var(--brand-2);font-weight:700}
.timer{font-weight:700;font-size:13px;background:var(--paper);border:1px solid var(--nv-b);padding:6px 10px;border-radius:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer b{color:var(--brand)}
.timer.low b{color:var(--bad)}
.qtype{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;padding-block:7px;border-bottom:1px solid var(--line);color:var(--muted)}
.qtype .mk span{color:var(--ok);font-weight:700}
.qtype .mk em{color:var(--bad);font-style:normal;font-weight:700}
.qhead{display:flex;justify-content:space-between;align-items:center;padding-block:9px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.qhead h2{margin:0;font-size:15px}
.qhead .lang{font-size:12px;color:var(--muted)}
.qhead select{font-size:12px;padding:2px 4px}
.qbody{flex:1;overflow:auto;padding-block:14px 20px;min-height:0}
.qtext{font-size:calc(15.5px*var(--fs,1));line-height:1.65;max-width:78ch}
.qtext b{font-weight:700}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px;max-width:78ch}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border:1px solid transparent;border-radius:3px;cursor:pointer;font-size:calc(15px*var(--fs,1));line-height:1.5}
.opt:hover{background:#f3f7fb;border-color:var(--line)}
.opt input{margin-top:4px;width:16px;height:16px;flex:none;accent-color:var(--brand-2)}
.opt.sel{background:#eaf2fb;border-color:#a9c6e6}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--head);padding-block:9px;padding-bottom:max(9px,env(safe-area-inset-bottom,0px))}
.actions .l{display:flex;gap:8px;flex-wrap:wrap}

/* palette */
.palette{width:300px;flex:none;display:flex;flex-direction:column;background:#f7f9fc;min-height:0}
.cand{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.cand svg{width:50px;height:58px;flex:none;border:1px solid var(--line);background:var(--head)}
.cand .nm{font-weight:700;font-size:13.5px;word-break:break-word}
.cand .roll{font-size:12px;color:var(--muted)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:11.5px;line-height:1.25}
.legend .it{display:flex;align-items:center;gap:6px}
.legend .it.wide{grid-column:1/-1}
.pal-sec{background:var(--brand-2);color:#fff;font-weight:700;font-size:12.5px;padding:6px 12px}
.pal-choose{font-size:12px;color:var(--muted);padding:8px 12px 2px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:9px 6px;padding:8px 12px 12px;align-content:start;min-height:0}
.pal-foot{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:var(--head);padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.pal-foot .btn-green{grid-column:1/-1}

/* status shapes */
.st{width:38px;height:33px;display:inline-grid;place-items:center;font-size:12.5px;font-weight:700;position:relative;border:1px solid transparent;font-variant-numeric:tabular-nums;flex:none;padding:0}
.st.sm{width:28px;height:25px;font-size:11px}
.st.nv{background:var(--nv);border-color:var(--nv-b);color:var(--ink);border-radius:3px}
.st.na{background:var(--nans);color:#fff;border-radius:2px 2px 14px 14px / 2px 2px 9px 9px}
.st.an{background:var(--ans);color:#fff;border-radius:14px 14px 2px 2px / 9px 9px 2px 2px}
.st.mk{background:var(--mark);color:#fff;border-radius:50%}
.st.am{background:var(--mark);color:#fff;border-radius:50%}
.st.am::after{content:"";position:absolute;right:-3px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--ans);border:2px solid #fff;box-sizing:border-box}
.st.sm.am::after{width:10px;height:10px;right:-3px;bottom:-2px}
.grid .st{justify-self:center;cursor:pointer}
.grid .st.cur{outline:2px solid var(--gold);outline-offset:2px}

/* figures */
.fig{margin:14px 0 4px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.word{font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:30px;letter-spacing:2px;color:#13294b;padding:6px 14px;border:1px dashed var(--nv-b);background:#fff}
.mirror-line{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:2px}
.mirror-line i{display:block;width:4px;height:58px;background:linear-gradient(#6aa3db,#2b6cb0)}
.water-wrap{display:flex;flex-direction:column;gap:3px}
.water-line{height:5px;background:repeating-linear-gradient(90deg,#4a90d9 0 10px,#9cc5ef 10px 20px);border-radius:3px}
.optfig{display:inline-block;font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:22px;letter-spacing:2px;color:#13294b}
.optfig.M{transform:scaleX(-1)} .optfig.W{transform:scaleY(-1)} .optfig.R{transform:rotate(180deg)}
.dice{display:flex;gap:26px;flex-wrap:wrap}
.dice figure{margin:0;text-align:center;font-size:12px;color:var(--muted)}
.dice svg{width:120px;height:120px;display:block}

.figimg{display:block;max-width:100%;height:auto;border:1px solid var(--line);background:#fff;margin:8px 0;cursor:zoom-in}
.zoomwrap{overflow:auto;max-height:75vh}.zoomwrap img{display:block;width:760px;max-width:none;height:auto}
.zhint{font-size:11.5px;color:var(--muted);margin:2px 0 0}
.passage{background:#f6f9fd;border:1px solid #c9d8ea;border-left:4px solid var(--brand-2);padding:10px 12px;margin:0 0 14px;font-size:calc(14px*var(--fs,1));line-height:1.6;max-width:78ch}
.passage summary{cursor:pointer;font-weight:700;color:var(--brand)}
.ptitle{font-weight:700;color:var(--brand);margin-bottom:4px}
.ptbl{overflow-x:auto;margin-top:8px}
.ptbl table{border-collapse:collapse;font-size:13.5px;background:#fff;min-width:320px}
.ptbl th,.ptbl td{border:1px solid #b9c7d8;padding:5px 9px;text-align:center}
.ptbl th{background:#e3ecf6}
.ptbl td:first-child{text-align:left;font-weight:700}
.fsz{display:inline-flex;gap:4px;align-items:center;margin-left:8px}
.fsz button{padding:2px 8px;font-size:12px}
.btn-out{border-color:#c8352a;color:#c8352a;font-weight:700}
.btn-out:hover{background:#fdeceb}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,30,50,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--paper);max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal-h{background:var(--brand);color:#fff;padding:10px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-h button{background:transparent;border:0;color:#fff;font-size:20px;line-height:1}
.modal-b{padding:14px 16px;overflow:auto}
.modal-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
.sumtbl{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.sumtbl th,.sumtbl td{border:1px solid var(--line);padding:7px 8px;text-align:center;font-variant-numeric:tabular-nums}
.sumtbl th{background:var(--head);font-size:12px}
.sumtbl td:first-child,.sumtbl th:first-child{text-align:left}
.sumtbl tr.tot td{font-weight:700;background:#f7f9fc}
.qp-item{border-bottom:1px solid var(--line);padding:10px 0;font-size:13.5px;line-height:1.55}
.qp-item .n{font-weight:700;color:var(--brand)}

/* result */
.result{flex:1;padding-block:18px 30px;display:flex;flex-direction:column;align-items:center;gap:16px}
.rcard{background:var(--paper);border:1px solid var(--line);max-width:1000px;width:100%}
.rhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.rhead h2{margin:0;font-size:18px;color:var(--brand)}
.score-row{display:grid;grid-template-columns:auto 1fr;gap:22px;padding:18px;align-items:center}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:30px;display:block;font-variant-numeric:tabular-nums}
.ring .c span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;width:100%}
.stat{border:1px solid var(--line);padding:10px 12px}
.stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.stat.ok .v{color:var(--ok)} .stat.bad .v{color:var(--bad)}
.verdict{margin:0 18px 16px;padding:10px 14px;background:var(--info-wash);border:1px solid #f1d68a;font-size:13.5px;line-height:1.5}
.secbars{padding:4px 18px 18px;display:grid;gap:10px}
.sb{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.sb .bar{height:14px;background:var(--nv);position:relative;overflow:hidden;border-radius:2px}
.sb .bar i{position:absolute;inset:0 auto 0 0;background:var(--brand-2)}
.sb .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center}
.chip{border:1px solid var(--nv-b);background:var(--paper);padding:5px 10px;border-radius:14px;font-size:12.5px}
.chip.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.sol{padding:14px 18px;border-bottom:1px solid var(--line)}
.sol-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.pill{padding:2px 8px;border-radius:10px;font-weight:700;font-size:11.5px}
.pill.ok{background:var(--ok-wash);color:var(--ok)} .pill.bad{background:var(--bad-wash);color:var(--bad)} .pill.skip{background:var(--nv);color:var(--muted)}
.sol .qtext{font-size:14.5px}
.sopts{display:grid;gap:6px;margin:10px 0}
.sopt{padding:7px 10px;border:1px solid var(--line);border-radius:3px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.sopt .L{font-weight:700;color:var(--muted);flex:none}
.sopt.right{background:var(--ok-wash);border-color:#9fd3ac}
.sopt.wrong{background:var(--bad-wash);border-color:#efb1ab}
.sopt .tag{margin-left:auto;font-size:11.5px;font-weight:700;white-space:nowrap}
.sopt.right .tag{color:var(--ok)} .sopt.wrong .tag{color:var(--bad)}
.exp{background:#f4f8fc;border-left:3px solid var(--brand-2);padding:9px 12px;font-size:13.5px;line-height:1.6}
.exp h4{margin:0 0 4px;font-size:12px;letter-spacing:.6px;color:var(--brand);text-transform:uppercase}
.empty{padding:22px 18px;color:var(--muted)}

.palette-toggle{display:none}
.site-foot{flex:none;min-height:64px;display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;background:#0a3f6e;color:#dbe8f6;font-size:12px;padding-block:8px;padding-right:max(210px,env(safe-area-inset-right,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.site-foot b{color:#fff}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff8e1;border:1px solid #f1d68a;color:#5b4300;padding:10px 16px;font-weight:700;font-size:13.5px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.15);max-width:calc(100% - 32px);text-align:center}
.cta{margin:0 18px 16px;padding:12px 14px;border:1px solid #9fc0e3;background:#eef5fc;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:13.5px;line-height:1.5}
.cta a,.ractions a{text-decoration:none}
.btn-wa{background:#1f9d55;border-color:#1f9d55;color:#fff;font-weight:700;display:inline-block}
.btn-wa:hover{filter:brightness(.92)}
.topics{padding:0 18px 18px}
.topics h3{font-size:14px;margin:0 0 8px;color:var(--brand)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid #efb1ab;background:var(--bad-wash);color:#7a1f17;padding:4px 10px;border-radius:12px;font-size:12.5px}
.tchip b{font-variant-numeric:tabular-nums}
.ractions{display:flex;gap:8px;flex-wrap:wrap}
.result{padding-bottom:84px}
@media print{.topbar .tb-right,.site-foot,.ractions,#filters,.cta,#logout,#retake,.toast{display:none!important}body{background:#fff}.rcard{border:0}.sol{break-inside:avoid}}
@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login-info{border-right:0;border-bottom:1px solid var(--line)}
  .palette{position:fixed;top:0;right:0;bottom:0;width:min(320px,88vw);z-index:40;box-shadow:-6px 0 18px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px)}
  .palette.open{transform:none}
  .palette{bottom:64px}
  .site-foot{padding-right:max(170px,env(safe-area-inset-right,0px));font-size:11px}
  .site-foot span:nth-child(2){display:none}
  .palette-toggle{display:inline-block}
  .tb-right{flex:1 1 100%;text-align:left}
  .exam .tb-right{display:none}
  .secbar .lbl{display:none}
  .tabs{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .tab{white-space:nowrap;flex:none}
  .timer{margin-right:auto}
  .score-row{grid-template-columns:1fr;justify-items:center}
  .sb{grid-template-columns:110px 1fr 56px}
  .qtext{font-size:calc(15px*var(--fs,1))}
  .secbar{gap:6px}
  .timer{font-size:12.5px;padding:5px 8px}
}
@media (prefers-reduced-motion:reduce){.palette{transition:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const DATA = {"sections": [["A", "Arithmetic"], ["B", "Data Interpretation"], ["C", "Reasoning & GMA"], ["D", "Current Events"], ["E", "Computer Awareness"]], "qs": [{"s": "A", "t": "Number System", "q": "How many factors (divisors) does the number 1,080 have?", "o": ["36", "32", "28", "24"], "a": 1, "e": "1,080 = 2³ × 3³ × 5 ⇒ number of factors = (3 + 1)(3 + 1)(1 + 1) = <b>32</b>.", "f": null, "p": null}, {"s": "A", "t": "Number System", "q": "How many numbers between 100 and 400 are divisible by both 6 and 9?", "o": ["33", "17", "16", "18"], "a": 1, "e": "Divisible by both 6 and 9 ⇒ divisible by LCM 18. Multiples of 18 from 108 (18 × 6) to 396 (18 × 22) ⇒ 22 − 6 + 1 = <b>17</b>.", "f": null, "p": null}, {"s": "A", "t": "Number System", "q": "The sum of the squares of three consecutive natural numbers is 434. What is the middle number?", "o": ["12", "13", "11", "14"], "a": 0, "e": "(n − 1)² + n² + (n + 1)² = 3n² + 2 = 434 ⇒ n² = 144 ⇒ n = <b>12</b> (11² + 12² + 13² = 121 + 144 + 169 = 434).", "f": null, "p": null}, {"s": "A", "t": "Surds", "q": "If √(1 + x/144) = 13/12, what is the value of x?", "o": ["24", "169", "36", "25"], "a": 3, "e": "Squaring: 1 + x/144 = 169/144 ⇒ x/144 = 25/144 ⇒ x = <b>25</b>.", "f": null, "p": null}, {"s": "A", "t": "Indices", "q": "If 3<sup>x+1</sup> = 243, what is the value of x²?", "o": ["9", "4", "25", "16"], "a": 3, "e": "243 = 3⁵ ⇒ x + 1 = 5 ⇒ x = 4 ⇒ x² = <b>16</b>.", "f": null, "p": null}, {"s": "A", "t": "LCM & HCF", "q": "What is the HCF of 2/3, 8/9, 16/81 and 10/27?", "o": ["80/3", "2/81", "2/3", "1/81"], "a": 1, "e": "HCF of fractions = HCF of numerators ÷ LCM of denominators = HCF(2, 8, 16, 10) ÷ LCM(3, 9, 81, 27) = <b>2/81</b>.", "f": null, "p": null}, {"s": "A", "t": "LCM & HCF", "q": "Three numbers are in the ratio 3 : 4 : 5 and their LCM is 2,400. What is their HCF?", "o": ["80", "40", "60", "20"], "a": 1, "e": "Numbers = 3x, 4x, 5x ⇒ LCM = 60x = 2,400 ⇒ x = 40. As 3, 4, 5 are co-prime, HCF = x = <b>40</b>.", "f": null, "p": null}, {"s": "A", "t": "Surds", "q": "Find the value of 1/(√9 − √8) − 1/(√8 − √7) + 1/(√7 − √6) − 1/(√6 − √5) + 1/(√5 − √4).", "o": ["2√2", "1", "0", "5"], "a": 3, "e": "1/(√(n+1) − √n) = √(n+1) + √n.<br>Sum = (3 + √8) − (√8 + √7) + (√7 + √6) − (√6 + √5) + (√5 + 2) = 3 + 2 = <b>5</b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage", "q": "A's income is 20% more than B's, and B's income is 25% less than C's. If C earns ₹40,000, how much does A earn?", "o": ["₹38,000", "₹36,000", "₹32,000", "₹35,000"], "a": 1, "e": "B = 40,000 × 0.75 = ₹30,000 ⇒ A = 30,000 × 1.2 = <b>₹36,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage", "q": "An 80-litre mixture contains 30% alcohol. How much pure alcohol must be added to make it 44% alcohol?", "o": ["16 litres", "24 litres", "18 litres", "20 litres"], "a": 3, "e": "Alcohol = 24 L. (24 + x)/(80 + x) = 0.44 ⇒ 24 + x = 35.2 + 0.44x ⇒ 0.56x = 11.2 ⇒ x = <b>20 litres</b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage", "q": "The population of a village is 8,000. If the number of men increases by 6% and the number of women by 10%, the population becomes 8,600. How many men were there initially?", "o": ["4,500", "3,000", "5,000", "5,500"], "a": 2, "e": "0.06m + 0.10(8,000 − m) = 600 ⇒ 800 − 0.04m = 600 ⇒ m = <b>5,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage", "q": "Ravi saves 15% of his income. If his income rises by 20% and his expenditure by 10%, by what per cent do his savings increase?", "o": ["70%", "80%", "76⅔%", "66⅔%"], "a": 2, "e": "Income 100, expenditure 85, savings 15.<br>New income 120, new expenditure 93.5 ⇒ savings 26.5.<br>Increase = 11.5/15 × 100 = <b>76⅔%</b>.", "f": null, "p": null}, {"s": "A", "t": "Profit & Loss", "q": "A shopkeeper marks his goods 25% above the cost price and allows a discount of 12%. If he sells an article for ₹1,650, what is his profit on it?", "o": ["₹165", "₹200", "₹150", "₹125"], "a": 2, "e": "SP = CP × 1.25 × 0.88 = 1.1 CP ⇒ CP = 1,650 ÷ 1.1 = ₹1,500 ⇒ profit = <b>₹150</b>.", "f": null, "p": null}, {"s": "A", "t": "Profit & Loss", "q": "By selling a table for ₹2,040, a trader gains 2%. At what price should he sell it to gain 12%?", "o": ["₹2,240", "₹2,200", "₹2,250", "₹2,280"], "a": 0, "e": "CP = 2,040 ÷ 1.02 = ₹2,000 ⇒ SP for 12% gain = 2,000 × 1.12 = <b>₹2,240</b>.", "f": null, "p": null}, {"s": "A", "t": "Discount", "q": "An article listed at ₹2,000 is sold for ₹1,530 after two successive discounts. If the first discount is 10%, what is the second discount?", "o": ["18%", "12%", "15%", "13.5%"], "a": 2, "e": "After the first discount: 2,000 × 0.9 = ₹1,800. Second discount = (1,800 − 1,530)/1,800 × 100 = <b>15%</b>.", "f": null, "p": null}, {"s": "A", "t": "Simple Interest", "q": "A sum of money becomes 7/5 of itself in 5 years at simple interest. What is the rate of interest per annum?", "o": ["10%", "9%", "8%", "7%"], "a": 2, "e": "Interest = 2/5 of the principal = 40% in 5 years ⇒ rate = <b>8%</b> per annum.", "f": null, "p": null}, {"s": "A", "t": "Compound Interest", "q": "What is the compound interest on ₹15,625 for 9 months at 16% per annum, compounded quarterly?", "o": ["₹1,906", "₹2,028", "₹1,951", "₹1,875"], "a": 2, "e": "Rate = 4% per quarter, time = 3 quarters.<br>Amount = 15,625 × (1.04)³ = 15,625 × 1.124864 = ₹17,576 ⇒ CI = <b>₹1,951</b>.", "f": null, "p": null}, {"s": "A", "t": "Partnership", "q": "A, B and C invest ₹8,000, ₹6,000 and ₹4,000. A, being the working partner, receives 10% of the profit for managing the business, and the rest is shared in the ratio of capitals. Out of a profit of ₹9,000, how much does A receive in all?", "o": ["₹4,500", "₹4,000", "₹3,600", "₹4,400"], "a": 0, "e": "A's management share = ₹900; remaining ₹8,100 in 4 : 3 : 2 ⇒ A = 4/9 × 8,100 = ₹3,600.<br>Total = 900 + 3,600 = <b>₹4,500</b>.", "f": null, "p": null}, {"s": "A", "t": "Average", "q": "The average of 6 numbers is 30. The average of the first four is 25 and that of the last three is 35. What is the fourth number?", "o": ["30", "25", "20", "35"], "a": 1, "e": "Total = 180; first four = 100; last three = 105.<br>The 4th number is counted twice ⇒ 100 + 105 − 180 = <b>25</b>.", "f": null, "p": null}, {"s": "A", "t": "Problems on Ages", "q": "The product of the ages of A and B is 240. If twice A's age is 4 years more than B's age, what is B's age?", "o": ["20 years", "16 years", "24 years", "12 years"], "a": 0, "e": "B = 2A − 4 ⇒ A(2A − 4) = 240 ⇒ A² − 2A − 120 = 0 ⇒ A = 12 ⇒ B = <b>20 years</b>.", "f": null, "p": null}, {"s": "A", "t": "Time & Work", "q": "A and B together can do a work in 12 days. After working together for 4 days, B leaves and A finishes the remaining work in 12 days. In how many days can B alone do the work?", "o": ["36 days", "30 days", "18 days", "24 days"], "a": 0, "e": "In 4 days they do 4/12 = 1/3 ⇒ A does 2/3 in 12 days ⇒ A alone = 18 days.<br>B = 1/12 − 1/18 = 1/36 ⇒ <b>36 days</b>.", "f": null, "p": null}, {"s": "A", "t": "Pipes & Cisterns", "q": "Two taps can fill a cistern in 20 minutes and 30 minutes. Both are opened together, but the first tap is closed 5 minutes before the cistern is full. In how much time is the cistern filled?", "o": ["14 minutes", "12 minutes", "16 minutes", "15 minutes"], "a": 3, "e": "Let the time be T: (T − 5)/20 + T/30 = 1 ⇒ 3(T − 5) + 2T = 60 ⇒ T = <b>15 minutes</b>.", "f": null, "p": null}, {"s": "A", "t": "Boats & Streams", "q": "A boat covers 24 km upstream and 36 km downstream in 6 hours, and 36 km upstream and 24 km downstream in 6.5 hours. What is the speed of the stream?", "o": ["3 km/h", "2 km/h", "4 km/h", "2.5 km/h"], "a": 1, "e": "Let 1/u = a, 1/d = b: 24a + 36b = 6, 36a + 24b = 6.5 ⇒ a + b = 5/24, a − b = 1/24 ⇒ a = 1/8, b = 1/12.<br>u = 8, d = 12 ⇒ stream = (12 − 8)/2 = <b>2 km/h</b>.", "f": null, "p": null}, {"s": "A", "t": "Speed & Distance", "q": "Ravi leaves a place at 9 a.m. at 30 km/h. Mohan leaves the same place at 11 a.m. in the same direction at 50 km/h. At what time will Mohan overtake Ravi?", "o": ["2:30 p.m.", "1:30 p.m.", "1 p.m.", "2 p.m."], "a": 3, "e": "Ravi's lead at 11 a.m. = 60 km; relative speed = 20 km/h ⇒ 3 hours ⇒ <b>2 p.m.</b>", "f": null, "p": null}, {"s": "A", "t": "Speed & Time", "q": "The speeds of A and B are in the ratio 3 : 4. A takes 30 minutes more than B to cover the same distance. How much time does A take?", "o": ["105 minutes", "120 minutes", "90 minutes", "150 minutes"], "a": 1, "e": "Times are in the ratio 4 : 3 ⇒ 1 part = 30 minutes ⇒ A takes 4 × 30 = <b>120 minutes</b> (2 hours).", "f": null, "p": null}, {"s": "A", "t": "Mixture", "q": "A trader mixes 26 kg of rice costing ₹20 per kg with 30 kg costing ₹36 per kg, and sells the mixture at ₹30 per kg. What is his profit per cent?", "o": ["7.5%", "6%", "5%", "4%"], "a": 2, "e": "Cost = 520 + 1,080 = ₹1,600 for 56 kg; SP = 56 × 30 = ₹1,680 ⇒ profit = 80/1,600 = <b>5%</b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "A wire bent into a square of area 121 cm² is rebent into a circle. What is the area of the circle? (π = 22/7)", "o": ["176 cm²", "144 cm²", "154 cm²", "616 cm²"], "a": 2, "e": "Side = 11 cm ⇒ length of wire = 44 cm = 2πr ⇒ r = 7 cm ⇒ area = 22/7 × 49 = <b>154 cm²</b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "The volume of a cylinder is 1,540 cm³ and its radius is 7 cm. What is its curved surface area? (π = 22/7)", "o": ["616 cm²", "220 cm²", "480 cm²", "440 cm²"], "a": 3, "e": "h = 1,540 ÷ (22/7 × 49) = 10 cm ⇒ CSA = 2πrh = 2 × 22/7 × 7 × 10 = <b>440 cm²</b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "A courtyard 18 m long and 12 m broad is to be paved with square stones of side 60 cm. How many stones are needed?", "o": ["600", "720", "480", "540"], "a": 0, "e": "(1,800 × 1,200) ÷ (60 × 60) = 21,60,000 ÷ 3,600 = <b>600</b>.", "f": null, "p": null}, {"s": "A", "t": "Probability", "q": "A bag contains 5 red, 4 blue and 3 green balls. Two balls are drawn at random. What is the probability that both are red?", "o": ["10/33", "5/12", "5/33", "1/6"], "a": 2, "e": "⁵C₂ ÷ ¹²C₂ = 10/66 = <b>5/33</b>.", "f": null, "p": null}, {"s": "A", "t": "Number Puzzle", "q": "If A gives 10 marbles to B, both have equal numbers. If B gives 10 marbles to A, A has twice as many as B. How many marbles do they have in all?", "o": ["120", "100", "140", "110"], "a": 0, "e": "A − 10 = B + 10 ⇒ A = B + 20. A + 10 = 2(B − 10) ⇒ B + 30 = 2B − 20 ⇒ B = 50, A = 70 ⇒ total <b>120</b>.", "f": null, "p": null}, {"s": "A", "t": "Number Puzzle", "q": "At a meeting, each person shakes hands with every other person exactly once. If there are 66 handshakes in all, how many persons are present?", "o": ["13", "11", "33", "12"], "a": 3, "e": "n(n − 1)/2 = 66 ⇒ n(n − 1) = 132 = 12 × 11 ⇒ n = <b>12</b>.", "f": null, "p": null}, {"s": "A", "t": "Fractions", "q": "A man spends 1/3 of his salary on food and 1/4 of the remainder on rent. He saves ₹6,000, which is half of what is left after paying rent. What is his salary?", "o": ["₹24,000", "₹30,000", "₹18,000", "₹36,000"], "a": 0, "e": "After food: 2/3 S; after rent: 3/4 × 2/3 S = S/2.<br>Half of S/2 = 6,000 ⇒ S = <b>₹24,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Chain Rule", "q": "If 15 workers earn ₹27,000 in 6 days, how much will 20 workers earn in 9 days at the same rate?", "o": ["₹40,500", "₹60,000", "₹48,000", "₹54,000"], "a": 3, "e": "Per worker per day = 27,000 ÷ 90 = ₹300 ⇒ 20 × 9 × 300 = <b>₹54,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Approximation", "q": "What approximate value will come in place of ?: (11.98)² + 7.02 × 14.97 − 64.03 ÷ 7.98 = ?", "o": ["257", "249", "233", "241"], "a": 3, "e": "≈ 12² + 7 × 15 − 64 ÷ 8 = 144 + 105 − 8 = <b>241</b>.", "f": null, "p": null}, {"s": "B", "t": "DI – Bar Graph", "q": "In which year was the percentage increase in the production of Company A over the previous year the highest?", "o": ["2024", "2023", "2022", "2021"], "a": 3, "e": "Increase: 2021 = 15/45 = 33.3%; 2022 = fall; 2023 = 15/55 = 27.3%; 2024 = 10/70 = 14.3% ⇒ highest in <b>2021</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Bar Graph", "q": "What is the average annual production of Company B over the five years?", "o": ["62,000", "60,000", "58,000", "56,000"], "a": 2, "e": "(50 + 40 + 65 + 60 + 75) thousand ÷ 5 = 290 ÷ 5 = <b>58 thousand</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Bar Graph", "q": "The production of Company A in 2020 and 2021 together is approximately what per cent of the production of Company B in 2023 and 2024 together?", "o": ["80.5%", "77.8%", "72.4%", "75.0%"], "a": 1, "e": "(45 + 60) ÷ (60 + 75) × 100 = 105/135 × 100 ≈ <b>77.8%</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Bar Graph", "q": "What is the ratio of the total production of Company A to that of Company B over the five years?", "o": ["11 : 10", "29 : 31", "16 : 15", "31 : 29"], "a": 3, "e": "A = 45 + 60 + 55 + 70 + 80 = 310; B = 290 ⇒ <b>31 : 29</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Bar Graph", "q": "In how many of the five years did Company A produce more cars than Company B?", "o": ["3", "4", "1", "2"], "a": 0, "e": "A > B in 2021 (60 > 40), 2023 (70 > 60) and 2024 (80 > 75) ⇒ <b>3</b> years.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Line Graph", "q": "If the expenditure of Company P in 2022 was ₹80 lakh, what was its income in that year?", "o": ["₹105 lakh", "₹96 lakh", "₹100 lakh", "₹120 lakh"], "a": 2, "e": "Profit % = 25 ⇒ income = 80 × 1.25 = <b>₹100 lakh</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Line Graph", "q": "If the incomes of P and Q were equal in 2023, what was the ratio of the expenditure of P to that of Q?", "o": ["15 : 13", "3 : 5", "5 : 3", "13 : 15"], "a": 3, "e": "Expenditure = Income ÷ (1 + profit%). P : Q = 1/1.5 : 1/1.3 = 1.3 : 1.5 = <b>13 : 15</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Line Graph", "q": "If the income of Company Q in 2024 was ₹62 lakh, what was its expenditure?", "o": ["₹40 lakh", "₹38 lakh", "₹34.1 lakh", "₹45 lakh"], "a": 0, "e": "Expenditure = 62 ÷ 1.55 = <b>₹40 lakh</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Line Graph", "q": "What is the average percentage profit of Company Q over the five years?", "o": ["34%", "36%", "35%", "38%"], "a": 1, "e": "(20 + 35 + 40 + 30 + 55) ÷ 5 = 180 ÷ 5 = <b>36%</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Line Graph", "q": "If the expenditures of Company P in 2021 and 2023 were ₹60 lakh and ₹70 lakh, what was its total profit in these two years?", "o": ["₹59 lakh", "₹54 lakh", "₹62 lakh", "₹65 lakh"], "a": 0, "e": "2021: 40% of 60 = ₹24 lakh; 2023: 50% of 70 = ₹35 lakh ⇒ total = <b>₹59 lakh</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Pie Chart", "q": "How much does the family spend on Education every month?", "o": ["₹7,500", "₹10,800", "₹8,400", "₹9,000"], "a": 3, "e": "15% of ₹60,000 = <b>₹9,000</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "What is the central angle of the sector for Rent?", "o": ["54.0°", "72.0°", "64.8°", "58.6°"], "a": 2, "e": "18% of 360° = <b>64.8°</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "By how much do the monthly Savings exceed the combined spending on Transport and Health?", "o": ["₹2,400", "₹1,800", "₹1,200", "₹3,000"], "a": 1, "e": "20% − (9% + 8%) = 3% of ₹60,000 = <b>₹1,800</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "If the family's income increases by 20% but the amount spent on Food remains the same, what per cent of the new income will be spent on Food?", "o": ["30%", "27.5%", "25%", "24%"], "a": 2, "e": "Food = ₹18,000; new income = ₹72,000 ⇒ 18,000/72,000 = <b>25%</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "What is the ratio of the spending on Food to the combined spending on Education and Health?", "o": ["10 : 7", "6 : 5", "30 : 23", "23 : 30"], "a": 2, "e": "30 : (15 + 8) = <b>30 : 23</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Table", "q": "Which district had the highest pass percentage?", "o": ["R", "P", "S", "T"], "a": 0, "e": "Pass %: P 14%, Q 12%, R 16%, S 15%, T 13% ⇒ <b>R</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Table", "q": "What is the overall pass percentage of the five districts taken together (approximately)?", "o": ["15.2%", "14.8%", "13.6%", "14.1%"], "a": 3, "e": "Qualified = 2,873; appeared = 20,400 ⇒ 2,873/20,400 × 100 ≈ <b>14.1%</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Table", "q": "What is the ratio of the number of candidates who qualified from district Q to that from district S?", "o": ["16 : 15", "152 : 145", "38 : 29", "145 : 152"], "a": 1, "e": "456 : 435 = (3 × 152) : (3 × 145) = <b>152 : 145</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Table", "q": "The number of candidates who did not qualify in district T is how many more than that in district S?", "o": ["985", "1,015", "1,100", "1,085"], "a": 1, "e": "T: 4,000 − 520 = 3,480; S: 2,900 − 435 = 2,465 ⇒ difference = <b>1,015</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Table", "q": "If 25% of the qualified candidates of district R are women, how many men qualified from R?", "o": ["208", "648", "624", "600"], "a": 2, "e": "Men = 75% of 832 = <b>624</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Table (Percentage)", "q": "What are the total marks obtained by Amit in the four subjects?", "o": ["345", "336", "330", "320"], "a": 2, "e": "Maths 80% of 150 = 120; Science 75; English 60% of 75 = 45; Social Studies 72% of 125 = 90 ⇒ total <b>330</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Table (Percentage)", "q": "What is Dev's overall percentage of marks in the four subjects (approximately)?", "o": ["69.6%", "68.4%", "71.2%", "67.5%"], "a": 0, "e": "135 + 60 + 48 + 70 = 313 out of 450 ⇒ 313/450 × 100 ≈ <b>69.6%</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Table (Percentage)", "q": "What are the average marks of the five students in Mathematics?", "o": ["110.2", "108.6", "112.0", "105.4"], "a": 1, "e": "Average % = (80 + 72 + 64 + 90 + 56)/5 = 72.4% ⇒ 72.4% of 150 = <b>108.6</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Table (Percentage)", "q": "How many students scored more than 60 marks in English?", "o": ["Three", "None", "Two", "One"], "a": 3, "e": "More than 60 out of 75 means more than 80%. Only Bina (84% = 63 marks) qualifies; Esha's 80% is exactly 60 ⇒ <b>one</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Table (Percentage)", "q": "What is the difference between Charu's marks in Social Studies and Esha's marks in Science?", "o": ["20", "16", "8", "12"], "a": 3, "e": "Charu: 80% of 125 = 100; Esha: 88% of 100 = 88 ⇒ difference = <b>12</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "Data Sufficiency", "q": "What is the area of the rectangle?<br>I. Its length is 12 cm.<br>II. Its diagonal is 13 cm.", "o": ["Statement I alone is sufficient", "Statement II alone is sufficient", "Either I or II alone is sufficient", "Both I and II together are needed"], "a": 3, "e": "Neither alone is enough. Together: breadth = √(13² − 12²) = 5 cm ⇒ area = 60 cm² ⇒ <b>both together are needed</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "x is an integer. Is x an even number?<br>I. 3x is an even number.<br>II. x + 5 is an odd number.", "o": ["Statement II alone is sufficient", "Even I and II together are not sufficient", "Either I or II alone is sufficient", "Statement I alone is sufficient"], "a": 2, "e": "I: 3 is odd, so 3x is even only if x is even ⇒ sufficient. II: x + 5 odd ⇒ x even ⇒ sufficient ⇒ <b>either alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "In which month was Mohan born?<br>I. Mohan's brother, born in May, is exactly 15 months older than Mohan.<br>II. Mohan was born in a month that has 30 days.", "o": ["Either I or II alone is sufficient", "Statement II alone is sufficient", "Statement I alone is sufficient", "Both I and II together are needed"], "a": 2, "e": "I: 15 months after May is August of the next year ⇒ sufficient. II gives four possible months ⇒ <b>Statement I alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "What is Rina's present age?<br>I. Rina is 4 years older than her brother.<br>II. Five years ago, Rina was 13 years old.", "o": ["Both I and II together are needed", "Statement II alone is sufficient", "Statement I alone is sufficient", "Either I or II alone is sufficient"], "a": 1, "e": "I gives only a difference. II gives 13 + 5 = 18 years ⇒ <b>Statement II alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "In a code language, what is the code for 'go'?<br>I. 'go home now' is written as 'ka ta pa' and 'come home late' as 'ra ka ma'.<br>II. 'now and then' is written as 'ta zo ni'.", "o": ["Either I or II alone is sufficient", "Both I and II together are needed", "Statement I alone is sufficient", "Statement II alone is sufficient"], "a": 1, "e": "From I: home = ka, so go and now are ta/pa (undecided). II alone says nothing about 'go'. Together: now = ta ⇒ go = pa ⇒ <b>both together are needed</b>.", "f": null, "p": "P6"}, {"s": "C", "t": "Ranking", "q": "In a class of 52 students, Neha is 18th from the top. Raju is 9 ranks below Neha. What is Raju's rank from the bottom?", "o": ["26th", "25th", "24th", "27th"], "a": 0, "e": "Raju is 18 + 9 = 27th from the top ⇒ from the bottom = 52 − 27 + 1 = <b>26th</b>.", "f": null, "p": null}, {"s": "C", "t": "Number Analogy", "q": "8 : 28 :: 27 : ?", "o": ["125", "81", "65", "64"], "a": 2, "e": "8 = 2³ → 3³ + 1 = 28. Similarly 27 = 3³ → 4³ + 1 = <b>65</b>.", "f": null, "p": null}, {"s": "C", "t": "Letter Series", "q": "Find the next term: AZ, CX, FU, JQ, ?", "o": ["PL", "OK", "NL", "OL"], "a": 3, "e": "First letters: A +2 C +3 F +4 J +5 <b>O</b>; second letters: Z −2 X −3 U −4 Q −5 <b>L</b> ⇒ <b>OL</b>.", "f": null, "p": null}, {"s": "C", "t": "Coding–Decoding", "q": "If COLD is coded as DQOH, how is WARM coded in that language?", "o": ["YCUQ", "XCUQ", "XBUQ", "XCTQ"], "a": 1, "e": "Letters are shifted +1, +2, +3, +4: W→X, A→C, R→U, M→Q ⇒ <b>XCUQ</b>.", "f": null, "p": null}, {"s": "C", "t": "Blood Relation", "q": "Pointing to a girl in a photograph, Arun said, \"She is the only daughter of the mother of my father's only son.\" How is the girl related to Arun?", "o": ["Mother", "Cousin", "Aunt", "Sister"], "a": 3, "e": "My father's only son = Arun himself; his mother's only daughter = Arun's <b>sister</b>.", "f": null, "p": null}, {"s": "C", "t": "Direction Sense", "q": "Rohit walks 6 km East, turns left and walks 8 km, then turns left again and walks 12 km. How far and in which direction is he from his starting point?", "o": ["8 km, North", "14 km, North-West", "10 km, North-West", "10 km, North-East"], "a": 2, "e": "He ends 6 km West and 8 km North of the start ⇒ distance = √(6² + 8²) = <b>10 km, North-West</b>.", "f": null, "p": null}, {"s": "C", "t": "Syllogism", "q": "Statements: Some pens are books. All books are bags. No bag is a cap.<br>Conclusions: I. Some pens are bags. II. No book is a cap.", "o": ["Both I and II follow", "Neither I nor II follows", "Only I follows", "Only II follows"], "a": 0, "e": "Some pens are books + all books are bags ⇒ some pens are bags (I). All books are bags + no bag is a cap ⇒ no book is a cap (II) ⇒ <b>both follow</b>.", "f": null, "p": null}, {"s": "C", "t": "Syllogism", "q": "Statements: All roses are flowers. Some flowers are red.<br>Conclusions: I. Some roses are red. II. All flowers are roses.", "o": ["Only II follows", "Both I and II follow", "Neither follows", "Only I follows"], "a": 2, "e": "The red flowers need not include any rose, and 'all roses are flowers' cannot be reversed into 'all flowers are roses' ⇒ <b>neither follows</b>.", "f": null, "p": null}, {"s": "C", "t": "Clock", "q": "What is the reflex angle between the hour hand and the minute hand of a clock at 2:30?", "o": ["105°", "245°", "265°", "255°"], "a": 3, "e": "Angle = |30 × 2 − 5.5 × 30| = |60 − 165| = 105° ⇒ reflex angle = 360° − 105° = <b>255°</b>.", "f": null, "p": null}, {"s": "C", "t": "Calendar", "q": "1 March 2027 falls on a Monday. On which day of the week will 1 March 2029 fall?", "o": ["Tuesday", "Thursday", "Wednesday", "Friday"], "a": 1, "e": "1 Mar 2027 → 1 Mar 2028 includes 29 Feb 2028 (366 days, +2) ⇒ Wednesday; 1 Mar 2028 → 1 Mar 2029 has 365 days (+1) ⇒ <b>Thursday</b>.", "f": null, "p": null}, {"s": "C", "t": "Number Series", "q": "Find the next term: 3, 7, 16, 32, 57, ?", "o": ["93", "89", "82", "95"], "a": 0, "e": "Differences are 2², 3², 4², 5², 6² ⇒ 57 + 36 = <b>93</b>.", "f": null, "p": null}, {"s": "C", "t": "Mathematical Operation", "q": "If 3 # 4 = 25 and 5 # 12 = 169, then 8 # 15 = ?", "o": ["361", "23", "289", "225"], "a": 2, "e": "a # b = a² + b² ⇒ 64 + 225 = <b>289</b>.", "f": null, "p": null}, {"s": "C", "t": "Odd One Out", "q": "Find the odd one out: BDF, HJL, MOQ, RTW, VXZ", "o": ["MOQ", "VXZ", "HJL", "RTW"], "a": 3, "e": "All others have a gap of one letter (+2, +2); RTW has +2, +3 ⇒ <b>RTW</b>.", "f": null, "p": null}, {"s": "C", "t": "Circular Arrangement", "q": "Six friends P, Q, R, S, T and U sit around a circular table facing the centre. P sits opposite S. Q is an immediate neighbour of both P and R. U is an immediate neighbour of both S and T. Who sits opposite R?", "o": ["U", "P", "Q", "T"], "a": 3, "e": "Going round: P, Q, R, S, U, T (and back to P). R is opposite <b>T</b>.", "f": null, "p": null}, {"s": "C", "t": "Circular Arrangement", "q": "In the same arrangement, who are the immediate neighbours of T?", "o": ["R and U", "Q and U", "P and U", "S and P"], "a": 2, "e": "Order P, Q, R, S, U, T ⇒ T sits between U and P ⇒ <b>P and U</b>.", "f": null, "p": null}, {"s": "C", "t": "Statement & Assumption", "q": "Statement: \"Buy one, get one free on all shirts — this week only,\" announces a shop.<br>Assumptions: I. Such offers attract customers. II. The shop is running at a loss.", "o": ["Only I is implicit", "Only II is implicit", "Both I and II are implicit", "Neither is implicit"], "a": 0, "e": "The offer assumes that customers respond to it (I). Nothing suggests a loss (II) ⇒ <b>only I is implicit</b>.", "f": null, "p": null}, {"s": "C", "t": "Statement & Argument", "q": "Should mobile phones be banned in school classrooms?<br>Arguments: I. Yes, they distract students during lessons. II. No, anything that is banned becomes more attractive.", "o": ["Both I and II are strong", "Only argument I is strong", "Neither I nor II is strong", "Only argument II is strong"], "a": 1, "e": "I gives a direct, relevant reason. II is a vague generalisation ⇒ <b>only I is strong</b>.", "f": null, "p": null}, {"s": "C", "t": "Logical Sequence", "q": "Arrange the following in a logical sequence from smallest to largest: 1. Tissue 2. Atom 3. Organ 4. Cell 5. Molecule", "o": ["2, 4, 5, 1, 3", "2, 5, 4, 1, 3", "2, 5, 1, 4, 3", "5, 2, 4, 1, 3"], "a": 1, "e": "Atom → Molecule → Cell → Tissue → Organ ⇒ <b>2, 5, 4, 1, 3</b>.", "f": null, "p": null}, {"s": "C", "t": "Dictionary Order", "q": "Arrange in dictionary order: 1. Govern 2. Gossip 3. Gourmet 4. Gorilla 5. Gospel", "o": ["4, 2, 5, 3, 1", "5, 4, 2, 3, 1", "4, 5, 3, 2, 1", "4, 5, 2, 3, 1"], "a": 3, "e": "Gorilla, Gospel, Gossip, Gourmet, Govern ⇒ <b>4, 5, 2, 3, 1</b>.", "f": null, "p": null}, {"s": "C", "t": "Counting in Series", "q": "How many 7s in the following series are immediately preceded by 3 and immediately followed by 5?<br>3 7 5 2 7 3 7 5 9 3 7 4 3 7 5 7 5 3 7 5", "o": ["3", "4", "2", "5"], "a": 1, "e": "The pattern 3 7 5 occurs at positions 1–3, 6–8, 13–15 and 18–20 ⇒ <b>4</b>.", "f": null, "p": null}, {"s": "C", "t": "Ordering", "q": "Among five boys A, B, C, D and E, A is taller than B but shorter than C. D is shorter than B. E is taller than C. Who is in the middle in terms of height?", "o": ["D", "A", "C", "B"], "a": 1, "e": "E > C > A > B > D ⇒ the middle (third) is <b>A</b>.", "f": null, "p": null}, {"s": "C", "t": "Alphabet Test", "q": "If the English alphabet is written in reverse order (Z to A), which letter will be 8th to the left of the 12th letter from the right?", "o": ["T", "D", "U", "S"], "a": 0, "e": "In Z…A, the 12th letter from the right is L. Moving 8 places to the left goes towards Z: L → <b>T</b>.", "f": null, "p": null}, {"s": "C", "t": "Number Arrangement", "q": "If the digits of the number 5839274 are arranged in ascending order, how many digits will remain in the same position?", "o": ["Two", "Three", "None", "One"], "a": 2, "e": "Original 5 8 3 9 2 7 4; ascending 2 3 4 5 7 8 9 — no position matches ⇒ <b>none</b>.", "f": null, "p": null}, {"s": "C", "t": "Coding by Letter Values", "q": "If BAT = 23 and CAT = 24, then RAT = ?", "o": ["39", "38", "41", "37"], "a": 0, "e": "Each word = sum of the positions of its letters: B(2) + A(1) + T(20) = 23. R(18) + 1 + 20 = <b>39</b>.", "f": null, "p": null}, {"s": "C", "t": "Inequality", "q": "If P &gt; Q ≥ R = S &lt; T, which of the following is definitely true?<br>I. P &gt; S &nbsp; II. T &gt; Q", "o": ["Only I is true", "Only II is true", "Both I and II are true", "Neither I nor II is true"], "a": 0, "e": "P &gt; Q ≥ R = S ⇒ P &gt; S (I true). T &gt; S, but T and Q cannot be compared ⇒ <b>only I is true</b>.", "f": null, "p": null}, {"s": "C", "t": "Dice (Non-verbal)", "q": "Two positions of the same dice are shown. Which number is opposite to 5?", "o": ["1", "4", "2", "6"], "a": 2, "e": "In the first position 3 is on top, 6 in front and 5 on the right. In the second, 3 is on top, 2 in front and 6 on the right — the dice has been turned so that the face that was on the left (2) is now in front.<br>So 2 is on the face opposite 5 ⇒ <b>2</b>.", "f": {"kind": "dice", "a": [3, 6, 5], "b": [3, 2, 6]}, "p": null}, {"s": "C", "t": "Water Image (Non-verbal)", "q": "Choose the correct water image of the given figure (the water surface is below it).", "o": ["@P", "@R", "@M", "@W"], "a": 3, "e": "In a water image, top and bottom are interchanged while left and right stay the same — every character is turned upside down, in the same order.", "f": {"kind": "water", "text": "GRAPH 47"}, "p": null}, {"s": "C", "t": "Counting Figures (Non-verbal)", "q": "How many squares are there in the given figure?", "o": ["17", "12", "18", "20"], "a": 3, "e": "The figure is a 4 × 3 grid of equal squares.<br>1 × 1: 4 × 3 = 12; 2 × 2: 3 × 2 = 6; 3 × 3: 2 × 1 = 2 ⇒ total <b>20</b>.", "f": {"kind": "img", "id": "sq5"}, "p": null}, {"s": "C", "t": "Scheduling Puzzle", "q": "Five lectures — Maths, Physics, Chemistry, Biology and English — are held from Monday to Friday, one each day. Chemistry is on Wednesday. Maths is on the day just after English. Biology is neither on Monday nor on Friday. Physics is held before Chemistry. Which lecture is held on Friday?", "o": ["English", "Maths", "Physics", "Biology"], "a": 1, "e": "English–Maths must be Thursday–Friday (Monday–Tuesday would leave no day before Wednesday for Physics). Then Biology = Tuesday, Physics = Monday ⇒ Friday = <b>Maths</b>.", "f": null, "p": null}, {"s": "C", "t": "Scheduling Puzzle", "q": "In the same schedule, which lecture is held between Biology and English?", "o": ["Physics", "None of them", "Chemistry", "Maths"], "a": 2, "e": "Order: Mon Physics, Tue Biology, Wed Chemistry, Thu English, Fri Maths ⇒ <b>Chemistry</b>.", "f": null, "p": null}, {"s": "C", "t": "Scheduling Puzzle", "q": "In the same schedule, how many lectures are held between Physics and English?", "o": ["None", "Two", "Three", "One"], "a": 1, "e": "Biology (Tue) and Chemistry (Wed) lie between Physics (Mon) and English (Thu) ⇒ <b>two</b>.", "f": null, "p": null}, {"s": "C", "t": "Number Classification", "q": "How many of the following numbers are divisible by 3 but NOT by 9?<br>18, 21, 27, 33, 45, 51, 63, 72", "o": ["3", "4", "2", "5"], "a": 0, "e": "Divisible by 3 but not 9: 21, 33, 51 ⇒ <b>3</b>.", "f": null, "p": null}, {"s": "C", "t": "Number Series", "q": "Find the next term: 5, 11, 23, 47, 95, ?", "o": ["191", "189", "193", "190"], "a": 0, "e": "Each term = previous × 2 + 1 ⇒ 95 × 2 + 1 = <b>191</b>.", "f": null, "p": null}, {"s": "C", "t": "Cube & Cuboid", "q": "A cube of side 5 cm is painted on all faces and cut into cubes of side 1 cm. How many small cubes have at most one face painted?", "o": ["60", "54", "81", "98"], "a": 2, "e": "No face painted: 3³ = 27; exactly one face: 6 × 3² = 54 ⇒ at most one = 27 + 54 = <b>81</b>.", "f": null, "p": null}, {"s": "C", "t": "Statement & Conclusion", "q": "Statement: The government has made helmets compulsory for both the rider and the pillion rider of two-wheelers.<br>Conclusions: I. The government wants to reduce deaths in road accidents. II. Pillion riders were never hurt in accidents.", "o": ["Neither I nor II follows", "Only I follows", "Both I and II follow", "Only II follows"], "a": 1, "e": "The rule aims at safety (I). II contradicts the very reason for including pillion riders ⇒ <b>only I follows</b>.", "f": null, "p": null}, {"s": "D", "t": "Appointments 2026", "q": "Who has been appointed MD & CEO of Kotak Mahindra Bank from 1 January 2027, succeeding Ashok Vaswani?", "o": ["Anup Kumar Saha", "Shashidhar Jagdishan", "Sandeep Bakhshi", "Rajeev Jain"], "a": 0, "e": "<b>Anup Kumar Saha</b>, formerly of Bajaj Finance, takes over from Ashok Vaswani.", "f": null, "p": null}, {"s": "D", "t": "Awards 2026", "q": "The Ramanujan Prize 2026 (ICTP–IMU), for young mathematicians from developing countries, was awarded to which IISc Bengaluru mathematician?", "o": ["Mahesh Kakde", "Ritabrata Munshi", "Neena Gupta", "Amalendu Krishna"], "a": 0, "e": "<b>Mahesh Kakde</b> won for his work in algebraic number theory (Iwasawa theory, Brumer–Stark conjecture). He is the fifth Indian to win it.", "f": null, "p": null}, {"s": "D", "t": "Appointments 2026", "q": "Which Indian cricketer was named UNICEF India's Celebrity Advocate in October 2026?", "o": ["Smriti Mandhana", "Harmanpreet Kaur", "Jemimah Rodrigues", "Shafali Verma"], "a": 0, "e": "Vice-captain <b>Smriti Mandhana</b> was appointed in October 2026 to champion children's rights.", "f": null, "p": null}, {"s": "D", "t": "Awards 2026", "q": "Diplomat-author Navtej Sarna received the Sahitya Akademi Award 2025 (English) for which novel?", "o": ["Winter Evenings", "Crimson Spring", "Indians at Herod's Gate", "The Exile"], "a": 1, "e": "He won for <b>Crimson Spring</b>, a novel set around the Jallianwala Bagh massacre of 1919.", "f": null, "p": null}, {"s": "D", "t": "Rankings 2026", "q": "Which airline was named the World's Best Airline at the Skytrax World Airline Awards 2026, displacing Qatar Airways?", "o": ["Singapore Airlines", "Emirates", "All Nippon Airways", "Qatar Airways"], "a": 0, "e": "<b>Singapore Airlines</b> regained the top title in 2026.", "f": null, "p": null}, {"s": "D", "t": "Reports 2026", "q": "In the World Economic Forum's Global Gender Gap Index 2026, India was ranked:", "o": ["127th", "129th", "131st", "135th"], "a": 2, "e": "India was placed <b>131st</b>; Iceland topped the index again.", "f": null, "p": null}, {"s": "D", "t": "Rankings 2026", "q": "Which institution was India's highest-ranked in the Times Higher Education (THE) World University Rankings 2027?", "o": ["IIT Delhi", "Anna University", "IIT Madras", "IISc Bengaluru"], "a": 3, "e": "The <b>Indian Institute of Science, Bengaluru</b> was India's best; the University of Oxford stayed first in the world.", "f": null, "p": null}, {"s": "D", "t": "Reports 2026", "q": "What is the theme of the World Bank's World Development Report 2026?", "o": ["Digital Public Infrastructure for Inclusive Growth", "The Promise of Artificial Intelligence", "The Middle-Income Trap", "Data for Better Lives"], "a": 1, "e": "WDR 2026 is titled <b>'The Promise of Artificial Intelligence'</b>. 'The Middle-Income Trap' (2024) and 'Data for Better Lives' (2021) were earlier titles.", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "In October 2026, the World Bank raised its forecast of India's growth for FY 2026-27 to:", "o": ["6.8%", "6.6%", "7.4%", "7.1%"], "a": 3, "e": "The World Bank raised the FY27 forecast to <b>7.1%</b> from 6.6%.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "The 153rd Assembly of the Inter-Parliamentary Union (IPU) was held in October 2026 at:", "o": ["Geneva, Switzerland", "Nairobi, Kenya", "Arusha, Tanzania", "Tashkent, Uzbekistan"], "a": 2, "e": "The 153rd IPU Assembly was held at <b>Arusha, Tanzania</b> (5–9 October 2026).", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "The Commonwealth Heads of Government Meeting (CHOGM) 2026 is hosted by:", "o": ["Trinidad and Tobago", "Rwanda", "Antigua and Barbuda", "Samoa"], "a": 2, "e": "CHOGM 2026 is in <b>Antigua and Barbuda</b> (St John's); Samoa hosted CHOGM 2024.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "The India–Bangladesh Ganga Waters Treaty, which expires in December 2026, was signed in:", "o": ["1960", "2011", "1996", "1972"], "a": 2, "e": "It was signed on 12 December <b>1996</b> for 30 years, sharing the Ganga waters at Farakka during the lean season.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "The second ASEAN–India Maritime Exercise (AIME-2026), in which INS Sahyadri took part, was held at:", "o": ["Sattahip Naval Base, Thailand", "Cam Ranh Bay, Vietnam", "Subic Bay, Philippines", "Changi, Singapore"], "a": 2, "e": "AIME-2026 was held off <b>Subic Bay, Philippines</b>; INS Sahyadri and INS Kulish represented India.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "Malabar 2026, the naval exercise of the four Quad countries, was hosted by:", "o": ["India", "Japan", "United States", "Australia"], "a": 1, "e": "<b>Japan</b> hosted Malabar 2026.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "In 2026, an IAF IL-76MD heavy transport aircraft landed at the newly built Nyoma airbase, one of the world's highest airfields. Nyoma is in:", "o": ["Arunachal Pradesh", "Himachal Pradesh", "Ladakh", "Sikkim"], "a": 2, "e": "Nyoma (Mudh) airbase is in eastern <b>Ladakh</b>, at over 13,000 ft.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "'Surya' (FSS-1), the first of the Indian Navy's indigenous Fleet Support Ships, was launched in 2026 by:", "o": ["Hindustan Shipyard Ltd, Visakhapatnam", "Cochin Shipyard Ltd, Kochi", "Garden Reach Shipbuilders & Engineers, Kolkata", "Mazagon Dock Shipbuilders, Mumbai"], "a": 0, "e": "It was launched at <b>Hindustan Shipyard Ltd (HSL), Visakhapatnam</b> in the presence of Defence Minister Rajnath Singh.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "INS Mangrol, commissioned at Mumbai in October 2026, is the third ship of which class?", "o": ["Mahe-class ASW Shallow Water Craft", "Kalvari-class submarine", "Kamorta-class anti-submarine corvette", "Nilgiri-class stealth frigate"], "a": 0, "e": "INS Mangrol is the third <b>Mahe-class Anti-Submarine Warfare Shallow Water Craft</b>.", "f": null, "p": null}, {"s": "D", "t": "Science 2026", "q": "In October 2026, DRDO carried out a flight trial of a stratospheric High-Altitude Platform (HAP) airship that reached an altitude of about:", "o": ["35 km", "12 km", "50 km", "21 km"], "a": 3, "e": "The airship reached about <b>21 km</b>, in the stratosphere, useful for surveillance and communication.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "Who became the first Indian woman to win gold at the senior World Wrestling Championships, at Astana in 2026?", "o": ["Manisha Bhanwala", "Reetika Hooda", "Antim Panghal", "Babita Kumari Phogat"], "a": 0, "e": "<b>Manisha Bhanwala</b> won gold in the 59 kg category.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "Indian shooter Udhayveer Sidhu won a gold medal at the ISSF World Cup held in October 2026 in:", "o": ["Cairo", "Lima", "Baku", "Munich"], "a": 0, "e": "He won gold at the ISSF World Cup in <b>Cairo</b>, Egypt.", "f": null, "p": null}, {"s": "D", "t": "Social 2026", "q": "Which Union Territory was declared fully literate in 2026 under ULLAS – Nav Bharat Saaksharta Karyakram?", "o": ["Andaman and Nicobar Islands", "Lakshadweep", "Puducherry", "Jammu and Kashmir"], "a": 1, "e": "<b>Lakshadweep</b> achieved full functional literacy under ULLAS.", "f": null, "p": null}, {"s": "D", "t": "Environment 2026", "q": "India's first snow leopard safari for tourists was launched in 2026 in:", "o": ["Uttarakhand", "Sikkim", "Himachal Pradesh", "Ladakh"], "a": 3, "e": "The high-altitude snow leopard safari was launched in <b>Ladakh</b>.", "f": null, "p": null}, {"s": "D", "t": "Awards 2026", "q": "Each winner of the Infosys Prize 2026 receives a gold medal, a citation and a purse of:", "o": ["US$75,000", "US$100,000", "US$250,000", "US$150,000"], "a": 1, "e": "The Infosys Prize carries a purse of <b>US$100,000</b> in each of its six categories.", "f": null, "p": null}, {"s": "D", "t": "Environment 2026", "q": "COP31, the UN Climate Change Conference held from 9 November 2026, was hosted at:", "o": ["Baku, Azerbaijan", "Antalya, Türkiye", "Adelaide, Australia", "Belém, Brazil"], "a": 1, "e": "COP31 was held in <b>Antalya, Türkiye</b>, presided over by Murat Kurum, while Australia leads the negotiations. Belém hosted COP30.", "f": null, "p": null}, {"s": "D", "t": "Awards 2026", "q": "Who won the Booker Prize 2026, becoming the oldest author ever to win it?", "o": ["M. John Harrison", "Banu Mushtaq", "David Szalay", "Abdulrazak Gurnah"], "a": 0, "e": "British author <b>M. John Harrison</b> (81) won for 'The End of Everything'. David Szalay won in 2025.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "In October 2026, the Ministry of Education approved a Centre of Excellence at the Central University of Odisha, Koraput, for which classical language?", "o": ["Pali", "Sanskrit", "Odia", "Prakrit"], "a": 0, "e": "The Centre of Excellence for Classical <b>Pali</b> is to be set up at CUO, Koraput — one of five CoEs approved for Assamese, Bengali, Marathi, Pali and Prakrit.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "At India Chem 2026 held in Mumbai, Odisha secured investment proposals worth about:", "o": ["₹45,389 crore", "₹53,894 crore", "₹35,894 crore", "₹58,394 crore"], "a": 1, "e": "Odisha attracted proposals of about <b>₹53,894 crore</b> in chemicals and petrochemicals.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "In October 2026, Odisha became the first State in India to launch a dedicated online incentive portal for:", "o": ["MICE tourism", "Film production", "Green hydrogen", "Semiconductors"], "a": 0, "e": "The portal is for <b>MICE</b> (Meetings, Incentives, Conferences and Exhibitions) tourism.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "In November 2026, the Odisha government signed an MoU on nutrition security and biodiversity conservation with:", "o": ["Indian Council of Agricultural Research", "Azim Premji Foundation", "M. S. Swaminathan Research Foundation", "Tata Trusts"], "a": 2, "e": "The MoU was signed with the Chennai-based <b>M. S. Swaminathan Research Foundation (MSSRF)</b>.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "The Odisha government is setting up its Disaster Recovery Data Centre (a backup to the State Data Centre) in which district?", "o": ["Angul", "Koraput", "Sundargarh", "Keonjhar"], "a": 3, "e": "The Disaster Recovery Data Centre will be set up in <b>Keonjhar</b> district, as a backup to the State Data Centre.", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "Which shortcut key inserts a hyperlink in MS Word?", "o": ["Ctrl + K", "Ctrl + L", "Ctrl + J", "Ctrl + H"], "a": 0, "e": "<b>Ctrl + K</b> opens the Insert Hyperlink dialog; Ctrl + H is Replace, Ctrl + L left-aligns and Ctrl + J justifies.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "In MS Excel, what does =ROUND(15.678, 1) return?", "o": ["15.7", "15.6", "15.68", "16"], "a": 0, "e": "It rounds to one decimal place ⇒ <b>15.7</b>.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "In MS Excel, which symbol is used to make a cell reference absolute (e.g. A1 → fixed)?", "o": ["#", "$", "%", "&amp;"], "a": 1, "e": "The dollar sign fixes the row and/or column, e.g. <b>$A$1</b>; F4 toggles it.", "f": null, "p": null}, {"s": "E", "t": "Software", "q": "Which of the following is NOT an operating system?", "o": ["macOS", "Linux", "Android", "MySQL"], "a": 3, "e": "<b>MySQL</b> is a database management system; the others are operating systems.", "f": null, "p": null}, {"s": "E", "t": "Memory Units", "q": "One kilobyte (KB) is equal to how many bits?", "o": ["8,000", "1,024", "4,096", "8,192"], "a": 3, "e": "1 KB = 1,024 bytes = 1,024 × 8 = <b>8,192 bits</b>.", "f": null, "p": null}, {"s": "E", "t": "Number System", "q": "What is the octal equivalent of the binary number 110101?", "o": ["53", "35", "56", "65"], "a": 3, "e": "Group in threes from the right: 110 | 101 = 6 | 5 ⇒ <b>(65)₈</b>.", "f": null, "p": null}, {"s": "E", "t": "Internet", "q": "Which protocol fetches e-mail while keeping the messages on the server, so that they stay in sync across several devices?", "o": ["SNMP", "POP3", "IMAP", "SMTP"], "a": 2, "e": "<b>IMAP</b> keeps mail on the server; POP3 usually downloads and removes it; SMTP sends mail.", "f": null, "p": null}, {"s": "E", "t": "Internet", "q": "In the address https://www.example.gov.in/home, which part is the top-level domain (TLD)?", "o": ["www", ".in", "https", ".gov"], "a": 1, "e": "The TLD is the last label of the domain name ⇒ <b>.in</b> (India's country-code TLD).", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "In MS Word, which shortcut key centre-aligns the selected paragraph?", "o": ["Ctrl + E", "Ctrl + C", "Ctrl + M", "Ctrl + R"], "a": 0, "e": "<b>Ctrl + E</b> centres; Ctrl + R right-aligns, Ctrl + M indents and Ctrl + C copies.", "f": null, "p": null}, {"s": "E", "t": "Cyber Security", "q": "Malware that encrypts a victim's files and demands payment for the decryption key is called:", "o": ["Ransomware", "Spyware", "Logic bomb", "Adware"], "a": 0, "e": "<b>Ransomware</b> (e.g. WannaCry) locks data and demands a ransom.", "f": null, "p": null}, {"s": "E", "t": "Memory", "q": "Which type of memory must be refreshed periodically to retain its data?", "o": ["SRAM", "Flash memory", "ROM", "DRAM"], "a": 3, "e": "<b>Dynamic RAM</b> stores bits as charges in capacitors that leak, so it needs refreshing; SRAM uses flip-flops.", "f": null, "p": null}, {"s": "E", "t": "Networking", "q": "Which device regenerates a weakened signal so that a network can be extended over a longer distance?", "o": ["Repeater", "Modem", "Bridge", "Network switch"], "a": 0, "e": "A <b>repeater</b> works at the physical layer and regenerates the signal to extend range.", "f": null, "p": null}, {"s": "E", "t": "Networking", "q": "In which network topology is every device connected directly to every other device?", "o": ["Bus", "Mesh", "Ring", "Star"], "a": 1, "e": "In a full <b>mesh</b> topology each node has a dedicated link to every other node (n(n − 1)/2 links).", "f": null, "p": null}, {"s": "E", "t": "MS PowerPoint", "q": "Which key combination starts the slide show from the current slide in MS PowerPoint?", "o": ["F5", "Ctrl + F5", "Shift + F5", "Ctrl + Shift + S"], "a": 2, "e": "F5 starts from the first slide; <b>Shift + F5</b> starts from the current slide.", "f": null, "p": null}, {"s": "E", "t": "File Formats", "q": "Which of the following image formats uses lossless compression and supports transparent backgrounds?", "o": ["MP4", "PNG", "WAV", "JPEG"], "a": 1, "e": "<b>PNG</b> is lossless with an alpha channel; JPEG is lossy, MP4 is video and WAV is audio.", "f": null, "p": null}, {"s": "E", "t": "Cloud Computing", "q": "Using e-mail or office software over the Internet on a subscription, without installing it, is an example of:", "o": ["DaaS", "SaaS", "IaaS", "PaaS"], "a": 1, "e": "<b>Software as a Service</b> delivers ready-to-use applications online.", "f": null, "p": null}, {"s": "E", "t": "Programming", "q": "Which language is understood directly by the CPU without any translation?", "o": ["C language", "Assembly language", "Machine language", "Python"], "a": 2, "e": "<b>Machine language</b> (binary code) is executed directly; others need an assembler, compiler or interpreter.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "Which MS Excel feature displays only the rows that meet the criteria you specify, hiding the rest?", "o": ["Freeze Panes", "Merge Cells", "Sort", "Filter"], "a": 3, "e": "<b>Filter</b> (Data → Filter) temporarily hides rows that do not match.", "f": null, "p": null}, {"s": "E", "t": "Windows", "q": "Which shortcut locks a Windows computer immediately?", "o": ["Windows + D", "Windows + E", "Windows + R", "Windows + L"], "a": 3, "e": "<b>Windows + L</b> locks the PC; + D shows the desktop, + E opens File Explorer, + R opens Run.", "f": null, "p": null}, {"s": "E", "t": "Networking", "q": "A network formed by Bluetooth devices around one person (phone, earbuds, smartwatch) is an example of a:", "o": ["WAN", "PAN", "MAN", "LAN"], "a": 1, "e": "A <b>Personal Area Network</b> covers a few metres around an individual.", "f": null, "p": null}], "passages": {"P1": "<div class=\"ptitle\">Directions (Q.36–40)</div><div>The bar graph shows the production of cars (in thousands) by two companies A and B from 2020 to 2024 (hypothetical data).</div><img class=\"figimg\" alt=\"Chart for Directions (Q.36–40)\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAsAAAAGiCAYAAADp+3AjAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAQ6wAAEOsBUJTofAAAgH1JREFUeJzt3XV0VEcbBvBn4+5uWIAASQgawd2dAC0U9+LQUqTQ4kWLFbdixSnu7hDcIUDc3WX3fn/ky8J2NyFANoHs8zsnh92ZuTNzdzbk3dm5c0WCIAggIiIiIlIRasXdASIiIiKiosQAmIiIiIhUCgNgIiIiIlIpDICJiIiISKUwA let tick=null;
function visit(i){ if(S.status[i]==="nv") S.status[i]="na"; S.cur=i; S.pending=S.saved[i]; }
function counts(from=0,to=QS.length-1){

function figHTML(q){

function applyFs(){ document.documentElement.style.setProperty("--fs", S.fs||1); }
function examLogout(){
  const d=modal("Logout", `<p>Do you want to leave the test?</p><ul style="line-height:1.7;padding-left:20px"><li><b>Submit &amp; Logout</b> — your test is submitted and you will see your score card and solutions.</li><li><b>Exit without saving</b> — this attempt is cleared from this device and the login screen opens.</li></ul>`,

    if(left<=10*60000 && left>5*60000 && !S.w10){ S.w10=true; persist(); toast("Only 10 minutes left. Review your marked questions."); }

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),6000); }
/* ---------- MODALS ---------- */

/* ---------- RESULT ---------- */
function evalAll(){
  const per=SECS.map(()=>({n:0,c:0,w:0,u:0}));
  let c=0,w=0,u=0;
  QS.forEach((q,k)=>{const p=per[secOf(k)]; p.n++; const a=S.saved[k];
    if(a===null||a===undefined){u++;p.u++;} else if(a===q.a){c++;p.c++;} else {w++;p.w++;}});
  return {c,w,u,per,score:c*EXAM.plus-w*EXAM.minus};
}
function fmtDur(ms){const t=Math.round(ms/1000);return `${Math.floor(t/60)} min ${pad2(t%60)} s`;}
function renderResult(){
  const R=evalAll(), att=R.c+R.w, acc=att?Math.round(R.c/att*100):0, pct=Math.max(0,R.score)/QS.length;
  const C=2*Math.PI*62;
  const verdict = (R.score>=110?"Target zone! A score of 110+ out of 150 is a strong Prelim score. ":"Aim for 110+ out of 150 (about 75%) to be safe in the Prelim. ") + (pct>=0.75?"Excellent! You are well prepared — keep revising the explanations of the few you missed.":
    pct>=0.6?"Good attempt. Focus on the sections with the lowest score below, then take the next mock.":
    pct>=0.4?"Fair. Read every explanation below carefully; most misses come from concepts that repeat in the real exam.":
    "Keep practising. Study the explanations below section by section and retake the test after revision.");
  const bars=SECS.map((s,k)=>{const p=R.per[k], v=p.c/p.n*100; return `<div class="sb"><span>${s[1]}</span><span class="bar" role="img" aria-label="${p.c} of ${p.n}"><i style="width:${v}%"></i></span><span class="pc">${p.c}/${p.n}</span></div>`;}).join("");
  const sec=SECS.map((s,k)=>{const p=R.per[k];return `<tr><td>${s[1]}</td><td>${p.n}</td><td>${p.c+p.w}</td><td style="color:var(--ok);font-weight:700">${p.c}</td><td style="color:var(--bad);font-weight:700">${p.w}</td><td>${p.u}</td><td><b>${fmt(p.c*EXAM.plus-p.w*EXAM.minus)}</b></td></tr>`}).join("");
  app.innerHTML = `<div class="screen">${topbar(`Candidate: <b>${esc(S.name)}</b> &nbsp;|&nbsp; Roll No: ${esc(S.roll)}`)}
  <main class="result pad">
    <section class="rcard">
      <div class="rhead"><h2>Score Card — ${EXAM.test}</h2><span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="note">Submitted: ${new Date(S.submittedAt).toLocaleString("en-IN")}</span><span class="ractions"><a class="btn btn-wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent("I scored "+fmt(R.score)+"/"+QS.length+" in the GES OSSC CGLRE (Specialist) Prelim "+EXAM.test+" (TCS pattern CBT). Try it free: "+location.href.split("#")[0])}">Share score</a><button class="btn" id="print">Print / Save PDF</button><button class="btn" id="logout">Logout</button></span></span></div>
      <div class="score-row">
        <div class="ring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" fill="none" stroke="#e3e6ea" stroke-width="14"/><circle cx="75" cy="75" r="62" fill="none" stroke="#1167b1" stroke-width="14" stroke-dasharray="${C*pct} ${C}" stroke-linecap="butt"/></svg>
          <div class="c"><div><b>${fmt(R.score)}</b><span>out of ${QS.length}</span></div></div></div>
        <div class="stats">
          <div class="stat ok"><div class="k">Correct</div><div class="v">${R.c}</div></div>
          <div class="stat bad"><div class="k">Wrong</div><div class="v">${R.w}</div></div>
          <div class="stat"><div class="k">Not attempted</div><div class="v">${R.u}</div></div>
          <div class="stat bad"><div class="k">Negative marks</div><div class="v">−${fmt(R.w*EXAM.minus)}</div></div>
          <div class="stat"><div class="k">Accuracy</div><div class="v">${acc}%</div></div>
          <div class="stat"><div class="k">Time taken</div><div class="v" style="font-size:16px">${fmtDur(S.submittedAt-S.startedAt)}</div></div>
          <div class="stat"><div class="k">Percentage</div><div class="v">${(pct*100).toFixed(1)}%</div></div>
        </div>
      </div>
      <div class="verdict">${verdict}</div>
      ${topicsHTML()}
      <div class="secbars">${bars}</div>
      <div class="pad" style="padding-bottom:16px"><div class="tbl-wrap"><table class="sumtbl"><thead><tr><th>Section</th><th>Questions</th><th>Attempted</th><th>Correct</th><th>Wrong</th><th>Not attempted</th><th>Score</th></tr></thead><tbody>${sec}</tbody></table></div></div>
      <div class="cta"><span>Want more full-length mock tests, PYQs and practice sets for the <b>OSSC CGLRE (Specialist) Prelim on 30 Nov 2026</b>? Join the GES preparation group.</span>
        <span class="ractions"><a class="btn btn-wa" target="_blank" rel="noopener" href="https://wa.me/919776188019?text=${encodeURIComponent("Hello Sir, I took the GES OSSC CGLRE (Specialist) Prelim "+EXAM.test+" and scored "+fmt(R.score)+"/"+QS.length+". I want to join the CGLRE preparation group.")}">Join on WhatsApp</a></span></div>
    </section>
    <section class="rcard" id="sols">
      <div class="rhead"><h2>Solutions &amp; Explanations</h2><button class="btn" id="retake">Retake Test</button></div>
      <div class="filters" id="filters"></div>
      <div id="sollist"></div>
    </section>
  </main>${footer()}</div>`;
  $("#print").onclick=()=>{ try{ window.print(); }catch(e){} };
  $("#logout").onclick=()=>{
    const d=modal("Logout", `<p>You will be logged out and this result will be cleared from this device. The next candidate can then sign in with a new name.</p>`, `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="lo">Logout</button>`);
    $("#lo",d).onclick=()=>{S=fresh(); try{localStorage.removeItem(KEY);}catch(e){} d.remove(); render();};
  };
  $("#retake").onclick=()=>{
    const d=modal("Retake Test", `<p>Your current answers and score will be cleared and a fresh ${EXAM.minutes}-minute test will start from the login screen.</p>`, `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="rt">Clear and retake</button>`);
    $("#rt",d).onclick=()=>{const nm=S.name, rl=S.roll; S=fresh(); S.name=nm; S.roll=rl; persist(); d.remove(); render(); window.scrollTo(0,0);};
  };
  renderSolutions();
}
function topicsHTML(){
  const m={};
  QS.forEach((q,k)=>{ const a=S.saved[k]; const miss = a===null||a===undefined||a!==q.a; const t=q.t.replace(/\s*\(.*\)$/,"").replace(/\s*–.*$/,""); if(!m[t]) m[t]={miss:0,n:0}; m[t].n++; if(miss) m[t].miss++; });
  const list=Object.entries(m).filter(([t,v])=>v.miss>0).sort((x,y)=>y[1].miss-x[1].miss||x[0].localeCompare(y[0])).slice(0,12);
  if(!list.length) return `<div class="topics"><h3>Topics to revise</h3><p class="note">No weak topics — every question was answered correctly!</p></div>`;
  return `<div class="topics"><h3>Topics to revise (wrong or not attempted)</h3><div class="tchips">${list.map(([t,v])=>`<span class="tchip">${esc(t)} · <b>${v.miss}/${v.n}</b></span>`).join("")}</div></div>`;
}
function renderSolutions(){
  const F=[["all","All"],["wrong","Wrong"],["skip","Not attempted"],["right","Correct"]];
  const secs=[["all","All sections"]].concat(SECS.map(s=>[s[0],s[1]]));
  $("#filters").innerHTML = F.map(f=>`<button class="chip ${S.filter===f[0]?"on":""}" data-f="${f[0]}">${f[1]}</button>`).join("") +
    `<span style="width:10px"></span>` + secs.map(s=>`<button class="chip ${S.fsec===s[0]?"on":""}" data-s="${s[0]}">${s[1]}</button>`).join("");
  $("#filters").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;persist();renderSolutions();});
  $("#filters").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.fsec=b.dataset.s;persist();renderSolutions();});
  let html="";
  QS.forEach((q,k)=>{
    const a=S.saved[k], st = a===null||a===undefined ? "skip" : (a===q.a?"right":"wrong");
    if(S.filter!=="all" && S.filter!==st) return;
    if(S.fsec!=="all" && S.fsec!==q.s) return;
    const pill = st==="right"?`<span class="pill ok">Correct +${EXAM.plus}</span>`:st==="wrong"?`<span class="pill bad">Wrong</span>`:`<span class="pill skip">Not attempted</span>`;
    const opts=q.o.map((o,j)=>{const cls=j===q.a?"right":(j===a?"wrong":""); const tag=j===q.a?"Correct answer":(j===a?"Your answer":""); return `<div class="sopt ${cls}"><span class="L">${j+1}.</span><span>${optHTML(q,o)}</span>${tag?`<span class="tag">${tag}${j===q.a&&j===a?" · Your answer":""}</span>`:""}</div>`;}).join("");
    html+=`<article class="sol"><div class="sol-top"><span><b style="color:var(--ink)">Q${k+1}</b> · ${SECS[secOf(k)][1]} · ${q.t}</span>${pill}</div>
      ${pasHTML(q,false)}<div class="qtext">${q.q}</div>${figHTML(q)}<div class="sopts">${opts}</div><div class="exp"><h4>Explanation</h4>${q.e}</div></article>`;
  });
  $("#sollist").innerHTML = html || `<p class="empty">No questions match this filter.</p>`;
}

/* ---------- ROUTER ---------- */
const app=$("#app");
document.addEventListener("click",e=>{ const im=e.target.closest&&e.target.closest(".figimg"); if(!im) return; modal("Figure (scroll / pinch to zoom)", `<div class="zoomwrap"><img alt="Enlarged figure" src="${im.getAttribute("src")}"></div>`, `<button class="btn btn-primary" data-close>Close</button>`); });
function render(){
  window.scrollTo(0,0); applyFs();
  if(S.stage==="exam" && S.endAt && Date.now()>=S.endAt){ finish(true); return; }
  if(S.stage==="login") renderLogin();
  else if(S.stage==="instr") renderInstr();
  else if(S.stage==="exam"){ if(S.pending===undefined) S.pending=S.saved[S.cur]; renderExam(); if(!tick) tick=setInterval(updateTimer,1000); }
  else renderResult();
}
render();
</script>
</body>
</html>
