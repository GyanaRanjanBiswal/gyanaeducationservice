<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gyana Education Service – OSSC CGLRE (Specialist) 2025 Preliminary Examination – Free Online CBT Mock Test-3 (TCS pattern)">
<title>OSSC CGLRE (Specialist) Prelim – Mock Test-3 | Gyana Education Service</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: TCS iON-style exam console — header strip, question pane left, palette right; light-only by design (mirrors the real exam screen) */
:root{
  --ink:#1b2430; --muted:#5d6b7c; --line:#cfd8e3; --paper:#ffffff; --wash:#eef3f8;
  --brand:#0b4f8a; --brand-2:#1167b1; --brand-ink:#ffffff; --head:#e9eef4;
  --ans:#2e9e3f; --nans:#e2502b; --nv:#e3e6ea; --nv-b:#b9c1cb; --mark:#6a3fb5; --gold:#f4b400;
  --ok:#1f8a3b; --ok-wash:#e5f5e8; --bad:#c8352a; --bad-wash:#fdeceb; --info-wash:#fff8e1;
  --f:Arial, "Helvetica Neue", Helvetica, "Noto Sans", sans-serif;
  color-scheme: light;
}
html,body{height:100%}
#app{height:100%}
body{background:var(--wash);color:var(--ink);font-family:var(--f);font-size:14px;}
*{box-sizing:border-box}
button{font-family:var(--f);cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.screen{min-height:100%;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top brand strip */
.topbar{background:var(--brand);color:var(--brand-ink);padding-block:8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px;border:2px solid var(--gold);flex:none}
.tb-text{min-width:0;flex:1 1 220px}
.tb-org{font-weight:700;letter-spacing:1.2px;font-size:15px}
.tb-exam{font-size:12.5px;opacity:.92}
.tb-right{font-size:12px;text-align:right;opacity:.92}

/* login */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding-block:28px}
.login{display:grid;grid-template-columns:1fr 1fr;max-width:860px;width:100%;background:var(--paper);border:1px solid var(--line);box-shadow:0 2px 10px rgba(11,79,138,.08)}
.login-info{background:var(--head);padding:24px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line)}
.login-info .row{display:flex;gap:8px;font-size:13.5px}
.login-info .k{color:var(--muted);min-width:118px}
.login-info .v{font-weight:700}
.login-form{padding:24px;display:flex;flex-direction:column;gap:12px}
.login-form h2{margin:0 0 4px;font-size:18px;color:var(--brand)}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:9px 10px;border:1px solid var(--nv-b);border-radius:3px;font-size:14px;font-family:var(--f)}
.btn{border:1px solid var(--nv-b);background:var(--paper);color:var(--ink);padding:9px 16px;border-radius:3px;font-size:13.5px}
.btn:hover{background:var(--head)}
.btn-primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff;font-weight:700}
.btn-primary:hover{background:var(--brand)}
.btn-primary:disabled{background:#9db8d3;border-color:#9db8d3;cursor:not-allowed}
.btn-green{background:var(--ans);border-color:var(--ans);color:#fff;font-weight:700}
.btn-green:hover{filter:brightness(.92)}
.note{font-size:12px;color:var(--muted);line-height:1.5}

/* instructions */
.instr{flex:1;padding-block:18px;display:flex;justify-content:center}
.instr-card{background:var(--paper);border:1px solid var(--line);max-width:980px;width:100%;display:flex;flex-direction:column}
.instr-head{background:var(--head);padding:12px 18px;font-weight:700;color:var(--brand);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.instr-body{padding:16px 22px;line-height:1.6;font-size:13.5px;overflow:auto}
.instr-body h3{font-size:14px;margin:14px 0 6px;color:var(--brand)}
.instr-body ol{padding-left:22px;margin:6px 0}
.instr-body li{margin-bottom:5px}
.legend-list{display:grid;gap:8px;margin:8px 0 8px 4px}
.legend-list div{display:flex;align-items:center;gap:10px}
.pattern{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.pattern th,.pattern td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.pattern th{background:var(--head)}
.pattern td.n{text-align:center;font-variant-numeric:tabular-nums}
.instr-foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;flex-direction:column;gap:12px}
.declare{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5}
.declare input{margin-top:3px;width:16px;height:16px;flex:none}
.instr-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* exam */
.exam{height:100%;display:flex;flex-direction:column}
.exam-main{flex:1;display:flex;min-height:0}
.qpane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper);border-right:1px solid var(--line)}
.secbar{display:flex;align-items:center;gap:8px;background:var(--head);border-bottom:1px solid var(--line);padding-block:6px;flex-wrap:wrap}
.secbar .lbl{font-weight:700;font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.tab{border:1px solid var(--nv-b);background:var(--paper);padding:6px 10px;font-size:12.5px;border-radius:3px 3px 0 0;color:var(--brand)}
.tab.on{background:var(--brand-2);color:#fff;border-color:var(--brand-2);font-weight:700}
.timer{font-weight:700;font-size:13px;background:var(--paper);border:1px solid var(--nv-b);padding:6px 10px;border-radius:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer b{color:var(--brand)}
.timer.low b{color:var(--bad)}
.qtype{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;padding-block:7px;border-bottom:1px solid var(--line);color:var(--muted)}
.qtype .mk span{color:var(--ok);font-weight:700}
.qtype .mk em{color:var(--bad);font-style:normal;font-weight:700}
.qhead{display:flex;justify-content:space-between;align-items:center;padding-block:9px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.qhead h2{margin:0;font-size:15px}
.qhead .lang{font-size:12px;color:var(--muted)}
.qhead select{font-size:12px;padding:2px 4px}
.qbody{flex:1;overflow:auto;padding-block:14px 20px;min-height:0}
.qtext{font-size:calc(15.5px*var(--fs,1));line-height:1.65;max-width:78ch}
.qtext b{font-weight:700}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px;max-width:78ch}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border:1px solid transparent;border-radius:3px;cursor:pointer;font-size:calc(15px*var(--fs,1));line-height:1.5}
.opt:hover{background:#f3f7fb;border-color:var(--line)}
.opt input{margin-top:4px;width:16px;height:16px;flex:none;accent-color:var(--brand-2)}
.opt.sel{background:#eaf2fb;border-color:#a9c6e6}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--head);padding-block:9px;padding-bottom:max(9px,env(safe-area-inset-bottom,0px))}
.actions .l{display:flex;gap:8px;flex-wrap:wrap}

/* palette */
.palette{width:300px;flex:none;display:flex;flex-direction:column;background:#f7f9fc;min-height:0}
.cand{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.cand svg{width:50px;height:58px;flex:none;border:1px solid var(--line);background:var(--head)}
.cand .nm{font-weight:700;font-size:13.5px;word-break:break-word}
.cand .roll{font-size:12px;color:var(--muted)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:11.5px;line-height:1.25}
.legend .it{display:flex;align-items:center;gap:6px}
.legend .it.wide{grid-column:1/-1}
.pal-sec{background:var(--brand-2);color:#fff;font-weight:700;font-size:12.5px;padding:6px 12px}
.pal-choose{font-size:12px;color:var(--muted);padding:8px 12px 2px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:9px 6px;padding:8px 12px 12px;align-content:start;min-height:0}
.pal-foot{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:var(--head);padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.pal-foot .btn-green{grid-column:1/-1}

/* status shapes */
.st{width:38px;height:33px;display:inline-grid;place-items:center;font-size:12.5px;font-weight:700;position:relative;border:1px solid transparent;font-variant-numeric:tabular-nums;flex:none;padding:0}
.st.sm{width:28px;height:25px;font-size:11px}
.st.nv{background:var(--nv);border-color:var(--nv-b);color:var(--ink);border-radius:3px}
.st.na{background:var(--nans);color:#fff;border-radius:2px 2px 14px 14px / 2px 2px 9px 9px}
.st.an{background:var(--ans);color:#fff;border-radius:14px 14px 2px 2px / 9px 9px 2px 2px}
.st.mk{background:var(--mark);color:#fff;border-radius:50%}
.st.am{background:var(--mark);color:#fff;border-radius:50%}
.st.am::after{content:"";position:absolute;right:-3px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--ans);border:2px solid #fff;box-sizing:border-box}
.st.sm.am::after{width:10px;height:10px;right:-3px;bottom:-2px}
.grid .st{justify-self:center;cursor:pointer}
.grid .st.cur{outline:2px solid var(--gold);outline-offset:2px}

/* figures */
.fig{margin:14px 0 4px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.word{font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:30px;letter-spacing:2px;color:#13294b;padding:6px 14px;border:1px dashed var(--nv-b);background:#fff}
.mirror-line{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:2px}
.mirror-line i{display:block;width:4px;height:58px;background:linear-gradient(#6aa3db,#2b6cb0)}
.water-wrap{display:flex;flex-direction:column;gap:3px}
.water-line{height:5px;background:repeating-linear-gradient(90deg,#4a90d9 0 10px,#9cc5ef 10px 20px);border-radius:3px}
.optfig{display:inline-block;font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:22px;letter-spacing:2px;color:#13294b}
.optfig.M{transform:scaleX(-1)} .optfig.W{transform:scaleY(-1)} .optfig.R{transform:rotate(180deg)}
.dice{display:flex;gap:26px;flex-wrap:wrap}
.dice figure{margin:0;text-align:center;font-size:12px;color:var(--muted)}
.dice svg{width:120px;height:120px;display:block}

.figimg{display:block;max-width:100%;height:auto;border:1px solid var(--line);background:#fff;margin:8px 0;cursor:zoom-in}
.zoomwrap{overflow:auto;max-height:75vh}.zoomwrap img{display:block;width:760px;max-width:none;height:auto}
.zhint{font-size:11.5px;color:var(--muted);margin:2px 0 0}
.passage{background:#f6f9fd;border:1px solid #c9d8ea;border-left:4px solid var(--brand-2);padding:10px 12px;margin:0 0 14px;font-size:calc(14px*var(--fs,1));line-height:1.6;max-width:78ch}
.passage summary{cursor:pointer;font-weight:700;color:var(--brand)}
.ptitle{font-weight:700;color:var(--brand);margin-bottom:4px}
.ptbl{overflow-x:auto;margin-top:8px}
.ptbl table{border-collapse:collapse;font-size:13.5px;background:#fff;min-width:320px}
.ptbl th,.ptbl td{border:1px solid #b9c7d8;padding:5px 9px;text-align:center}
.ptbl th{background:#e3ecf6}
.ptbl td:first-child{text-align:left;font-weight:700}
.fsz{display:inline-flex;gap:4px;align-items:center;margin-left:8px}
.fsz button{padding:2px 8px;font-size:12px}
.btn-out{border-color:#c8352a;color:#c8352a;font-weight:700}
.btn-out:hover{background:#fdeceb}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,30,50,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--paper);max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal-h{background:var(--brand);color:#fff;padding:10px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-h button{background:transparent;border:0;color:#fff;font-size:20px;line-height:1}
.modal-b{padding:14px 16px;overflow:auto}
.modal-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
.sumtbl{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.sumtbl th,.sumtbl td{border:1px solid var(--line);padding:7px 8px;text-align:center;font-variant-numeric:tabular-nums}
.sumtbl th{background:var(--head);font-size:12px}
.sumtbl td:first-child,.sumtbl th:first-child{text-align:left}
.sumtbl tr.tot td{font-weight:700;background:#f7f9fc}
.qp-item{border-bottom:1px solid var(--line);padding:10px 0;font-size:13.5px;line-height:1.55}
.qp-item .n{font-weight:700;color:var(--brand)}

/* result */
.result{flex:1;padding-block:18px 30px;display:flex;flex-direction:column;align-items:center;gap:16px}
.rcard{background:var(--paper);border:1px solid var(--line);max-width:1000px;width:100%}
.rhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.rhead h2{margin:0;font-size:18px;color:var(--brand)}
.score-row{display:grid;grid-template-columns:auto 1fr;gap:22px;padding:18px;align-items:center}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:30px;display:block;font-variant-numeric:tabular-nums}
.ring .c span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;width:100%}
.stat{border:1px solid var(--line);padding:10px 12px}
.stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.stat.ok .v{color:var(--ok)} .stat.bad .v{color:var(--bad)}
.verdict{margin:0 18px 16px;padding:10px 14px;background:var(--info-wash);border:1px solid #f1d68a;font-size:13.5px;line-height:1.5}
.secbars{padding:4px 18px 18px;display:grid;gap:10px}
.sb{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.sb .bar{height:14px;background:var(--nv);position:relative;overflow:hidden;border-radius:2px}
.sb .bar i{position:absolute;inset:0 auto 0 0;background:var(--brand-2)}
.sb .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center}
.chip{border:1px solid var(--nv-b);background:var(--paper);padding:5px 10px;border-radius:14px;font-size:12.5px}
.chip.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.sol{padding:14px 18px;border-bottom:1px solid var(--line)}
.sol-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.pill{padding:2px 8px;border-radius:10px;font-weight:700;font-size:11.5px}
.pill.ok{background:var(--ok-wash);color:var(--ok)} .pill.bad{background:var(--bad-wash);color:var(--bad)} .pill.skip{background:var(--nv);color:var(--muted)}
.sol .qtext{font-size:14.5px}
.sopts{display:grid;gap:6px;margin:10px 0}
.sopt{padding:7px 10px;border:1px solid var(--line);border-radius:3px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.sopt .L{font-weight:700;color:var(--muted);flex:none}
.sopt.right{background:var(--ok-wash);border-color:#9fd3ac}
.sopt.wrong{background:var(--bad-wash);border-color:#efb1ab}
.sopt .tag{margin-left:auto;font-size:11.5px;font-weight:700;white-space:nowrap}
.sopt.right .tag{color:var(--ok)} .sopt.wrong .tag{color:var(--bad)}
.exp{background:#f4f8fc;border-left:3px solid var(--brand-2);padding:9px 12px;font-size:13.5px;line-height:1.6}
.exp h4{margin:0 0 4px;font-size:12px;letter-spacing:.6px;color:var(--brand);text-transform:uppercase}
.empty{padding:22px 18px;color:var(--muted)}

.palette-toggle{display:none}
.site-foot{flex:none;min-height:64px;display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;background:#0a3f6e;color:#dbe8f6;font-size:12px;padding-block:8px;padding-right:max(210px,env(safe-area-inset-right,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.site-foot b{color:#fff}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff8e1;border:1px solid #f1d68a;color:#5b4300;padding:10px 16px;font-weight:700;font-size:13.5px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.15);max-width:calc(100% - 32px);text-align:center}
.cta{margin:0 18px 16px;padding:12px 14px;border:1px solid #9fc0e3;background:#eef5fc;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:13.5px;line-height:1.5}
.cta a,.ractions a{text-decoration:none}
.btn-wa{background:#1f9d55;border-color:#1f9d55;color:#fff;font-weight:700;display:inline-block}
.btn-wa:hover{filter:brightness(.92)}
.topics{padding:0 18px 18px}
.topics h3{font-size:14px;margin:0 0 8px;color:var(--brand)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid #efb1ab;background:var(--bad-wash);color:#7a1f17;padding:4px 10px;border-radius:12px;font-size:12.5px}
.tchip b{font-variant-numeric:tabular-nums}
.ractions{display:flex;gap:8px;flex-wrap:wrap}
.result{padding-bottom:84px}
@media print{.topbar .tb-right,.site-foot,.ractions,#filters,.cta,#logout,#retake,.toast{display:none!important}body{background:#fff}.rcard{border:0}.sol{break-inside:avoid}}
@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login-info{border-right:0;border-bottom:1px solid var(--line)}
  .palette{position:fixed;top:0;right:0;bottom:0;width:min(320px,88vw);z-index:40;box-shadow:-6px 0 18px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px)}
  .palette.open{transform:none}
  .palette{bottom:64px}
  .site-foot{padding-right:max(170px,env(safe-area-inset-right,0px));font-size:11px}
  .site-foot span:nth-child(2){display:none}
  .palette-toggle{display:inline-block}
  .tb-right{flex:1 1 100%;text-align:left}
  .exam .tb-right{display:none}
  .secbar .lbl{display:none}
  .tabs{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .tab{white-space:nowrap;flex:none}
  .timer{margin-right:auto}
  .score-row{grid-template-columns:1fr;justify-items:center}
  .sb{grid-template-columns:110px 1fr 56px}
  .qtext{font-size:calc(15px*var(--fs,1))}
  .secbar{gap:6px}
  .timer{font-size:12.5px;padding:5px 8px}
}
@media (prefers-reduced-motion:reduce){.palette{transition:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const DATA = {"sections": [["A", "Arithmetic"], ["B", "Data Interpretation"], ["C", "Reasoning & GMA"], ["D", "Current Events"], ["E", "Computer Awareness"]], "qs": [{"s": "A", "t": "Number System", "q": "What is the smallest number that must be added to 1,000 to make it exactly divisible by 45?", "o": ["25", "10", "45", "35"], "a": 3, "e": "1,000 ÷ 45 leaves remainder 10 (45 × 22 = 990) ⇒ add 45 − 10 = <b>35</b> to get 1,035 = 45 × 23.", "f": null, "p": null}, {"s": "A", "t": "LCM & HCF", "q": "The sum of two numbers is 216 and their HCF is 27. How many such pairs of numbers are possible?", "o": ["4", "3", "2", "1"], "a": 2, "e": "Let the numbers be 27a and 27b with a, b co-prime ⇒ a + b = 8 ⇒ (1, 7) and (3, 5) are co-prime pairs ((2, 6) and (4, 4) are not) ⇒ <b>2</b> pairs.", "f": null, "p": null}, {"s": "A", "t": "Simplification", "q": "Simplify: 1 ÷ [1 + 1 ÷ {1 + 1 ÷ (1 + 1/2)}]", "o": ["5/3", "3/5", "5/8", "8/5"], "a": 2, "e": "1 + 1/2 = 3/2 → 1 ÷ 3/2 = 2/3 → 1 + 2/3 = 5/3 → 1 ÷ 5/3 = 3/5 → 1 + 3/5 = 8/5 → 1 ÷ 8/5 = <b>5/8</b>.", "f": null, "p": null}, {"s": "A", "t": "Surds", "q": "Find the value of √(12 + √(12 + √(12 + …))) (continuing infinitely).", "o": ["4", "6", "2√3", "3"], "a": 0, "e": "Let x = √(12 + x) ⇒ x² − x − 12 = 0 ⇒ (x − 4)(x + 3) = 0 ⇒ x = <b>4</b> (x is positive).", "f": null, "p": null}, {"s": "A", "t": "Unit Digit", "q": "What is the unit digit of 3<sup>65</sup> × 6<sup>59</sup> × 7<sup>71</sup>?", "o": ["2", "6", "4", "8"], "a": 2, "e": "Powers of 3 and 7 repeat their unit digits every 4. 65 = 4 × 16 + 1 ⇒ 3¹ → 3; 6 to any power → 6; 71 = 4 × 17 + 3 ⇒ 7³ → 3.<br>3 × 6 × 3 = 54 ⇒ unit digit <b>4</b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage", "q": "If A's salary is 25% more than B's salary, then B's salary is how much per cent less than A's?", "o": ["25%", "20%", "22.5%", "15%"], "a": 1, "e": "B = 100 ⇒ A = 125. B is less by 25/125 × 100 = <b>20%</b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage – Election", "q": "In an election between two candidates, 10% of the votes cast were invalid. The winner got 58% of the valid votes and won by 1,440 votes. What was the total number of votes cast?", "o": ["11,000", "12,000", "10,000", "9,000"], "a": 2, "e": "Margin = 58% − 42% = 16% of valid votes = 1,440 ⇒ valid votes = 9,000 = 90% of total ⇒ total = <b>10,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage", "q": "In a town, 60% of the people speak Odia, 45% speak Hindi and 25% speak both. If 1,200 people speak neither language, what is the population of the town?", "o": ["6,000", "4,800", "8,000", "5,000"], "a": 0, "e": "People speaking at least one = 60 + 45 − 25 = 80% ⇒ neither = 20% = 1,200 ⇒ population = <b>6,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage", "q": "If 40% of 60% of a number is 360, what is the number?", "o": ["1,500", "1,800", "1,440", "1,200"], "a": 0, "e": "0.40 × 0.60 × x = 0.24x = 360 ⇒ x = <b>1,500</b>.", "f": null, "p": null}, {"s": "A", "t": "Profit & Loss", "q": "A man buys an article for ₹800 and sells it at a loss of 15%. With that money he buys another article and sells it at a gain of 20%. What is his overall result?", "o": ["No gain, no loss", "Loss of ₹16", "Gain of ₹16", "Gain of ₹40"], "a": 2, "e": "800 × 0.85 = ₹680; 680 × 1.20 = ₹816 ⇒ overall <b>gain of ₹16</b> on his original ₹800.", "f": null, "p": null}, {"s": "A", "t": "Profit & Loss", "q": "A man sold two chairs at ₹1,200 each. On one he gained 20% and on the other he lost 20%. What is his overall gain or loss per cent?", "o": ["4% gain", "No gain, no loss", "4% loss", "2% loss"], "a": 2, "e": "CP₁ = 1,200/1.2 = 1,000; CP₂ = 1,200/0.8 = 1,500 ⇒ total CP = 2,500, SP = 2,400 ⇒ loss = 100/2,500 × 100 = <b>4% loss</b>.", "f": null, "p": null}, {"s": "A", "t": "Discount", "q": "After two successive discounts of 20% and 10%, an article is sold for ₹1,440. What is its marked price?", "o": ["₹2,000", "₹2,100", "₹1,800", "₹1,900"], "a": 0, "e": "SP = MP × 0.8 × 0.9 = 0.72 MP = 1,440 ⇒ MP = <b>₹2,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Simple Interest", "q": "At what rate per cent per annum of simple interest will a sum of money double itself in 8 years?", "o": ["15%", "8%", "12.5%", "10.5%"], "a": 2, "e": "Doubling ⇒ interest = principal ⇒ R × 8 = 100 ⇒ R = <b>12.5%</b>.", "f": null, "p": null}, {"s": "A", "t": "CI & SI", "q": "The compound interest on a sum for 2 years at 10% per annum is ₹420. What is the simple interest on the same sum for the same period at the same rate?", "o": ["₹400", "₹380", "₹420", "₹440"], "a": 0, "e": "CI for 2 years at 10% = 21% of P = 420 ⇒ P = 2,000 ⇒ SI = 2,000 × 10 × 2/100 = <b>₹400</b>.", "f": null, "p": null}, {"s": "A", "t": "Compound Interest", "q": "In how much time will ₹8,000 amount to ₹9,261 at 10% per annum, compounded half-yearly?", "o": ["2½ years", "2 years", "3 years", "1½ years"], "a": 3, "e": "Half-yearly rate 5% ⇒ 9,261/8,000 = (21/20)³ = (1.05)³ ⇒ 3 half-years = <b>1½ years</b>.", "f": null, "p": null}, {"s": "A", "t": "Ratio & Proportion", "q": "If 2A = 3B = 4C, then what is A : B : C?", "o": ["6 : 4 : 3", "2 : 3 : 4", "3 : 4 : 6", "4 : 3 : 2"], "a": 0, "e": "Let 2A = 3B = 4C = 12 ⇒ A = 6, B = 4, C = 3 ⇒ <b>6 : 4 : 3</b>.", "f": null, "p": null}, {"s": "A", "t": "Ratio & Proportion", "q": "What is the mean proportional between 9 and 25?", "o": ["17", "15", "225", "16"], "a": 1, "e": "Mean proportional = √(9 × 25) = √225 = <b>15</b>.", "f": null, "p": null}, {"s": "A", "t": "Partnership", "q": "A and B invest in a business in the ratio 3 : 5, for 8 months and 6 months respectively. If B's share of the profit is ₹15,000, what is A's share?", "o": ["₹18,000", "₹9,000", "₹12,000", "₹10,000"], "a": 2, "e": "Profit ratio = 3 × 8 : 5 × 6 = 24 : 30 = 4 : 5 ⇒ A = 4/5 × 15,000 = <b>₹12,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Average", "q": "The average marks of a class of 40 students is 63. If the average marks of the 25 boys is 60, what is the average marks of the girls?", "o": ["65", "66", "70", "68"], "a": 3, "e": "Total = 40 × 63 = 2,520; boys = 25 × 60 = 1,500 ⇒ girls' total = 1,020 for 15 girls ⇒ average = <b>68</b>.", "f": null, "p": null}, {"s": "A", "t": "Average Speed", "q": "A person covers the first one-third of a distance at 10 km/h, the next one-third at 20 km/h and the last one-third at 60 km/h. What is his average speed for the whole journey?", "o": ["20 km/h", "24 km/h", "18 km/h", "30 km/h"], "a": 2, "e": "Take the distance as 180 km: time = 60/10 + 60/20 + 60/60 = 6 + 3 + 1 = 10 h ⇒ average speed = 180/10 = <b>18 km/h</b>.", "f": null, "p": null}, {"s": "A", "t": "Time & Work", "q": "12 men can complete a piece of work in 18 days. How many men are needed to complete the same work in 8 days?", "o": ["32", "24", "30", "27"], "a": 3, "e": "Men × days is constant: 12 × 18 = 216 = M × 8 ⇒ M = <b>27</b>.", "f": null, "p": null}, {"s": "A", "t": "Time & Work", "q": "10 men can complete a work in 15 days. After they have worked for 5 days, 5 more men join them. In how many more days will the remaining work be finished?", "o": ["6⅔ days", "10 days", "8 days", "7 days"], "a": 0, "e": "Total work = 150 man-days; done in 5 days = 50 ⇒ remaining 100 man-days by 15 men = 100/15 = <b>6⅔ days</b>.", "f": null, "p": null}, {"s": "A", "t": "Pipes & Cisterns", "q": "Two pipes can fill a tank in 12 hours and 15 hours respectively. Both are opened together, and after 4 hours the first pipe is closed. In how many hours in all will the tank be filled?", "o": ["11 hours", "10 hours", "9 hours", "8 hours"], "a": 1, "e": "In 4 hours: 4/12 + 4/15 = 1/3 + 4/15 = 3/5 filled. Remaining 2/5 by the second pipe = 2/5 × 15 = 6 h ⇒ total = 4 + 6 = <b>10 hours</b>.", "f": null, "p": null}, {"s": "A", "t": "Trains", "q": "Two trains, 150 m and 100 m long, run in opposite directions at 54 km/h and 36 km/h. In how much time will they cross each other completely?", "o": ["25 seconds", "10 seconds", "12 seconds", "8 seconds"], "a": 1, "e": "Relative speed = 54 + 36 = 90 km/h = 25 m/s; distance = 150 + 100 = 250 m ⇒ time = 250/25 = <b>10 seconds</b>.", "f": null, "p": null}, {"s": "A", "t": "Trains", "q": "A train running at 90 km/h crosses another train running at 54 km/h in the opposite direction in 8 seconds. If the second train is 140 m long, what is the length of the first train?", "o": ["180 m", "140 m", "160 m", "200 m"], "a": 0, "e": "Relative speed = 90 + 54 = 144 km/h = 40 m/s ⇒ total length = 40 × 8 = 320 m ⇒ first train = 320 − 140 = <b>180 m</b>.", "f": null, "p": null}, {"s": "A", "t": "Boats & Streams", "q": "A man can row at 9 km/h in still water. It takes him twice as long to row upstream as to row the same distance downstream. What is the speed of the stream?", "o": ["4 km/h", "3 km/h", "2 km/h", "4.5 km/h"], "a": 1, "e": "Time is twice ⇒ downstream speed = 2 × upstream speed ⇒ 9 + s = 2(9 − s) ⇒ 3s = 9 ⇒ s = <b>3 km/h</b>.", "f": null, "p": null}, {"s": "A", "t": "Time & Distance", "q": "Walking at 4/5 of his usual speed, a man reaches his office 10 minutes late. What is his usual time to reach the office?", "o": ["40 minutes", "50 minutes", "30 minutes", "45 minutes"], "a": 0, "e": "At 4/5 of the speed, time becomes 5/4 of the usual time ⇒ extra = 1/4 of usual time = 10 min ⇒ usual time = <b>40 minutes</b>.", "f": null, "p": null}, {"s": "A", "t": "Mixture", "q": "Two vessels contain 30 litres and 20 litres of solutions having 40% and 60% acid respectively. If they are mixed, what is the percentage of acid in the mixture?", "o": ["48%", "50%", "45%", "52%"], "a": 0, "e": "Acid = 12 + 12 = 24 litres in 50 litres ⇒ 24/50 × 100 = <b>48%</b>.", "f": null, "p": null}, {"s": "A", "t": "Alligation", "q": "In what ratio must water be mixed with milk costing ₹60 per litre to get a mixture worth ₹50 per litre?", "o": ["6 : 1", "1 : 5", "1 : 6", "5 : 1"], "a": 1, "e": "Water costs ₹0. Water : milk = (60 − 50) : (50 − 0) = 10 : 50 = <b>1 : 5</b>.", "f": null, "p": null}, {"s": "A", "t": "Problems on Ages", "q": "The sum of the ages of 4 children born at intervals of 3 years each is 54 years. What is the age of the youngest child?", "o": ["6 years", "8 years", "9 years", "12 years"], "a": 2, "e": "x + (x + 3) + (x + 6) + (x + 9) = 54 ⇒ 4x + 18 = 54 ⇒ x = <b>9 years</b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "The perimeter of a rectangle is 46 cm and its area is 120 cm². What is the length of its diagonal?", "o": ["15 cm", "19 cm", "13 cm", "17 cm"], "a": 3, "e": "l + b = 23 and lb = 120 ⇒ l = 15, b = 8 ⇒ diagonal = √(225 + 64) = √289 = <b>17 cm</b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "A wheel of radius 21 cm covers a distance of 1.32 km. How many revolutions does it make? (π = 22/7)", "o": ["1,200", "900", "1,100", "1,000"], "a": 3, "e": "Circumference = 2 × 22/7 × 21 = 132 cm; distance = 1,32,000 cm ⇒ revolutions = 1,32,000 ÷ 132 = <b>1,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "The volume of a cube is 1,728 cm³. What is its total surface area?", "o": ["1,008 cm²", "864 cm²", "576 cm²", "720 cm²"], "a": 1, "e": "Edge = ∛1728 = 12 cm ⇒ total surface area = 6 × 12² = <b>864 cm²</b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "A metal sphere of radius 4 cm is melted and recast into small spheres of radius 1 cm each. How many small spheres are obtained?", "o": ["32", "48", "64", "16"], "a": 2, "e": "Number = (4/1)³ = <b>64</b> (volume is proportional to the cube of the radius).", "f": null, "p": null}, {"s": "A", "t": "Number Series", "q": "Find the next term of the series: 4, 6, 12, 30, 90, ?", "o": ["300", "315", "270", "360"], "a": 1, "e": "Multipliers: × 1.5, × 2, × 2.5, × 3 ⇒ next × 3.5 ⇒ 90 × 3.5 = <b>315</b>.", "f": null, "p": null}, {"s": "B", "t": "DI – Caselet", "q": "How many girls are there in the college in all?", "o": ["400", "360", "380", "420"], "a": 0, "e": "Girls: Science 90, Commerce 50, Arts 120, Computer Applications 60, Vocational 80 ⇒ <b>400</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Caselet", "q": "By how many does the number of boys in Science exceed the number of boys in Arts?", "o": ["120", "160", "130", "150"], "a": 3, "e": "Science = 30% of 1,200 = 360 ⇒ boys = 3/4 × 360 = 270. Arts = 240 ⇒ boys = 120. Difference = <b>150</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Caselet", "q": "Girls form what per cent of the students in the Vocational stream?", "o": ["66⅔%", "33⅓%", "60%", "50%"], "a": 0, "e": "Boys : girls in Vocational = 1 : 2 ⇒ girls = 2/3 = <b>66⅔%</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Caselet", "q": "What is the ratio of the number of boys in Commerce to the number of boys in Computer Applications?", "o": ["25 : 14", "12 : 25", "5 : 2", "25 : 12"], "a": 3, "e": "Commerce 300 ⇒ boys 5/6 × 300 = 250; Computer Applications 180 ⇒ boys 2/3 × 180 = 120 ⇒ 250 : 120 = <b>25 : 12</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Caselet", "q": "The girls in Arts are what per cent of all the girls in the college?", "o": ["35%", "25%", "28%", "30%"], "a": 3, "e": "120 ÷ 400 × 100 = <b>30%</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Table", "q": "What is the total production of factory M over the four years?", "o": ["230 thousand", "220 thousand", "216 thousand", "210 thousand"], "a": 1, "e": "52 + 48 + 56 + 64 = <b>220 thousand</b> units.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Table", "q": "By approximately what per cent did the total production of all five factories increase from 2022 to 2025?", "o": ["28.5%", "30.0%", "34.2%", "31.7%"], "a": 3, "e": "Total 2022 = 205; total 2025 = 270 ⇒ (270 − 205)/205 × 100 ≈ <b>31.7%</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Table", "q": "What is the average annual production of factory N over the four years?", "o": ["37.5 thousand", "38.25 thousand", "38.75 thousand", "39.25 thousand"], "a": 1, "e": "(30 + 36 + 42 + 45) ÷ 4 = 153 ÷ 4 = <b>38.25 thousand</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Table", "q": "The production of factory L in 2025 is what per cent of the production of factory M in 2025?", "o": ["75%", "72.5%", "70%", "80%"], "a": 0, "e": "48 ÷ 64 × 100 = <b>75%</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Table", "q": "What is the ratio of the total production of factory K to that of factory O over the four years?", "o": ["35 : 31", "21 : 19", "105 : 92", "92 : 105"], "a": 2, "e": "K = 45 + 50 + 55 + 60 = 210; O = 40 + 44 + 47 + 53 = 184 ⇒ 210 : 184 = <b>105 : 92</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Pie Chart", "q": "How much does the school spend on the Library in the year?", "o": ["₹7.5 lakh", "₹9 lakh", "₹12 lakh", "₹6 lakh"], "a": 1, "e": "15% of ₹60 lakh = <b>₹9 lakh</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "What is the central angle of the sector representing Infrastructure?", "o": ["60°", "72°", "90°", "54°"], "a": 1, "e": "20% of 360° = <b>72°</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "By how much does the expenditure on Salaries exceed the expenditure on Sports?", "o": ["₹10 lakh", "₹9 lakh", "₹12 lakh", "₹15 lakh"], "a": 2, "e": "(30% − 10%) of ₹60 lakh = 20% of ₹60 lakh = <b>₹12 lakh</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "If ₹1.5 lakh is moved from Others to Laboratory, the Laboratory expenditure will be what per cent of the total budget?", "o": ["16.5%", "17.5%", "18%", "17%"], "a": 1, "e": "Laboratory = 15% of 60 = ₹9 lakh → 9 + 1.5 = ₹10.5 lakh ⇒ 10.5/60 × 100 = <b>17.5%</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "What is the ratio of the expenditure on Infrastructure to the expenditure on Library?", "o": ["3 : 2", "3 : 4", "5 : 3", "4 : 3"], "a": 3, "e": "20 : 15 = <b>4 : 3</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Bar Chart", "q": "What is the total number of cars that remained unsold over the five years?", "o": ["29 thousand", "30 thousand", "27 thousand", "25 thousand"], "a": 2, "e": "Unsold = (40 − 35) + (45 − 42) + (50 − 46) + (60 − 52) + (70 − 63) = 5 + 3 + 4 + 8 + 7 = <b>27 thousand</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Bar Chart", "q": "In which year was the percentage of cars sold out of cars produced the highest?", "o": ["2025", "2021", "2023", "2022"], "a": 3, "e": "Sold/produced: 2021 87.5%, 2022 93.3%, 2023 92%, 2024 86.7%, 2025 90% ⇒ <b>2022</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Bar Chart", "q": "By what per cent did the sales of cars increase from 2021 to 2025?", "o": ["75%", "85%", "70%", "80%"], "a": 3, "e": "(63 − 35)/35 × 100 = 28/35 × 100 = <b>80%</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Bar Chart", "q": "What was the average annual production of cars over the five years?", "o": ["52 thousand", "50 thousand", "53 thousand", "55 thousand"], "a": 2, "e": "(40 + 45 + 50 + 60 + 70) ÷ 5 = 265 ÷ 5 = <b>53 thousand</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Bar Chart", "q": "The sales in 2024 are approximately what per cent of the production in 2025?", "o": ["70.8%", "74.3%", "76.4%", "72.5%"], "a": 1, "e": "52 ÷ 70 × 100 ≈ <b>74.3%</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Line Graph", "q": "In which year did place Y receive more tourists than place X for the first time?", "o": ["2024", "2021", "2022", "2025"], "a": 2, "e": "2020: 10 < 12; 2021: 14 < 18; 2022: 20 > 15 ⇒ first in <b>2022</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Line Graph", "q": "What is the total number of tourists who visited place X during the six years?", "o": ["126 lakh", "120 lakh", "118 lakh", "132 lakh"], "a": 0, "e": "12 + 18 + 15 + 24 + 27 + 30 = <b>126 lakh</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Line Graph", "q": "By what per cent did the number of tourists to place Y increase from 2020 to 2025?", "o": ["200%", "180%", "220%", "320%"], "a": 2, "e": "(32 − 10)/10 × 100 = <b>220%</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Line Graph", "q": "What is the ratio of tourists to X to tourists to Y in 2023 and 2024 taken together?", "o": ["3 : 2", "17 : 14", "51 : 43", "43 : 51"], "a": 2, "e": "X = 24 + 27 = 51; Y = 18 + 25 = 43 ⇒ <b>51 : 43</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Line Graph", "q": "What is the approximate average number of tourists per year to place Y?", "o": ["19.8 lakh", "21.0 lakh", "18.5 lakh", "20.3 lakh"], "a": 0, "e": "(10 + 14 + 20 + 18 + 25 + 32) ÷ 6 = 119 ÷ 6 ≈ <b>19.8 lakh</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "Data Sufficiency", "q": "What is the cost price of the article?<br>I. The article was sold for ₹1,320.<br>II. The profit earned on it was 10%.", "o": ["Statement I alone is sufficient", "Both I and II together are needed", "Either I or II alone is sufficient", "Even I and II together are not sufficient"], "a": 1, "e": "I gives only the SP; II gives only the profit %. Together: CP = 1,320 ÷ 1.10 = ₹1,200 ⇒ <b>both are needed</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "Is x greater than y? (x and y are integers)<br>I. x + y = 11<br>II. x − y = 3", "o": ["Statement I alone is sufficient", "Both I and II together are needed", "Statement II alone is sufficient", "Even I and II together are not sufficient"], "a": 2, "e": "I alone cannot decide (e.g. 6, 5 or 5, 6). II: x − y = 3 &gt; 0 ⇒ x &gt; y.<br><b>Statement II alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "What is the ratio a : b?<br>I. 3a = 5b<br>II. a + b = 40", "o": ["Even I and II together are not sufficient", "Statement I alone is sufficient", "Both I and II together are needed", "Statement II alone is sufficient"], "a": 1, "e": "I: a/b = 5/3 ⇒ a : b = 5 : 3. II alone gives only the sum.<br><b>Statement I alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "How many students are there in the class?<br>I. Rahul is 12th from the top and 18th from the bottom.<br>II. Rahul is 12th from the top and there are 17 students below him.", "o": ["Either I or II alone is sufficient", "Statement I alone is sufficient", "Even I and II together are not sufficient", "Both I and II together are needed"], "a": 0, "e": "I: 12 + 18 − 1 = 29. II: 11 above + Rahul + 17 below = 29.<br><b>Either I or II alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "What is Sohan's present age?<br>I. Five years ago, Sohan was 12 years old.<br>II. Sohan is 4 years older than Mohan.", "o": ["Even I and II together are not sufficient", "Statement II alone is sufficient", "Both I and II together are needed", "Statement I alone is sufficient"], "a": 3, "e": "I: present age = 12 + 5 = 17 years. II only links Sohan with Mohan, whose age is unknown.<br><b>Statement I alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "C", "t": "Number Analogy", "q": "Select the number that will replace the question mark: 6 : 222 :: 7 : ?", "o": ["336", "357", "350", "343"], "a": 2, "e": "Rule: n³ + n ⇒ 6³ + 6 = 222 ⇒ 7³ + 7 = 343 + 7 = <b>350</b>.", "f": null, "p": null}, {"s": "C", "t": "Letter Analogy", "q": "ACEG : ZXVT :: BDFH : ?", "o": ["YXUS", "XWUS", "YWUS", "YWVS"], "a": 2, "e": "Each letter is replaced by its opposite letter (A↔Z, C↔X, E↔V, G↔T).<br>B↔Y, D↔W, F↔U, H↔S ⇒ <b>YWUS</b>.", "f": null, "p": null}, {"s": "C", "t": "Word Analogy", "q": "Odometer : Distance :: Hygrometer : ?", "o": ["Pressure", "Temperature", "Humidity", "Altitude"], "a": 2, "e": "An odometer measures distance; a hygrometer measures <b>humidity</b>.", "f": null, "p": null}, {"s": "C", "t": "Classification", "q": "Find the odd one out: 13, 17, 23, 29, 33, 37", "o": ["23", "33", "29", "17"], "a": 1, "e": "All the others are prime numbers; <b>33</b> = 3 × 11 is not.", "f": null, "p": null}, {"s": "C", "t": "Classification", "q": "Find the odd one out: BDF, HJL, NPR, TVY", "o": ["HJL", "NPR", "BDF", "TVY"], "a": 3, "e": "BDF, HJL and NPR skip one letter each time (+2, +2). In <b>TVY</b> the gaps are +2, +3.", "f": null, "p": null}, {"s": "C", "t": "Coding–Decoding", "q": "If MONDAY is coded as NPOEBZ, how will FRIDAY be coded?", "o": ["GSJEBZ", "GSJEAZ", "GTJEBZ", "FSJEBZ"], "a": 0, "e": "Each letter moves one step forward (M→N, O→P …) ⇒ F→G, R→S, I→J, D→E, A→B, Y→Z = <b>GSJEBZ</b>.", "f": null, "p": null}, {"s": "C", "t": "Coding–Decoding", "q": "In a certain code, TEACHER is written as VGCEJGT. How will SCHOOL be written in that code?", "o": ["TEJQQN", "UEJQPN", "UEIQQN", "UEJQQN"], "a": 3, "e": "Each letter moves two steps forward (T→V, E→G …) ⇒ S→U, C→E, H→J, O→Q, O→Q, L→N = <b>UEJQQN</b>.", "f": null, "p": null}, {"s": "C", "t": "Blood Relations", "q": "P is the son of Q. Q is the daughter of R. R is the husband of S. How is S related to P?", "o": ["Mother", "Great-grandmother", "Aunt", "Grandmother"], "a": 3, "e": "R and S are husband and wife, and Q is their daughter ⇒ S is Q's mother ⇒ S is P's <b>grandmother</b> (maternal).", "f": null, "p": null}, {"s": "C", "t": "Blood Relations", "q": "Introducing a man, Neha said, \"His wife is the only daughter of my father.\" How is the man related to Neha?", "o": ["Brother-in-law", "Husband", "Father-in-law", "Brother"], "a": 1, "e": "The only daughter of Neha's father is Neha herself. The man's wife is Neha ⇒ he is Neha's <b>husband</b>.", "f": null, "p": null}, {"s": "C", "t": "Direction Sense", "q": "Starting from point A, Rahul walks 5 km South, then 3 km West, then 9 km North and finally 3 km East. How far and in which direction is he from A?", "o": ["4 km South", "14 km North", "6 km North", "4 km North"], "a": 3, "e": "South 5 and North 9 ⇒ 4 km North; West 3 and East 3 cancel ⇒ <b>4 km North</b> of A.", "f": null, "p": null}, {"s": "C", "t": "Direction Sense", "q": "One evening, Gita was walking along a road with the Sun directly behind her. In which direction was she walking?", "o": ["South", "West", "North", "East"], "a": 3, "e": "In the evening the Sun is in the West. If the Sun is behind her, she is facing and walking towards the <b>East</b>.", "f": null, "p": null}, {"s": "C", "t": "Ranking", "q": "In a class of 45 students, Sita is 16th from the top. What is her rank from the bottom?", "o": ["28th", "31st", "30th", "29th"], "a": 2, "e": "Rank from bottom = 45 − 16 + 1 = <b>30th</b>.", "f": null, "p": null}, {"s": "C", "t": "Ranking", "q": "In a queue of 48 people, Amit is 14th from the front and Raj is 17th from the end. Mona stands exactly midway between Amit and Raj. What is Mona's position from the front?", "o": ["22nd", "23rd", "24th", "25th"], "a": 1, "e": "Raj from the front = 48 − 17 + 1 = 32nd. Midway between 14th and 32nd = (14 + 32)/2 = <b>23rd</b>.", "f": null, "p": null}, {"s": "C", "t": "Seating Arrangement", "q": "Five persons A, B, C, D and E sit in a row facing North. C sits in the middle. A sits at the extreme left. B sits to the immediate right of C. E does not sit next to A. Who sits second from the left?", "o": ["D", "B", "C", "E"], "a": 0, "e": "A = 1, C = 3, B = 4. D and E take seats 2 and 5. E is not next to A ⇒ E = 5 ⇒ D = 2 ⇒ second from the left is <b>D</b>.", "f": null, "p": null}, {"s": "C", "t": "Syllogism", "q": "Statements: Some kites are birds. Some birds are crows.<br>Conclusions: I. Some kites are crows. &nbsp;II. No kite is a crow.", "o": ["Neither I nor II follows", "Only II follows", "Either I or II follows", "Only I follows"], "a": 2, "e": "Neither conclusion follows on its own, but I and II form a complementary pair about the same two terms (one must be true) ⇒ <b>either I or II follows</b>.", "f": null, "p": null}, {"s": "C", "t": "Syllogism", "q": "Statements: No apple is a mango. Some mangoes are bananas.<br>Conclusions: I. Some bananas are not apples. &nbsp;II. No banana is an apple.", "o": ["Neither I nor II follows", "Only II follows", "Only I follows", "Either I or II follows"], "a": 2, "e": "The bananas that are mangoes can never be apples ⇒ I follows. Other bananas may be apples ⇒ II does not follow ⇒ <b>only I follows</b>.", "f": null, "p": null}, {"s": "C", "t": "Number Series", "q": "Find the next term: 7, 11, 19, 35, 67, ?", "o": ["135", "127", "129", "131"], "a": 3, "e": "Differences: 4, 8, 16, 32 ⇒ next 64 ⇒ 67 + 64 = <b>131</b>.", "f": null, "p": null}, {"s": "C", "t": "Letter Series", "q": "Find the next term: Z, X, U, Q, L, ?", "o": ["E", "H", "F", "G"], "a": 2, "e": "Steps back: −2, −3, −4, −5 ⇒ next −6 ⇒ L (12) − 6 = 6 = <b>F</b>.", "f": null, "p": null}, {"s": "C", "t": "Alpha-numeric Series", "q": "Find the next term: KM5, IP8, GS11, EV14, ?", "o": ["CY17", "CX17", "DY17", "CY16"], "a": 0, "e": "First letters −2 (K, I, G, E → C); second letters +3 (M, P, S, V → Y); numbers +3 (… 14 → 17) ⇒ <b>CY17</b>.", "f": null, "p": null}, {"s": "C", "t": "Calendar", "q": "Today is Wednesday. What day of the week will it be after 65 days?", "o": ["Saturday", "Friday", "Thursday", "Tuesday"], "a": 1, "e": "65 = 7 × 9 + 2 ⇒ 2 odd days ⇒ Wednesday + 2 = <b>Friday</b>.", "f": null, "p": null}, {"s": "C", "t": "Calendar", "q": "On what day of the week was 2 October 1869 (the birth date of Mahatma Gandhi)?", "o": ["Monday", "Saturday", "Sunday", "Thursday"], "a": 1, "e": "Odd days: 1600 years → 0; 1601–1800 → 200 years = 3; 1801–1868 → 68 years with 17 leap years = 85 ≡ 1; 1869 up to 2 Oct = 275 days ≡ 2.<br>Total 3 + 1 + 2 = 6 odd days (0 = Sunday … 6 = Saturday) ⇒ <b>Saturday</b>.", "f": null, "p": null}, {"s": "C", "t": "Clock", "q": "What is the angle between the hour and minute hands of a clock at 2:30?", "o": ["105°", "115°", "120°", "95°"], "a": 0, "e": "θ = |30 × 2 − 5.5 × 30| = |60 − 165| = <b>105°</b>.", "f": null, "p": null}, {"s": "C", "t": "Clock", "q": "At what time between 2 and 3 o'clock will the hands of a clock be at right angles for the first time?", "o": ["26 4/11 minutes past 2", "27 3/11 minutes past 2", "25 minutes past 2", "28 2/11 minutes past 2"], "a": 1, "e": "5.5m − 60 = 90 ⇒ m = 150/5.5 = 300/11 = <b>27 3/11 minutes past 2</b>.", "f": null, "p": null}, {"s": "C", "t": "Inequality", "q": "If P &gt; Q ≥ R = S &lt; T, which of the following is definitely true?", "o": ["Q &gt; S", "P &gt; S", "T &gt; Q", "R &lt; Q"], "a": 1, "e": "P &gt; Q ≥ R = S ⇒ <b>P &gt; S</b> is certain. Q may equal S, and T cannot be compared with Q.", "f": null, "p": null}, {"s": "C", "t": "Venn Diagram", "q": "Which option best describes the relationship among Doctors, Women and Mothers?", "o": ["Women lie inside Mothers; Doctors overlap both", "Mothers lie inside Women; Doctors overlap both", "Doctors lie inside Mothers, which lie inside Women", "All three are completely separate"], "a": 1, "e": "Every mother is a woman, so Mothers lie inside Women. Some doctors are women and some are mothers, but not all ⇒ Doctors <b>partly overlap both</b>.", "f": null, "p": null}, {"s": "C", "t": "Mathematical Operations", "q": "If 'A' means '+', 'B' means '−', 'C' means '×' and 'D' means '÷', what is the value of 18 C 4 D 6 A 7 B 5?", "o": ["10", "14", "12", "16"], "a": 1, "e": "18 × 4 ÷ 6 + 7 − 5 = 72 ÷ 6 + 2 = 12 + 2 = <b>14</b>.", "f": null, "p": null}, {"s": "C", "t": "Missing Number", "q": "Find the missing number:<br>Row 1: 3, 4, 25<br>Row 2: 6, 8, 100<br>Row 3: 5, 12, ?", "o": ["169", "289", "170", "144"], "a": 0, "e": "Third number = (first)² + (second)²: 9 + 16 = 25; 36 + 64 = 100 ⇒ 25 + 144 = <b>169</b>.", "f": null, "p": null}, {"s": "C", "t": "Statement & Conclusion", "q": "Statement: \"All candidates must bring their admit card to the examination hall; no candidate will be allowed to enter without it.\"<br>Conclusions: I. A candidate without an admit card cannot enter the hall. &nbsp;II. The admit card is the only document needed for entry.", "o": ["Only II follows", "Neither I nor II follows", "Both I and II follow", "Only I follows"], "a": 3, "e": "I restates the rule. The statement does not say that no other document is required ⇒ <b>only I follows</b>.", "f": null, "p": null}, {"s": "C", "t": "Alphabet Test", "q": "If the letters of the word ODISHA are arranged in alphabetical order, how many letters will remain in the same position?", "o": ["1", "2", "3", "0"], "a": 0, "e": "ODISHA → ADHIOS. Comparing position by position (O/A, D/D, I/H, S/I, H/O, A/S), only <b>D</b> stays in place ⇒ <b>1</b>.", "f": null, "p": null}, {"s": "C", "t": "Word Formation", "q": "Which of the following words cannot be formed using the letters of the word REPUBLIC?", "o": ["BLUE", "PURE", "PUBLIC", "CIRCLE"], "a": 3, "e": "REPUBLIC has only one 'C', but <b>CIRCLE</b> needs two. PUBLIC, PURE and BLUE can be formed.", "f": null, "p": null}, {"s": "C", "t": "Cube & Cuboid", "q": "A cube is painted red on two opposite faces and blue on the remaining four faces. It is then cut into 64 equal smaller cubes. How many small cubes have only red paint on them?", "o": ["8", "24", "16", "4"], "a": 0, "e": "n = 4. On each red face, the inner (n − 2)² = 4 cubes are painted only red (edge cubes also touch a blue face).<br>2 red faces × 4 = <b>8</b>.", "f": null, "p": null}, {"s": "C", "t": "Order & Ranking", "q": "Five persons P, Q, R, S and T are of different heights. Q is taller than P but shorter than T. R is the shortest. S is taller than T. Who is the tallest?", "o": ["Q", "P", "S", "T"], "a": 2, "e": "S &gt; T &gt; Q &gt; P &gt; R ⇒ the tallest is <b>S</b>.", "f": null, "p": null}, {"s": "C", "t": "Mirror Image (Non-verbal)", "q": "Choose the correct mirror image of the given figure when the mirror is placed on the right side (MN).", "o": ["@W", "@P", "@M", "@R"], "a": 2, "e": "A mirror on the right interchanges left and right: the order of the characters is reversed and each character is laterally inverted, while top and bottom stay the same.", "f": {"kind": "mirror", "text": "GES 2027"}, "p": null}, {"s": "C", "t": "Counting Figures (Non-verbal)", "q": "How many triangles are there in the given figure?", "o": ["14", "10", "12", "9"], "a": 2, "e": "Every triangle has its top vertex at the apex. Four lines start from the apex, giving C(4, 2) = 6 triangles on each horizontal line.<br>There are 2 horizontal lines (the middle line and the base) ⇒ 6 × 2 = <b>12</b>.", "f": {"kind": "img", "id": "tri3"}, "p": null}, {"s": "C", "t": "Figure Series (Non-verbal)", "q": "Select the figure that will come next in the series of problem figures.", "o": ["(1)", "(2)", "(3)", "(4)"], "a": 0, "e": "The hand turns 90° anticlockwise each step (up → left → down → right → <b>up</b>), and the number of small dots increases by one each step (1, 2, 3, 4 → <b>5</b>).<br>So the next figure has the hand pointing up with five dots ⇒ figure <b>(1)</b>.", "f": {"kind": "img", "id": "series3"}, "p": null}, {"s": "D", "t": "Science 2026", "q": "Vikram-1, which became India's first privately built rocket to reach orbit in July 2026, was developed by:", "o": ["Agnikul Cosmos", "Skyroot Aerospace", "Bellatrix Aerospace", "Dhruva Space"], "a": 1, "e": "Hyderabad-based <b>Skyroot Aerospace</b> launched Vikram-1 from Sriharikota on 18 July 2026. Its sub-orbital Vikram-S had flown in 2022.", "f": null, "p": null}, {"s": "D", "t": "Appointments 2026", "q": "In 2026, Varsha Ashok Aglawe became the first woman to head which organisation in its 176-year history?", "o": ["Archaeological Survey of India", "Survey of India", "India Meteorological Department", "Geological Survey of India"], "a": 3, "e": "She became the Director General of the <b>Geological Survey of India</b> (set up in 1851) — its first woman head.", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "The 'Bharat Maritime Insurance Pool', launched by the Department of Financial Services in July 2026, offers India's first sovereign-backed:", "o": ["Protection & Indemnity (P&I) cover for ships", "Crop insurance for coastal farmers", "Export credit guarantee for shipbuilders", "Health insurance cover for seafarers and their families"], "a": 0, "e": "BMIP launched India's first sovereign-backed <b>Protection &amp; Indemnity (P&amp;I)</b> product for ships, reducing dependence on foreign P&amp;I clubs.", "f": null, "p": null}, {"s": "D", "t": "Awards 2026", "q": "Who won the Booker Prize 2026 for 'The End of Everything', becoming the first science-fiction writer to win the prize?", "o": ["Kiran Desai", "David Szalay", "M. John Harrison", "Bernardine Evaristo"], "a": 2, "e": "British writer <b>M. John Harrison</b> won on 10 November 2026. (David Szalay won in 2025 for 'Flesh'.)", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "The 16th Finance Commission, chaired by Arvind Panagariya, recommended what share for the States in the divisible pool of central taxes for 2026–31?", "o": ["40%", "42%", "41%", "45%"], "a": 2, "e": "The report, tabled on 1 February 2026, kept the States' share at <b>41%</b> for the five years from 1 April 2026.", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "'Samudra Manthan', approved by the Union Cabinet in July 2026 with an outlay of ₹84,084 crore, is a national scheme for:", "o": ["Deep-sea fishing harbours", "Offshore oil and gas exploration", "Coastal tourism circuits", "Ocean thermal energy conversion plants"], "a": 1, "e": "Samudra Manthan is the National <b>Offshore Exploration</b> Scheme of the Petroleum Ministry, including support for deep-water exploration wells.", "f": null, "p": null}, {"s": "D", "t": "Environment 2026", "q": "Glaw Lake, designated in August 2026 as India's 101st Ramsar site, is the first Ramsar site of which State/UT?", "o": ["Meghalaya", "Arunachal Pradesh", "Jammu and Kashmir", "Sikkim"], "a": 1, "e": "Glaw Lake lies in Lohit district, inside the Kamlang Tiger Reserve, <b>Arunachal Pradesh</b>.", "f": null, "p": null}, {"s": "D", "t": "Art & Culture 2026", "q": "Pithora painting, the ritual wall art of the Rathwa tribe that received a GI tag in 2026, belongs to which State?", "o": ["Chhattisgarh", "Odisha", "Madhya Pradesh", "Gujarat"], "a": 3, "e": "Pithora painting of <b>Gujarat</b> is made by the Rathwa, Bhil and Bhilala communities.", "f": null, "p": null}, {"s": "D", "t": "Science 2026", "q": "NVS-03, launched by GSLV-F18 from Sriharikota in October 2026, strengthens which Indian system?", "o": ["Mobile satellite communication", "NavIC navigation", "Earth observation (RISAT)", "Weather forecasting (INSAT)"], "a": 1, "e": "NVS-03 is a <b>NavIC</b> (Navigation with Indian Constellation) satellite carrying an indigenously developed atomic clock.", "f": null, "p": null}, {"s": "D", "t": "Science 2026", "q": "Pioxaniliprole, unveiled in 2026 by PI Industries, is India's first indigenously discovered:", "o": ["Biofertiliser strain", "Antibiotic drug", "Malaria vaccine", "Insecticide molecule"], "a": 3, "e": "It is India's first home-discovered <b>insecticide molecule</b>, to be sold for crops from Rabi 2026-27.", "f": null, "p": null}, {"s": "D", "t": "Environment 2026", "q": "In October 2026, which was declared India's first 100% organic Union Territory?", "o": ["Lakshadweep", "Ladakh", "Andaman & Nicobar Islands", "Puducherry"], "a": 1, "e": "<b>Ladakh</b> was declared fully organic after banning chemical fertilisers; Sikkim became India's first organic State in 2016.", "f": null, "p": null}, {"s": "D", "t": "Reports 2026", "q": "In the World Justice Project (WJP) Rule of Law Index 2026, India was ranked:", "o": ["88th", "79th", "95th", "86th"], "a": 0, "e": "India ranked <b>88th</b> of 143 countries (86th in 2025); Denmark was first.", "f": null, "p": null}, {"s": "D", "t": "Banking 2026", "q": "The 'Favara–UPI' cross-border payment corridor, which went live in July 2026, links India with:", "o": ["Sri Lanka", "Mauritius", "Nepal", "Maldives"], "a": 3, "e": "Favara is the instant payment system of the <b>Maldives</b>; the corridor allows real-time remittances to India through UPI.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "Who became India's 100th chess Grandmaster in November 2026, also the first Grandmaster from Madhya Pradesh?", "o": ["Aswath S.", "Anuj Shrivatri", "Pranesh M.", "V. S. Rathanvel"], "a": 1, "e": "<b>Anuj Shrivatri</b> earned the title by winning the ASEAN Plus Individual Open in the Philippines. V. S. Rathanvel was the 99th GM.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "India won the SAFF Women's Championship 2026 (a record sixth title) by defeating which team in the final?", "o": ["Bangladesh", "Nepal", "Bhutan", "Afghanistan"], "a": 0, "e": "India beat <b>Bangladesh</b> 3–1 in June 2026, ending a seven-year wait for the title.", "f": null, "p": null}, {"s": "D", "t": "Polity 2026", "q": "In August 2026, Parliament passed a Bill raising the sanctioned strength of the Supreme Court, including the Chief Justice of India, from 34 to:", "o": ["35", "40", "38", "36"], "a": 2, "e": "Strength rose to <b>38</b> (37 judges + the CJI), replacing an ordinance of May 2026.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "In August 2026, India successfully test-fired the Agni-4 ballistic missile from the Integrated Test Range at:", "o": ["Sriharikota, Andhra Pradesh", "Pokhran, Rajasthan", "Thumba, Kerala", "Chandipur, Odisha"], "a": 3, "e": "The nuclear-capable Agni-4 was test-fired from the ITR, <b>Chandipur (Balasore), Odisha</b> on 6 August 2026.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "Famed Nepali mountaineer Nirmal 'Nimsdai' Purja died in an avalanche in 2026 on which peak?", "o": ["Nanga Parbat", "Broad Peak", "Annapurna", "K2"], "a": 1, "e": "He died on <b>Broad Peak</b> (Pakistan). In 2019 he had climbed all 14 eight-thousanders in about six months.", "f": null, "p": null}, {"s": "D", "t": "Banking 2026", "q": "In June 2026, UPI payments were launched in Cambodia through a partnership between NPCI International and:", "o": ["ABA Bank", "ACLEDA Bank", "Wing Bank", "Canadia Bank"], "a": 1, "e": "NPCI International partnered with <b>ACLEDA Bank</b>, letting Indian travellers pay at Cambodian QR codes through UPI apps.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "INS Dunagiri, commissioned at Kolkata in June 2026, is a:", "o": ["Survey Vessel (Large)", "Anti-submarine shallow water craft", "Scorpene-class submarine", "Project 17A stealth frigate"], "a": 3, "e": "INS Dunagiri is a <b>Project 17A (Nilgiri-class) stealth guided-missile frigate</b> built by GRSE, commissioned along with INS Sanshodhak and INS Agray.", "f": null, "p": null}, {"s": "D", "t": "Health 2026", "q": "'Ayushman Sarathi', launched by the Union Health Ministry on 29 June 2026, is a:", "o": ["WhatsApp chatbot for PM-JAY services", "Mobile clinic van for rural areas", "Helpline for mental-health counselling", "Drone service to deliver medicines"], "a": 0, "e": "Developed by the National Health Authority, it is a <b>WhatsApp chatbot</b> for Ayushman card, eligibility and hospital services under PM-JAY.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "Who won the men's singles title at the Commonwealth Table Tennis Championships 2026 held in New Delhi?", "o": ["Ankur Bhattacharjee", "Manav Thakkar", "Achanta Sharath Kamal", "Harmeet Desai"], "a": 0, "e": "<b>Ankur Bhattacharjee</b> beat Payas Jain 4–3 in the final of the 22nd Commonwealth TT Championships; Yashaswini Ghorpade won the women's title.", "f": null, "p": null}, {"s": "D", "t": "Science 2026", "q": "'VISTA', India's first indigenous stratospheric super-pressure balloon (2026), was developed by which start-up?", "o": ["Red Balloon Aerospace", "Ananth Technologies Ltd", "Agnikul Cosmos", "Digantara"], "a": 0, "e": "Vijayawada-based <b>Red Balloon Aerospace</b> flew VISTA to about 25 km, for uses such as telecom relay and disaster monitoring.", "f": null, "p": null}, {"s": "D", "t": "Banking 2026", "q": "'Mission SAKSHAM', launched by the RBI in April 2026, is a capacity-building programme for:", "o": ["Urban Co-operative Banks", "Payments Banks", "Regional Rural Banks", "Non-banking finance companies (NBFCs)"], "a": 0, "e": "Launched by Governor Sanjay Malhotra, it aims to train about 1.4 lakh staff and directors of <b>Urban Co-operative Banks</b>.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "RIMPAC 2026, the world's largest multinational maritime exercise in which the Indian Navy's P-8I aircraft took part, was hosted by the USA around:", "o": ["Alaska", "Guam", "Hawaii", "San Diego"], "a": 2, "e": "RIMPAC (Rim of the Pacific) is held around <b>Hawaii</b>; the P-8I operated from Joint Base Pearl Harbor-Hickam.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "Pseudolaguvia khairii, a new catfish species reported in 2026, was discovered in which river of Odisha's Mayurbhanj district?", "o": ["Subarnarekha", "Salandi", "Budhabalanga", "Baitarani"], "a": 2, "e": "It was found in the <b>Budhabalanga</b> river and named after Khairi, the famous tigress of Similipal.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "SAREX-26, the national maritime search-and-rescue exercise led by the Indian Coast Guard in October 2026, was held off:", "o": ["Paradip", "Puri", "Dhamra", "Gopalpur"], "a": 0, "e": "SAREX-26 was conducted off the <b>Paradip</b> coast with ships, aircraft and foreign observers.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "Which city hosted the 13th BRICS Education Ministers' Meeting in August 2026 under India's BRICS chairship?", "o": ["Visakhapatnam", "Cuttack", "Puri", "Bhubaneswar"], "a": 3, "e": "The meeting was held in <b>Bhubaneswar</b> from 5 to 7 August 2026.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "In July 2026, Odisha signed a tripartite agreement with Digital Bharat Nidhi and BSNL under the amended BharatNet programme (about ₹3,384 crore) to provide:", "o": ["Solar power to tribal hostels", "Free smartphones to women self-help group members", "4G towers along national highways", "High-speed broadband to about 50,000 villages"], "a": 3, "e": "The project will take <b>high-speed broadband</b> to gram panchayats and about 50,000 villages of Odisha.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "In July 2026, Odisha signed an MoU for an integrated aluminium project worth about ₹1.10 lakh crore with Adani Enterprises and which UAE-based group?", "o": ["ADNOC Group", "International Holding Company", "Mubadala Investment Company", "Emirates Global Aluminium (EGA)"], "a": 1, "e": "Adani and Abu Dhabi's <b>International Holding Company (IHC)</b>, through its unit IRH, will form a 50:50 joint venture for mining, refining and smelting.", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "In MS Word, which shortcut makes the selected text subscript (as in H₂O)?", "o": ["Ctrl + Shift + =", "Ctrl + =", "Ctrl + I", "Ctrl + U"], "a": 1, "e": "<b>Ctrl + =</b> applies subscript; Ctrl + Shift + = applies superscript; Ctrl + U underlines; Ctrl + I italicises.", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "In MS Word, an automatic 'Table of Contents' is inserted from which tab?", "o": ["Home (Styles)", "Insert", "Layout", "References"], "a": 3, "e": "<b>References</b> → Table of Contents (built from the heading styles).", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "In MS Word, pressing Ctrl + Enter inserts a:", "o": ["Page break", "Section break", "Text-wrapping break", "Column break"], "a": 0, "e": "<b>Ctrl + Enter</b> inserts a page break; Ctrl + Shift + Enter inserts a column break.", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "In MS Word (recent versions), the 'Watermark' option is found in which tab?", "o": ["Home", "Layout", "Insert", "Design"], "a": 3, "e": "<b>Design</b> → Page Background → Watermark.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "In MS Excel, the function COUNTA counts the number of:", "o": ["Non-empty cells", "Cells meeting a condition", "Cells with numbers only", "Empty (blank) cells"], "a": 0, "e": "<b>COUNTA</b> counts non-empty cells; COUNT counts numbers; COUNTBLANK counts empty cells; COUNTIF counts cells meeting a condition.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "What will =AVERAGE(4, 8, 12) return in MS Excel?", "o": ["4", "8", "24", "12"], "a": 1, "e": "(4 + 8 + 12) ÷ 3 = 24 ÷ 3 = <b>8</b>.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "What will =POWER(2, 5) return in MS Excel?", "o": ["25", "10", "32", "7"], "a": 2, "e": "POWER(2, 5) = 2⁵ = <b>32</b>.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "In MS Excel, what does pressing F4 do while a cell reference is selected in the formula bar?", "o": ["Inserts a new worksheet", "Opens the Find and Replace dialog box", "Checks spelling", "Toggles relative/absolute reference"], "a": 3, "e": "F4 cycles the reference through A1 → <b>$A$1 → A$1 → $A1</b>, i.e. it toggles between relative and absolute references.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "Which chart is best suited to show the share of each part in a whole (for example, a family budget)?", "o": ["Pie chart", "Stock chart", "Line chart", "Scatter chart"], "a": 0, "e": "A <b>pie chart</b> shows each category as a share of the total.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "What will =LEN(\"OSSC CGL\") return in MS Excel?", "o": ["8", "9", "7", "6"], "a": 0, "e": "LEN counts all characters including the space: O-S-S-C (4) + space (1) + C-G-L (3) = <b>8</b>.", "f": null, "p": null}, {"s": "E", "t": "MS PowerPoint", "q": "In MS PowerPoint, which key starts the slide show from the first slide?", "o": ["Shift + F5", "F7", "Ctrl + F5", "F5"], "a": 3, "e": "<b>F5</b> starts from the beginning; Shift + F5 starts from the current slide; F7 checks spelling.", "f": null, "p": null}, {"s": "E", "t": "MS PowerPoint", "q": "In MS PowerPoint, 'Slide Master' is opened from which tab?", "o": ["Home", "Insert", "View", "Design"], "a": 2, "e": "<b>View</b> → Master Views → Slide Master.", "f": null, "p": null}, {"s": "E", "t": "MS Access", "q": "In MS Access, which view is used to change the structure of a table (field names and data types)?", "o": ["Print Preview", "Design View", "Layout View", "Datasheet View"], "a": 1, "e": "<b>Design View</b> is used to add fields and set data types and properties; Datasheet View shows the records.", "f": null, "p": null}, {"s": "E", "t": "MS Access", "q": "Which MS Access object is mainly used to present data in a printable, formatted layout?", "o": ["Report", "Module", "Query", "Form"], "a": 0, "e": "A <b>Report</b> is designed for printing and summarising data; forms are for data entry, queries for retrieval.", "f": null, "p": null}, {"s": "E", "t": "Internet", "q": "What does HTTP stand for?", "o": ["Hyperlink Text Transfer Protocol", "High Text Transfer Program", "HyperText Transfer Protocol", "HyperText Transmission Process"], "a": 2, "e": "<b>HTTP</b> = HyperText Transfer Protocol, used to transfer web pages.", "f": null, "p": null}, {"s": "E", "t": "Networking", "q": "Which device forwards data packets between different networks, such as a home network and the Internet?", "o": ["Repeater", "Modem cable", "Hub", "Router"], "a": 3, "e": "A <b>router</b> forwards packets between networks using IP addresses.", "f": null, "p": null}, {"s": "E", "t": "E-mail", "q": "In e-mail, the full form of 'BCC' is:", "o": ["Back Carbon Copy", "Blind Carbon Copy", "Basic Copy Cc", "Blank Carbon Copy"], "a": 1, "e": "<b>Blind Carbon Copy</b> — recipients in BCC are hidden from the other recipients.", "f": null, "p": null}, {"s": "E", "t": "Cyber Security", "q": "Sending fake e-mails that look genuine in order to steal passwords or bank details is called:", "o": ["Phishing", "Spoofing of IP", "Hacking", "Spamming"], "a": 0, "e": "<b>Phishing</b> tricks users into revealing sensitive information through fake e-mails or websites.", "f": null, "p": null}, {"s": "E", "t": "File Types", "q": "Which of the following file extensions indicates a compressed (archive) file?", "o": [".docx", ".jpg", ".html", ".zip"], "a": 3, "e": "<b>.zip</b> files hold one or more compressed files; .docx is a Word document, .jpg an image and .html a web page.", "f": null, "p": null}, {"s": "E", "t": "Windows", "q": "In Windows, pressing Windows key + L:", "o": ["Opens File Explorer", "Shows the desktop", "Opens Settings", "Locks the computer"], "a": 3, "e": "<b>Win + L</b> locks the screen; Win + E opens File Explorer; Win + D shows the desktop; Win + I opens Settings.", "f": null, "p": null}], "passages": {"P1": "<div class=\"ptitle\">Directions (Q.36–40)</div><div>Read the information carefully and answer the questions.<br>A college has <b>1,200 students</b> in five streams. Science has 30% of the students, Commerce 25%, Arts 20%, Computer Applications 15% and Vocational the rest. The ratio of boys to girls is 3 : 1 in Science, 5 : 1 in Commerce, 1 : 1 in Arts, 2 : 1 in Computer Applications and 1 : 2 in Vocational.</div>", "P2": "<div class=\"ptitle\">Directions (Q.41–45)</div><div>The table shows the production (in thousand units) of five factories K, L, M, N and O from 2022 to 2025.</div><div class=\"ptbl\"><table><thead><tr><th>Factory</th><th>2022</th><th>2023</th><th>2024</th><th>2025</th></tr></thead><tbody><tr><td>K</td><td>45</td><td>50</td><td>55</td><td>60</td></tr><tr><td>L</td><td>38</td><td>42</td><td>40</td><td>48</td></tr><tr><td>M</td><td>52</td><td>48</td><td>56</td><td>64</td></tr><tr><td>N</td><td>30</td><td>36</td><td>42</td><td>45</td></tr><tr><td>O</td><td>40</td><td>44</td><td>47</td><td>53</td></tr></tbody></table></div>", "P3": "<div class=\"ptitle\">Directions (Q.46–50)</div><div>The pie chart shows how a school spends its <b>annual budget of ₹60 lakh</b> under six heads.</div><img class=\"figimg\" alt=\"Chart for Directions (Q.46–50)\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAsAAAAHZCAYAAACIHo0hAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAQ6wAAEOsBUJTofAAAqplJREFUeJzs3XdcleX/x/HXOWwQBBFUBBcunLj3zm2WZma/rMzMcpSp2TDNHH0rs8zMUamZOXKbe+8tiqICKsoQZO+9zv37AzmJoKKCN3I+z8fDb1/u+7rv8z function patternTable(){
  let rows = SECS.map((s,i)=>{const n=secRange[i][1]-secRange[i][0]+1;return `<tr><td>${s[1]}</td><td class="n">${secRange[i][0]+1}–${secRange[i][1]+1}</td><td class="n">${n}</td><td class="n">${n*EXAM.plus}</td></tr>`}).join("");
  return `<div class="tbl-wrap"><table class="pattern"><thead><tr><th>Section</th><th>Q. Nos.</th><th>Questions</th><th>Marks</th></tr></thead><tbody>${rows}<tr><td><b>Total</b></td><td></td><td class="n"><b>${QS.length}</b></td><td class="n"><b>${QS.length*EXAM.plus}</b></td></tr></tbody></table></div>`;
}
