<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gyana Education Service – OSSC CGLRE (Specialist) 2025 Preliminary Examination – Free Online CBT Mock Test-1 (TCS pattern)">
<title>OSSC CGLRE (Specialist) Prelim – Mock Test-1 | Gyana Education Service</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: TCS iON-style exam console — header strip, question pane left, palette right; light-only by design (mirrors the real exam screen) */
:root{
  --ink:#1b2430; --muted:#5d6b7c; --line:#cfd8e3; --paper:#ffffff; --wash:#eef3f8;
  --brand:#0b4f8a; --brand-2:#1167b1; --brand-ink:#ffffff; --head:#e9eef4;
  --ans:#2e9e3f; --nans:#e2502b; --nv:#e3e6ea; --nv-b:#b9c1cb; --mark:#6a3fb5; --gold:#f4b400;
  --ok:#1f8a3b; --ok-wash:#e5f5e8; --bad:#c8352a; --bad-wash:#fdeceb; --info-wash:#fff8e1;
  --f:Arial, "Helvetica Neue", Helvetica, "Noto Sans", sans-serif;
  color-scheme: light;
}
html,body{height:100%}
#app{height:100%}
body{background:var(--wash);color:var(--ink);font-family:var(--f);font-size:14px;}
*{box-sizing:border-box}
button{font-family:var(--f);cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.screen{min-height:100%;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top brand strip */
.topbar{background:var(--brand);color:var(--brand-ink);padding-block:8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px;border:2px solid var(--gold);flex:none}
.tb-text{min-width:0;flex:1 1 220px}
.tb-org{font-weight:700;letter-spacing:1.2px;font-size:15px}
.tb-exam{font-size:12.5px;opacity:.92}
.tb-right{font-size:12px;text-align:right;opacity:.92}

/* login */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding-block:28px}
.login{display:grid;grid-template-columns:1fr 1fr;max-width:860px;width:100%;background:var(--paper);border:1px solid var(--line);box-shadow:0 2px 10px rgba(11,79,138,.08)}
.login-info{background:var(--head);padding:24px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line)}
.login-info .row{display:flex;gap:8px;font-size:13.5px}
.login-info .k{color:var(--muted);min-width:118px}
.login-info .v{font-weight:700}
.login-form{padding:24px;display:flex;flex-direction:column;gap:12px}
.login-form h2{margin:0 0 4px;font-size:18px;color:var(--brand)}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:9px 10px;border:1px solid var(--nv-b);border-radius:3px;font-size:14px;font-family:var(--f)}
.btn{border:1px solid var(--nv-b);background:var(--paper);color:var(--ink);padding:9px 16px;border-radius:3px;font-size:13.5px}
.btn:hover{background:var(--head)}
.btn-primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff;font-weight:700}
.btn-primary:hover{background:var(--brand)}
.btn-primary:disabled{background:#9db8d3;border-color:#9db8d3;cursor:not-allowed}
.btn-green{background:var(--ans);border-color:var(--ans);color:#fff;font-weight:700}
.btn-green:hover{filter:brightness(.92)}
.note{font-size:12px;color:var(--muted);line-height:1.5}

/* instructions */
.instr{flex:1;padding-block:18px;display:flex;justify-content:center}
.instr-card{background:var(--paper);border:1px solid var(--line);max-width:980px;width:100%;display:flex;flex-direction:column}
.instr-head{background:var(--head);padding:12px 18px;font-weight:700;color:var(--brand);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.instr-body{padding:16px 22px;line-height:1.6;font-size:13.5px;overflow:auto}
.instr-body h3{font-size:14px;margin:14px 0 6px;color:var(--brand)}
.instr-body ol{padding-left:22px;margin:6px 0}
.instr-body li{margin-bottom:5px}
.legend-list{display:grid;gap:8px;margin:8px 0 8px 4px}
.legend-list div{display:flex;align-items:center;gap:10px}
.pattern{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.pattern th,.pattern td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.pattern th{background:var(--head)}
.pattern td.n{text-align:center;font-variant-numeric:tabular-nums}
.instr-foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;flex-direction:column;gap:12px}
.declare{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5}
.declare input{margin-top:3px;width:16px;height:16px;flex:none}
.instr-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* exam */
.exam{height:100%;display:flex;flex-direction:column}
.exam-main{flex:1;display:flex;min-height:0}
.qpane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper);border-right:1px solid var(--line)}
.secbar{display:flex;align-items:center;gap:8px;background:var(--head);border-bottom:1px solid var(--line);padding-block:6px;flex-wrap:wrap}
.secbar .lbl{font-weight:700;font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.tab{border:1px solid var(--nv-b);background:var(--paper);padding:6px 10px;font-size:12.5px;border-radius:3px 3px 0 0;color:var(--brand)}
.tab.on{background:var(--brand-2);color:#fff;border-color:var(--brand-2);font-weight:700}
.timer{font-weight:700;font-size:13px;background:var(--paper);border:1px solid var(--nv-b);padding:6px 10px;border-radius:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer b{color:var(--brand)}
.timer.low b{color:var(--bad)}
.qtype{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;padding-block:7px;border-bottom:1px solid var(--line);color:var(--muted)}
.qtype .mk span{color:var(--ok);font-weight:700}
.qtype .mk em{color:var(--bad);font-style:normal;font-weight:700}
.qhead{display:flex;justify-content:space-between;align-items:center;padding-block:9px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.qhead h2{margin:0;font-size:15px}
.qhead .lang{font-size:12px;color:var(--muted)}
.qhead select{font-size:12px;padding:2px 4px}
.qbody{flex:1;overflow:auto;padding-block:14px 20px;min-height:0}
.qtext{font-size:calc(15.5px*var(--fs,1));line-height:1.65;max-width:78ch}
.qtext b{font-weight:700}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px;max-width:78ch}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border:1px solid transparent;border-radius:3px;cursor:pointer;font-size:calc(15px*var(--fs,1));line-height:1.5}
.opt:hover{background:#f3f7fb;border-color:var(--line)}
.opt input{margin-top:4px;width:16px;height:16px;flex:none;accent-color:var(--brand-2)}
.opt.sel{background:#eaf2fb;border-color:#a9c6e6}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--head);padding-block:9px;padding-bottom:max(9px,env(safe-area-inset-bottom,0px))}
.actions .l{display:flex;gap:8px;flex-wrap:wrap}

/* palette */
.palette{width:300px;flex:none;display:flex;flex-direction:column;background:#f7f9fc;min-height:0}
.cand{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.cand svg{width:50px;height:58px;flex:none;border:1px solid var(--line);background:var(--head)}
.cand .nm{font-weight:700;font-size:13.5px;word-break:break-word}
.cand .roll{font-size:12px;color:var(--muted)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:11.5px;line-height:1.25}
.legend .it{display:flex;align-items:center;gap:6px}
.legend .it.wide{grid-column:1/-1}
.pal-sec{background:var(--brand-2);color:#fff;font-weight:700;font-size:12.5px;padding:6px 12px}
.pal-choose{font-size:12px;color:var(--muted);padding:8px 12px 2px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:9px 6px;padding:8px 12px 12px;align-content:start;min-height:0}
.pal-foot{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:var(--head);padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.pal-foot .btn-green{grid-column:1/-1}

/* status shapes */
.st{width:38px;height:33px;display:inline-grid;place-items:center;font-size:12.5px;font-weight:700;position:relative;border:1px solid transparent;font-variant-numeric:tabular-nums;flex:none;padding:0}
.st.sm{width:28px;height:25px;font-size:11px}
.st.nv{background:var(--nv);border-color:var(--nv-b);color:var(--ink);border-radius:3px}
.st.na{background:var(--nans);color:#fff;border-radius:2px 2px 14px 14px / 2px 2px 9px 9px}
.st.an{background:var(--ans);color:#fff;border-radius:14px 14px 2px 2px / 9px 9px 2px 2px}
.st.mk{background:var(--mark);color:#fff;border-radius:50%}
.st.am{background:var(--mark);color:#fff;border-radius:50%}
.st.am::after{content:"";position:absolute;right:-3px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--ans);border:2px solid #fff;box-sizing:border-box}
.st.sm.am::after{width:10px;height:10px;right:-3px;bottom:-2px}
.grid .st{justify-self:center;cursor:pointer}
.grid .st.cur{outline:2px solid var(--gold);outline-offset:2px}

/* figures */
.fig{margin:14px 0 4px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.word{font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:30px;letter-spacing:2px;color:#13294b;padding:6px 14px;border:1px dashed var(--nv-b);background:#fff}
.mirror-line{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:2px}
.mirror-line i{display:block;width:4px;height:58px;background:linear-gradient(#6aa3db,#2b6cb0)}
.water-wrap{display:flex;flex-direction:column;gap:3px}
.water-line{height:5px;background:repeating-linear-gradient(90deg,#4a90d9 0 10px,#9cc5ef 10px 20px);border-radius:3px}
.optfig{display:inline-block;font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:22px;letter-spacing:2px;color:#13294b}
.optfig.M{transform:scaleX(-1)} .optfig.W{transform:scaleY(-1)} .optfig.R{transform:rotate(180deg)}
.dice{display:flex;gap:26px;flex-wrap:wrap}
.dice figure{margin:0;text-align:center;font-size:12px;color:var(--muted)}
.dice svg{width:120px;height:120px;display:block}

.figimg{display:block;max-width:100%;height:auto;border:1px solid var(--line);background:#fff;margin:8px 0;cursor:zoom-in}
.zoomwrap{overflow:auto;max-height:75vh}.zoomwrap img{display:block;width:760px;max-width:none;height:auto}
.zhint{font-size:11.5px;color:var(--muted);margin:2px 0 0}
.passage{background:#f6f9fd;border:1px solid #c9d8ea;border-left:4px solid var(--brand-2);padding:10px 12px;margin:0 0 14px;font-size:calc(14px*var(--fs,1));line-height:1.6;max-width:78ch}
.passage summary{cursor:pointer;font-weight:700;color:var(--brand)}
.ptitle{font-weight:700;color:var(--brand);margin-bottom:4px}
.ptbl{overflow-x:auto;margin-top:8px}
.ptbl table{border-collapse:collapse;font-size:13.5px;background:#fff;min-width:320px}
.ptbl th,.ptbl td{border:1px solid #b9c7d8;padding:5px 9px;text-align:center}
.ptbl th{background:#e3ecf6}
.ptbl td:first-child{text-align:left;font-weight:700}
.fsz{display:inline-flex;gap:4px;align-items:center;margin-left:8px}
.fsz button{padding:2px 8px;font-size:12px}
.btn-out{border-color:#c8352a;color:#c8352a;font-weight:700}
.btn-out:hover{background:#fdeceb}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,30,50,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--paper);max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal-h{background:var(--brand);color:#fff;padding:10px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-h button{background:transparent;border:0;color:#fff;font-size:20px;line-height:1}
.modal-b{padding:14px 16px;overflow:auto}
.modal-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
.sumtbl{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.sumtbl th,.sumtbl td{border:1px solid var(--line);padding:7px 8px;text-align:center;font-variant-numeric:tabular-nums}
.sumtbl th{background:var(--head);font-size:12px}
.sumtbl td:first-child,.sumtbl th:first-child{text-align:left}
.sumtbl tr.tot td{font-weight:700;background:#f7f9fc}
.qp-item{border-bottom:1px solid var(--line);padding:10px 0;font-size:13.5px;line-height:1.55}
.qp-item .n{font-weight:700;color:var(--brand)}

/* result */
.result{flex:1;padding-block:18px 30px;display:flex;flex-direction:column;align-items:center;gap:16px}
.rcard{background:var(--paper);border:1px solid var(--line);max-width:1000px;width:100%}
.rhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.rhead h2{margin:0;font-size:18px;color:var(--brand)}
.score-row{display:grid;grid-template-columns:auto 1fr;gap:22px;padding:18px;align-items:center}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:30px;display:block;font-variant-numeric:tabular-nums}
.ring .c span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;width:100%}
.stat{border:1px solid var(--line);padding:10px 12px}
.stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.stat.ok .v{color:var(--ok)} .stat.bad .v{color:var(--bad)}
.verdict{margin:0 18px 16px;padding:10px 14px;background:var(--info-wash);border:1px solid #f1d68a;font-size:13.5px;line-height:1.5}
.secbars{padding:4px 18px 18px;display:grid;gap:10px}
.sb{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.sb .bar{height:14px;background:var(--nv);position:relative;overflow:hidden;border-radius:2px}
.sb .bar i{position:absolute;inset:0 auto 0 0;background:var(--brand-2)}
.sb .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center}
.chip{border:1px solid var(--nv-b);background:var(--paper);padding:5px 10px;border-radius:14px;font-size:12.5px}
.chip.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.sol{padding:14px 18px;border-bottom:1px solid var(--line)}
.sol-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.pill{padding:2px 8px;border-radius:10px;font-weight:700;font-size:11.5px}
.pill.ok{background:var(--ok-wash);color:var(--ok)} .pill.bad{background:var(--bad-wash);color:var(--bad)} .pill.skip{background:var(--nv);color:var(--muted)}
.sol .qtext{font-size:14.5px}
.sopts{display:grid;gap:6px;margin:10px 0}
.sopt{padding:7px 10px;border:1px solid var(--line);border-radius:3px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.sopt .L{font-weight:700;color:var(--muted);flex:none}
.sopt.right{background:var(--ok-wash);border-color:#9fd3ac}
.sopt.wrong{background:var(--bad-wash);border-color:#efb1ab}
.sopt .tag{margin-left:auto;font-size:11.5px;font-weight:700;white-space:nowrap}
.sopt.right .tag{color:var(--ok)} .sopt.wrong .tag{color:var(--bad)}
.exp{background:#f4f8fc;border-left:3px solid var(--brand-2);padding:9px 12px;font-size:13.5px;line-height:1.6}
.exp h4{margin:0 0 4px;font-size:12px;letter-spacing:.6px;color:var(--brand);text-transform:uppercase}
.empty{padding:22px 18px;color:var(--muted)}

.palette-toggle{display:none}
.site-foot{flex:none;min-height:64px;display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;background:#0a3f6e;color:#dbe8f6;font-size:12px;padding-block:8px;padding-right:max(210px,env(safe-area-inset-right,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.site-foot b{color:#fff}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff8e1;border:1px solid #f1d68a;color:#5b4300;padding:10px 16px;font-weight:700;font-size:13.5px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.15);max-width:calc(100% - 32px);text-align:center}
.cta{margin:0 18px 16px;padding:12px 14px;border:1px solid #9fc0e3;background:#eef5fc;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:13.5px;line-height:1.5}
.cta a,.ractions a{text-decoration:none}
.btn-wa{background:#1f9d55;border-color:#1f9d55;color:#fff;font-weight:700;display:inline-block}
.btn-wa:hover{filter:brightness(.92)}
.topics{padding:0 18px 18px}
.topics h3{font-size:14px;margin:0 0 8px;color:var(--brand)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid #efb1ab;background:var(--bad-wash);color:#7a1f17;padding:4px 10px;border-radius:12px;font-size:12.5px}
.tchip b{font-variant-numeric:tabular-nums}
.ractions{display:flex;gap:8px;flex-wrap:wrap}
.result{padding-bottom:84px}
@media print{.topbar .tb-right,.site-foot,.ractions,#filters,.cta,#logout,#retake,.toast{display:none!important}body{background:#fff}.rcard{border:0}.sol{break-inside:avoid}}
@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login-info{border-right:0;border-bottom:1px solid var(--line)}
  .palette{position:fixed;top:0;right:0;bottom:0;width:min(320px,88vw);z-index:40;box-shadow:-6px 0 18px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px)}
  .palette.open{transform:none}
  .palette{bottom:64px}
  .site-foot{padding-right:max(170px,env(safe-area-inset-right,0px));font-size:11px}
  .site-foot span:nth-child(2){display:none}
  .palette-toggle{display:inline-block}
  .tb-right{flex:1 1 100%;text-align:left}
  .exam .tb-right{display:none}
  .secbar .lbl{display:none}
  .tabs{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .tab{white-space:nowrap;flex:none}
  .timer{margin-right:auto}
  .score-row{grid-template-columns:1fr;justify-items:center}
  .sb{grid-template-columns:110px 1fr 56px}
  .qtext{font-size:calc(15px*var(--fs,1))}
  .secbar{gap:6px}
  .timer{font-size:12.5px;padding:5px 8px}
}
@media (prefers-reduced-motion:reduce){.palette{transition:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const DATA = {"sections": [["A", "Arithmetic"], ["B", "Data Interpretation"], ["C", "Reasoning & GMA"], ["D", "Current Events"], ["E", "Computer Awareness"]], "qs": [{"s": "A", "t": "LCM & HCF", "q": "What is the least number which, when divided by 12, 15 and 20, leaves a remainder of 7 in each case?", "o": ["60", "127", "73", "67"], "a": 3, "e": "LCM of 12, 15, 20 = 60. Required number = 60 + 7 = <b>67</b>.", "f": null, "p": null}, {"s": "A", "t": "LCM & HCF", "q": "The HCF of two numbers is 12 and their LCM is 360. If one of the numbers is 72, what is the other number?", "o": ["60", "84", "36", "48"], "a": 0, "e": "Product of the numbers = HCF × LCM ⇒ other number = (12 × 360) ÷ 72 = <b>60</b>.", "f": null, "p": null}, {"s": "A", "t": "Approximation", "q": "What approximate value should come in place of ?<br>(√1225 + 4.98 × 12.03) ÷ 4.99 = ?", "o": ["21", "19", "24", "17"], "a": 1, "e": "√1225 = 35; 4.98 × 12.03 ≈ 5 × 12 = 60 ⇒ (35 + 60) ÷ 5 = <b>19</b>.", "f": null, "p": null}, {"s": "A", "t": "Simplification", "q": "Find the value of 0.25 × 0.25 + 0.15 × 0.15 + 2 × 0.25 × 0.15.", "o": ["0.81", "0.4", "0.16", "0.016"], "a": 2, "e": "a² + b² + 2ab = (a + b)² = (0.25 + 0.15)² = 0.4² = <b>0.16</b>.", "f": null, "p": null}, {"s": "A", "t": "Average & Ages", "q": "The average age of a family of 5 members is 24 years. If the youngest member is 8 years old, what was the average age of the family at the time of the birth of the youngest member?", "o": ["22 years", "16 years", "20 years", "18 years"], "a": 2, "e": "Present total = 5 × 24 = 120. Eight years ago the other 4 members together were 120 − 8 − 4 × 8 = 80 years old.<br>Average then = 80 ÷ 4 = <b>20 years</b>.", "f": null, "p": null}, {"s": "A", "t": "Problems on Ages", "q": "Ten years ago, A was half of B in age. If the ratio of their present ages is 3 : 4, what is the sum of their present ages?", "o": ["45 years", "28 years", "35 years", "42 years"], "a": 2, "e": "Let A = 3x, B = 4x ⇒ 3x − 10 = ½(4x − 10) ⇒ 6x − 20 = 4x − 10 ⇒ x = 5.<br>Sum = 7x = <b>35 years</b>.", "f": null, "p": null}, {"s": "A", "t": "Number Series", "q": "Find the next term of the series: 4, 18, 48, 100, 180, ?", "o": ["288", "294", "300", "276"], "a": 1, "e": "Rule: n × (n + 1)² ⇒ 1×4, 2×9, 3×16, 4×25, 5×36.<br>Next = 6 × 49 = <b>294</b>.", "f": null, "p": null}, {"s": "A", "t": "Average", "q": "The average marks of 40 students were found to be 52. Later it was noticed that a mark 84 had been wrongly entered as 48. What is the correct average?", "o": ["52.6", "53.6", "51.1", "52.9"], "a": 3, "e": "Total increases by 84 − 48 = 36 ⇒ average rises by 36 ÷ 40 = 0.9.<br>Correct average = <b>52.9</b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage", "q": "A's income is 40% more than B's income. By what per cent is B's income less than A's income?", "o": ["71 3/7%", "40%", "28 4/7%", "25%"], "a": 2, "e": "Let B = 100 ⇒ A = 140. B is less by 40 on 140 ⇒ 40/140 × 100 = <b>28 4/7%</b>.", "f": null, "p": null}, {"s": "A", "t": "Ratio & Proportion", "q": "₹7,800 is divided among A, B and C such that 2A = 3B = 4C. What is C's share?", "o": ["₹3,600", "₹1,800", "₹2,400", "₹1,950"], "a": 1, "e": "2A = 3B = 4C = k ⇒ A : B : C = 1/2 : 1/3 : 1/4 = 6 : 4 : 3.<br>C = 7,800 × 3/13 = <b>₹1,800</b>.", "f": null, "p": null}, {"s": "A", "t": "Partnership", "q": "A invests ₹30,000 for 8 months, B invests ₹40,000 for 6 months and C invests ₹20,000 for 12 months. Out of a total profit of ₹27,000, what is C's share?", "o": ["₹10,800", "₹9,000", "₹8,000", "₹7,200"], "a": 1, "e": "Capital × months: A = 2,40,000, B = 2,40,000, C = 2,40,000 ⇒ ratio 1 : 1 : 1.<br>C's share = 27,000 ÷ 3 = <b>₹9,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Profit, Loss & Discount", "q": "A shopkeeper allows a discount of 10% on the marked price and still gains 17%. If the cost price of an article is ₹500, what is its marked price?", "o": ["₹600", "₹640", "₹650", "₹585"], "a": 2, "e": "SP = 500 × 1.17 = ₹585 = 90% of MP ⇒ MP = 585 ÷ 0.9 = <b>₹650</b>.", "f": null, "p": null}, {"s": "A", "t": "Profit & Loss", "q": "A man buys oranges at 6 for ₹10 and sells them at 4 for ₹10. What is his gain per cent?", "o": ["33⅓%", "40%", "50%", "60%"], "a": 2, "e": "Take 12 oranges: CP = ₹20, SP = ₹30 ⇒ gain = 10/20 × 100 = <b>50%</b>.", "f": null, "p": null}, {"s": "A", "t": "Simple Interest", "q": "At what rate per cent per annum simple interest will ₹6,000 amount to ₹7,800 in 5 years?", "o": ["7.5%", "5%", "6%", "6.5%"], "a": 2, "e": "SI = 1,800 ⇒ R = (1,800 × 100) ÷ (6,000 × 5) = <b>6%</b>.", "f": null, "p": null}, {"s": "A", "t": "Compound Interest", "q": "A sum of money at compound interest amounts to ₹8,820 in 2 years and ₹9,261 in 3 years. What is the rate of interest per annum?", "o": ["4%", "6%", "5%", "5.5%"], "a": 2, "e": "Interest for the 3rd year on ₹8,820 = 9,261 − 8,820 = 441.<br>Rate = 441/8,820 × 100 = <b>5%</b>.", "f": null, "p": null}, {"s": "A", "t": "CI – SI", "q": "The difference between compound interest and simple interest on a sum for 2 years at 8% per annum is ₹96. What is the sum?", "o": ["₹16,000", "₹14,400", "₹15,000", "₹12,000"], "a": 2, "e": "For 2 years: CI − SI = P(r/100)² ⇒ 96 = P × 0.0064 ⇒ P = <b>₹15,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Time & Work", "q": "A and B together can finish a work in 12 days, B and C in 15 days, and A and C in 20 days. In how many days can A, B and C together finish it?", "o": ["10 days", "8 days", "15 days", "12 days"], "a": 0, "e": "2(A + B + C) = 1/12 + 1/15 + 1/20 = (5 + 4 + 3)/60 = 1/5 ⇒ A + B + C = 1/10.<br>Together: <b>10 days</b>.", "f": null, "p": null}, {"s": "A", "t": "Work & Wages", "q": "A can do a work in 10 days and B in 15 days. With the help of C, they finish it in 5 days and receive ₹3,000. What is C's share?", "o": ["₹750", "₹500", "₹600", "₹1,000"], "a": 1, "e": "C's one-day work = 1/5 − 1/10 − 1/15 = (6 − 3 − 2)/30 = 1/30. C's work in 5 days = 5/30 = 1/6.<br>C's share = 3,000 × 1/6 = <b>₹500</b>.", "f": null, "p": null}, {"s": "A", "t": "Pipes & Cisterns", "q": "Pipe A fills a tank three times as fast as pipe B. Together they fill the tank in 36 minutes. How long would pipe B alone take to fill it?", "o": ["48 min", "120 min", "108 min", "144 min"], "a": 3, "e": "Let B fill 1 unit/min ⇒ A fills 3 units/min. Tank = 4 × 36 = 144 units.<br>B alone = 144 ÷ 1 = <b>144 min</b> (A alone would take 48 min).", "f": null, "p": null}, {"s": "A", "t": "Time & Distance", "q": "If a man travels 3 km/h faster, he takes 40 minutes less to cover a certain distance; if he travels 2 km/h slower, he takes 40 minutes more. What is the distance?", "o": ["30 km", "36 km", "48 km", "40 km"], "a": 3, "e": "d/v − d/(v + 3) = 2/3 and d/(v − 2) − d/v = 2/3 ⇒ 3d/[v(v + 3)] = 2d/[v(v − 2)] ⇒ 3(v − 2) = 2(v + 3) ⇒ v = 12 km/h.<br>d = v(v − 2)/3 = 12 × 10/3 = <b>40 km</b>.", "f": null, "p": null}, {"s": "A", "t": "Trains", "q": "A 150 m long train passes a man walking at 6 km/h in the same direction in 10 seconds. What is the speed of the train?", "o": ["54 km/h", "48 km/h", "66 km/h", "60 km/h"], "a": 3, "e": "Relative speed = 150/10 = 15 m/s = 54 km/h ⇒ train speed = 54 + 6 = <b>60 km/h</b>.", "f": null, "p": null}, {"s": "A", "t": "Boats & Streams", "q": "A boat goes 30 km upstream and 44 km downstream in 10 hours. It also goes 40 km upstream and 55 km downstream in 13 hours. What is the speed of the stream?", "o": ["2.5 km/h", "5 km/h", "3 km/h", "4 km/h"], "a": 2, "e": "Let x = 1/upstream speed, y = 1/downstream speed: 30x + 44y = 10, 40x + 55y = 13 ⇒ y = 1/11, x = 1/5.<br>Upstream 5, downstream 11 ⇒ stream = (11 − 5)/2 = <b>3 km/h</b>.", "f": null, "p": null}, {"s": "A", "t": "Mixture – Replacement", "q": "A vessel contains 40 litres of pure milk. 4 litres of milk are taken out and replaced with water. This process is done once more. How much milk is left in the vessel?", "o": ["36 litres", "31.6 litres", "32.4 litres", "32 litres"], "a": 2, "e": "Milk left = 40 × (1 − 4/40)² = 40 × 0.9 × 0.9 = <b>32.4 litres</b>.", "f": null, "p": null}, {"s": "A", "t": "Alligation", "q": "A trader has 50 kg of sugar. He sells a part at 8% profit and the rest at 18% profit, gaining 14% on the whole. How much sugar did he sell at 18% profit?", "o": ["30 kg", "25 kg", "35 kg", "20 kg"], "a": 0, "e": "Alligation: (18 − 14) : (14 − 8) = 4 : 6 for 8% : 18% ⇒ 18% part = 50 × 6/10 = <b>30 kg</b>.", "f": null, "p": null}, {"s": "A", "t": "Population", "q": "The population of a town increases by 5% every year. If the present population is 1,32,300, what was the population 2 years ago?", "o": ["1,20,000", "1,25,000", "1,26,000", "1,18,000"], "a": 0, "e": "P × 1.05² = 1,32,300 ⇒ P = 1,32,300 ÷ 1.1025 = <b>1,20,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage", "q": "A number is first increased by 20% and then decreased by 20%. The result is 192. What was the original number?", "o": ["208", "192", "196", "200"], "a": 3, "e": "Net effect = 1.2 × 0.8 = 0.96 ⇒ number = 192 ÷ 0.96 = <b>200</b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "The area of a circle is 616 cm². What is its circumference? (Take π = 22/7)", "o": ["176 cm", "66 cm", "44 cm", "88 cm"], "a": 3, "e": "πr² = 616 ⇒ r² = 196 ⇒ r = 14 cm. Circumference = 2 × 22/7 × 14 = <b>88 cm</b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "The length of a rectangle is increased by 50%. By what per cent must its breadth be decreased so that the area remains the same?", "o": ["25%", "50%", "33⅓%", "66⅔%"], "a": 2, "e": "Decrease = 50/150 × 100 = <b>33⅓%</b>.", "f": null, "p": null}, {"s": "A", "t": "Number System", "q": "How many times does the digit 7 appear when all the numbers from 1 to 100 are written?", "o": ["19", "11", "21", "20"], "a": 3, "e": "Units place: 7, 17, …, 97 = 10 times. Tens place: 70–79 = 10 times. Total = <b>20</b>.", "f": null, "p": null}, {"s": "A", "t": "Wrong Term in Series", "q": "Find the wrong term in the series: 3, 10, 29, 68, 127, 218", "o": ["29", "68", "127", "10"], "a": 1, "e": "Rule: n³ + 2 ⇒ 3, 10, 29, 66, 127, 218.<br>So <b>68</b> is wrong; it should be 66.", "f": null, "p": null}, {"s": "A", "t": "Problems on Numbers", "q": "The sum of the squares of two consecutive even numbers is 340. What is the larger number?", "o": ["16", "12", "14", "18"], "a": 2, "e": "12² + 14² = 144 + 196 = 340 ⇒ larger number = <b>14</b>.", "f": null, "p": null}, {"s": "A", "t": "Time & Distance", "q": "A bus covers a distance of 480 km at a uniform speed. If its speed were 8 km/h more, it would take 2 hours less. What is the original speed of the bus?", "o": ["40 km/h", "48 km/h", "32 km/h", "45 km/h"], "a": 0, "e": "480/v − 480/(v + 8) = 2 ⇒ 480 × 8 = 2v(v + 8) ⇒ v² + 8v − 1920 = 0 ⇒ (v + 48)(v − 40) = 0 ⇒ v = <b>40 km/h</b>.", "f": null, "p": null}, {"s": "A", "t": "Ratio & Proportion", "q": "A and B together have ₹1,100. If 2/5 of A's amount is equal to 1/3 of B's amount, how much does B have?", "o": ["₹500", "₹550", "₹660", "₹600"], "a": 3, "e": "2A/5 = B/3 ⇒ A : B = 5 : 6 ⇒ B = 1,100 × 6/11 = <b>₹600</b>.", "f": null, "p": null}, {"s": "A", "t": "Discount", "q": "The marked price of a TV is ₹25,000. Two successive discounts of 10% and 5% are allowed. What is its selling price?", "o": ["₹21,375", "₹21,500", "₹22,500", "₹21,250"], "a": 0, "e": "25,000 × 0.90 × 0.95 = <b>₹21,375</b>.", "f": null, "p": null}, {"s": "A", "t": "Wages", "q": "A worker is engaged for 24 days at ₹600 for each day he works. For each day he is absent, he gets no wage and ₹150 is also deducted. If he received ₹12,150 in all, for how many days was he absent?", "o": ["4", "3", "2", "5"], "a": 1, "e": "If absent x days: 600(24 − x) − 150x = 12,150 ⇒ 14,400 − 750x = 12,150 ⇒ x = <b>3</b>.", "f": null, "p": null}, {"s": "B", "t": "DI – Caselet", "q": "How many female employees are there in the organisation?", "o": ["200", "250", "275", "225"], "a": 3, "e": "Bus = 200 (male 60% = 120, female 80); Metro = 150 (female 50% = 75, male 75); Own vehicle = 150 (female 70, male 80).<br>Females = 80 + 75 + 70 = <b>225</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Caselet", "q": "Male employees who use their own vehicles form approximately what per cent of all the male employees?", "o": ["29.1%", "35.6%", "32%", "26.7%"], "a": 0, "e": "Males = 120 + 75 + 80 = 275 ⇒ 80/275 × 100 ≈ <b>29.1%</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Caselet", "q": "What is the ratio of male bus users to female metro users?", "o": ["5 : 8", "4 : 3", "3 : 2", "8 : 5"], "a": 3, "e": "120 : 75 = <b>8 : 5</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Caselet", "q": "If 20% of the bus users shift to the metro, how many employees will then use the metro?", "o": ["200", "170", "190", "180"], "a": 2, "e": "20% of 200 = 40 ⇒ metro users = 150 + 40 = <b>190</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Caselet", "q": "By how many does the number of male employees exceed the number of female employees?", "o": ["75", "40", "25", "50"], "a": 3, "e": "Males 275 − females 225 = <b>50</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Table", "q": "What are Chinu's marks in Mathematics?", "o": ["72", "74", "68", "70"], "a": 3, "e": "Chinu: 290 − (72 + 68 + 80) = <b>70</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Table", "q": "What are the average marks of the five students in English?", "o": ["71.4", "69.6", "70.8", "72.0"], "a": 2, "e": "Missing English marks: Amit = 300 − (78 + 65 + 82) = 75; Esha = 270 − (65 + 70 + 73) = 62.<br>(75 + 70 + 68 + 79 + 62) ÷ 5 = 354 ÷ 5 = <b>70.8</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Table", "q": "How many students scored more than 70 marks in Science?", "o": ["4", "5", "3", "2"], "a": 2, "e": "Science: Amit 65, Bina = 310 − (88 + 70 + 76) = 76, Chinu 72, Deepa 85, Esha 70.<br>More than 70: Bina, Chinu, Deepa ⇒ <b>3</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Table", "q": "What is Deepa's overall percentage of marks?", "o": ["80%", "85%", "82.5%", "87.5%"], "a": 1, "e": "Deepa's total = 340 out of 400 ⇒ <b>85%</b> (Odia = 340 − 256 = 84).", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Table", "q": "What is the total of the marks scored by all five students in Mathematics?", "o": ["398", "390", "388", "393"], "a": 3, "e": "78 + 88 + 70 + 92 + 65 = <b>393</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Pie Chart", "q": "What is the expenditure on Paper?", "o": ["₹2,00,000", "₹2,40,000", "₹1,60,000", "₹1,80,000"], "a": 0, "e": "Paper = 90° ⇒ 90/360 × 8,00,000 = <b>₹2,00,000</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "By how much does the expenditure on Printing exceed that on Royalty?", "o": ["₹80,000", "₹72,000", "₹96,000", "₹64,000"], "a": 0, "e": "(72° − 36°)/360° × 8,00,000 = 36/360 × 8,00,000 = <b>₹80,000</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "The expenditure on Binding is what per cent of the total expenditure?", "o": ["20%", "15%", "18%", "12%"], "a": 1, "e": "54/360 × 100 = <b>15%</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "If 5,000 copies of the book are published and sold at a profit of 25% on the total cost, what is the selling price of one copy?", "o": ["₹200", "₹180", "₹160", "₹250"], "a": 0, "e": "Total SP = 8,00,000 × 1.25 = ₹10,00,000 ⇒ per copy = 10,00,000 ÷ 5,000 = <b>₹200</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "What is the ratio of the expenditure on Paper to the combined expenditure on Binding and Transport?", "o": ["4 : 5", "5 : 3", "3 : 2", "5 : 4"], "a": 3, "e": "90° : (54° + 18°) = 90 : 72 = <b>5 : 4</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Line Graph", "q": "What was the total rainfall from June to November?", "o": ["1150 mm", "1170 mm", "1190 mm", "1120 mm"], "a": 1, "e": "220 + 340 + 300 + 180 + 90 + 40 = <b>1170 mm</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Line Graph", "q": "What was the percentage decrease in rainfall from August to September?", "o": ["35%", "40%", "45%", "50%"], "a": 1, "e": "(300 − 180)/300 × 100 = <b>40%</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Line Graph", "q": "What was the average monthly rainfall over the six months?", "o": ["185 mm", "195 mm", "190 mm", "200 mm"], "a": 1, "e": "1170 ÷ 6 = <b>195 mm</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Line Graph", "q": "The rainfall in July is approximately what per cent of the total rainfall of the six months?", "o": ["29%", "31%", "34%", "26%"], "a": 0, "e": "340/1170 × 100 ≈ 29.06% ≈ <b>29%</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Line Graph", "q": "In how many months was the rainfall more than the six-month average?", "o": ["2", "3", "4", "5"], "a": 1, "e": "Average = 195 mm. Above it: June (220), July (340), August (300) ⇒ <b>3</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Bar & Table", "q": "What is the total number of female employees in the five companies?", "o": ["1400", "1300", "1600", "1500"], "a": 3, "e": "Females: A = 800 × 3/8 = 300, B = 600 × 1/2 = 300, C = 900 × 1/3 = 300, D = 700 × 3/7 = 300, E = 500 × 3/5 = 300.<br>Total = <b>1500</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Bar & Table", "q": "The number of male employees in Company C is what per cent more than that in Company D?", "o": ["25%", "33⅓%", "40%", "50%"], "a": 3, "e": "Males: C = 600, D = 400 ⇒ (600 − 400)/400 × 100 = <b>50%</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Bar & Table", "q": "What is the ratio of the total number of male employees to the total number of female employees?", "o": ["5 : 4", "3 : 2", "4 : 3", "7 : 5"], "a": 2, "e": "Males = 500 + 300 + 600 + 400 + 200 = 2000; females = 1500 ⇒ <b>4 : 3</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Bar & Table", "q": "Which company has the least number of male employees?", "o": ["A", "E", "B", "D"], "a": 1, "e": "Males: A 500, B 300, C 600, D 400, E 200 ⇒ least in <b>E</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Bar & Table", "q": "Female employees of Company B form approximately what per cent of the total employees of Companies B and D together?", "o": ["21.4%", "27.3%", "23.1%", "25%"], "a": 2, "e": "300/(600 + 700) × 100 = 300/1300 × 100 ≈ <b>23.1%</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "Data Sufficiency", "q": "What is the speed of the train?<br>I. The train crosses a 200 m long platform in 20 seconds.<br>II. The train crosses a pole in 10 seconds.", "o": ["Even I and II together are not sufficient", "Statement I alone is sufficient", "Both I and II together are needed", "Either I or II alone is sufficient"], "a": 2, "e": "I: L + 200 = 20v (two unknowns). II: L = 10v (two unknowns).<br>Together: 10v + 200 = 20v ⇒ v = 20 m/s ⇒ <b>both I and II are needed</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "What is the value of A + B?<br>I. 2A + 2B = 30<br>II. A − B = 5", "o": ["Both I and II together are needed", "Even I and II together are not sufficient", "Statement II alone is sufficient", "Statement I alone is sufficient"], "a": 3, "e": "I: A + B = 15 directly. II gives only the difference.<br><b>Statement I alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "Is n an odd number? (n is an integer)<br>I. n² is odd.<br>II. n + 2 is odd.", "o": ["Either I or II alone is sufficient", "Even I and II together are not sufficient", "Both I and II together are needed", "Statement I alone is sufficient"], "a": 0, "e": "I: n² odd ⇒ n odd. II: n + 2 odd ⇒ n odd. Each gives a definite 'Yes'.<br><b>Either I or II alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "What is the area of the circular field?<br>I. The cost of levelling the field is ₹6,160.<br>II. The diameter of the field is 28 m.", "o": ["Statement II alone is sufficient", "Both I and II together are needed", "Even I and II together are not sufficient", "Statement I alone is sufficient"], "a": 0, "e": "I: the rate of levelling is not given ⇒ not sufficient. II: r = 14 m ⇒ area = 22/7 × 14² = 616 m².<br><b>Statement II alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "How many sons does Ravi have?<br>I. Ravi has four children.<br>II. Exactly two of Ravi's children are daughters.", "o": ["Both I and II together are needed", "Statement II alone is sufficient", "Either I or II alone is sufficient", "Even I and II together are not sufficient"], "a": 0, "e": "I gives only the number of children; II gives only the number of daughters.<br>Together: 4 − 2 = 2 sons ⇒ <b>both I and II are needed</b>.", "f": null, "p": "P6"}, {"s": "C", "t": "Analogy", "q": "Select the number that will replace the question mark: 16 : 25 :: 36 : ?", "o": ["48", "64", "42", "49"], "a": 3, "e": "4² : 5² :: 6² : 7² ⇒ <b>49</b>.", "f": null, "p": null}, {"s": "C", "t": "Classification", "q": "Three of the following letter-groups are alike in some way and one is different. Find the odd one.", "o": ["GIK", "BDF", "RTW", "MOQ"], "a": 2, "e": "BDF, GIK, MOQ: each letter is +2 (B→D→F). RTW is R→T (+2), T→W (+3) ⇒ <b>RTW</b> is the odd one.", "f": null, "p": null}, {"s": "C", "t": "Coding–Decoding", "q": "In a certain code, MOTHER is written as OMHTRE. How will SISTER be written in that code?", "o": ["ISTSRE", "SITSRE", "ISTSER", "ISSTRE"], "a": 0, "e": "Letters are swapped in pairs: MO→OM, TH→HT, ER→RE.<br>SI→IS, ST→TS, ER→RE ⇒ <b>ISTSRE</b>.", "f": null, "p": null}, {"s": "C", "t": "Coded Relations", "q": "'P × Q' means P is the father of Q; 'P + Q' means P is the wife of Q; 'P − Q' means P is the brother of Q; 'P ÷ Q' means P is the daughter of Q. If A ÷ B × C + D, how is D related to A?", "o": ["Father-in-law", "Brother-in-law", "Maternal uncle", "Brother"], "a": 1, "e": "A is the daughter of B; B is the father of C ⇒ A and C are sisters (C is a wife, so female). C is the wife of D ⇒ D is the husband of A's sister ⇒ <b>brother-in-law</b>.", "f": null, "p": null}, {"s": "C", "t": "Symbol Substitution", "q": "If '÷' means '+', '−' means '÷', '×' means '−' and '+' means '×', what is the value of 20 ÷ 8 − 4 × 3 + 2?", "o": ["14", "20", "16", "18"], "a": 2, "e": "Replace the signs: 20 + 8 ÷ 4 − 3 × 2 = 20 + 2 − 6 = <b>16</b>.", "f": null, "p": null}, {"s": "C", "t": "Direction Sense", "q": "A man walks 5 km towards North, turns right and walks 4 km, turns right again and walks 8 km, and then turns right and walks 4 km. How far and in which direction is he from the starting point?", "o": ["3 km North", "4 km South", "5 km West", "3 km South"], "a": 3, "e": "N 5 → E 4 → S 8 → W 4 ⇒ East–West cancels; 5 − 8 = 3 km South ⇒ <b>3 km South</b>.", "f": null, "p": null}, {"s": "C", "t": "Direction Sense", "q": "If North-East becomes West, North-West becomes South and so on, what will South become?", "o": ["North-West", "South-East", "North-East", "East"], "a": 2, "e": "NE → W is a turn of 135° anticlockwise (check: NW → S is also 135° anticlockwise).<br>South turned 135° anticlockwise = <b>North-East</b>.", "f": null, "p": null}, {"s": "C", "t": "Calendar", "q": "Which is the next year that will have exactly the same calendar as the year 2026?", "o": ["2031", "2036", "2037", "2032"], "a": 2, "e": "2026 is an ordinary year beginning on Thursday. Adding odd days: 2027 (+1) Fri, 2028 (+1, leap) Sat, 2029 Mon, 2030 Tue, 2031 Wed, 2032 Thu (but leap), 2033 Sat, 2034 Sun, 2035 Mon, 2036 Tue (leap), 2037 Thu.<br>First ordinary year starting on Thursday ⇒ <b>2037</b>.", "f": null, "p": null}, {"s": "C", "t": "Clock", "q": "At what time between 3 o'clock and 4 o'clock will the hour hand and the minute hand of a clock coincide?", "o": ["16 min past 3", "16 4/11 min past 3", "15 min past 3", "17 3/11 min past 3"], "a": 1, "e": "At 3:00 the hands are 15 min-spaces apart. The minute hand gains 55 min-spaces in 60 minutes ⇒ time = 15 × 60/55 = <b>16 4/11 min past 3</b>.", "f": null, "p": null}, {"s": "C", "t": "Number Series", "q": "Find the next term of the series: 7, 15, 32, 67, 138, ?", "o": ["276", "285", "281", "279"], "a": 2, "e": "Rule: ×2 + 1, ×2 + 2, ×2 + 3, ×2 + 4 … ⇒ 138 × 2 + 5 = <b>281</b>.", "f": null, "p": null}, {"s": "C", "t": "Alpha-numeric Series", "q": "Find the next term: B2, E5, H8, K11, ?", "o": ["O15", "N14", "M13", "N13"], "a": 1, "e": "Letters move +3 (B, E, H, K, N) and each number is the letter's position ⇒ <b>N14</b>.", "f": null, "p": null}, {"s": "C", "t": "Coding–Decoding", "q": "If FAST is coded as '7 2 20 21', how will SLOW be coded?", "o": ["20 13 16 24", "21 14 17 25", "19 12 15 23", "20 13 16 23"], "a": 0, "e": "Each letter is written as (alphabet position + 1): F6→7, A1→2, S19→20, T20→21.<br>S→20, L→13, O→16, W→24 ⇒ <b>20 13 16 24</b>.", "f": null, "p": null}, {"s": "C", "t": "Word Formation", "q": "Which of the following words can be formed using the letters of the word 'CONSTITUTION'?", "o": ["STATION", "CONTEST", "TUITION", "MOTION"], "a": 2, "e": "CONSTITUTION has C, O×2, N×2, S, T×3, I×2, U. TUITION (T, U, I, T, I, O, N) can be formed.<br>STATION needs A, CONTEST needs E and MOTION needs M ⇒ <b>TUITION</b>.", "f": null, "p": null}, {"s": "C", "t": "Ranking", "q": "In a class, Rohit is 9th from the top and 32nd from the bottom. How many students are there in the class?", "o": ["40", "41", "42", "39"], "a": 0, "e": "Total = 9 + 32 − 1 = <b>40</b>.", "f": null, "p": null}, {"s": "C", "t": "Puzzle", "q": "Five boxes P, Q, R, S and T are stacked one above another. P is at the top. R is just below P. Q is just above T. S is not just below R. Which box is at the bottom?", "o": ["R", "Q", "S", "T"], "a": 2, "e": "P = 5th (top), R = 4th. Q–T are consecutive in positions 1–3. S cannot be 3rd ⇒ Q = 3rd, T = 2nd, S = 1st.<br>Bottom ⇒ <b>S</b>.", "f": null, "p": null}, {"s": "C", "t": "Problems on Ages", "q": "The ages of A and B differ by 16 years. Six years ago, A's age was three times B's age. What is A's present age?", "o": ["32 years", "36 years", "30 years", "28 years"], "a": 2, "e": "a − b = 16 and a − 6 = 3(b − 6) ⇒ a = 3b − 12 ⇒ 3b − 12 − b = 16 ⇒ b = 14 ⇒ A = <b>30 years</b>.", "f": null, "p": null}, {"s": "C", "t": "Seating Arrangement", "q": "Six friends A, B, C, D, E and F sit around a circular table facing the centre. A sits opposite D. B and C are the neighbours of A. E is a neighbour of both D and C. Who sits opposite B?", "o": ["C", "D", "F", "E"], "a": 3, "e": "Place A and D opposite. B and C occupy the two seats next to A. E must touch D and C, so E sits between C and D; F takes the last seat between D and B.<br>The seat opposite B is the one between C and D ⇒ <b>E</b> (true for either side placement).", "f": null, "p": null}, {"s": "C", "t": "Arithmetical Reasoning", "q": "A train has 12 coaches, each 20 m long, with a gap of 1 m between every two adjacent coaches. What is the total length of the train?", "o": ["240 m", "252 m", "260 m", "251 m"], "a": 3, "e": "Coaches = 12 × 20 = 240 m; gaps = 11 × 1 = 11 m ⇒ <b>251 m</b>.", "f": null, "p": null}, {"s": "C", "t": "Inequality", "q": "If A > B, B ≥ C, C = D and D > E, which of the following is definitely true?", "o": ["C > B", "A > E", "B = D", "E > C"], "a": 1, "e": "A > B ≥ C = D > E ⇒ <b>A > E</b> is certain. B = D is only possible, not certain; the other two are false.", "f": null, "p": null}, {"s": "C", "t": "Clock", "q": "What is the angle between the hour hand and the minute hand of a clock at 7:30?", "o": ["45°", "52.5°", "60°", "30°"], "a": 0, "e": "θ = |30H − 5.5M| = |210 − 165| = <b>45°</b>.", "f": null, "p": null}, {"s": "C", "t": "Arithmetical Reasoning", "q": "A had ₹120. He spent 1/4 of it on books and 1/3 of the remainder on food. He then gave half of what was left to B. How much money is left with A?", "o": ["₹40", "₹30", "₹45", "₹20"], "a": 1, "e": "Books: 120 → 90. Food: 1/3 of 90 = 30 ⇒ 60 left. Half given to B ⇒ <b>₹30</b>.", "f": null, "p": null}, {"s": "C", "t": "Arithmetical Reasoning", "q": "An electricity bill has a fixed meter rent and a charge per unit. The bill for 120 units is ₹780 and for 200 units it is ₹1,180. What will be the bill for 150 units?", "o": ["₹900", "₹960", "₹950", "₹930"], "a": 3, "e": "Per unit = (1,180 − 780)/80 = ₹5; rent = 780 − 600 = ₹180.<br>150 units: 180 + 750 = <b>₹930</b>.", "f": null, "p": null}, {"s": "C", "t": "Dictionary Order", "q": "Arrange the words in the order in which they appear in an English dictionary:<br>1. Admire &nbsp;2. Admission &nbsp;3. Adjust &nbsp;4. Admit &nbsp;5. Adorn", "o": ["3, 1, 2, 4, 5", "3, 2, 1, 4, 5", "3, 1, 4, 2, 5", "1, 3, 2, 4, 5"], "a": 0, "e": "Adj- comes before Adm-. Admir- (r) < Admis- (s) < Admit (t). Adorn (o) is last.<br>Adjust, Admire, Admission, Admit, Adorn ⇒ <b>3, 1, 2, 4, 5</b>.", "f": null, "p": null}, {"s": "C", "t": "Coded Sentences", "q": "In a code language, 'good sweet fruit' is written as 'tom kan ret', 'fruit is good' as 'ret pul tom' and 'sweet is apple' as 'kan pul sop'. What is the code for 'apple'?", "o": ["tom", "pul", "kan", "sop"], "a": 3, "e": "sweet = kan (1st & 3rd), is = pul (2nd & 3rd). The remaining word of the 3rd sentence: apple = <b>sop</b>.", "f": null, "p": null}, {"s": "C", "t": "Syllogism", "q": "Statements: All cars are vehicles. Some vehicles are bikes.<br>Conclusions: I. Some cars are bikes. &nbsp;II. Some vehicles are cars.", "o": ["Only II follows", "Neither I nor II follows", "Both I and II follow", "Only I follows"], "a": 0, "e": "I: the bikes may be vehicles that are not cars ⇒ does not follow. II: all cars are vehicles ⇒ some vehicles are cars ⇒ follows.<br><b>Only II follows</b>.", "f": null, "p": null}, {"s": "C", "t": "Statement & Conclusion", "q": "Statement: Of all the students who appeared in an examination this year, only 20% passed.<br>Conclusions: I. The examination was tougher this year. &nbsp;II. 80% of the students who appeared did not pass.", "o": ["Only I follows", "Both I and II follow", "Neither I nor II follows", "Only II follows"], "a": 3, "e": "II is a direct restatement of the data. I is a guess (no comparison with earlier years is given).<br><b>Only II follows</b>.", "f": null, "p": null}, {"s": "C", "t": "Cube & Cuboid", "q": "A cube painted on all its faces is cut into 27 identical smaller cubes. How many of the small cubes have exactly one face painted?", "o": ["8", "6", "12", "1"], "a": 1, "e": "n = 3 ⇒ one face painted = 6(n − 2)² = 6 × 1 = <b>6</b> (the centre cube of each face).", "f": null, "p": null}, {"s": "C", "t": "Missing Number", "q": "Find the missing number:<br>Row 1: 2, 3, 4<br>Row 2: 5, 7, 9<br>Row 3: 10, 21, ?", "o": ["36", "27", "13", "18"], "a": 0, "e": "In each column, Row 3 = Row 1 × Row 2: 2 × 5 = 10, 3 × 7 = 21 ⇒ 4 × 9 = <b>36</b>.", "f": null, "p": null}, {"s": "C", "t": "Mirror Image (Non-verbal)", "q": "A mirror is placed on the right side of the figure. Choose its correct mirror image.", "o": ["@P", "@M", "@W", "@R"], "a": 1, "e": "A mirror on the right side interchanges left and right: the order of the characters is reversed and each character is laterally inverted, while top and bottom stay the same.<br>The other options are the water image, a 180° rotation and a simple reversal of order.", "f": {"kind": "mirror", "text": "CGLRE 25"}, "p": null}, {"s": "C", "t": "Dice (Non-verbal)", "q": "Two positions of the same die are shown. Which number is on the face opposite to 2?", "o": ["5", "4", "6", "1"], "a": 0, "e": "The face 3 is common. Read the numbers clockwise starting from 3: Position (i) top 1, front 2, right 3 ⇒ 3, 2, 1; Position (ii) top 3, front 4, right 5 ⇒ 3, 5, 4.<br>Numbers in matching places are opposite: 2 ↔ 5 and 1 ↔ 4 (and the unseen 6 is opposite 3) ⇒ <b>5</b>.", "f": {"kind": "dice", "a": [1, 2, 3], "b": [3, 4, 5]}, "p": null}, {"s": "C", "t": "Sign Interchange", "q": "Which two signs should be interchanged to make the following equation correct?<br>12 ÷ 4 + 3 × 6 − 2 = 17", "o": ["× and −", "+ and ×", "÷ and −", "÷ and +"], "a": 2, "e": "Interchanging ÷ and −: 12 − 4 + 3 × 6 ÷ 2 = 12 − 4 + 9 = <b>17</b> ✓.<br>(+ and × gives 13; ÷ and + gives 18; × and − gives −6.)", "f": null, "p": null}, {"s": "C", "t": "Logical Deduction", "q": "Ritu is taller than Meena. Meena is taller than Sonu. Based on these statements, the statement 'Ritu is taller than Sonu' is:", "o": ["Uncertain", "True", "False", "Data contradictory"], "a": 1, "e": "Ritu > Meena > Sonu ⇒ Ritu > Sonu is definitely <b>True</b>.", "f": null, "p": null}, {"s": "C", "t": "Blood Relations", "q": "M is the father of N. N is the sister of O. O is the husband of P. How is M related to P?", "o": ["Father-in-law", "Father", "Brother-in-law", "Uncle"], "a": 0, "e": "N and O are M's children; O is P's husband ⇒ M is the father of P's husband ⇒ <b>father-in-law</b>.", "f": null, "p": null}, {"s": "C", "t": "Figure Series (Non-verbal)", "q": "Select the figure that will come next in the series of problem figures.", "o": ["(1)", "(2)", "(3)", "(4)"], "a": 3, "e": "In each step the arrow turns 45° clockwise (up → up-right → right → down-right → <b>down</b>), and the shaded corner moves anticlockwise (top-left → bottom-left → bottom-right → top-right → <b>top-left</b>).<br>So the next figure has the arrow pointing down with the top-left corner shaded ⇒ figure <b>(4)</b>.", "f": {"kind": "img", "id": "series"}, "p": null}, {"s": "C", "t": "Classification", "q": "Find the odd one out: 169, 225, 289, 323", "o": ["169", "323", "225", "289"], "a": 1, "e": "169 = 13², 225 = 15², 289 = 17² are perfect squares; <b>323</b> = 17 × 19 is not a perfect square.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "INS Samarthak, commissioned on 16 October 2026 as the Indian Navy's first indigenous multi-purpose vessel, was built by:", "o": ["Cochin Shipyard Limited", "Larsen & Toubro", "Mazagon Dock Shipbuilders", "Goa Shipyard Limited"], "a": 1, "e": "INS Samarthak was built by <b>Larsen &amp; Toubro</b> at Kattupalli — the first major warship from a private Indian shipyard to enter naval service. It was commissioned at Karwar by Vice-President C.P. Radhakrishnan.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "The first-ever BIMSTEC Home Ministers' Meeting, held in New Delhi on 13 October 2026 under Amit Shah's chairmanship, adopted the:", "o": ["Bay of Bengal Charter", "Delhi Declaration", "Colombo Process", "Kathmandu Declaration"], "a": 1, "e": "The meeting adopted the <b>Delhi Declaration</b> and five initiatives, including a BIMSTEC Convention against Trafficking in Persons.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "Who inaugurated the 12th BRICS Parliamentary Forum on 26 October 2026, held under India's BRICS Chairship?", "o": ["C.P. Radhakrishnan", "Harivansh", "Om Birla", "Droupadi Murmu"], "a": 2, "e": "Lok Sabha Speaker <b>Om Birla</b> inaugurated the Forum; it ended on 27 October with a Joint Declaration backing UN Security Council reform.", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "In October 2026, the Union Cabinet raised the Dearness Allowance of Central Government employees by 3 percentage points to:", "o": ["60%", "61%", "63%", "58%"], "a": 2, "e": "DA/DR rose from 60% to <b>63%</b> of basic pay/pension, with effect from 1 July 2026 (about 48.5 lakh employees and 68.7 lakh pensioners benefit).", "f": null, "p": null}, {"s": "D", "t": "Schemes 2026", "q": "The 24th instalment of PM-KISAN was released by PM Modi on 30 October 2026 from:", "o": ["Banaskantha, Gujarat", "Varanasi, Uttar Pradesh", "Sikar, Rajasthan", "Bhagalpur, Bihar"], "a": 0, "e": "Over ₹18,690 crore went to about 9.34 crore farmer families from <b>Banaskantha, Gujarat</b>. Each family gets ₹6,000 a year in three instalments.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "The India–New Zealand Free Trade Agreement entered into force on:", "o": ["20 October 2026", "15 September 2026", "1 January 2027", "27 April 2026"], "a": 0, "e": "Signed on 27 April 2026, the FTA came into force on <b>20 October 2026</b>; Indian goods get duty-free access to all of New Zealand's tariff lines (dairy is excluded from India's concessions).", "f": null, "p": null}, {"s": "D", "t": "Science & Space 2026", "q": "GSLV-F17, launched on 4 September 2026, placed which satellite — described as India's first dedicated imaging satellite for geosynchronous orbit — in orbit?", "o": ["NVS-03", "GSAT-7R", "EOS-05", "Oceansat-3A"], "a": 2, "e": "GSLV-F17 put the 2,367-kg <b>EOS-05</b> into a sub-geosynchronous transfer orbit from Sriharikota.", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "In September 2026, the Japan Credit Rating Agency (JCR) upgraded India's long-term sovereign rating from BBB+ to:", "o": ["A+", "A-", "AA-", "BBB"], "a": 1, "e": "JCR raised India to <b>A-</b> with a stable outlook, citing digital public infrastructure and GST.", "f": null, "p": null}, {"s": "D", "t": "National 2026", "q": "The Kishau Multipurpose Project, for which six States signed an agreement in September 2026, is planned on which river?", "o": ["Tons", "Mahakali", "Chenab", "Sutlej"], "a": 0, "e": "A 232.6-m concrete gravity dam is planned on the <b>Tons</b> river (a Yamuna tributary) for UP, Uttarakhand, Himachal Pradesh, Rajasthan, Delhi and Haryana.", "f": null, "p": null}, {"s": "D", "t": "National 2026", "q": "India's first LNG-powered train was flagged off by Amit Shah on 27 September 2026 from:", "o": ["Vadodara Junction", "Kalol, Gandhinagar", "Gandhinagar Capital station", "Sabarmati, Ahmedabad"], "a": 3, "e": "The train was flagged off from <b>Sabarmati Railway Station, Ahmedabad</b>, along with railway works worth ₹1,472 crore.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "Exercise KAZIND-2026 (September–October 2026, Oskemen) is a joint military exercise between India and:", "o": ["Tajikistan", "Uzbekistan", "Kazakhstan", "Kyrgyzstan"], "a": 2, "e": "KAZIND is the India–<b>Kazakhstan</b> exercise; its 9th edition focused on counter-terrorism under a UN mandate.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "'Garuda Shakti', whose 11th edition began on 27 October 2026 at Banyuwangi, is a special forces exercise between India and:", "o": ["Thailand", "Indonesia", "Philippines", "Malaysia"], "a": 1, "e": "Garuda Shakti is the India–<b>Indonesia</b> joint special forces exercise; the Indian contingent is from the Parachute Regiment (Special Forces).", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "Guy Parmelin, who made a state visit to India in October 2026, is the President of:", "o": ["Liechtenstein", "Switzerland", "Norway", "Austria"], "a": 1, "e": "The Swiss President's visit produced a Migration and Mobility Partnership and an Agreement on Exchange of Young Professionals, building on the India–EFTA TEPA.", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "The Container Manufacturing Promotion Scheme approved by the Union Cabinet in October 2026 has an outlay of:", "o": ["₹7,500 crore", "₹5,000 crore", "₹10,000 crore", "₹15,000 crore"], "a": 2, "e": "The <b>₹10,000-crore</b> scheme (up to 2039-40) aims to raise domestic container capacity about ten-fold to 7.5 lakh TEUs a year.", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "Who chairs the High Level Committee on Banking for Viksit Bharat, constituted on 30 October 2026?", "o": ["Shirish Chandra Murmu", "Padmaja Chunduru", "N.S. Vishwanathan", "Suresh N. Patel"], "a": 3, "e": "Former Central Vigilance Commissioner <b>Suresh N. Patel</b> chairs it; the committee will recommend reforms to make Indian banks globally competitive within six months.", "f": null, "p": null}, {"s": "D", "t": "Polity 2026", "q": "The National Social Security Board notified on 30 October 2026 under the Code on Social Security covers:", "o": ["Bank employees", "Unorganised, gig and platform workers", "Armed forces veterans", "Central and State Government pensioners"], "a": 1, "e": "The Board, chaired by the Union Labour Minister, recommends and monitors welfare schemes for <b>unorganised, gig and platform workers</b>.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "Which country will host the inaugural ICC Women's Champions Trophy in February 2027?", "o": ["Bangladesh", "Sri Lanka", "South Africa", "India"], "a": 3, "e": "The ICC moved the six-team T20 event to <b>India</b> (Mumbai and Vadodara, 14–28 February 2027).", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "In September 2026, Virat Kohli became only the second batter after Sachin Tendulkar to reach how many ODI runs?", "o": ["13,000", "14,000", "16,000", "15,000"], "a": 3, "e": "Kohli made 139* against West Indies at Thiruvananthapuram (his 55th ODI hundred) to reach <b>15,000</b> ODI runs.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "At the 2026 Asian Games, Vithya Ramraj broke P.T. Usha's 42-year-old national record in which event?", "o": ["Women's 400 m hurdles", "Women's 100 m hurdles", "Women's 200 m", "Women's 400 m"], "a": 0, "e": "She clocked 54.75 s to win bronze in the <b>women's 400 m hurdles</b>, bettering Usha's 55.42 s from the 1984 Los Angeles Olympics.", "f": null, "p": null}, {"s": "D", "t": "Schemes 2026", "q": "The Khelo India Sports Goods Manufacturing Scheme, approved in October 2026, has a total outlay of about:", "o": ["₹1,857 crore", "₹2,500 crore", "₹1,250 crore", "₹3,000 crore"], "a": 0, "e": "The scheme has an outlay of <b>₹1,856.67 crore</b> (2026 to 2033-34), including Sports Goods Manufacturing Zones.", "f": null, "p": null}, {"s": "D", "t": "National 2026", "q": "In October 2026, the first cargo since 1947 from upper Assam to a foreign port sailed from Bogibeel to Bangladesh along which National Waterway?", "o": ["NW-1 (Ganga)", "NW-2 (Brahmaputra)", "NW-16 (Barak)", "NW-3 (West Coast Canal)"], "a": 1, "e": "The barge carried 540 tonnes of methanol from Bogibeel (Dibrugarh) via <b>National Waterway-2 (Brahmaputra)</b> and the Indo-Bangladesh Protocol Route to Pangaon, Dhaka.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "The 25th edition of 'CII Enterprise Odisha', inaugurated by CM Mohan Charan Majhi in January 2026, was held at:", "o": ["Cuttack", "Sambalpur", "Rourkela", "Berhampur"], "a": 2, "e": "CII Enterprise Odisha 2026 (25th edition) was held at <b>Rourkela</b> on 27 January 2026.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "India's first Fibre Reinforced Polymer (FRP) unit of Hindalco was inaugurated in January 2026 at Lapanga in which district of Odisha?", "o": ["Sambalpur", "Jharsuguda", "Angul", "Sundargarh"], "a": 0, "e": "The Hindalco FRP unit is at Lapanga in <b>Sambalpur</b> district.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "The National Urban Conclave 2026 and the 19th Urban Mobility India Conference were held in October 2026 in:", "o": ["New Delhi", "Bhubaneswar", "Pune", "Visakhapatnam"], "a": 1, "e": "Both events were held in <b>Bhubaneswar</b>; CM Majhi flagged off 26 e-buses under PM e-Bus Sewa at the conclave.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "'PMAY-Urban BANDHU', launched in Bhubaneswar in October 2026, provides:", "o": ["Home loans to government staff", "Affordable rental housing for migrant workers", "Free rooftop solar panels for urban poor households", "Shelters for the homeless elderly"], "a": 1, "e": "Under <b>PMAY-Urban BANDHU</b>, an affordable rental housing project for migrant workers and low-income families is coming up at Gadakana, Bhubaneswar.", "f": null, "p": null}, {"s": "D", "t": "Banking 2026", "q": "In October 2026, the RBI approved the amalgamation of the Indian branches of Emirates NBD into which Indian bank, effective 1 December 2026?", "o": ["Yes Bank", "RBL Bank", "South Indian Bank", "IDBI Bank"], "a": 1, "e": "The RBI sanctioned the merger of Emirates NBD's Indian branches into <b>RBL Bank</b> under Section 44A of the Banking Regulation Act; Emirates NBD had acquired a 60% stake in RBL Bank in 2026.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "In October 2026, India signed the Terms of Reference to launch negotiations for a Preferential Trade Agreement (PTA) with which country?", "o": ["Mexico", "Chile", "Peru", "Argentina"], "a": 0, "e": "India and <b>Mexico</b> signed the Terms of Reference, formally launching PTA negotiations covering goods, rules of origin, customs and trade remedies.", "f": null, "p": null}, {"s": "D", "t": "Environment 2026", "q": "The World Circular Economy Forum (WCEF) 2026 was held from 15 to 18 September 2026 in which Indian city?", "o": ["Gandhinagar", "New Delhi", "Bengaluru", "Visakhapatnam"], "a": 0, "e": "WCEF 2026 was inaugurated in <b>Gandhinagar</b> (Gujarat) by Bhupender Yadav and Bhupendra Patel, co-organised by Finland's Sitra, MoEFCC, CPCB and the Gujarat Government.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "The 22nd edition of 'Yudh Abhyas' (September 2026), held at Auli and the Mahajan Field Firing Range, is a joint exercise between the armies of India and:", "o": ["Japan", "USA", "Russia", "France"], "a": 1, "e": "Yudh Abhyas is the India–<b>USA</b> army exercise; the US contingent came from the 11th Airborne Division.", "f": null, "p": null}, {"s": "D", "t": "Schemes 2026", "q": "The Pradhan Mantri Viksit Gram Swaraj Yojana, approved by the Union Cabinet in October 2026, is meant to strengthen:", "o": ["Panchayati Raj institutions", "Urban local bodies", "Rural roads and bridges network", "Village cooperative banks"], "a": 0, "e": "The ₹7,395.55-crore scheme (2026-27 to 2030-31) supports over 2.55 lakh <b>Panchayats</b> and traditional local bodies, including preparation of Gram Panchayat Development Plans.", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "Which feature of MS Word automatically corrects common typing mistakes, such as changing 'teh' to 'the'?", "o": ["AutoFormat", "Spell Check", "AutoCorrect", "AutoText"], "a": 2, "e": "<b>AutoCorrect</b> replaces common misspellings as you type (File → Options → Proofing → AutoCorrect Options).", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "In MS Word, the Line and Paragraph Spacing option is in which group of the Home tab?", "o": ["Styles", "Editing", "Page Setup", "Paragraph"], "a": 3, "e": "Line spacing, alignment, indents and bullets are in the <b>Paragraph</b> group of the Home tab.", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "In MS Word, the shortcut Ctrl + Shift + > is used to:", "o": ["Insert a symbol", "Change the text to superscript style", "Decrease the font size", "Increase the font size"], "a": 3, "e": "Ctrl + Shift + &gt; <b>increases the font size</b>; Ctrl + Shift + &lt; decreases it.", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "In MS Word 2019/365, a 'Watermark' is added from which tab?", "o": ["Design", "View", "Insert", "Review"], "a": 0, "e": "Watermark, Page Colour and Page Borders are in the <b>Design</b> tab (Page Background group).", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "What value will =MOD(17, 5) return in MS Excel?", "o": ["5", "3", "1", "2"], "a": 3, "e": "MOD returns the remainder: 17 = 5 × 3 + 2 ⇒ <b>2</b>.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "What will =ROUNDUP(12.341, 1) return in MS Excel?", "o": ["12.4", "12.34", "12", "12.3"], "a": 0, "e": "ROUNDUP always rounds away from zero to the given digits: 12.341 → <b>12.4</b>.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "What will =PROPER(\"odisha staff\") return in MS Excel?", "o": ["Odisha Staff", "ODISHA STAFF", "odisha staff", "Odisha staff"], "a": 0, "e": "PROPER capitalises the first letter of each word ⇒ <b>Odisha Staff</b>.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "In MS Excel 2019, the last column of a worksheet is labelled:", "o": ["XFD", "XFX", "ZZZ", "IV"], "a": 0, "e": "A worksheet has 16,384 columns (A to <b>XFD</b>) and 1,048,576 rows. IV was the last column in Excel 2003.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "Which shortcut inserts a new worksheet in MS Excel?", "o": ["Ctrl + Shift + N", "Ctrl + N", "Ctrl + F11", "Shift + F11"], "a": 3, "e": "<b>Shift + F11</b> inserts a new sheet; Ctrl + N opens a new workbook; Ctrl + F11 inserts a macro sheet.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "In MS Excel, the Conditional Formatting command is located on which tab?", "o": ["Review", "Insert", "Data", "Home"], "a": 3, "e": "<b>Home</b> → Styles group → Conditional Formatting.", "f": null, "p": null}, {"s": "E", "t": "MS PowerPoint", "q": "In MS PowerPoint, which feature lets the presenter jump to a particular slide by clicking a text or shape during the slide show?", "o": ["Transition", "Animation", "Handout", "Hyperlink"], "a": 3, "e": "A <b>hyperlink</b> (or Action setting) on text or a shape can be set to 'Place in This Document' to jump to any slide.", "f": null, "p": null}, {"s": "E", "t": "MS PowerPoint", "q": "Which is the default view of MS PowerPoint in which slides are created and edited?", "o": ["Slide Sorter", "Normal", "Notes Page", "Reading View"], "a": 1, "e": "<b>Normal</b> view shows the slide pane, thumbnails and notes, and is used for creating and editing slides.", "f": null, "p": null}, {"s": "E", "t": "MS PowerPoint", "q": "In MS PowerPoint, SmartArt graphics are inserted from which tab?", "o": ["View", "Insert", "Design", "Home"], "a": 1, "e": "<b>Insert</b> → Illustrations group → SmartArt.", "f": null, "p": null}, {"s": "E", "t": "MS Access", "q": "In MS Access, a query is mainly used to:", "o": ["Retrieve records that meet given criteria", "Print the whole database", "Design the layout of a form", "Encrypt the database file with a password for security"], "a": 0, "e": "A <b>query</b> retrieves (and can update) the records that meet given criteria from one or more tables.", "f": null, "p": null}, {"s": "E", "t": "MS Access", "q": "Which MS Access data type is used to store text longer than 255 characters?", "o": ["Short Text", "Hyperlink", "Number", "Long Text"], "a": 3, "e": "<b>Long Text</b> (earlier called Memo) stores large text; Short Text holds up to 255 characters.", "f": null, "p": null}, {"s": "E", "t": "E-mail", "q": "In an e-mail account, unwanted bulk messages detected by the mail service are moved automatically to which folder?", "o": ["Sent Items", "Spam", "Outbox", "Drafts"], "a": 1, "e": "Unsolicited bulk mail is filtered into the <b>Spam</b> (Junk) folder.", "f": null, "p": null}, {"s": "E", "t": "Internet", "q": "Which of the following is NOT a web browser?", "o": ["Firefox", "Opera", "Python", "Safari"], "a": 2, "e": "<b>Python</b> is a programming language; Firefox, Safari and Opera are web browsers.", "f": null, "p": null}, {"s": "E", "t": "Computer Basics", "q": "Which of the following is an example of an operating system?", "o": ["MS Excel", "Adobe Reader", "Linux", "Google Chrome"], "a": 2, "e": "<b>Linux</b> is an operating system; the others are application software.", "f": null, "p": null}, {"s": "E", "t": "Computer Basics", "q": "Which of the following is an output device?", "o": ["Microphone", "Plotter", "Joystick", "Scanner"], "a": 1, "e": "A <b>plotter</b> prints large drawings and graphs (output); the others are input devices.", "f": null, "p": null}, {"s": "E", "t": "Windows", "q": "In Windows, the shortcut Ctrl + A is used to:", "o": ["Select all items", "Add a new folder", "Align text left", "Open a new window"], "a": 0, "e": "<b>Ctrl + A</b> selects all items or all text in the active window or document.", "f": null, "p": null}], "passages": {"P1": "<div class=\"ptitle\">Directions (Q.36–40)</div><div>Read the information carefully and answer the questions.<br>An organisation has <b>500 employees</b>. 40% of them travel to the office by bus, 30% by metro and the rest by their own vehicles. Among the bus users, 60% are male. Among the metro users, 50% are female. 70 of the employees who use their own vehicles are female.</div>", "P2": "<div class=\"ptitle\">Directions (Q.41–45)</div><div>The const secRange = SECS.map(s=>{const idx=QS.map((q,i)=>q.s===s[0]?i:-1).filter(i=>i>=0);return [idx[0], idx[idx.length-1]];});

let S = load() || fresh();
function fresh(){return {stage:"login", name:"", roll:"", status:QS.map(()=>"nv"), saved:QS.map(()=>null), pending:null, cur:0, endAt:null, startedAt:null, submittedAt:null, filter:"all", fsec:"all"};}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function persist(){try{localStorage.setItem(KEY, JSON.stringify(S));}catch(e){}}
const $ = (s,el=document)=>el.querySelector(s);
const esc = t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function pad2(n){return String(n).padStart(2,"0");}

function footer(){
  return `<footer class="site-foot pad"><span>© 2026 <b>Gyana Education Service</b></span><span>${EXAM.title} · ${EXAM.test}</span><span>Helpline: <b>9776188019</b></span><a href="https://gyanaeducationservice.co.in/#library" style="color:#fff;font-weight:700">All mock tests</a></footer>`;
}
function topbar(right){
  return `<header class="topbar pad"><div class="logo" aria-hidden="true">GES</div>
  <div class="tb-text"><div class="tb-org">${EXAM.org}</div><div class="tb-exam">${EXAM.title} &nbsp;|&nbsp; ${EXAM.test}</div></div>
  <div class="tb-right">${right||"Computer Based Test (CBT)"}</div></header>`;
}

  return `<div class="tbl-wrap"><table class="pattern"><thead><tr><th>Section</th><th>Q. Nos.</th><th>Questions</th><th>Marks</th></tr></thead><tbody>${rows}<tr><td><b>Total</b></td><td></td><td class="n"><b>${QS.length}</b></td><td class="n"><b>${QS.length*EXAM.plus}</b></td></tr></tbody></table></div>`;
}
