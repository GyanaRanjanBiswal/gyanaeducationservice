<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gyana Education Service – OSSC CGLRE (Specialist) 2025 Preliminary Examination – Free Online CBT Mock Test-4 (TCS pattern)">
<title>OSSC CGLRE (Specialist) Prelim – Mock Test-4 | Gyana Education Service</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: TCS iON-style exam console — header strip, question pane left, palette right; light-only by design (mirrors the real exam screen) */
:root{
  --ink:#1b2430; --muted:#5d6b7c; --line:#cfd8e3; --paper:#ffffff; --wash:#eef3f8;
  --brand:#0b4f8a; --brand-2:#1167b1; --brand-ink:#ffffff; --head:#e9eef4;
  --ans:#2e9e3f; --nans:#e2502b; --nv:#e3e6ea; --nv-b:#b9c1cb; --mark:#6a3fb5; --gold:#f4b400;
  --ok:#1f8a3b; --ok-wash:#e5f5e8; --bad:#c8352a; --bad-wash:#fdeceb; --info-wash:#fff8e1;
  --f:Arial, "Helvetica Neue", Helvetica, "Noto Sans", sans-serif;
  color-scheme: light;
}
html,body{height:100%}
#app{height:100%}
body{background:var(--wash);color:var(--ink);font-family:var(--f);font-size:14px;}
*{box-sizing:border-box}
button{font-family:var(--f);cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.screen{min-height:100%;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top brand strip */
.topbar{background:var(--brand);color:var(--brand-ink);padding-block:8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px;border:2px solid var(--gold);flex:none}
.tb-text{min-width:0;flex:1 1 220px}
.tb-org{font-weight:700;letter-spacing:1.2px;font-size:15px}
.tb-exam{font-size:12.5px;opacity:.92}
.tb-right{font-size:12px;text-align:right;opacity:.92}

/* login */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding-block:28px}
.login{display:grid;grid-template-columns:1fr 1fr;max-width:860px;width:100%;background:var(--paper);border:1px solid var(--line);box-shadow:0 2px 10px rgba(11,79,138,.08)}
.login-info{background:var(--head);padding:24px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line)}
.login-info .row{display:flex;gap:8px;font-size:13.5px}
.login-info .k{color:var(--muted);min-width:118px}
.login-info .v{font-weight:700}
.login-form{padding:24px;display:flex;flex-direction:column;gap:12px}
.login-form h2{margin:0 0 4px;font-size:18px;color:var(--brand)}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:9px 10px;border:1px solid var(--nv-b);border-radius:3px;font-size:14px;font-family:var(--f)}
.btn{border:1px solid var(--nv-b);background:var(--paper);color:var(--ink);padding:9px 16px;border-radius:3px;font-size:13.5px}
.btn:hover{background:var(--head)}
.btn-primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff;font-weight:700}
.btn-primary:hover{background:var(--brand)}
.btn-primary:disabled{background:#9db8d3;border-color:#9db8d3;cursor:not-allowed}
.btn-green{background:var(--ans);border-color:var(--ans);color:#fff;font-weight:700}
.btn-green:hover{filter:brightness(.92)}
.note{font-size:12px;color:var(--muted);line-height:1.5}

/* instructions */
.instr{flex:1;padding-block:18px;display:flex;justify-content:center}
.instr-card{background:var(--paper);border:1px solid var(--line);max-width:980px;width:100%;display:flex;flex-direction:column}
.instr-head{background:var(--head);padding:12px 18px;font-weight:700;color:var(--brand);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.instr-body{padding:16px 22px;line-height:1.6;font-size:13.5px;overflow:auto}
.instr-body h3{font-size:14px;margin:14px 0 6px;color:var(--brand)}
.instr-body ol{padding-left:22px;margin:6px 0}
.instr-body li{margin-bottom:5px}
.legend-list{display:grid;gap:8px;margin:8px 0 8px 4px}
.legend-list div{display:flex;align-items:center;gap:10px}
.pattern{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.pattern th,.pattern td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.pattern th{background:var(--head)}
.pattern td.n{text-align:center;font-variant-numeric:tabular-nums}
.instr-foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;flex-direction:column;gap:12px}
.declare{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5}
.declare input{margin-top:3px;width:16px;height:16px;flex:none}
.instr-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* exam */
.exam{height:100%;display:flex;flex-direction:column}
.exam-main{flex:1;display:flex;min-height:0}
.qpane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper);border-right:1px solid var(--line)}
.secbar{display:flex;align-items:center;gap:8px;background:var(--head);border-bottom:1px solid var(--line);padding-block:6px;flex-wrap:wrap}
.secbar .lbl{font-weight:700;font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.tab{border:1px solid var(--nv-b);background:var(--paper);padding:6px 10px;font-size:12.5px;border-radius:3px 3px 0 0;color:var(--brand)}
.tab.on{background:var(--brand-2);color:#fff;border-color:var(--brand-2);font-weight:700}
.timer{font-weight:700;font-size:13px;background:var(--paper);border:1px solid var(--nv-b);padding:6px 10px;border-radius:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer b{color:var(--brand)}
.timer.low b{color:var(--bad)}
.qtype{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;padding-block:7px;border-bottom:1px solid var(--line);color:var(--muted)}
.qtype .mk span{color:var(--ok);font-weight:700}
.qtype .mk em{color:var(--bad);font-style:normal;font-weight:700}
.qhead{display:flex;justify-content:space-between;align-items:center;padding-block:9px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.qhead h2{margin:0;font-size:15px}
.qhead .lang{font-size:12px;color:var(--muted)}
.qhead select{font-size:12px;padding:2px 4px}
.qbody{flex:1;overflow:auto;padding-block:14px 20px;min-height:0}
.qtext{font-size:calc(15.5px*var(--fs,1));line-height:1.65;max-width:78ch}
.qtext b{font-weight:700}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px;max-width:78ch}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border:1px solid transparent;border-radius:3px;cursor:pointer;font-size:calc(15px*var(--fs,1));line-height:1.5}
.opt:hover{background:#f3f7fb;border-color:var(--line)}
.opt input{margin-top:4px;width:16px;height:16px;flex:none;accent-color:var(--brand-2)}
.opt.sel{background:#eaf2fb;border-color:#a9c6e6}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--head);padding-block:9px;padding-bottom:max(9px,env(safe-area-inset-bottom,0px))}
.actions .l{display:flex;gap:8px;flex-wrap:wrap}

/* palette */
.palette{width:300px;flex:none;display:flex;flex-direction:column;background:#f7f9fc;min-height:0}
.cand{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.cand svg{width:50px;height:58px;flex:none;border:1px solid var(--line);background:var(--head)}
.cand .nm{font-weight:700;font-size:13.5px;word-break:break-word}
.cand .roll{font-size:12px;color:var(--muted)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:11.5px;line-height:1.25}
.legend .it{display:flex;align-items:center;gap:6px}
.legend .it.wide{grid-column:1/-1}
.pal-sec{background:var(--brand-2);color:#fff;font-weight:700;font-size:12.5px;padding:6px 12px}
.pal-choose{font-size:12px;color:var(--muted);padding:8px 12px 2px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:9px 6px;padding:8px 12px 12px;align-content:start;min-height:0}
.pal-foot{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:var(--head);padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.pal-foot .btn-green{grid-column:1/-1}

/* status shapes */
.st{width:38px;height:33px;display:inline-grid;place-items:center;font-size:12.5px;font-weight:700;position:relative;border:1px solid transparent;font-variant-numeric:tabular-nums;flex:none;padding:0}
.st.sm{width:28px;height:25px;font-size:11px}
.st.nv{background:var(--nv);border-color:var(--nv-b);color:var(--ink);border-radius:3px}
.st.na{background:var(--nans);color:#fff;border-radius:2px 2px 14px 14px / 2px 2px 9px 9px}
.st.an{background:var(--ans);color:#fff;border-radius:14px 14px 2px 2px / 9px 9px 2px 2px}
.st.mk{background:var(--mark);color:#fff;border-radius:50%}
.st.am{background:var(--mark);color:#fff;border-radius:50%}
.st.am::after{content:"";position:absolute;right:-3px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--ans);border:2px solid #fff;box-sizing:border-box}
.st.sm.am::after{width:10px;height:10px;right:-3px;bottom:-2px}
.grid .st{justify-self:center;cursor:pointer}
.grid .st.cur{outline:2px solid var(--gold);outline-offset:2px}

/* figures */
.fig{margin:14px 0 4px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.word{font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:30px;letter-spacing:2px;color:#13294b;padding:6px 14px;border:1px dashed var(--nv-b);background:#fff}
.mirror-line{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:2px}
.mirror-line i{display:block;width:4px;height:58px;background:linear-gradient(#6aa3db,#2b6cb0)}
.water-wrap{display:flex;flex-direction:column;gap:3px}
.water-line{height:5px;background:repeating-linear-gradient(90deg,#4a90d9 0 10px,#9cc5ef 10px 20px);border-radius:3px}
.optfig{display:inline-block;font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:22px;letter-spacing:2px;color:#13294b}
.optfig.M{transform:scaleX(-1)} .optfig.W{transform:scaleY(-1)} .optfig.R{transform:rotate(180deg)}
.dice{display:flex;gap:26px;flex-wrap:wrap}
.dice figure{margin:0;text-align:center;font-size:12px;color:var(--muted)}
.dice svg{width:120px;height:120px;display:block}

.figimg{display:block;max-width:100%;height:auto;border:1px solid var(--line);background:#fff;margin:8px 0;cursor:zoom-in}
.zoomwrap{overflow:auto;max-height:75vh}.zoomwrap img{display:block;width:760px;max-width:none;height:auto}
.zhint{font-size:11.5px;color:var(--muted);margin:2px 0 0}
.passage{background:#f6f9fd;border:1px solid #c9d8ea;border-left:4px solid var(--brand-2);padding:10px 12px;margin:0 0 14px;font-size:calc(14px*var(--fs,1));line-height:1.6;max-width:78ch}
.passage summary{cursor:pointer;font-weight:700;color:var(--brand)}
.ptitle{font-weight:700;color:var(--brand);margin-bottom:4px}
.ptbl{overflow-x:auto;margin-top:8px}
.ptbl table{border-collapse:collapse;font-size:13.5px;background:#fff;min-width:320px}
.ptbl th,.ptbl td{border:1px solid #b9c7d8;padding:5px 9px;text-align:center}
.ptbl th{background:#e3ecf6}
.ptbl td:first-child{text-align:left;font-weight:700}
.fsz{display:inline-flex;gap:4px;align-items:center;margin-left:8px}
.fsz button{padding:2px 8px;font-size:12px}
.btn-out{border-color:#c8352a;color:#c8352a;font-weight:700}
.btn-out:hover{background:#fdeceb}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,30,50,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--paper);max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal-h{background:var(--brand);color:#fff;padding:10px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-h button{background:transparent;border:0;color:#fff;font-size:20px;line-height:1}
.modal-b{padding:14px 16px;overflow:auto}
.modal-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
.sumtbl{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.sumtbl th,.sumtbl td{border:1px solid var(--line);padding:7px 8px;text-align:center;font-variant-numeric:tabular-nums}
.sumtbl th{background:var(--head);font-size:12px}
.sumtbl td:first-child,.sumtbl th:first-child{text-align:left}
.sumtbl tr.tot td{font-weight:700;background:#f7f9fc}
.qp-item{border-bottom:1px solid var(--line);padding:10px 0;font-size:13.5px;line-height:1.55}
.qp-item .n{font-weight:700;color:var(--brand)}

/* result */
.result{flex:1;padding-block:18px 30px;display:flex;flex-direction:column;align-items:center;gap:16px}
.rcard{background:var(--paper);border:1px solid var(--line);max-width:1000px;width:100%}
.rhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.rhead h2{margin:0;font-size:18px;color:var(--brand)}
.score-row{display:grid;grid-template-columns:auto 1fr;gap:22px;padding:18px;align-items:center}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:30px;display:block;font-variant-numeric:tabular-nums}
.ring .c span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;width:100%}
.stat{border:1px solid var(--line);padding:10px 12px}
.stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.stat.ok .v{color:var(--ok)} .stat.bad .v{color:var(--bad)}
.verdict{margin:0 18px 16px;padding:10px 14px;background:var(--info-wash);border:1px solid #f1d68a;font-size:13.5px;line-height:1.5}
.secbars{padding:4px 18px 18px;display:grid;gap:10px}
.sb{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.sb .bar{height:14px;background:var(--nv);position:relative;overflow:hidden;border-radius:2px}
.sb .bar i{position:absolute;inset:0 auto 0 0;background:var(--brand-2)}
.sb .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center}
.chip{border:1px solid var(--nv-b);background:var(--paper);padding:5px 10px;border-radius:14px;font-size:12.5px}
.chip.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.sol{padding:14px 18px;border-bottom:1px solid var(--line)}
.sol-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.pill{padding:2px 8px;border-radius:10px;font-weight:700;font-size:11.5px}
.pill.ok{background:var(--ok-wash);color:var(--ok)} .pill.bad{background:var(--bad-wash);color:var(--bad)} .pill.skip{background:var(--nv);color:var(--muted)}
.sol .qtext{font-size:14.5px}
.sopts{display:grid;gap:6px;margin:10px 0}
.sopt{padding:7px 10px;border:1px solid var(--line);border-radius:3px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.sopt .L{font-weight:700;color:var(--muted);flex:none}
.sopt.right{background:var(--ok-wash);border-color:#9fd3ac}
.sopt.wrong{background:var(--bad-wash);border-color:#efb1ab}
.sopt .tag{margin-left:auto;font-size:11.5px;font-weight:700;white-space:nowrap}
.sopt.right .tag{color:var(--ok)} .sopt.wrong .tag{color:var(--bad)}
.exp{background:#f4f8fc;border-left:3px solid var(--brand-2);padding:9px 12px;font-size:13.5px;line-height:1.6}
.exp h4{margin:0 0 4px;font-size:12px;letter-spacing:.6px;color:var(--brand);text-transform:uppercase}
.empty{padding:22px 18px;color:var(--muted)}

.palette-toggle{display:none}
.site-foot{flex:none;min-height:64px;display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;background:#0a3f6e;color:#dbe8f6;font-size:12px;padding-block:8px;padding-right:max(210px,env(safe-area-inset-right,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.site-foot b{color:#fff}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff8e1;border:1px solid #f1d68a;color:#5b4300;padding:10px 16px;font-weight:700;font-size:13.5px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.15);max-width:calc(100% - 32px);text-align:center}
.cta{margin:0 18px 16px;padding:12px 14px;border:1px solid #9fc0e3;background:#eef5fc;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:13.5px;line-height:1.5}
.cta a,.ractions a{text-decoration:none}
.btn-wa{background:#1f9d55;border-color:#1f9d55;color:#fff;font-weight:700;display:inline-block}
.btn-wa:hover{filter:brightness(.92)}
.topics{padding:0 18px 18px}
.topics h3{font-size:14px;margin:0 0 8px;color:var(--brand)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid #efb1ab;background:var(--bad-wash);color:#7a1f17;padding:4px 10px;border-radius:12px;font-size:12.5px}
.tchip b{font-variant-numeric:tabular-nums}
.ractions{display:flex;gap:8px;flex-wrap:wrap}
.result{padding-bottom:84px}
@media print{.topbar .tb-right,.site-foot,.ractions,#filters,.cta,#logout,#retake,.toast{display:none!important}body{background:#fff}.rcard{border:0}.sol{break-inside:avoid}}
@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login-info{border-right:0;border-bottom:1px solid var(--line)}
  .palette{position:fixed;top:0;right:0;bottom:0;width:min(320px,88vw);z-index:40;box-shadow:-6px 0 18px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px)}
  .palette.open{transform:none}
  .palette{bottom:64px}
  .site-foot{padding-right:max(170px,env(safe-area-inset-right,0px));font-size:11px}
  .site-foot span:nth-child(2){display:none}
  .palette-toggle{display:inline-block}
  .tb-right{flex:1 1 100%;text-align:left}
  .exam .tb-right{display:none}
  .secbar .lbl{display:none}
  .tabs{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .tab{white-space:nowrap;flex:none}
  .timer{margin-right:auto}
  .score-row{grid-template-columns:1fr;justify-items:center}
  .sb{grid-template-columns:110px 1fr 56px}
  .qtext{font-size:calc(15px*var(--fs,1))}
  .secbar{gap:6px}
  .timer{font-size:12.5px;padding:5px 8px}
}
@media (prefers-reduced-motion:reduce){.palette{transition:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const DATA = {"sections": [["A", "Arithmetic"], ["B", "Data Interpretation"], ["C", "Reasoning & GMA"], ["D", "Current Events"], ["E", "Computer Awareness"]], "qs": [{"s": "A", "t": "Number System", "q": "What is the smallest five-digit number that is exactly divisible by 41?", "o": ["10,045", "10,041", "10,004", "10,025"], "a": 2, "e": "10,000 ÷ 41 = 243, remainder 37 ⇒ add 41 − 37 = 4 ⇒ <b>10,004</b> (= 41 × 244).", "f": null, "p": null}, {"s": "A", "t": "LCM & HCF", "q": "The LCM of two numbers is 12 times their HCF, and the sum of the HCF and the LCM is 403. If one number is 93, what is the other?", "o": ["112", "124", "134", "155"], "a": 1, "e": "HCF = h, LCM = 12h ⇒ 13h = 403 ⇒ h = 31, LCM = 372.<br>Other number = (31 × 372) ÷ 93 = <b>124</b>.", "f": null, "p": null}, {"s": "A", "t": "LCM & HCF", "q": "The product of two two-digit numbers is 2,028 and their HCF is 13. What is the greater number?", "o": ["65", "52", "39", "78"], "a": 1, "e": "Numbers = 13a and 13b with a, b co-prime ⇒ 169ab = 2,028 ⇒ ab = 12 ⇒ (a, b) = (3, 4) gives 39 and 52 (both two-digit; (1, 12) gives 13 and 156) ⇒ greater = <b>52</b>.", "f": null, "p": null}, {"s": "A", "t": "Simplification", "q": "Find the value of (587 + 413)² − 4 × 587 × 413.", "o": ["30,726", "31,276", "29,276", "30,276"], "a": 3, "e": "(a + b)² − 4ab = (a − b)² = (587 − 413)² = 174² = <b>30,276</b>.", "f": null, "p": null}, {"s": "A", "t": "Number Puzzle", "q": "In a three-digit number, the hundreds digit is twice the units digit, and the tens digit is the sum of the other two digits. If the sum of all three digits is 18, what is the number?", "o": ["639", "963", "693", "396"], "a": 2, "e": "Let units = u ⇒ hundreds = 2u, tens = 3u ⇒ 6u = 18 ⇒ u = 3 ⇒ number = <b>693</b>.", "f": null, "p": null}, {"s": "A", "t": "Fractions", "q": "A spent 1/4 of his life as a child, 1/5 as a youth and 1/3 as an adult, and the remaining 13 years in old age. At what age did he die?", "o": ["60 years", "72 years", "65 years", "56 years"], "a": 0, "e": "Fraction for old age = 1 − (1/4 + 1/5 + 1/3) = 1 − 47/60 = 13/60 = 13 years ⇒ life = <b>60 years</b>.", "f": null, "p": null}, {"s": "A", "t": "Fractions", "q": "Three friends shared a bill. Anil paid half of what Bina paid, and Bina paid two-thirds of what Chetan paid. What fraction of the bill did Chetan pay?", "o": ["1/3", "1/2", "2/5", "3/5"], "a": 1, "e": "Let Chetan = 3 ⇒ Bina = 2, Anil = 1 ⇒ total 6 ⇒ Chetan paid 3/6 = <b>1/2</b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage", "q": "In a village, 60% of the men and 40% of the women are literate. If men and women are in the ratio 3 : 2, what percentage of the village is literate?", "o": ["50%", "48%", "56%", "52%"], "a": 3, "e": "Literate = (0.6 × 3 + 0.4 × 2)/5 = 2.6/5 = <b>52%</b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage", "q": "In an office, employees and managers are in the ratio 4 : 1. If 75% of the employees and 40% of the managers travel by metro, what percentage of the total staff travels by metro?", "o": ["72%", "57.5%", "68%", "64%"], "a": 2, "e": "(0.75 × 4 + 0.40 × 1)/5 = 3.4/5 = <b>68%</b>.", "f": null, "p": null}, {"s": "A", "t": "Successive Percentage", "q": "The price of a TV was first increased by 20% and then decreased by 20%. If the final price is ₹9,600, what was the original price?", "o": ["₹10,400", "₹9,600", "₹9,800", "₹10,000"], "a": 3, "e": "Net effect = 1.2 × 0.8 = 0.96 ⇒ original = 9,600 ÷ 0.96 = <b>₹10,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Profit & Loss", "q": "The profit made by selling an article for ₹1,560 is equal to the loss incurred by selling it for ₹1,240. At what price should it be sold to earn a 20% profit?", "o": ["₹1,680", "₹1,800", "₹1,600", "₹1,720"], "a": 0, "e": "CP = (1,560 + 1,240)/2 = ₹1,400 ⇒ SP for 20% profit = 1,400 × 1.2 = <b>₹1,680</b>.", "f": null, "p": null}, {"s": "A", "t": "Average Cost", "q": "A family buys rice at ₹40, ₹50 and ₹60 per kg in three successive months, spending ₹6,000 each month. What is the approximate average cost per kg?", "o": ["₹48.65", "₹49.20", "₹50.00", "₹47.50"], "a": 0, "e": "Quantity = 150 + 120 + 100 = 370 kg for ₹18,000 ⇒ average = 18,000 ÷ 370 ≈ <b>₹48.65</b> per kg (the harmonic mean, not the simple average).", "f": null, "p": null}, {"s": "A", "t": "Simple Interest", "q": "A sum of ₹12,000 is lent partly at 8% and partly at 10% per annum simple interest. If the total interest for one year is ₹1,060, how much was lent at 10%?", "o": ["₹5,000", "₹7,000", "₹4,500", "₹6,000"], "a": 0, "e": "Let ₹x be at 8%: 0.08x + 0.10(12,000 − x) = 1,060 ⇒ 1,200 − 0.02x = 1,060 ⇒ x = 7,000 ⇒ at 10% = <b>₹5,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Compound Interest", "q": "At what rate of compound interest per annum will ₹6,400 amount to ₹7,225 in 2 years?", "o": ["6.25%", "6%", "6.5%", "6.75%"], "a": 0, "e": "7,225/6,400 = (85/80)² = (1 + 1/16)² ⇒ rate = 1/16 = <b>6.25%</b>.", "f": null, "p": null}, {"s": "A", "t": "Partnership", "q": "A starts a business with ₹30,000. After 4 months B joins with ₹40,000, and after another 2 months C joins with ₹50,000. Out of a profit of ₹49,000 at the end of the year, what is C's share?", "o": ["₹15,000", "₹18,000", "₹14,000", "₹16,000"], "a": 0, "e": "A: 30,000 × 12 = 3,60,000; B: 40,000 × 8 = 3,20,000; C: 50,000 × 6 = 3,00,000 ⇒ 36 : 32 : 30.<br>C = 30/98 × 49,000 = <b>₹15,000</b>.", "f": null, "p": null}, {"s": "A", "t": "Ratio", "q": "If A : B = 3 : 4, B : C = 5 : 6 and C − A = 27, what is the value of B?", "o": ["72", "48", "60", "45"], "a": 2, "e": "A : B : C = 15 : 20 : 24 ⇒ C − A = 9 parts = 27 ⇒ 1 part = 3 ⇒ B = 20 × 3 = <b>60</b>.", "f": null, "p": null}, {"s": "A", "t": "Problems on Ages", "q": "Three years hence, Mira will be three times as old as she was 9 years ago. What is her present age?", "o": ["21 years", "18 years", "15 years", "12 years"], "a": 2, "e": "x + 3 = 3(x − 9) ⇒ x + 3 = 3x − 27 ⇒ x = <b>15 years</b>.", "f": null, "p": null}, {"s": "A", "t": "Provisions", "q": "A camp has food for 500 men for 27 days. After 3 days, 100 men leave the camp. For how many more days will the remaining food last?", "o": ["28 days", "32 days", "24 days", "30 days"], "a": 3, "e": "Food left = 500 × 24 man-days ⇒ for 400 men it lasts 500 × 24 ÷ 400 = <b>30 days</b>.", "f": null, "p": null}, {"s": "A", "t": "Work & Time", "q": "A can finish a work in 12 days. After A has worked alone for 4 days, B joins him and they finish the remaining work in 4 more days. In how many days can B alone finish the whole work?", "o": ["10 days", "12 days", "8 days", "15 days"], "a": 1, "e": "A works 8 days in all ⇒ does 8/12 = 2/3. B does the remaining 1/3 in 4 days ⇒ B alone = <b>12 days</b>.", "f": null, "p": null}, {"s": "A", "t": "Wages", "q": "A worker is paid ₹50 per hour for up to 8 hours a day and ₹75 per hour for overtime. In a 6-day week he earned ₹3,150. How many hours of overtime did he work?", "o": ["10 hours", "9 hours", "14 hours", "12 hours"], "a": 0, "e": "Regular pay = 6 × 8 × 50 = ₹2,400 ⇒ overtime pay = ₹750 ⇒ 750 ÷ 75 = <b>10 hours</b>.", "f": null, "p": null}, {"s": "A", "t": "Time Allocation", "q": "A test has 120 questions to be solved in 2 hours, of which 30 are on Mathematics. If each Mathematics question needs twice the time of any other question, how many minutes should be spent on Mathematics?", "o": ["40 minutes", "50 minutes", "60 minutes", "48 minutes"], "a": 3, "e": "Time units: 30 × 2 + 90 × 1 = 150 units = 120 min ⇒ 1 unit = 0.8 min ⇒ Mathematics = 60 × 0.8 = <b>48 minutes</b>.", "f": null, "p": null}, {"s": "A", "t": "Trains", "q": "Stations P and Q are 330 km apart. A train leaves P at 8 a.m. for Q at 60 km/h, and another train leaves Q at 9 a.m. for P at 75 km/h. At what time will they meet?", "o": ["12 noon", "11 a.m.", "11:30 a.m.", "10:30 a.m."], "a": 1, "e": "By 9 a.m. the first train covers 60 km ⇒ gap 270 km closed at 135 km/h ⇒ 2 hours ⇒ <b>11 a.m.</b>", "f": null, "p": null}, {"s": "A", "t": "Average Speed", "q": "Ravi drives to a town at 30 km/h and returns at 60 km/h. Mohan drives both ways at 45 km/h. If they start together, who returns first?", "o": ["Ravi", "Cannot be determined", "Mohan", "Both at the same time"], "a": 2, "e": "Ravi's average speed = 2 × 30 × 60/90 = 40 km/h &lt; 45 km/h ⇒ <b>Mohan</b> returns first.", "f": null, "p": null}, {"s": "A", "t": "Clock", "q": "Through how many degrees does the hour hand of a clock turn from 10:00 a.m. to 2:30 p.m.?", "o": ["150°", "145°", "120°", "135°"], "a": 3, "e": "4½ hours × 30° per hour = <b>135°</b>.", "f": null, "p": null}, {"s": "A", "t": "Counting", "q": "There are 3 roads from A to B and 4 roads from B to C. In how many ways can a man go from A to C via B and return to A via B without using any road twice?", "o": ["24", "72", "144", "48"], "a": 1, "e": "Going: 3 × 4 = 12 ways; returning on different roads: 3 × 2 = 6 ways ⇒ 12 × 6 = <b>72</b>.", "f": null, "p": null}, {"s": "A", "t": "Counting", "q": "Poles are fixed at every 5 m along the boundary of a square garden of side 60 m, with one pole at each corner. How many poles are needed?", "o": ["44", "49", "48", "52"], "a": 2, "e": "Perimeter = 240 m; on a closed boundary, number of poles = 240 ÷ 5 = <b>48</b>.", "f": null, "p": null}, {"s": "A", "t": "Geometric Progression", "q": "A ball dropped from a height of 64 m rebounds to half the height each time. What total distance does it travel before coming to rest?", "o": ["192 m", "256 m", "160 m", "128 m"], "a": 0, "e": "Down 64 m, then up and down 2 × (32 + 16 + 8 + …) = 2 × 64 = 128 m ⇒ total = <b>192 m</b>.", "f": null, "p": null}, {"s": "A", "t": "HCF Application", "q": "What is the least number of square tiles needed to pave a floor 15 m 17 cm long and 9 m 2 cm broad?", "o": ["902", "740", "841", "814"], "a": 3, "e": "Largest tile side = HCF(1,517, 902) cm = 41 cm (1,517 = 37 × 41, 902 = 22 × 41) ⇒ tiles = 37 × 22 = <b>814</b>.", "f": null, "p": null}, {"s": "A", "t": "Number Puzzle", "q": "A man has ₹480 in notes of ₹1, ₹5 and ₹10, the number of notes of each kind being equal. What is the total number of notes?", "o": ["120", "90", "60", "45"], "a": 1, "e": "Let each be n ⇒ n(1 + 5 + 10) = 480 ⇒ n = 30 ⇒ total = 3 × 30 = <b>90</b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "A cube is cut into 8 equal smaller cubes. By what per cent does the total surface area increase?", "o": ["100%", "200%", "300%", "50%"], "a": 0, "e": "Edge a → 8 cubes of edge a/2. Total area = 8 × 6(a/2)² = 12a² vs 6a² ⇒ increase = <b>100%</b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "The perimeter of a semicircle is 72 cm. What is its radius? (π = 22/7)", "o": ["12 cm", "21 cm", "18 cm", "14 cm"], "a": 3, "e": "Perimeter = πr + 2r = r(22/7 + 2) = 36r/7 = 72 ⇒ r = <b>14 cm</b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "The radius of a cylinder is halved and its height is doubled. What happens to its volume?", "o": ["It becomes double", "It remains the same", "It becomes one-fourth", "It becomes half"], "a": 3, "e": "V = πr²h ⇒ π(r/2)²(2h) = πr²h/2 ⇒ the volume <b>becomes half</b>.", "f": null, "p": null}, {"s": "A", "t": "Speed & Distance", "q": "A man completes a journey in 6 hours, travelling the first half of the distance at 40 km/h and the second half at 60 km/h. What is the total distance?", "o": ["276 km", "288 km", "240 km", "300 km"], "a": 1, "e": "d/2 ÷ 40 + d/2 ÷ 60 = 6 ⇒ d/80 + d/120 = 6 ⇒ 5d/240 = 6 ⇒ d = <b>288 km</b>.", "f": null, "p": null}, {"s": "A", "t": "Discount", "q": "A trader allows a discount of 20% on the marked price and also gives one article free with every four bought. If he still gains 28%, by what per cent is the marked price above the cost price?", "o": ["100%", "60%", "120%", "80%"], "a": 0, "e": "For 5 articles: SP = 4 × 0.8 M = 3.2M; CP = 5C. 3.2M = 1.28 × 5C = 6.4C ⇒ M = 2C ⇒ marked <b>100%</b> above cost.", "f": null, "p": null}, {"s": "A", "t": "Average", "q": "The average weight of 10 persons increases by 1.5 kg when one of them, weighing 58 kg, is replaced by a new person. What is the weight of the new person?", "o": ["68 kg", "74.5 kg", "70 kg", "73 kg"], "a": 3, "e": "Increase in total = 10 × 1.5 = 15 kg ⇒ new person = 58 + 15 = <b>73 kg</b>.", "f": null, "p": null}, {"s": "B", "t": "DI – Line Graph", "q": "In which year was the difference between the urban and rural unemployment rates the least?", "o": ["2022-23", "2021-22", "2020-21", "2023-24"], "a": 0, "e": "Gaps: 3.2, 2.8, <b>2.4</b>, 2.6, 2.6 ⇒ least in <b>2022-23</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Line Graph", "q": "The urban unemployment rate of 2024-25 is approximately what per cent more than the rural rate of 2020-21?", "o": ["17%", "15%", "20%", "12%"], "a": 0, "e": "(6.1 − 5.2)/5.2 × 100 ≈ 17.3% ⇒ about <b>17%</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Line Graph", "q": "What is the ratio of the urban unemployment rate in 2023-24 to that in 2021-22?", "o": ["7 : 10", "33 : 50", "16 : 11", "11 : 16"], "a": 3, "e": "6.6 : 9.6 = 66 : 96 = <b>11 : 16</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Line Graph", "q": "Which of the following is certainly true about the trends shown in the graph?", "o": ["The urban rate rose every year", "The urban rate was higher than the rural rate in every year", "The gap between the urban and the rural rates narrowed in every single year", "The rural rate fell every year"], "a": 1, "e": "Urban &gt; rural in all five years. The rural rate rose in 2021-22, the gap rose in 2023-24, and the urban rate mostly fell.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Line Graph", "q": "In which year was the fall in the rural unemployment rate, compared with the previous year, the greatest?", "o": ["2023-24", "2024-25", "2022-23", "2021-22"], "a": 2, "e": "Changes: 2021-22 +1.6, 2022-23 −2.2, 2023-24 −0.6, 2024-25 −0.5 ⇒ greatest fall in <b>2022-23</b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Bar Graph", "q": "In which year was the difference between the growth rates of State X and India the greatest?", "o": ["2023-24", "2021-22", "2022-23", "2019-20"], "a": 0, "e": "Differences: 1.5, 0.9, 1.5, 1.5, <b>1.8</b> ⇒ <b>2023-24</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Bar Graph", "q": "Which of the following can be certainly inferred from the graph?", "o": ["State X's growth rate was higher than India's growth rate in every year", "State X grew faster than India in four of the five years", "State X's growth rate was highest in 2023-24", "India's growth rate rose every year"], "a": 1, "e": "X was lower only in 2020-21 (3.2 vs 4.1) ⇒ faster in <b>four of the five years</b>. X's highest rate was in 2021-22 (11.8%).", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Bar Graph", "q": "What is the ratio of the growth rate of State X in 2020-21 to that of India in 2022-23?", "o": ["16 : 31", "32 : 59", "59 : 32", "8 : 15"], "a": 1, "e": "3.2 : 5.9 = <b>32 : 59</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Bar Graph", "q": "If the industrial output of State X in 2020-21 was ₹500 thousand crore, what was it in 2021-22?", "o": ["₹511.8 thousand crore", "₹618 thousand crore", "Cannot be determined", "₹559 thousand crore"], "a": 3, "e": "Growth of 11.8% in 2021-22 ⇒ 500 × 1.118 = <b>₹559 thousand crore</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Bar Graph", "q": "What is the average growth rate of India over the five years?", "o": ["6.34%", "6.12%", "6.50%", "5.98%"], "a": 0, "e": "(5.0 + 4.1 + 10.3 + 5.9 + 6.4) ÷ 5 = 31.7 ÷ 5 = <b>6.34%</b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Pie Chart", "q": "What is the central angle of the Fallow land sector?", "o": ["36°", "43.2°", "40.5°", "48.6°"], "a": 1, "e": "12% of 360° = <b>43.2°</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "If all the Barren land is turned into Forest, what will be the central angle of the Forest sector?", "o": ["144°", "115.2°", "151.2°", "136.8°"], "a": 0, "e": "Forest becomes 32 + 8 = 40% ⇒ 40% of 360° = <b>144°</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "If the Net sown area is 1,80,000 hectares, what is the area under Pastures?", "o": ["36,000 hectares", "40,000 hectares", "24,000 hectares", "30,000 hectares"], "a": 3, "e": "36% = 1,80,000 ha ⇒ 1% = 5,000 ha ⇒ Pastures (6%) = <b>30,000 hectares</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "Which of the following can be inferred from the pie chart?", "o": ["Net sown area covers more than half of the district", "Fallow land is more than double the combined area of Pastures and Barren land", "Forest and Net sown area together cover more than two-thirds of the district", "Forest land is larger than the Net sown area"], "a": 2, "e": "32 + 36 = 68% &gt; 66.7% ⇒ true. Net sown is 36% (not &gt; 50%), forest 32% &lt; 36%, and fallow 12% &lt; 2 × 14%.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie Chart", "q": "What is the ratio of Fallow land to Net sown area?", "o": ["2 : 5", "1 : 3", "1 : 4", "3 : 1"], "a": 1, "e": "12 : 36 = <b>1 : 3</b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Table", "q": "In 2021-22, rice production was approximately what per cent of the total production?", "o": ["45.0%", "47.3%", "46.1%", "44.2%"], "a": 2, "e": "820 ÷ 1,780 × 100 ≈ <b>46.1%</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Table", "q": "Which of the following statements can be inferred from the table?", "o": ["In 2022-23, vegetables formed more than one-fourth of the total", "Oilseed production was highest in 2023-24", "In 2023-24, rice formed more than 45% of the total production", "Production of every crop increased every year"], "a": 2, "e": "2023-24: 960/2,100 = 45.7% ⇒ true. Pulses fell in 2022-23 and oilseeds in 2023-24; vegetables in 2022-23 = 480/1,955 = 24.6%.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Table", "q": "What is the ratio of sugarcane production in 2023-24 to that in 2021-22?", "o": ["13 : 12", "6 : 5", "10 : 13", "13 : 10"], "a": 3, "e": "390 : 300 = <b>13 : 10</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Table", "q": "What is the ratio of pulses to oilseeds production in 2021-22?", "o": ["8 : 7", "4 : 3", "6 : 5", "3 : 4"], "a": 1, "e": "120 : 90 = <b>4 : 3</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Table", "q": "Rice production in 2022-23 is how many times the vegetable production in 2021-22?", "o": ["2.5 times", "1.5 times", "Three times", "Two times"], "a": 3, "e": "900 ÷ 450 = <b>2 times</b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Table (Percentage)", "q": "The number of absent students of schools A and C together is approximately what per cent of the boys present in these two schools?", "o": ["29.2%", "25.0%", "27.8%", "31.5%"], "a": 0, "e": "Absent: A 120 + C 180 = 300. Boys present: A 1,080 × 55% = 594; C 720 × 60% = 432 ⇒ 1,026.<br>300/1,026 × 100 ≈ <b>29.2%</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Table (Percentage)", "q": "What is the ratio of boys present in schools D and E together to girls present in these two schools?", "o": ["664 : 521", "521 : 664", "4 : 3", "332 : 263"], "a": 0, "e": "D: present 850 (girls 510, boys 340); E: present 1,520 (girls 532, boys 988).<br>Boys 1,328 : girls 1,042 = <b>664 : 521</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Table (Percentage)", "q": "What is the difference between the number of boys present in school A and girls present in school D?", "o": ["84", "108", "72", "96"], "a": 0, "e": "Boys present in A = 594; girls present in D = 510 ⇒ difference = <b>84</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Table (Percentage)", "q": "If boys and girls among the absent students of school C are in the ratio 3 : 2, what is the ratio of total boys to total girls enrolled in school C?", "o": ["2 : 3", "3 : 2", "5 : 4", "7 : 5"], "a": 1, "e": "Present 720: girls 288, boys 432. Absent 180: boys 108, girls 72.<br>Boys 540 : girls 360 = <b>3 : 2</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Table (Percentage)", "q": "What is the average number of absent students in schools A, C and D?", "o": ["150", "135", "160", "140"], "a": 0, "e": "Absent: A 120, C 180, D 150 ⇒ 450 ÷ 3 = <b>150</b>.", "f": null, "p": "P5"}, {"s": "B", "t": "Data Sufficiency", "q": "What is the value of the integer x?<br>I. x² = 49<br>II. 2x + 3 = 17", "o": ["Statement I alone is sufficient", "Even I and II together are not sufficient", "Both I and II together are needed", "Statement II alone is sufficient"], "a": 3, "e": "I gives x = 7 or −7 (not unique). II gives x = 7 ⇒ <b>Statement II alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "Who is the tallest among P, Q and R?<br>I. P is taller than both Q and R.<br>II. Q and R are both shorter than P.", "o": ["Both I and II together are needed", "Even I and II together are not sufficient", "Either I or II alone is sufficient", "Statement I alone is sufficient"], "a": 2, "e": "Each statement alone says P is taller than the other two ⇒ <b>either I or II alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "What is the average speed of the car?<br>I. It covers 150 km in 2.5 hours.<br>II. It is faster than a bus running at 50 km/h.", "o": ["Statement II alone is sufficient", "Both I and II together are needed", "Statement I alone is sufficient", "Even I and II together are not sufficient"], "a": 2, "e": "I: 150 ÷ 2.5 = 60 km/h. II only says it is more than 50 km/h ⇒ <b>Statement I alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "On which day of the week was Ravi born?<br>I. Ravi was born three days after his sister.<br>II. Ravi's sister was born on a Monday.", "o": ["Either I or II alone is sufficient", "Both I and II together are needed", "Statement I alone is sufficient", "Even I and II together are not sufficient"], "a": 1, "e": "Neither alone is enough; together: Monday + 3 = Thursday ⇒ <b>both are needed</b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "How many sons does Mr. X have?<br>I. Mr. X has five children, of whom exactly two are daughters.<br>II. Each daughter of Mr. X has at least one brother.", "o": ["Both I and II together are needed", "Statement II alone is sufficient", "Even I and II together are not sufficient", "Statement I alone is sufficient"], "a": 3, "e": "I: 5 − 2 = 3 sons. II only says there is at least one son ⇒ <b>Statement I alone is sufficient</b>.", "f": null, "p": "P6"}, {"s": "C", "t": "Ranking", "q": "In a list of 52 students, Ravi is 37th from the bottom. What is his rank from the top?", "o": ["16th", "15th", "14th", "17th"], "a": 0, "e": "Rank from top = 52 − 37 + 1 = <b>16th</b>.", "f": null, "p": null}, {"s": "C", "t": "Number Puzzle", "q": "Only coins of ₹5 and ₹7 are available. What is the largest amount (in ₹) that cannot be paid exactly using these coins?", "o": ["13", "18", "24", "23"], "a": 3, "e": "For two co-prime values a and b, the largest amount that cannot be formed is ab − a − b = 35 − 5 − 7 = <b>23</b>. (24 = 5 + 5 + 7 + 7.)", "f": null, "p": null}, {"s": "C", "t": "Letter–Number Analogy", "q": "BE : 25 :: DI : ?", "o": ["94", "48", "49", "59"], "a": 2, "e": "Letters are replaced by their positions: B = 2, E = 5 ⇒ 25. D = 4, I = 9 ⇒ <b>49</b>.", "f": null, "p": null}, {"s": "C", "t": "Coding by Letter Values", "q": "If BOOK = 43, then PAGE = ?", "o": ["33", "29", "31", "27"], "a": 1, "e": "BOOK = 2 + 15 + 15 + 11 = 43. PAGE = 16 + 1 + 7 + 5 = <b>29</b>.", "f": null, "p": null}, {"s": "C", "t": "Similar Set", "q": "Choose the set that is similar to the given set: (4, 16, 64)", "o": ["(5, 20, 60)", "(2, 8, 32)", "(6, 18, 72)", "(3, 9, 24)"], "a": 1, "e": "4 × 4 = 16, 16 × 4 = 64. Only <b>(2, 8, 32)</b> follows × 4, × 4.", "f": null, "p": null}, {"s": "C", "t": "Similar Set", "q": "Choose the set that is similar to the given set: (17, 13, 5)", "o": ["(29, 25, 17)", "(22, 19, 11)", "(30, 26, 20)", "(15, 10, 2)"], "a": 0, "e": "17 − 4 = 13, 13 − 8 = 5. Only <b>(29, 25, 17)</b> follows − 4, − 8.", "f": null, "p": null}, {"s": "C", "t": "Grouping Puzzle", "q": "Eight friends P, Q, R, S, T, U, V and W form two teams of four. P and Q are never together. S and T are always together. R and U are never together. If P and S are in one team, which can be the other team?", "o": ["R, U, V, W", "Q, R, U, W", "Q, R, V, W", "Q, T, V, W"], "a": 2, "e": "Team 1 has P, S, T and one more (not Q). R and U must be split, so the fourth member is R or U ⇒ Team 2 = Q, V, W and the other of R/U ⇒ <b>Q, R, V, W</b>.", "f": null, "p": null}, {"s": "C", "t": "Grouping Puzzle", "q": "In the same arrangement (P–Q apart, S–T together, R–U apart), if R is in P's team, who must be in Q's team?", "o": ["U", "S", "V", "T"], "a": 0, "e": "U can never be with R, so U is always in the other team with Q (whether S, T join P or not) ⇒ <b>U</b>.", "f": null, "p": null}, {"s": "C", "t": "Missing Number", "q": "Find the missing number:<br>Row 1: 3, 4, 19<br>Row 2: 5, 6, 41<br>Row 3: 7, 8, ?", "o": ["71", "72", "64", "56"], "a": 0, "e": "Third = (first × second) + (first + second): 12 + 7 = 19; 30 + 11 = 41 ⇒ 56 + 15 = <b>71</b>.", "f": null, "p": null}, {"s": "C", "t": "Logical Propositions", "q": "If the proposition 'All doctors are rich' is false, which of the following is certainly true?", "o": ["No rich person is a doctor", "No doctor is rich", "Some doctors are not rich", "Some doctors are rich"], "a": 2, "e": "The contradictory of 'All S are P' is 'Some S are not P' ⇒ <b>Some doctors are not rich</b> must be true. The others may or may not be true.", "f": null, "p": null}, {"s": "C", "t": "Coding–Decoding", "q": "In a certain code, MONKEY is written as XDJMNL. How is TIGER written in that code?", "o": ["QDFIS", "RDFHS", "QDFHS", "SHFDQ"], "a": 2, "e": "The word is reversed (YEKNOM) and each letter is moved one step back (Y→X, E→D …).<br>TIGER → REGIT → <b>QDFHS</b>.", "f": null, "p": null}, {"s": "C", "t": "Clock", "q": "A clock gains 6 minutes every hour. Through how many degrees does its minute hand turn in one correct hour?", "o": ["396°", "366°", "360°", "390°"], "a": 0, "e": "In one correct hour the clock shows 66 minutes ⇒ minute hand turns 66 × 6° = <b>396°</b>.", "f": null, "p": null}, {"s": "C", "t": "Wrong Term", "q": "In the series 5, 7, 11, 19, 35, 66, 131, only one term is wrong. Find it.", "o": ["19", "66", "131", "35"], "a": 1, "e": "Differences should be 2, 4, 8, 16, 32, 64: 35 + 32 = 67, not <b>66</b>; and 67 + 64 = 131.", "f": null, "p": null}, {"s": "C", "t": "Calendar", "q": "In an ordinary (non-leap) year, which month begins on the same day of the week as January?", "o": ["October", "April", "July", "September"], "a": 0, "e": "Odd days from January to the start of October: 3 + 0 + 3 + 2 + 3 + 2 + 3 + 3 + 2 = 21 ≡ 0 ⇒ <b>October</b> begins on the same day.", "f": null, "p": null}, {"s": "C", "t": "Calendar", "q": "If 26 January 2027 is a Tuesday, what day of the week will 15 August 2027 be?", "o": ["Monday", "Friday", "Saturday", "Sunday"], "a": 3, "e": "Days after 26 Jan: 5 (Jan) + 28 + 31 + 30 + 31 + 30 + 31 + 15 = 201 = 7 × 28 + 5 ⇒ Tuesday + 5 = <b>Sunday</b>.", "f": null, "p": null}, {"s": "C", "t": "Dice (Non-verbal)", "q": "Two positions of the same dice are shown. Which number is opposite to 3?", "o": ["4", "1", "6", "5"], "a": 0, "e": "In the first position 1 is on top, 2 in front and 3 on the right. In the second, 1 is on top, 4 in front and 2 on the right — the dice has been turned so that the face that was on the left (4) is now in front.<br>So 4 is on the face opposite 3 ⇒ <b>4</b>.", "f": {"kind": "dice", "a": [1, 2, 3], "b": [1, 4, 2]}, "p": null}, {"s": "C", "t": "Sign Interchange", "q": "Which two signs should be interchanged to make the equation correct?<br>18 ÷ 3 × 2 + 4 − 6 = 25", "o": ["− and ×", "+ and −", "+ and ×", "× and ÷"], "a": 3, "e": "Interchanging × and ÷: 18 × 3 ÷ 2 + 4 − 6 = 27 + 4 − 6 = <b>25</b> ✓. The other swaps give 14, 8 and 28.", "f": null, "p": null}, {"s": "C", "t": "Venn Diagram (Non-verbal)", "q": "In the figure, the triangle represents teachers, the circle women and the rectangle graduates. How many women teachers are not graduates?", "o": ["7", "12", "5", "11"], "a": 0, "e": "Women teachers who are not graduates lie inside both the triangle and the circle but outside the rectangle ⇒ <b>7</b>.", "f": {"kind": "img", "id": "venn4"}, "p": null}, {"s": "C", "t": "Coding (Sentences)", "q": "In a code language: 'sky is blue today' = 'la pa ka mo'; 'blue river is deep' = 're ka zi la'; 'deep sky looks dark' = 'ni re su pa'. What is the code for 'river'?", "o": ["ka", "zi", "re", "la"], "a": 1, "e": "Sentences 1 and 2 share 'blue, is' = 'ka, la'. Sentences 2 and 3 share 'deep' = 're'. So in sentence 2, river = <b>zi</b>.", "f": null, "p": null}, {"s": "C", "t": "Coding (Sentences)", "q": "In the same code language, what does 'mo' stand for?", "o": ["is", "today", "looks", "sky"], "a": 1, "e": "Sentences 1 and 3 share 'sky' = 'pa'; 'is, blue' = 'la, ka' ⇒ the remaining code 'mo' = <b>today</b>.", "f": null, "p": null}, {"s": "C", "t": "Coding (Sentences)", "q": "In the same code language, which code stands for 'dark'?", "o": ["Either 'su' or 'ni'", "su", "re", "Neither 'su' nor 'ni'"], "a": 0, "e": "Sentence 3 leaves 'looks, dark' = 'su, ni', but no other sentence separates them ⇒ <b>either 'su' or 'ni'</b>.", "f": null, "p": null}, {"s": "C", "t": "Family Puzzle", "q": "A family has six members A, B, C, D, E and F. B is the husband of A. C is the son of A, and D is C's sister. E is B's mother and F is E's husband. Who is D's grandmother?", "o": ["E", "A", "B", "F"], "a": 0, "e": "E is B's mother and B is D's father ⇒ E is D's <b>grandmother</b>.", "f": null, "p": null}, {"s": "C", "t": "Family Puzzle", "q": "In the same family, how many male members are there?", "o": ["Four", "Three", "None of these", "Two"], "a": 1, "e": "Males: B (husband), C (son) and F (E's husband) ⇒ <b>three</b>.", "f": null, "p": null}, {"s": "C", "t": "Family Puzzle", "q": "In the same family, how is F related to C?", "o": ["Uncle", "Grandfather", "Great-grandfather", "Father"], "a": 1, "e": "F is the husband of E, B's mother ⇒ F is B's father ⇒ C's <b>grandfather</b>.", "f": null, "p": null}, {"s": "C", "t": "Odd One Out", "q": "Find the number that is different from the others: 2,197; 1,331; 3,375; 2,744; 4,094", "o": ["1,331", "2,744", "3,375", "4,094"], "a": 3, "e": "2,197 = 13³, 1,331 = 11³, 3,375 = 15³, 2,744 = 14³. <b>4,094</b> is not a cube (16³ = 4,096).", "f": null, "p": null}, {"s": "C", "t": "Letter Shifting", "q": "In the word EDUCATION, each vowel is replaced by the next letter of the alphabet and each consonant by the previous letter. In the new arrangement, which letter is third from the right end?", "o": ["S", "J", "M", "P"], "a": 1, "e": "E→F, D→C, U→V, C→B, A→B, T→S, I→J, O→P, N→M ⇒ F C V B B S J P M. Third from the right = <b>J</b>.", "f": null, "p": null}, {"s": "C", "t": "Number Series", "q": "Find the next term: 6, 11, 21, 36, 56, ?", "o": ["81", "86", "78", "76"], "a": 0, "e": "Differences 5, 10, 15, 20 ⇒ next 25 ⇒ 56 + 25 = <b>81</b>.", "f": null, "p": null}, {"s": "C", "t": "Direction Sense", "q": "A man walks 20 m North, turns right and walks 30 m, turns right and walks 100 m, then turns left and walks 30 m. How far is he from the starting point?", "o": ["120 m", "60 m", "80 m", "100 m"], "a": 3, "e": "Net: North 20 − South 100 = 80 m South; East 30 + 30 = 60 m ⇒ distance = √(80² + 60²) = <b>100 m</b> (South-East).", "f": null, "p": null}, {"s": "C", "t": "Number Puzzle", "q": "A farm has hens and cows. If the number of heads is 48 and the number of legs is 140, how many hens are there?", "o": ["22", "24", "28", "26"], "a": 3, "e": "If all 48 were hens: 96 legs. Extra 44 legs ÷ 2 = 22 cows ⇒ hens = 48 − 22 = <b>26</b>.", "f": null, "p": null}, {"s": "C", "t": "Cube & Cuboid", "q": "A 4 cm × 3 cm × 2 cm cuboid is painted on all faces and cut into 1 cm cubes. How many small cubes have exactly two faces painted?", "o": ["16", "4", "12", "8"], "a": 2, "e": "Cubes with two painted faces lie on edges (not corners): 4(l − 2) + 4(b − 2) + 4(h − 2) = 4 × 2 + 4 × 1 + 4 × 0 = <b>12</b>.", "f": null, "p": null}, {"s": "C", "t": "Statement & Conclusion", "q": "Statement: \"All students who score above 90% in the final examination will get a scholarship. Riya scored 94%.\"<br>Conclusions: I. Riya will get a scholarship. &nbsp;II. Students scoring 90% or below will not get any scholarship.", "o": ["Both I and II follow", "Neither I nor II follows", "Only I follows", "Only II follows"], "a": 2, "e": "Riya scored above 90%, so she will get the scholarship (I). The statement says nothing about students scoring 90% or below — they may get a scholarship under some other rule ⇒ <b>only I follows</b>.", "f": null, "p": null}, {"s": "C", "t": "Figure Matrix (Non-verbal)", "q": "Select the figure that completes the figure matrix.", "o": ["(1)", "(2)", "(3)", "(4)"], "a": 0, "e": "Each row and each column has one circle, one square and one triangle, and one figure each with 1, 2 and 3 dots.<br>Row 3 has a triangle (2 dots) and a circle (3 dots) ⇒ the missing figure is a square with 1 dot ⇒ figure <b>(1)</b>.", "f": {"kind": "img", "id": "matrix4"}, "p": null}, {"s": "C", "t": "Alphabet Test", "q": "How many pairs of letters are there in the word PRINCIPAL that have as many letters between them in the word as in the English alphabet?", "o": ["One", "None", "Three", "Two"], "a": 0, "e": "Only the second I and L qualify: I (6th) and L (9th) have 2 letters between them in the word, and I and L have 2 letters (J, K) between them in the alphabet ⇒ <b>one</b>.", "f": null, "p": null}, {"s": "C", "t": "Course of Action", "q": "Statement: A large number of students fail in Mathematics every year in a district.<br>Courses of action: I. Remedial classes in Mathematics should be organised for weak students. &nbsp;II. Mathematics should be removed from the school syllabus.", "o": ["Neither I nor II follows", "Both I and II follow", "Only II follows", "Only I follows"], "a": 3, "e": "Remedial classes address the problem (I). Removing a core subject is impractical and does not solve it (II) ⇒ <b>only I follows</b>.", "f": null, "p": null}, {"s": "C", "t": "Seating Arrangement", "q": "J, K, L, M, N, O and P sit in a row facing North. M sits in the middle. J is third to the left of M. K is second to the right of M. L sits immediately to the left of K. N sits at one of the ends. O does not sit next to J. Who sits second from the left?", "o": ["L", "O", "N", "P"], "a": 3, "e": "Positions 1–7: M = 4, J = 1, K = 6, L = 5. N must be at the other end (7). O is not next to J ⇒ O = 3, P = 2 ⇒ second from the left is <b>P</b>.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "The Youth Olympic Games 2026, where Indian boxers Gunjan and Ambekar Meetei won India's first-ever Youth Olympic boxing golds, were held in:", "o": ["Buenos Aires, Argentina", "Nairobi, Kenya", "Dakar, Senegal", "Cairo, Egypt"], "a": 2, "e": "The 4th Summer Youth Olympics were held in <b>Dakar, Senegal</b> — the first Olympic event in Africa. India won 10 medals.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "India won the Men's U-19 Asia Cup 2026 by defeating which team by one wicket in a last-ball finish in the final?", "o": ["Bangladesh", "Sri Lanka", "Afghanistan", "Pakistan"], "a": 3, "e": "India beat <b>Pakistan</b> by one wicket in the final in Oman, winning the title for the ninth time.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "At the Hylo Open 2026 badminton tournament in Germany, Lakshya Sen won the men's singles title. Who won the women's singles title?", "o": ["P. V. Sindhu", "Anupama Upadhyaya", "Malvika Bansod", "Saina Nehwal"], "a": 0, "e": "<b>P. V. Sindhu</b> won the women's title, completing an Indian singles double; Lakshya Sen beat Jonatan Christie in the men's final.", "f": null, "p": null}, {"s": "D", "t": "Awards 2026", "q": "Who won the Infosys Prize 2026 in Economics?", "o": ["Karthik Sastry", "Riddhipratim Basu", "Mahesh Kakde", "Neena Gupta"], "a": 0, "e": "Princeton economist <b>Karthik A. Sastry</b> won for his work on climate change, technology and the economy. Riddhipratim Basu won in Mathematical Sciences.", "f": null, "p": null}, {"s": "D", "t": "Awards 2026", "q": "The Earthshot Prize 2026, founded by Prince William, was presented in November 2026 in which Indian city?", "o": ["Kolkata", "Mumbai", "Bengaluru", "New Delhi"], "a": 1, "e": "The awards were held in <b>Mumbai</b> — the first time in India. Mahindra Last Mile Mobility won in the 'Clean Our Air' category.", "f": null, "p": null}, {"s": "D", "t": "Reports 2026", "q": "In the Environmental Performance Index (EPI) 2026, prepared by Yale University, which country was ranked first?", "o": ["Switzerland", "Finland", "Denmark", "Estonia"], "a": 3, "e": "<b>Estonia</b> topped the EPI 2026, while India was ranked 176th — second from the bottom.", "f": null, "p": null}, {"s": "D", "t": "Governance 2026", "q": "Which city was declared India's cleanest city in Swachh Survekshan 2025-26, whose awards were presented in November 2026?", "o": ["Greater Hyderabad", "Surat", "Vijayawada", "Navi Mumbai"], "a": 3, "e": "<b>Navi Mumbai</b> topped the rankings, followed by Surat and Vijayawada; the awards were presented by the President.", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "The new series of the Consumer Price Index (CPI) released by MoSPI in February 2026 uses which base year?", "o": ["2012", "2020", "2024", "2022"], "a": 2, "e": "The new CPI series has the base year <b>2024 = 100</b> (earlier 2012), with a wider basket including more services.", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "Which refinery became the first in India to receive ISCC CORSIA certification for producing Sustainable Aviation Fuel (SAF)?", "o": ["IndianOil's Paradip Refinery", "IndianOil's Panipat Refinery", "BPCL's Kochi Refinery", "HPCL's Visakh Refinery"], "a": 1, "e": "IndianOil's <b>Panipat Refinery</b> (Haryana) received the certification, enabling commercial SAF supply under global norms.", "f": null, "p": null}, {"s": "D", "t": "Science 2026", "q": "India's first indigenous vaccine against H5N1 bird flu for chickens, unveiled in November 2026, was developed by:", "o": ["Bharat Biotech, Hyderabad", "IVRI, Izatnagar", "ICAR-NIHSAD, Bhopal", "ICMR-NIV, Pune"], "a": 2, "e": "It was developed by the ICAR–National Institute of High Security Animal Diseases (<b>NIHSAD</b>), <b>Bhopal</b>.", "f": null, "p": null}, {"s": "D", "t": "Science 2026", "q": "India's first LED dome planetarium, 'COSMOS', was inaugurated in November 2026 in which city?", "o": ["Hyderabad", "Kolkata", "Mysuru", "Bhubaneswar"], "a": 2, "e": "COSMOS–<b>Mysuru</b>, developed with the Indian Institute of Astrophysics, has a tilted LED dome.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "Unit 1 of the Rooppur Nuclear Power Plant, built with Russian assistance, was connected to the national grid in November 2026. It is in which country?", "o": ["Myanmar", "Philippines", "Sri Lanka", "Bangladesh"], "a": 3, "e": "Rooppur (Pabna district) made <b>Bangladesh</b> the 33rd country to generate nuclear power; it uses VVER-1200 reactors.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "The 23rd ASEAN–India Summit and the 21st East Asia Summit were held in November 2026 in:", "o": ["Manila", "Kuala Lumpur", "Vientiane", "Jakarta"], "a": 0, "e": "Both summits were held in <b>Manila</b>, Philippines; 2026 is the 'ASEAN–India Year of Maritime Cooperation'.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "2026 has been designated as the ASEAN–India Year of:", "o": ["Digital and Fintech Partnership", "Youth and Culture", "Maritime Cooperation", "Tourism"], "a": 2, "e": "2026 is the ASEAN–India Year of <b>Maritime Cooperation</b>; a long-term Maritime Cooperation Plan was adopted at Manila.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "'Harimau Shakti', whose 2026 edition began on 18 November, is a joint military exercise between India and:", "o": ["Singapore", "Indonesia", "Thailand", "Malaysia"], "a": 3, "e": "Harimau Shakti is the India–<b>Malaysia</b> army exercise; its fifth edition was held in Rajasthan in 2025.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "IMNEX-26, the eighth edition of a bilateral naval exercise held at Visakhapatnam in November 2026, was conducted by India with:", "o": ["Indonesia", "Myanmar", "Sri Lanka", "Bangladesh"], "a": 1, "e": "IMNEX is the India–<b>Myanmar</b> Naval Exercise.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "In October 2026, the Prime Minister inaugurated the Reserve Bank of India's ₹169-crore data centre and cybersecurity training institute in Odisha at:", "o": ["Berhampur, Ganjam", "Cuttack", "Rourkela", "Jatni, Khordha"], "a": 3, "e": "The facility is at <b>Jatni</b> near Bhubaneswar (Khordha district), on an 18.55-acre site.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "HAL's second production line for which aero-engine, used in the ALH Dhruv and LCH Prachand helicopters, is being set up at Koraput (Sunabeda)?", "o": ["AL-31FP", "Shakti", "Adour", "Kaveri"], "a": 1, "e": "Defence Minister Rajnath Singh laid the foundation of the ₹218-crore <b>Shakti</b> engine line; HAL Koraput also delivered its 2,000th aero-engine.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "The proposed Shree Jagannath International Airport (about ₹5,631 crore), being developed by the Airports Authority of India, is in which district?", "o": ["Khordha", "Jagatsinghpur", "Puri", "Ganjam"], "a": 2, "e": "The greenfield airport is planned in <b>Puri</b> district, with a capacity of about 46 lakh passengers a year.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "With its new greenfield plant at Kalinganagar in 2026, which company became India's largest ferro chrome producer?", "o": ["Tata Steel", "Facor", "IMFA", "Jindal Stainless"], "a": 2, "e": "Indian Metals &amp; Ferro Alloys (<b>IMFA</b>) raised its capacity above 5 lakh tonnes a year with the ₹800-crore Kalinganagar (Jajpur) plant.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "The 33rd APEC Economic Leaders' Meeting was held on 18–19 November 2026 in which city?", "o": ["Lima", "Shenzhen", "Gyeongju", "Singapore"], "a": 1, "e": "China hosted APEC 2026 in <b>Shenzhen</b>; the 2025 meeting was in Gyeongju, South Korea.", "f": null, "p": null}, {"s": "D", "t": "Awards 2026", "q": "Who was crowned Miss World 2026 at the pageant held in Vietnam in September 2026?", "o": ["Nikita Porwal", "Joheirry Mola", "Opal Suchata Chuangsri", "Fátima Bosch"], "a": 1, "e": "<b>Joheirry Mola Domínguez</b> of the Dominican Republic won; India's Nikita Porwal reached the Top 40.", "f": null, "p": null}, {"s": "D", "t": "Awards 2026", "q": "Which Odia writer was chosen for the Sahitya Akademi Award 2025 (announced in March 2026)?", "o": ["Rajendra Kishore Panda", "Pratibha Ray", "G. K. Baliyar Singh", "Haraprasad Das"], "a": 2, "e": "<b>Girijakumar Baliyar Singh</b> won for 'Padapurana'; awards in 24 languages were announced on 16 March 2026.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "Sea Vigil-26, the fifth edition of the pan-India coastal defence exercise held in November 2026, was coordinated by:", "o": ["National Security Guard", "Indian Navy", "Indian Coast Guard", "Border Security Force"], "a": 1, "e": "The <b>Indian Navy</b> coordinated Sea Vigil-26 (11–19 November) along the entire coastline with the Coast Guard, State police and other agencies.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "The fourth India–Japan '2+2' Foreign and Defence Ministerial Dialogue was held in November 2026 in:", "o": ["Osaka", "New Delhi", "Tokyo", "Hiroshima"], "a": 2, "e": "External Affairs Minister S. Jaishankar and Defence Minister Rajnath Singh met their Japanese counterparts in <b>Tokyo</b>.", "f": null, "p": null}, {"s": "D", "t": "Reports 2026", "q": "Which Indian institution was ranked highest among Indian institutions in the QS World University Rankings 2027?", "o": ["IIT Delhi", "IIT Madras", "IIT Bombay", "IISc Bengaluru"], "a": 0, "e": "<b>IIT Delhi</b> ranked 118th — the best ever rank for an Indian institution; 52 Indian institutions were listed.", "f": null, "p": null}, {"s": "D", "t": "Reports 2026", "q": "Which State was ranked first in the Access Equality Index 2026?", "o": ["Sikkim", "Andhra Pradesh", "Goa", "Kerala"], "a": 2, "e": "<b>Goa</b> topped the index, which measures equal access to basic services and opportunities; Andhra Pradesh was second.", "f": null, "p": null}, {"s": "D", "t": "Reports 2026", "q": "In the Climate Change Performance Index (CCPI) 2027, released at COP31, India was ranked:", "o": ["23rd", "33rd", "10th", "28th"], "a": 3, "e": "India slipped five places to <b>28th</b> in the CCPI 2027.", "f": null, "p": null}, {"s": "D", "t": "Social Sector 2026", "q": "'Vayo Samman Rashtriya Abhiyan', launched on 4 November 2026 by the Ministry of Social Justice and Empowerment, aims to:", "o": ["Give free bus travel to senior citizens", "Train youth as home nurses abroad", "Build bonds between senior citizens and young people", "Provide pensions to all workers of the unorganised sector"], "a": 2, "e": "It promotes respect, companionship and shared activities between <b>senior citizens and the young</b> through 'Vayo SAATHI' volunteers, under the Atal Vayo Abhyuday Yojana.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "Who won the men's Ballon d'Or 2026, ending England's 25-year wait for the award?", "o": ["Kylian Mbappé", "Harry Kane", "Ousmane Dembélé", "Lamine Yamal"], "a": 1, "e": "<b>Harry Kane</b> won his first Ballon d'Or in October 2026; Ousmane Dembélé was the 2025 winner.", "f": null, "p": null}, {"s": "E", "t": "Computer Organisation", "q": "Which bus carries the address of the memory location to be read or written?", "o": ["Expansion bus", "Control bus", "Address bus", "Data bus"], "a": 2, "e": "The <b>address bus</b> carries memory addresses; the data bus carries data; the control bus carries control signals.", "f": null, "p": null}, {"s": "E", "t": "Cyber Security", "q": "Which of the following is used to protect a network from unauthorised access by filtering incoming and outgoing traffic?", "o": ["Router table", "Firewall", "Spooler", "Compiler"], "a": 1, "e": "A <b>firewall</b> (hardware or software) allows or blocks traffic according to security rules.", "f": null, "p": null}, {"s": "E", "t": "Memory", "q": "Which of the following has the fastest access time?", "o": ["Main memory (RAM)", "CPU registers", "Cache memory", "Hard disk"], "a": 1, "e": "<b>Registers</b> inside the CPU are the fastest, followed by cache, RAM and then secondary storage.", "f": null, "p": null}, {"s": "E", "t": "Computer Basics", "q": "The Power-On Self-Test (POST) at start-up is carried out by the:", "o": ["Operating system", "Device driver", "BIOS", "Compiler"], "a": 2, "e": "The <b>BIOS</b> (firmware stored in ROM) runs POST to check the hardware before loading the operating system.", "f": null, "p": null}, {"s": "E", "t": "Networking", "q": "Which network device uses MAC addresses to forward data only to the intended device within a LAN?", "o": ["Switch", "Repeater", "Hub", "Modem"], "a": 0, "e": "A <b>switch</b> works at the data-link layer and forwards frames by MAC address; a hub sends data to all ports.", "f": null, "p": null}, {"s": "E", "t": "Networking", "q": "An IPv4 address is of what size?", "o": ["128 bits", "16 bits", "32 bits", "64 bits"], "a": 2, "e": "IPv4 = <b>32 bits</b> (e.g. 192.168.1.1); IPv6 = 128 bits.", "f": null, "p": null}, {"s": "E", "t": "Internet", "q": "What does DNS do on the Internet?", "o": ["Blocks malicious websites", "Sends and receives e-mail between servers", "Encrypts all the data sent over the web", "Converts domain names into IP addresses"], "a": 3, "e": "The Domain Name System translates names such as example.com into <b>IP addresses</b>.", "f": null, "p": null}, {"s": "E", "t": "Windows", "q": "Which key combination closes the active window or program in Windows?", "o": ["Alt + Tab", "Ctrl + Shift + Esc", "Win + D", "Alt + F4"], "a": 3, "e": "<b>Alt + F4</b> closes the active window; Alt + Tab switches windows; Win + D shows the desktop.", "f": null, "p": null}, {"s": "E", "t": "Internet", "q": "HTTPS normally uses which port number?", "o": ["443", "21", "80", "8080"], "a": 0, "e": "HTTPS uses port <b>443</b>; HTTP 80, FTP 21, SMTP 25.", "f": null, "p": null}, {"s": "E", "t": "Cyber Security", "q": "A program that looks useful but secretly performs harmful actions is called a:", "o": ["Cookie", "Worm", "Trojan horse", "Software firewall"], "a": 2, "e": "A <b>Trojan horse</b> disguises itself as useful software; a worm spreads itself across networks.", "f": null, "p": null}, {"s": "E", "t": "Cyber Security", "q": "Entering a one-time password (OTP) sent to your phone after typing your password is an example of:", "o": ["Single sign-on access control", "Two-factor authentication", "Phishing", "Encryption"], "a": 1, "e": "Password (something you know) + OTP on your phone (something you have) = <b>two-factor authentication</b>.", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "In MS Word, which key opens the 'Save As' dialog box?", "o": ["Shift + F7", "F1", "F7", "F12"], "a": 3, "e": "<b>F12</b> = Save As; F7 = spelling and grammar; F5 = Go To; F1 = Help.", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "Which view in MS Word shows the document as it will appear when printed?", "o": ["Draft", "Focus (Immersive) mode", "Print Layout", "Web Layout"], "a": 2, "e": "<b>Print Layout</b> shows margins, headers and page breaks as they will print.", "f": null, "p": null}, {"s": "E", "t": "Computer Basics", "q": "In computer terminology, what is meant by 'booting'?", "o": ["Shutting down all running programs and switching off the PC", "Removing viruses from the computer", "Starting the computer and loading the operating system", "Copying files to a USB drive"], "a": 2, "e": "<b>Booting</b> is the start-up process in which POST runs and the operating system is loaded into memory.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "In MS Excel, what is the address of the cell in the 3rd column and 10th row?", "o": ["10C", "C10", "3J", "J3"], "a": 1, "e": "Column letter first, then row number ⇒ <b>C10</b>.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "In MS Excel, =COUNTIF(A1:A10, \"&gt;=40\") returns:", "o": ["The number of empty cells", "The sum of all the values in A1:A10 that are 40 or more", "The largest value in A1:A10", "The number of cells in A1:A10 with values of 40 or more"], "a": 3, "e": "COUNTIF counts the cells that meet the condition ⇒ <b>number of cells ≥ 40</b>.", "f": null, "p": null}, {"s": "E", "t": "MS PowerPoint", "q": "Which PowerPoint view shows thumbnails of all slides so that they can be rearranged easily?", "o": ["Outline View", "Reading View", "Slide Sorter", "Notes Page"], "a": 2, "e": "<b>Slide Sorter</b> view shows all slides as thumbnails for reordering.", "f": null, "p": null}, {"s": "E", "t": "Networking", "q": "A computer network that spreads over a city or a large campus is called a:", "o": ["PAN", "MAN", "LAN", "WAN"], "a": 1, "e": "<b>MAN</b> (Metropolitan Area Network) covers a city; LAN a building; PAN a person's devices; WAN a country or the world.", "f": null, "p": null}, {"s": "E", "t": "Computer Generations", "q": "Which generation of computers used integrated circuits (ICs)?", "o": ["Fourth", "Second", "First", "Third"], "a": 3, "e": "1st – vacuum tubes; 2nd – transistors; <b>3rd – integrated circuits</b>; 4th – microprocessors (VLSI).", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "In MS Word, which feature automatically corrects common typing mistakes (such as 'teh' to 'the') as you type?", "o": ["AutoFormat", "AutoCorrect", "AutoText", "AutoComplete"], "a": 1, "e": "<b>AutoCorrect</b> (File → Options → Proofing) fixes common errors as you type.", "f": null, "p": null}], "passages": {"P1": "<div class=\"ptitle\">Directions (Q.36–40)</div><div>The line graph shows the rural and urban unemployment rates (in %) of a State from 2020-21 to 2024-25 (hypothetical data).</div><img class=\"figimg\" alt=\"Chart for Directions (Q.36–40)\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAsAAAAGiCAYAAADp+3AjAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAQ6wAAEOsBUJTofAAAtWNJREFUeJzs3XdYU9cbB/BvBgkrYW8QlY3ixD3r3nW2Wq11z/qztVOrrdaqdVSto1Vr3XvUvfeeiAMHiOw9Q8IMSe7vj0AgEiBqwnw/z9On4d5z7zmBCG9O3vMeFsMwDAghhBBCCKkl2JU9AEIIIYQQQioSBcCEEEIIIaRWoQCYEEIIIYTUKhQAE0IIIYSQWoUCYEIIIYQQUqtQAEwIIYQQQmoVCoAJIYQQQkitQgEwIYQQQgipVSgAJoQQQgghtQoFwIQQQgghpFahAJgQQgghhNQqFAATQgghhJBahQJgQgghhBBSq1AATAghhBBCahUKgAkhhBBCSK1CATAhhBBCCKlVKAAmhBBCCCG1CgXApNaRZGXj2u3Hqv+u33mM+4EvkZicXtlDK6HzoBn4ZfmWyh5GqRb/uRPtB0yDXC6v0H7nLv0HXYbOrNA+ifZuPwxC+wHTcOlGQGUPhVQgSWY2en/2LQ6fuqZ2XJSRib1HLuKvbUfw9MWbUq9fv/U/XLj2QOO5yd8tx4I/tup0vKR241b2AAipaKHhsRgyYa7Gcy2b+mDVghnwcq9TwaPS7GVoJNzrO1f2MEoVl5iCV6FRYJiK7Tc2PhnBoVEV2ynRmiQzG69Co5AhyazsoVQJx8/dxPqtR7BywZdo4FWvwvtfum43Lt98hNO7l4HD4eitnz827ENYZBx6dm6pOhaflIo+n30HPp+Hus52+HXlNiz/eRo+H9pT7dpjZ29iyZpduHFsvcZ79+rSCpO/W4Fh/T+Cr2ddvT0HUnvQDDCptXp91Apn967A2b0rsGv9PAzr/xHuB77EsEk/Iyc3r7KHRwipIZJS0hHwNBiSzOxK6T88Kh4BT4P1+kY1OVWEf3adwPjP+sHUxEh1/M9NB6FQMLh8aDX2bVyAaWMG4ZflW5CZlaNqk5Wdi3nLNuPLcUNQr46DxvsP7NUBLo42+H3tLv09CVKrUABMai0rSzP4N/aGf2Nv9PqoFf5e+g06tGqEuIQU3Lj3VGf9JCanIzwqXu0YwzBIThUhNCJW538U00UShEbEIk0k1vqauIQURMcmldsuKSUdkTEJkMkqNuVBKs1HRHQCUtMzNJ5PTE5HRHRCuakYGeJMvImIRXKqSOu+45NSERGdAIVC8S5D/iCFr5nyno9CoUBMXBIiohOQny8r974MwyA2PhnxSaklzmVl5yIsMg7ZObnl3kcmkyMyJgFJKe+XNp
