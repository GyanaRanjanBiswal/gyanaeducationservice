<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Free OAVS 2026 PGT & TGT compulsory paper CBT mock test (120 questions: English, Odia, Current Affairs 2026, Reasoning, Teaching Methodology; 120 minutes, −0.25) by Gyana Education Service – TCS iON style with detailed solutions.">
<title>OAVS 2026 Compulsory Paper (120 Marks) – Mock Test-2 | Gyana Education Service</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: TCS iON-style exam console — header strip, question pane left, palette right; light-only by design (mirrors the real exam screen) */
:root{
  --ink:#1b2430; --muted:#5d6b7c; --line:#cfd8e3; --paper:#ffffff; --wash:#eef3f8;
  --brand:#0b4f8a; --brand-2:#1167b1; --brand-ink:#ffffff; --head:#e9eef4;
  --ans:#2e9e3f; --nans:#e2502b; --nv:#e3e6ea; --nv-b:#b9c1cb; --mark:#6a3fb5; --gold:#f4b400;
  --ok:#1f8a3b; --ok-wash:#e5f5e8; --bad:#c8352a; --bad-wash:#fdeceb; --info-wash:#fff8e1;
  --f:Arial, "Helvetica Neue", Helvetica, "GES Odia", "Noto Sans Oriya", "Noto Sans", sans-serif;
  color-scheme: light;
}
html,body{height:100%}
#app{height:100%}
body{background:var(--wash);color:var(--ink);font-family:var(--f);font-size:14px;}
*{box-sizing:border-box}
button{font-family:var(--f);cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.screen{min-height:100%;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top brand strip */
.topbar{background:var(--brand);color:var(--brand-ink);padding-block:8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px;border:2px solid var(--gold);flex:none}
.tb-text{min-width:0;flex:1 1 220px}
.tb-org{font-weight:700;letter-spacing:1.2px;font-size:15px}
.tb-exam{font-size:12.5px;opacity:.92}
.tb-right{font-size:12px;text-align:right;opacity:.92}

/* login */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding-block:28px}
.login{display:grid;grid-template-columns:1fr 1fr;max-width:860px;width:100%;background:var(--paper);border:1px solid var(--line);box-shadow:0 2px 10px rgba(11,79,138,.08)}
.login-info{background:var(--head);padding:24px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line)}
.login-info .row{display:flex;gap:8px;font-size:13.5px}
.login-info .k{color:var(--muted);min-width:118px}
.login-info .v{font-weight:700}
.login-form{padding:24px;display:flex;flex-direction:column;gap:12px}
.login-form h2{margin:0 0 4px;font-size:18px;color:var(--brand)}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:9px 10px;border:1px solid var(--nv-b);border-radius:3px;font-size:14px;font-family:var(--f)}
.btn{border:1px solid var(--nv-b);background:var(--paper);color:var(--ink);padding:9px 16px;border-radius:3px;font-size:13.5px}
.btn:hover{background:var(--head)}
.btn-primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff;font-weight:700}
.btn-primary:hover{background:var(--brand)}
.btn-primary:disabled{background:#9db8d3;border-color:#9db8d3;cursor:not-allowed}
.btn-green{background:var(--ans);border-color:var(--ans);color:#fff;font-weight:700}
.btn-green:hover{filter:brightness(.92)}
.note{font-size:12px;color:var(--muted);line-height:1.5}

/* instructions */
.instr{flex:1;padding-block:18px;display:flex;justify-content:center}
.instr-card{background:var(--paper);border:1px solid var(--line);max-width:980px;width:100%;display:flex;flex-direction:column}
.instr-head{background:var(--head);padding:12px 18px;font-weight:700;color:var(--brand);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.instr-body{padding:16px 22px;line-height:1.6;font-size:13.5px;overflow:auto}
.instr-body h3{font-size:14px;margin:14px 0 6px;color:var(--brand)}
.instr-body ol{padding-left:22px;margin:6px 0}
.instr-body li{margin-bottom:5px}
.legend-list{display:grid;gap:8px;margin:8px 0 8px 4px}
.legend-list div{display:flex;align-items:center;gap:10px}
.pattern{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.pattern th,.pattern td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.pattern th{background:var(--head)}
.pattern td.n{text-align:center;font-variant-numeric:tabular-nums}
.instr-foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;flex-direction:column;gap:12px}
.declare{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5}
.declare input{margin-top:3px;width:16px;height:16px;flex:none}
.instr-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* exam */
.exam{height:100%;display:flex;flex-direction:column}
.exam-main{flex:1;display:flex;min-height:0}
.qpane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper);border-right:1px solid var(--line)}
.secbar{display:flex;align-items:center;gap:8px;background:var(--head);border-bottom:1px solid var(--line);padding-block:6px;flex-wrap:wrap}
.secbar .lbl{font-weight:700;font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.tab{border:1px solid var(--nv-b);background:var(--paper);padding:6px 10px;font-size:12.5px;border-radius:3px 3px 0 0;color:var(--brand)}
.tab.on{background:var(--brand-2);color:#fff;border-color:var(--brand-2);font-weight:700}
.timer{font-weight:700;font-size:13px;background:var(--paper);border:1px solid var(--nv-b);padding:6px 10px;border-radius:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer b{color:var(--brand)}
.timer.low b{color:var(--bad)}
.qtype{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;padding-block:7px;border-bottom:1px solid var(--line);color:var(--muted)}
.qtype .mk span{color:var(--ok);font-weight:700}
.qtype .mk em{color:var(--bad);font-style:normal;font-weight:700}
.qhead{display:flex;justify-content:space-between;align-items:center;padding-block:9px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.qhead h2{margin:0;font-size:15px}
.qhead .lang{font-size:12px;color:var(--muted)}
.qhead select{font-size:12px;padding:2px 4px}
.qbody{flex:1;overflow:auto;padding-block:14px 20px;min-height:0}
.qtext{font-size:calc(15.5px*var(--fs,1));line-height:1.65;max-width:78ch}
.qtext b{font-weight:700}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px;max-width:78ch}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border:1px solid transparent;border-radius:3px;cursor:pointer;font-size:calc(15px*var(--fs,1));line-height:1.5}
.opt:hover{background:#f3f7fb;border-color:var(--line)}
.opt input{margin-top:4px;width:16px;height:16px;flex:none;accent-color:var(--brand-2)}
.opt.sel{background:#eaf2fb;border-color:#a9c6e6}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--head);padding-block:9px;padding-bottom:max(9px,env(safe-area-inset-bottom,0px))}
.actions .l{display:flex;gap:8px;flex-wrap:wrap}

/* palette */
.palette{width:300px;flex:none;display:flex;flex-direction:column;background:#f7f9fc;min-height:0}
.cand{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.cand svg{width:50px;height:58px;flex:none;border:1px solid var(--line);background:var(--head)}
.cand .nm{font-weight:700;font-size:13.5px;word-break:break-word}
.cand .roll{font-size:12px;color:var(--muted)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:11.5px;line-height:1.25}
.legend .it{display:flex;align-items:center;gap:6px}
.legend .it.wide{grid-column:1/-1}
.pal-sec{background:var(--brand-2);color:#fff;font-weight:700;font-size:12.5px;padding:6px 12px}
.pal-choose{font-size:12px;color:var(--muted);padding:8px 12px 2px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:9px 6px;padding:8px 12px 12px;align-content:start;min-height:0}
.pal-foot{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:var(--head);padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.pal-foot .btn-green{grid-column:1/-1}

/* status shapes */
.st{width:38px;height:33px;display:inline-grid;place-items:center;font-size:12.5px;font-weight:700;position:relative;border:1px solid transparent;font-variant-numeric:tabular-nums;flex:none;padding:0}
.st.sm{width:28px;height:25px;font-size:11px}
.st.nv{background:var(--nv);border-color:var(--nv-b);color:var(--ink);border-radius:3px}
.st.na{background:var(--nans);color:#fff;border-radius:2px 2px 14px 14px / 2px 2px 9px 9px}
.st.an{background:var(--ans);color:#fff;border-radius:14px 14px 2px 2px / 9px 9px 2px 2px}
.st.mk{background:var(--mark);color:#fff;border-radius:50%}
.st.am{background:var(--mark);color:#fff;border-radius:50%}
.st.am::after{content:"";position:absolute;right:-3px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--ans);border:2px solid #fff;box-sizing:border-box}
.st.sm.am::after{width:10px;height:10px;right:-3px;bottom:-2px}
.grid .st{justify-self:center;cursor:pointer}
.grid .st.cur{outline:2px solid var(--gold);outline-offset:2px}

/* figures */
.fig{margin:14px 0 4px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.word{font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:30px;letter-spacing:2px;color:#13294b;padding:6px 14px;border:1px dashed var(--nv-b);background:#fff}
.mirror-line{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:2px}
.mirror-line i{display:block;width:4px;height:58px;background:linear-gradient(#6aa3db,#2b6cb0)}
.water-wrap{display:flex;flex-direction:column;gap:3px}
.water-line{height:5px;background:repeating-linear-gradient(90deg,#4a90d9 0 10px,#9cc5ef 10px 20px);border-radius:3px}
.optfig{display:inline-block;font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:22px;letter-spacing:2px;color:#13294b}
.optfig.M{transform:scaleX(-1)} .optfig.W{transform:scaleY(-1)} .optfig.R{transform:rotate(180deg)}
.dice{display:flex;gap:26px;flex-wrap:wrap}
.dice figure{margin:0;text-align:center;font-size:12px;color:var(--muted)}
.dice svg{width:120px;height:120px;display:block}

.figimg{display:block;max-width:100%;height:auto;border:1px solid var(--line);background:#fff;margin:8px 0;cursor:zoom-in}
.zoomwrap{overflow:auto;max-height:75vh}.zoomwrap img{display:block;width:760px;max-width:none;height:auto}
.zhint{font-size:11.5px;color:var(--muted);margin:2px 0 0}
.passage{background:#f6f9fd;border:1px solid #c9d8ea;border-left:4px solid var(--brand-2);padding:10px 12px;margin:0 0 14px;font-size:calc(14px*var(--fs,1));line-height:1.6;max-width:78ch}
.passage summary{cursor:pointer;font-weight:700;color:var(--brand)}
.ptitle{font-weight:700;color:var(--brand);margin-bottom:4px}
.ptbl{overflow-x:auto;margin-top:8px}
.ptbl table{border-collapse:collapse;font-size:13.5px;background:#fff;min-width:320px}
.ptbl th,.ptbl td{border:1px solid #b9c7d8;padding:5px 9px;text-align:center}
.ptbl th{background:#e3ecf6}
.ptbl td:first-child{text-align:left;font-weight:700}
.fsz{display:inline-flex;gap:4px;align-items:center;margin-left:8px}
.fsz button{padding:2px 8px;font-size:12px}
.btn-out{border-color:#c8352a;color:#c8352a;font-weight:700}
.btn-out:hover{background:#fdeceb}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,30,50,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--paper);max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal-h{background:var(--brand);color:#fff;padding:10px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-h button{background:transparent;border:0;color:#fff;font-size:20px;line-height:1}
.modal-b{padding:14px 16px;overflow:auto}
.modal-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
.sumtbl{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.sumtbl th,.sumtbl td{border:1px solid var(--line);padding:7px 8px;text-align:center;font-variant-numeric:tabular-nums}
.sumtbl th{background:var(--head);font-size:12px}
.sumtbl td:first-child,.sumtbl th:first-child{text-align:left}
.sumtbl tr.tot td{font-weight:700;background:#f7f9fc}
.qp-item{border-bottom:1px solid var(--line);padding:10px 0;font-size:13.5px;line-height:1.55}
.qp-item .n{font-weight:700;color:var(--brand)}

/* result */
.result{flex:1;padding-block:18px 30px;display:flex;flex-direction:column;align-items:center;gap:16px}
.rcard{background:var(--paper);border:1px solid var(--line);max-width:1000px;width:100%}
.rhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.rhead h2{margin:0;font-size:18px;color:var(--brand)}
.score-row{display:grid;grid-template-columns:auto 1fr;gap:22px;padding:18px;align-items:center}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:30px;display:block;font-variant-numeric:tabular-nums}
.ring .c span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;width:100%}
.stat{border:1px solid var(--line);padding:10px 12px}
.stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.stat.ok .v{color:var(--ok)} .stat.bad .v{color:var(--bad)}
.verdict{margin:0 18px 16px;padding:10px 14px;background:var(--info-wash);border:1px solid #f1d68a;font-size:13.5px;line-height:1.5}
.secbars{padding:4px 18px 18px;display:grid;gap:10px}
.sb{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.sb .bar{height:14px;background:var(--nv);position:relative;overflow:hidden;border-radius:2px}
.sb .bar i{position:absolute;inset:0 auto 0 0;background:var(--brand-2)}
.sb .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center}
.chip{border:1px solid var(--nv-b);background:var(--paper);padding:5px 10px;border-radius:14px;font-size:12.5px}
.chip.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.sol{padding:14px 18px;border-bottom:1px solid var(--line)}
.sol-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.pill{padding:2px 8px;border-radius:10px;font-weight:700;font-size:11.5px}
.pill.ok{background:var(--ok-wash);color:var(--ok)} .pill.bad{background:var(--bad-wash);color:var(--bad)} .pill.skip{background:var(--nv);color:var(--muted)}
.sol .qtext{font-size:14.5px}
.sopts{display:grid;gap:6px;margin:10px 0}
.sopt{padding:7px 10px;border:1px solid var(--line);border-radius:3px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.sopt .L{font-weight:700;color:var(--muted);flex:none}
.sopt.right{background:var(--ok-wash);border-color:#9fd3ac}
.sopt.wrong{background:var(--bad-wash);border-color:#efb1ab}
.sopt .tag{margin-left:auto;font-size:11.5px;font-weight:700;white-space:nowrap}
.sopt.right .tag{color:var(--ok)} .sopt.wrong .tag{color:var(--bad)}
.exp{background:#f4f8fc;border-left:3px solid var(--brand-2);padding:9px 12px;font-size:13.5px;line-height:1.6}
.exp h4{margin:0 0 4px;font-size:12px;letter-spacing:.6px;color:var(--brand);text-transform:uppercase}
.empty{padding:22px 18px;color:var(--muted)}

.palette-toggle{display:none}
.site-foot{flex:none;min-height:64px;display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;background:#0a3f6e;color:#dbe8f6;font-size:12px;padding-block:8px;padding-right:max(210px,env(safe-area-inset-right,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.site-foot b{color:#fff}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff8e1;border:1px solid #f1d68a;color:#5b4300;padding:10px 16px;font-weight:700;font-size:13.5px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.15);max-width:calc(100% - 32px);text-align:center}
.cta{margin:0 18px 16px;padding:12px 14px;border:1px solid #9fc0e3;background:#eef5fc;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:13.5px;line-height:1.5}
.cta a,.ractions a{text-decoration:none}
.btn-wa{background:#1f9d55;border-color:#1f9d55;color:#fff;font-weight:700;display:inline-block}
.btn-wa:hover{filter:brightness(.92)}
.topics{padding:0 18px 18px}
.topics h3{font-size:14px;margin:0 0 8px;color:var(--brand)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid #efb1ab;background:var(--bad-wash);color:#7a1f17;padding:4px 10px;border-radius:12px;font-size:12.5px}
.tchip b{font-variant-numeric:tabular-nums}
.ractions{display:flex;gap:8px;flex-wrap:wrap}
.result{padding-bottom:84px}
@media print{.topbar .tb-right,.site-foot,.ractions,#filters,.cta,#logout,#retake,.toast{display:none!important}body{background:#fff}.rcard{border:0}.sol{break-inside:avoid}}
@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login-info{border-right:0;border-bottom:1px solid var(--line)}
  .palette{position:fixed;top:0;right:0;bottom:0;width:min(320px,88vw);z-index:40;box-shadow:-6px 0 18px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px)}
  .palette.open{transform:none}
  .palette{bottom:64px}
  .site-foot{padding-right:max(170px,env(safe-area-inset-right,0px));font-size:11px}
  .site-foot span:nth-child(2){display:none}
  .palette-toggle{display:inline-block}
  .tb-right{flex:1 1 100%;text-align:left}
  .exam .tb-right{display:none}
  .secbar .lbl{display:none}
  .tabs{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .tab{white-space:nowrap;flex:none}
  .timer{margin-right:auto}
  .score-row{grid-template-columns:1fr;justify-items:center}
  .sb{grid-template-columns:110px 1fr 56px}
  .qtext{font-size:calc(15px*var(--fs,1))}
  .secbar{gap:6px}
  .timer{font-size:12.5px;padding:5px 8px}
}
@media (prefers-reduced-motion:reduce){.palette{transition:none}}

<script>
const DATA = {"sections": [["A", "English"], ["B", "Odia"], ["C", "Current Affairs"], ["D", "Reasoning"], ["E", "Teaching Methodology"]], "qs": [{"s": "A", "t": "Spot the Error", "q": "The following sentence has been split into four segments. Identify the segment that contains a grammatical error.<br><i>Each of the students / were given / a separate answer sheet / by the invigilator.</i>", "o": ["Each of the students", "were given", "a separate answer sheet", "by the invigilator."], "a": 1, "e": "‘<b>Each</b> of + plural noun’ is singular, so the verb must be singular: ‘Each of the students <b>was</b> given…’.", "f": null, "p": null}, {"s": "A", "t": "Spot the Error", "q": "The following sentence has been split into four segments. Identify the segment that contains a grammatical error.<br><i>She is one of those teachers / who has / devoted their lives / to rural education.</i>", "o": ["She is one of those teachers", "who has", "devoted their lives", "to rural education."], "a": 1, "e": "In ‘one of those + plural noun + who’, the relative pronoun refers to the plural noun (teachers), so the verb is plural: ‘who <b>have</b> devoted their lives’. (Note that ‘their’ already agrees with ‘teachers’.)", "f": null, "p": null}, {"s": "A", "t": "Spot the Error", "q": "The following sentence has been split into four segments. Identify the segment that contains a grammatical error.<br><i>No sooner did the bell ring / when the students / rushed out / of the classroom.</i>", "o": ["No sooner did the bell ring", "when the students", "rushed out", "of the classroom."], "a": 1, "e": "‘No sooner’ is always followed by ‘<b>than</b>’: ‘No sooner did the bell ring <b>than</b> the students rushed out’. (‘Hardly/Scarcely’ take ‘when’.)", "f": null, "p": null}, {"s": "A", "t": "Fill in the Blanks", "q": "Select the most appropriate option to fill in the blank.<br>He insisted ______ paying the bill himself.", "o": ["in", "at", "for", "on"], "a": 3, "e": "The verb ‘insist’ takes the preposition ‘<b>on</b>/upon’ before a gerund or noun: insist on paying.", "f": null, "p": null}, {"s": "A", "t": "Fill in the Blanks", "q": "Select the most appropriate option to fill in the blank.<br>Unless you ______ regularly, you will not clear the examination.", "o": ["practise", "practised", "do not practise", "will practise"], "a": 0, "e": "‘Unless’ already means ‘if not’, so it must not be followed by another negative. In a first conditional the ‘unless’ clause takes the simple present: ‘Unless you <b>practise</b>…’.", "f": null, "p": null}, {"s": "A", "t": "Synonyms", "q": "Select the most appropriate SYNONYM of the given word.<br><b>Ubiquitous</b>", "o": ["Omnipresent", "Unique", "Ambiguous", "Rare"], "a": 0, "e": "<b>Ubiquitous</b> = present or found everywhere; omnipresent (e.g. ‘Smartphones are ubiquitous today’).", "f": null, "p": null}, {"s": "A", "t": "Synonyms", "q": "Select the most appropriate SYNONYM of the given word.<br><b>Pragmatic</b>", "o": ["Practical", "Romantic", "Dogmatic", "Idealistic"], "a": 0, "e": "<b>Pragmatic</b> = dealing with things sensibly and realistically; practical. Idealistic and romantic are near-opposites; dogmatic means rigidly opinionated.", "f": null, "p": null}, {"s": "A", "t": "Antonyms", "q": "Select the most appropriate ANTONYM of the given word.<br><b>Ostentatious</b>", "o": ["Pretentious", "Flamboyant", "Modest", "Showy"], "a": 2, "e": "<b>Ostentatious</b> = designed to impress; showy. Showy, flamboyant and pretentious are synonyms; the antonym is <b>modest</b>.", "f": null, "p": null}, {"s": "A", "t": "Antonyms", "q": "Select the most appropriate ANTONYM of the given word.<br><b>Taciturn</b>", "o": ["Reserved", "Reticent", "Talkative", "Silent"], "a": 2, "e": "<b>Taciturn</b> = saying little; reserved. Reticent and silent are synonyms; the antonym is <b>talkative</b> (loquacious).", "f": null, "p": null}, {"s": "A", "t": "Spelling", "q": "Select the correctly spelt word.", "o": ["Maintenance", "Mantainance", "Maintenence", "Maintainance"], "a": 0, "e": "Although the verb is ‘maintain’, the noun is <b>maintenance</b> (main-te-nance).", "f": null, "p": null}, {"s": "A", "t": "Spelling", "q": "Select the INCORRECTLY spelt word.", "o": ["Occassion", "Privilege", "Rhythm", "Necessary"], "a": 0, "e": "Correct: Occasion (double c, single s). Rhythm, Privilege and Necessary are correctly spelt.", "f": null, "p": null}, {"s": "A", "t": "One Word Substitution", "q": "Select the option that can be used as a one-word substitute for the given group of words.<br>A person who remains indifferent to pleasure and pain", "o": ["Sceptic", "Hedonist", "Stoic", "Cynic"], "a": 2, "e": "A <b>stoic</b> endures pain and pleasure without showing feelings. A hedonist pursues pleasure; a cynic distrusts others’ motives; a sceptic doubts accepted beliefs.", "f": null, "p": null}, {"s": "A", "t": "One Word Substitution", "q": "Select the option that can be used as a one-word substitute for the given group of words.<br>The killing of one’s own mother", "o": ["Fratricide", "Matricide", "Patricide", "Regicide"], "a": 1, "e": "<b>Matricide</b> (mater = mother). Patricide – father; fratricide – brother; regicide – king.", "f": null, "p": null}, {"s": "A", "t": "Idioms & Phrases", "q": "Select the most appropriate meaning of the idiom.<br><i>To smell a rat</i>", "o": ["To find a hidden treasure", "To be very hungry", "To act cowardly", "To suspect that something is wrong"], "a": 3, "e": "‘<b>To smell a rat</b>’ = to sense that something is suspicious or dishonest.", "f": null, "p": null}, {"s": "A", "t": "Idioms & Phrases", "q": "Select the most appropriate meaning of the idiom.<br><i>To leave no stone unturned</i>", "o": ["To give up halfway", "To search only the obvious places", "To destroy everything", "To make every possible effort"], "a": 3, "e": "‘<b>To leave no stone unturned</b>’ = to try every possible means to achieve something.", "f": null, "p": null}, {"s": "A", "t": "Voice", "q": "Select the option that expresses the given sentence in passive voice.<br>People say that he is honest.", "o": ["He was said to be honest.", "He is said to be honest.", "He is said that he is honest.", "It is said by people that he was honest."], "a": 1, "e": "Sentences with ‘People say/believe that…’ are commonly made passive as <b>Subject + is said + to-infinitive</b>: ‘He is said to be honest.’ (‘It is said that he is honest’ is also correct, but option 3 wrongly changes ‘is’ to ‘was’.)", "f": null, "p": null}, {"s": "A", "t": "Voice", "q": "Select the option that expresses the given sentence in passive voice.<br>Who wrote this letter?", "o": ["By whom has this letter been written?", "By whom was this letter written?", "Who was this letter written?", "By whom this letter was written?"], "a": 1, "e": "‘Who’ (subject) → ‘By whom’; simple past → was + V3, with question order: ‘By whom <b>was this letter written</b>?’ Option 4 changes the tense.", "f": null, "p": null}, {"s": "A", "t": "Narration", "q": "Select the option that expresses the given sentence in indirect speech.<br>He said, “Alas! I have lost my purse.”", "o": ["He said alas that he has lost his purse.", "He exclaimed with joy that he had lost his purse.", "He exclaimed with sorrow that I had lost my purse.", "He exclaimed with sorrow that he had lost his purse."], "a": 3, "e": "Exclamatory sentence: the interjection is dropped and the feeling expressed (‘exclaimed with sorrow’); present perfect → past perfect; I → he.", "f": null, "p": null}, {"s": "A", "t": "Sentence Improvement", "q": "Select the most appropriate option to improve the underlined part.<br>Hardly had I reached the station <u>than the train left</u>.", "o": ["then the train left", "when the train left", "than the train had left", "No improvement"], "a": 1, "e": "‘Hardly/Scarcely … <b>when</b>’; ‘No sooner … than’. So: ‘Hardly had I reached the station <b>when</b> the train left.’", "f": null, "p": null}, {"s": "A", "t": "Sentence Rearrangement", "q": "Rearrang  ।", "ମୁଁ ସପରିବାରେ ପୁରୀ ଯିବି ।", "ମୁଁ ମୋ ପରିବାର ସହ ସପରିବାରେ ପୁରୀ ଯିବି ।", "ମୁଁ ସପରିବାର ସହିତ ପୁରୀ ଯିବି ।"], "a": 1, "e": "‘ସପରିବାରେ’ର ଅର୍ଥ ହିଁ ‘ପରିବାର ସହିତ’; ଦୁଇଟି ଏକାଠି ଲେଖିଲେ <b>ପୁନରୁକ୍ତି ଦୋଷ</b> ହୁଏ।", "f": null, "p": null}, {"s": "C", "t": "Odisha", "q": "Odisha’s annual Budget for 2026–27, presented by CM Mohan Charan Majhi on 20 February 2026, crossed ₹3 lakh crore for the first time. What is its size?", "o": ["₹3.01 lakh crore", "₹2.90 lakh crore", "₹3.10 lakh crore", "₹3.25 lakh crore"], "a": 2, "e": "The outlay is <b>₹3.10 lakh crore</b>, up from ₹2.90 lakh crore in 2025–26. The programme budget is about ₹1.80 lakh crore (~58%). The CM also holds the Finance portfolio.", "f": null, "p": null}, {"s": "C", "t": "Odisha", "q": "The Odisha Budget 2026–27 targets a nominal GSDP growth of 12%. To about what level is this expected to take the State’s GSDP?", "o": ["₹15 lakh crore", "₹20 lakh crore", "₹11 lakh crore", "₹8 lakh crore"], "a": 2, "e": "The Budget aims to take Odisha’s GSDP to about <b>₹11.07 lakh crore</b> in 2026–27 at current prices, with a nominal growth target of 12%.", "f": null, "p": null}, {"s": "C", "t": "Odisha", "q": "In November 2026, the Odisha Government presented a supplementary budget for 2026–27. What was its size?", "o": ["₹17,440 crore", "₹24,150 crore", "₹31,500 crore", "₹14,150 crore"], "a": 1, "e": "CM Mohan Charan Majhi presented a <b>₹24,150-crore</b> supplementary statement on 18 Nov 2026. ₹17,440 crore was the supplementary budget for 2025–26 (tabled in November 2025).", "f": null, "p": null}, {"s": "C", "t": "Odisha", "q": "The 600 MW Upper Indravati Pumped Storage Project, cleared by the Odisha Cabinet in November 2026, is significant because it will be:", "o": ["India’s largest solar park", "India’s first floating solar plant", "Odisha’s first nuclear power plant", "Odisha’s first pumped storage power project"], "a": 3, "e": "It will be <b>Odisha’s first pumped storage project</b> (about ₹4,708 crore), storing surplus power by pumping water uphill and releasing it at peak demand. The Indravati is a tributary of the Godavari.", "f": null, "p": null}, {"s": "C", "t": "Odisha", "q": "Under Odisha’s ‘Mukhyamantri Annapurna Yojana’, launched in June 2026 to mark two years of the government, beneficiaries get:", "o": ["Free cooked meals at ₹5", "₹1,000 a month for cooking gas", "A free smartphone", "An additional 5 kg of free rice"], "a": 3, "e": "The scheme gives an <b>additional 5 kg of free rice</b> to NFSA and SFSS beneficiaries — about 3.28 crore people.", "f": null, "p": null}, {"s": "C", "t": "Odisha", "q": "Odisha’s ‘Bidesh Sikhyabruti’ scheme (August 2026) supports which group of students?", "o": ["Students of Odia-medium schools for Class XI", "Sports students for training abroad", "Girl students in government colleges", "SC and ST students admitted to top-200 global universities"], "a": 3, "e": "Up to ₹25 lakh each for <b>50 meritorious SC/ST students</b> a year admitted to universities ranked in the global top 200.", "f": null, "p": null}, {"s": "C", "t": "Odisha", "q": "Where was Odisha’s State-level ‘Janjatiya Gaurav Divas’ celebrated on 15 November 2026?", "o": ["Koraput", "Malkangiri", "Mayurbhanj", "Sundargarh"], "a": 1, "e": "The State-level celebration was held at <b>Malkangiri</b>. The day marks the birth anniversary of Bhagwan Birsa Munda.", "f": null, "p": null}, {"s": "C", "t": "National", "q": "The Income-tax Act, 2025, which came into force on 1 April 2026, replaced the Income-tax Act of:", "o": ["1974", "1922", "1961", "1956"], "a": 2, "e": "The <b>Income-tax Act, 2025</b> replaced the <b>Income-tax Act, 1961</b> from 1 April 2026 (tax year 2026–27), with simpler language and the single concept of ‘tax year’ in place of ‘previous year’ and ‘assessment year’.", "f": null, "p": null}, {"s": "C", "t": "National", "q": "The AI Impact Summit held in New Delhi in February 2026 adopted the ‘New Delhi Declaration on AI Impact’. Which guiding principle was it rooted in?", "o": ["Sarvajan Hitaya, Sarvajan Sukhaya", "Reform, Perform, Transform", "Sabka Saath, Sabka Vikas", "Satyameva Jayate"], "a": 0, "e": "The declaration, adopted on 21 February 2026 and endorsed by 88 countries and international organisations (including the USA, China, the UK and the EU), is guided by ‘<b>Sarvajan Hitaya, Sarvajan Sukhaya</b>’ (welfare for all, happiness for all). It is built on three ‘Sutras’ – People, Planet and Progress.", "f": null, "p": null}, {"s": "C", "t": "Defence", "q": "Who took over as India’s third Chief of Defence Staff (CDS) on 31 May 2026?", "o": ["Gen. Raja Subramani", "Gen. Anil Chauhan", "Gen. Upendra Dwivedi", "Adm. Dinesh K. Tripathi"], "a": 0, "e": "<b>Gen. Raja Subramani</b> became the third CDS after Gen. Bipin Rawat (first) and Gen. Anil Chauhan (second). On the same day, Adm. Krishna Swaminathan took over as Navy Chief.", "f": null, "p": null}, {"s": "C", "t": "Defence", "q": "Admiral Krishna Swaminathan, who assumed charge on 31 May 2026, is India’s:", "o": ["3rd Chief of Defence Staff", "30th Chief of the Army Staff", "27th Chief of the Naval Staff", "26th Chief of the Naval Staff"], "a": 2, "e": "He became the <b>27th Chief of the Naval Staff</b>, succeeding Adm. Dinesh K. Tripathi. He earlier headed the Western Naval Command and is a communication and electronic-warfare specialist.", "f": null, "p": null}, {"s": "C", "t": "Defence", "q": "On 21 June 2026, PM Narendra Modi commissioned INS Dunagiri, INS Sanshodhak and INS Agray in Kolkata. Which shipyard built all three?", "o": ["Goa Shipyard", "Garden Reach Shipbuilders & Engineers (GRSE)", "Mazagon Dock Shipbuilders", "Cochin Shipyard"], "a": 1, "e": "All three were indigenously designed and built by <b>GRSE, Kolkata</b>. INS Dunagiri is the fifth Project 17A (Nilgiri-class) stealth frigate, Sanshodhak a large survey vessel and Agray an anti-submarine shallow-water craft.", "f": null, "p": null}, {"s": "C", "t": "Defence", "q": "‘Dharma Guardian 2026’, held at Chaubattia (Uttarakhand) in February–March 2026, is a joint military exercise between India and:", "o": ["Japan", "Australia", "South Korea", "France"], "a": 0, "e": "Dharma Guardian is the India–<b>Japan</b> exercise between the Indian Army and the Japan Ground Self-Defense Force; its 7th edition was held in 2026.", "f": null, "p": null}, {"s": "C", "t": "Science", "q": "Which ISRO launch failed in January 2026?", "o": ["SSLV-D3 / EOS-08", "GSLV-F16 / NISAR", "PSLV-C62 / EOS-N1", "LVM3-M6 / BlueBird"], "a": 2, "e": "The <b>PSLV-C62/EOS-N1</b> mission (12 January 2026) failed because of an anomaly in the rocket’s third stage; all 16 satellites, including DRDO’s EOS-N1 ‘Anvesha’, were lost. It was the second PSLV failure in a row after PSLV-C61 (May 2025). GSLV-F16 launched NISAR in July 2025, and SSLV-D3 launched EOS-08 in August 2024.", "f": null, "p": null}, {"s": "C", "t": "Science", "q": "In August 2026 the Government told Parliament that Gaganyaan’s first uncrewed mission (G1), targeted for the last quarter of 2026, will carry which half-humanoid robot?", "o": ["Vyommitra", "Bharat-1", "Pushpak", "Shakti"], "a": 0, "e": "<b>Vyommitra</b>, a half-humanoid robot developed by ISRO, will simulate a crew member on G1 and check the life-support and crew systems. The first crewed Gaganyaan flight is targeted for 2027–28.", "f": null, "p": null}, {"s": "C", "t": "Reports", "q": "In the World Happiness Report 2026 (released 19–20 March 2026), what was India’s rank?", "o": ["126th", "116th", "118th", "104th"], "a": 1, "e": "India rose to <b>116th</b> from 118th. Finland topped for the ninth year in a row; Costa Rica (4th) was the highest-ever Latin American country. Nepal (99th) and Pakistan (104th) ranked above India.", "f": null, "p": null}, {"s": "C", "t": "Reports", "q": "In the Global Hunger Index 2026, released in October 2026, India was placed:", "o": ["100th of 122 countries, in the ‘serious’ category", "102nd of 123 countries, in the ‘moderate’ category", "100th of 122 countries, in the ‘moderate’ category", "105th of 127 countries, in the ‘alarming’ category"], "a": 0, "e": "India ranked <b>100th of 122</b> (shared with Ethiopia) with a score of 24.1 — ‘<b>serious</b>’. Child wasting (19%) was the highest in South Asia. The GHI is published by Concern Worldwide and Welthungerhilfe.", "f": null, "p": null}, {"s": "C", "t": "International", "q": "The UN General Assembly has declared 2026 as the International Year of all of the following EXCEPT:", "o": ["Rangelands and Pastoralists", "Millets", "the Woman Farmer", "Volunteers for Sustainable Development"], "a": 1, "e": "The three International Years of 2026 are Rangelands and Pastoralists, Volunteers for Sustainable Development, and the Woman Farmer. The International Year of <b>Millets</b> was 2023, proposed by India.", "f": null, "p": null}, {"s": "C", "t": "Awards", "q": "Which film won the Best Picture award at the 98th Academy Awards (Oscars) in March 2026?", "o": ["One Battle After Another", "Frankenstein", "Sinners", "Hamnet"], "a": 0, "e": "Paul Thomas Anderson’s <b>One Battle After Another</b> won Best Picture, Best Director and Best Adapted Screenplay. Jessie Buckley (Hamnet) and Michael B. Jordan (Sinners) won the lead acting awards.", "f": null, "p": null}, {"s": "C", "t": "Awards", "q": "Who was announced in September 2026 as the recipient of the Dadasaheb Phalke Award (for 2024)?", "o": ["Mohanlal", "Anant Nag", "Rajinikanth", "Mithun Chakraborty"], "a": 1, "e": "Kannada actor <b>Anant Nag</b> received it at the 72nd National Film Awards in Kevadia (Gujarat) on 22 Sept 2026 — the second Kannada actor after Dr Rajkumar (1995). Mithun (2022) and Mohanlal (2023) were the previous recipients.", "f": null, "p": null}, {"s": "C", "t": "Awards", "q": "Who won the Nobel Prize in Literature 2026?", "o": ["Margaret Atwood", "Haruki Murakami", "Anne Carson", "Salman Rushdie"], "a": 2, "e": "Canadian poet and classicist <b>Anne Carson</b> won the 2026 prize, after László Krasznahorkai (2025).", "f": null, "p": null}, {"s": "C", "t": "Awards", "q": "The Nobel Memorial Prize in Economic Sciences 2026 was awarded to:", "o": ["Claudia Goldin", "Esther Duflo and Abhijit Banerjee", "Robert E. Hall and Michael Woodford", "Joel Mokyr, Philippe Aghion and Peter Howitt"], "a": 2, "e": "<b>Robert E. Hall and Michael Woodford</b> won ‘for microeconomic foundations of macroeconomic stabilisation’. Mokyr, Aghion and Howitt won in 2025; Banerjee, Duflo and Kremer in 2019.", "f": null, "p": null}, {"s": "C", "t": "Awards", "q": "Which book won the International Booker Prize 2026, the first winner translated from Mandarin Chinese?", "o": ["Heart Lamp by Banu Mushtaq", "Kairos by Jenny Erpenbeck", "Taiwan Travelogue by Yáng Shuāng-zǐ", "Tomb of Sand by Geetanjali Shree"], "a": 2, "e": "<b>Taiwan Travelogue</b>, translated by Lin King, won in May 2026. Heart Lamp (Kannada) won in 2025, Kairos in 2024 and Tomb of Sand (Hindi) in 2022.", "f": null, "p": null}, {"s": "C", "t": "Sports", "q": "Which player won the 2026 FIDE Candidates Tournament in Cyprus and will challenge D. Gukesh for the World Chess Championship?", "o": ["Anish Giri", "R. Praggnanandhaa", "Fabiano Caruana", "Javokhir Sindarov"], "a": 3, "e": "Uzbekistan’s <b>Javokhir Sindarov</b> won unbeaten with a round to spare. India’s <b>R. Vaishali</b> won the Women’s Candidates held alongside it.", "f": null, "p": null}, {"s": "C", "t": "Sports", "q": "Who won the men’s and women’s singles titles at Wimbledon 2026?", "o": ["Jannik Sinner and Iga Świątek", "Carlos Alcaraz and Aryna Sabalenka", "Jannik Sinner and Linda Nosková", "Alexander Zverev and Mirra Andreeva"], "a": 2, "e": "<b>Jannik Sinner</b> beat Alexander Zverev to defend his title; Czech <b>Linda Nosková</b> beat Karolína Muchová for her first major.", "f": null, "p": null}, {"s": "C", "t": "Sports", "q": "Who won the men’s singles title at the French Open 2026, his first Grand Slam?", "o": ["Carlos Alcaraz", "Jannik Sinner", "Alexander Zverev", "Flavio Cobolli"], "a": 2, "e": "<b>Alexander Zverev</b> beat Italy’s Flavio Cobolli in five sets on 7 June 2026. Mirra Andreeva won the women’s title.", "f": null, "p": null}, {"s": "C", "t": "Sports", "q": "At the Thomas & Uber Cup 2026 in Horsens, Denmark, China won the Thomas Cup by beating which team, playing its first final?", "o": ["France", "Indonesia", "India", "Japan"], "a": 0, "e": "China beat <b>France</b> 3–1 to retain the Thomas Cup. South Korea beat China 3–1 to win the Uber Cup for the third time.", "f": null, "p": null}, {"s": "C", "t": "Sports", "q": "Which country won the FIH Women’s Hockey World Cup 2026, beating the Netherlands in a shootout?", "o": ["Germany", "Australia", "Belgium", "Argentina"], "a": 3, "e": "<b>Argentina</b> ended Dutch dominance. India’s women beat Germany for fifth place — their best finish since 1974. Germany won the men’s title.", "f": null, "p": null}, {"s": "C", "t": "Sports", "q": "Who won the Golden Ball (best player) at the FIFA World Cup 2026?", "o": ["Kylian Mbappé", "Rodri", "Lionel Messi", "Lamine Yamal"], "a": 1, "e": "Spain’s midfielder <b>Rodri</b> won the Golden Ball as Spain beat Argentina 1–0 in the final. Kylian Mbappé won the Golden Boot (10 goals).", "f": null, "p": null}, {"s": "C", "t": "Sports", "q": "At the 2026 Asian Games in Aichi–Nagoya, who became the first Indian woman to win an individual recurve archery gold?", "o": ["Deepika Kumari", "Kumkum Anil Mohod", "Ankita Bhakat", "Jyothi Surekha Vennam"], "a": 1, "e": "<b>Kumkum Anil Mohod</b> won on 3 Oct 2026. Jyothi Surekha Vennam competes in compound archery. India won 85 medals and finished fourth.", "f": null, "p": null}, {"s": "D", "t": "Number Series", "q": "What should come in place of the question mark (?) in the given series?<br>2, 3, 10, 15, 26, 35, ?", "o": ["48", "49", "50", "51"], "a": 2, "e": "Terms are n² + 1 for odd n and n² − 1 for even n: 1+1, 4−1, 9+1, 16−1, 25+1, 36−1, so next 49 + 1 = <b>50</b>.", "f": null, "p": null}, {"s": "D", "t": "Number Series", "q": "What should come in place of the question mark (?) in the given series?<br>7, 26, 63, 124, 215, ?", "o": ["343", "342", "344", "340"], "a": 1, "e": "Terms are n³ − 1 for n = 2, 3, 4, 5, 6 ⇒ next 7³ − 1 = <b>342</b>.", "f": null, "p": null}, {"s": "D", "t": "Number Series", "q": "What should come in place of the question mark (?) in the given series?<br>120, 99, 80, 63, 48, ?", "o": ["35", "36", "33", "34"], "a": 0, "e": "11²−1, 10²−1, 9²−1, 8²−1, 7²−1 ⇒ 6² − 1 = <b>35</b>. (Differences: −21, −19, −17, −15, −13.)", "f": null, "p": null}, {"s": "D", "t": "Wrong Number", "q": "Find the WRONG number in the series.<br>3, 8, 15, 24, 34, 48", "o": ["24", "34", "48", "15"], "a": 1, "e": "Terms should be n² − 1: 3, 8, 15, 24, <b>35</b>, 48. So <b>34</b> is wrong.", "f": null, "p": null}, {"s": "D", "t": "Letter Series", "q": "What should come in place of the question mark (?) in the given series?<br>Z, U, Q, N, L, ?", "o": ["I", "J", "K", "M"], "a": 2, "e": "Backward steps of 5, 4, 3, 2, 1: Z(26) → U(21) → Q(17) → N(14) → L(12) → <b>K</b>(11).", "f": null, "p": null}, {"s": "D", "t": "Letter Series", "q": "What should come in place of the question mark (?) in the given series?<br>DKM, FJN, HIO, JHP, ?", "o": ["KGQ", "LHQ", "LGR", "LGQ"], "a": 3, "e": "First letters +2 (D F H J <b>L</b>); middle letters −1 (K J I H <b>G</b>); last letters +1 (M N O P <b>Q</b>) ⇒ LGQ.", "f": null, "p": null}, {"s": "D", "t": "Analogy", "q": "Select the option related to the third term in the same way as the second is related to the first.<br>Myopia : Eye :: Otitis : ?", "o": ["Nose", "Skin", "Gums", "Ear"], "a": 3, "e": "Myopia affects the eye; <b>otitis</b> is inflammation of the ear. (Gingivitis – gums; rhinitis – nose; dermatitis – skin.)", "f": null, "p": null}, {"s": "D", "t": "Number Analogy", "q": "Select the number related to the third number in the same way as the second is related to the first.<br>7 : 56 :: 9 : ?", "o": ["72", "81", "90", "99"], "a": 2, "e": "7 × 8 = 56, i.e. n(n + 1) ⇒ 9 × 10 = <b>90</b>.", "f": null, "p": null}, {"s": "D", "t": "Classification", "q": "Select the odd one out.<br>143, 221, 323, 437, 529", "o": ["437", "323", "221", "529"], "a": 3, "e": "143 = 11 × 13, 221 = 13 × 17, 323 = 17 × 19, 437 = 19 × 23 — products of consecutive primes. <b>529 = 23²</b>.", "f": null, "p": null}, {"s": "D", "t": "Classification", "q": "Select the odd one out.", "o": ["Bihu", "Kuchipudi", "Kathak", "Odissi"], "a": 0, "e": "Kathak, Kuchipudi and Odissi are among India’s classical dances; <b>Bihu</b> is a folk dance of Assam.", "f": null, "p": null}, {"s": "D", "t": "Coding–Decoding", "q": "In a certain code language, MONKEY is written as XDJMNL. How will TIGER be written in that language?", "o": ["SHFDQ", "UJHFS", "QDHFS", "QDFHS"], "a": 3, "e": "Each letter is moved one step back (M→L, O→N, N→M, K→J, E→D, Y→X ⇒ LNMJDX) and the word is reversed ⇒ XDJMNL. TIGER → SHFDQ → reversed <b>QDFHS</b>.", "f": null, "p": null}, {"s": "D", "t": "Coding–Decoding", "q": "In a code language, ‘you are good’ is written as ‘pit na sa’, ‘they are bad’ as ‘na ho re’ and ‘good and bad’ as ‘sa re lo’. What is the code for ‘and’?", "o": ["lo", "re", "sa", "na"], "a": 0, "e": "Common to 1 & 2: ‘are’ = na. Common to 1 & 3: ‘good’ = sa. Common to 2 & 3: ‘bad’ = re. The remaining word in sentence 3 gives ‘and’ = <b>lo</b>.", "f": null, "p": null}, {"s": "D", "t": "Blood Relation", "q": "A is the son of B. C, the sister of B, has a son D and a daughter E. F is the maternal uncle of D. How is A related to D?", "o": ["Uncle", "Brother", "Nephew", "Cousin"], "a": 3, "e": "B and C are siblings. A is B’s son and D is C’s son ⇒ A and D are <b>cousins</b>. (F, D’s maternal uncle, is C’s brother.)", "f": null, "p": null}, {"s": "D", "t": "Coded Blood Relation", "q": "A ★ B means A is the mother of B; A ◆ B means A is the son of B; A ● B means A is the wife of B. If P ★ Q ◆ R, how is R related to P?", "o": ["Son", "Husband", "Brother", "Father"], "a": 1, "e": "P ★ Q: P is Q’s mother. Q ◆ R: Q is R’s son, so R is Q’s parent. Since P is the mother, R is the father ⇒ R is P’s <b>husband</b>.", "f": null, "p": null}, {"s": "D", "t": "Direction Sense", "q": "Raju walks 20 m North, turns left and walks 10 m, turns left again and walks 20 m, and finally turns right and walks 15 m. How far and in which direction is he from his starting point?", "o": ["15 m West", "25 m East", "10 m South-West", "25 m West"], "a": 3, "e": "N 20 → (0, 20); left = West 10 → (−10, 20); left = South 20 → (−10, 0); right of South = West 15 → (−25, 0) ⇒ <b>25 m West</b>.", "f": null, "p": null}, {"s": "D", "t": "Direction Sense", "q": "At 5 p.m., Ravi starts walking towards his own shadow. After some distance he turns left. In which direction is he walking now?", "o": ["North", "West", "South", "East"], "a": 0, "e": "In the evening the sun is in the West, so shadows fall towards the East. Walking towards his shadow, he faces East; turning left from East means facing <b>North</b>.", "f": null, "p": null}, {"s": "D", "t": "Ranking", "q": "In a class of 45 students, Mohan’s rank is 16th from the top. Sohan is 7 ranks below Mohan. What is Sohan’s rank from the bottom?", "o": ["24th", "29th", "23rd", "22nd"], "a": 2, "e": "Sohan from top = 16 + 7 = 23. From bottom = 45 − 23 + 1 = <b>23rd</b>.", "f": null, "p": null}, {"s": "D", "t": "Ordering", "q": "Among A, B, C, D and E: B is heavier than A and D but lighter than C. E is heavier than C. D is not the lightest. Who is the third heaviest?", "o": ["C", "A", "D", "B"], "a": 3, "e": "E > C > B, and B > A, D. Since D is not the lightest, D > A. Order: E > C > <b>B</b> > D > A.", "f": null, "p": null}, {"s": "D", "t": "Seating Arrangement", "q": "Six friends L, M, N, O, P and Q sit in a row facing North. O sits at one of the ends. N sits third to the right of O. L sits second to the left of Q. M is not an immediate neighbour of O. Who sits at the extreme right end?", "o": ["N", "Q", "P", "M"], "a": 3, "e": "O cannot be at the right end (no seat third to its right), so O = 1 and N = 4. With L two seats left of Q: Q = 5, L = 3. Seats 2 and 6 remain; M is not next to O ⇒ M = 6, P = 2. Order: O P L N Q M ⇒ <b>M</b>.", "f": null, "p": null}, {"s": "D", "t": "Seating Arrangement", "q": "Six persons A, B, C, D, E and F sit around a circular table facing the centre. A sits second to the right of C. E sits opposite A. B sits immediately to the left of E. D is not an immediate neighbour of C. Who sits opposite B?", "o": ["C", "D", "A", "F"], "a": 3, "e": "Facing the centre, ‘right’ is anticlockwise. Fix C at seat 0: A is two seats anticlockwise (seat 4); E is opposite A (seat 1); B is immediately left of E, i.e. clockwise (seat 2). Seats 3 and 5 remain; seat 5 is next to C, so D = 3, F = 5. Opposite B (seat 2) is seat 5 ⇒ <b>F</b>.", "f": null, "p": null}, {"s": "D", "t": "Syllogism", "q": "Statements: All doctors are teachers. No teacher is a lawyer.<br>Conclusions: I. No doctor is a lawyer. II. All teachers being doctors is a possibility.", "o": ["Only conclusion II follows", "Only conclusion I follows", "Both I and II follow", "Neither I nor II follows"], "a": 2, "e": "Doctors lie inside ‘teachers’, which does not touch ‘lawyers’ ⇒ I follows. Nothing prevents ‘doctors’ and ‘teachers’ from being the same set ⇒ the possibility in II also follows.", "f": null, "p": null}, {"s": "D", "t": "Syllogism", "q": "Statements: Some cats are dogs. Some dogs are rats.<br>Conclusions: I. Some cats are rats. II. Some rats are dogs.", "o": ["Only conclusion II follows", "Only conclusion I follows", "Neither I nor II follows", "Both I and II follow"], "a": 0, "e": "Two ‘some’ premises give no definite link between cats and rats ⇒ I does not follow. ‘Some dogs are rats’ converts to ‘Some rats are dogs’ ⇒ II follows.", "f": null, "p": null}, {"s": "D", "t": "Course of Action", "q": "Statement: Several students of a school fell ill after eating the mid-day meal.<br>Courses of action: I. Food samples should be tested and the supplier investigated. II. The mid-day meal scheme should be stopped in all schools of the State.", "o": ["Only II follows", "Only I follows", "Both I and II follow", "Neither I nor II follows"], "a": 1, "e": "Testing the food and investigating the supplier tackles the problem directly (I). Stopping the scheme everywhere because of one incident is impractical and harmful (II).", "f": null, "p": null}, {"s": "D", "t": "Calendar", "q": "What day of the week was 26 January 1950, the day the Constitution of India came into force?", "o": ["Wednesday", "Thursday", "Sunday", "Friday"], "a": 1, "e": "Odd days up to 1949: 1600 years (0) + 300 years (1) + 49 years (12 leap + 37 ordinary = 61 ≡ 5) ⇒ 6 odd days. Add 26 days of January (5 odd) ⇒ 11 ≡ 4 ⇒ <b>Thursday</b>.", "f": null, "p": null}, {"s": "D", "t": "Clock", "q": "At what time between 4 and 5 o’clock will the hour and minute hands of a clock coincide?", "o": ["21 9⁄11 minutes past 4", "22 minutes past 4", "20 minutes past 4", "21 3⁄11 minutes past 4"], "a": 0, "e": "The minute hand must gain 20 minute-spaces at 11/12 space per minute: 20 × 12/11 = 240/11 = <b>21 9/11 minutes past 4</b>.", "f": null, "p": null}, {"s": "D", "t": "Clock", "q": "What is the angle between the hands of a clock at 3:40?", "o": ["130°", "150°", "120°", "140°"], "a": 0, "e": "θ = |30H − 5.5M| = |90 − 220| = <b>130°</b>.", "f": null, "p": null}, {"s": "D", "t": "Clock Mirror Image", "q": "A clock seen in a plane mirror shows the time as 4:20. What is the actual time?", "o": ["8:40", "4:40", "7:20", "7:40"], "a": 3, "e": "For a mirror image, actual time = 11:60 − mirror time = 11:60 − 4:20 = <b>7:40</b>.", "f": null, "p": null}, {"s": "D", "t": "Cube Net (Non-verbal)", "q": "The given sheet is folded to form a cube. Which number will be on the face opposite to 3?", "o": ["5", "4", "6", "1"], "a": 2, "e": "In a straight column of four squares (1, 3, 5, 6), alternate faces are opposite: 1–5 and 3–<b>6</b>. In the row 2–3–4, 2 and 4 are opposite.", "f": {"kind": "svg", "svg": "<svg viewBox=\"0 0 200 250\" width=\"180\" height=\"225\" role=\"img\" aria-label=\"Open cube net\"><g fill=\"#fff\" stroke=\"#13294b\" stroke-width=\"2.2\"><rect x=\"70\" y=\"10\" width=\"55\" height=\"55\"/><rect x=\"15\" y=\"65\" width=\"55\" height=\"55\"/><rect x=\"70\" y=\"65\" width=\"55\" height=\"55\"/><rect x=\"125\" y=\"65\" width=\"55\" height=\"55\"/><rect x=\"70\" y=\"120\" width=\"55\" height=\"55\"/><rect x=\"70\" y=\"175\" width=\"55\" height=\"55\"/></g><g font-family=\"Arial\" font-size=\"24\" font-weight=\"700\" fill=\"#13294b\" text-anchor=\"middle\"><text x=\"97.5\" y=\"46\">1</text><text x=\"42.5\" y=\"101\">2</text><text x=\"97.5\" y=\"101\">3</text><text x=\"152.5\" y=\"101\">4</text><text x=\"97.5\" y=\"156\">5</text><text x=\"97.5\" y=\"211\">6</text></g></svg>"}, "p": null}, {"s": "D", "t": "Counting Figures (Non-verbal)", "q": "How many triangles are there in the given figure?", "o": ["6", "4", "8", "10"], "a": 2, "e": "The two diagonals form 4 small triangles. Each diagonal also splits the square into 2 large triangles: 2 × 2 = 4. Total = 4 + 4 = <b>8</b>.", "f": {"kind": "svg", "svg": "<svg viewBox=\"0 0 170 170\" width=\"160\" height=\"160\" role=\"img\" aria-label=\"Square with diagonals\"><g fill=\"none\" stroke=\"#13294b\" stroke-width=\"2.4\"><rect x=\"10\" y=\"10\" width=\"150\" height=\"150\"/><line x1=\"10\" y1=\"10\" x2=\"160\" y2=\"160\"/><line x1=\"160\" y1=\"10\" x2=\"10\" y2=\"160\"/></g></svg>"}, "p": null}, {"s": "D", "t": "Missing Number", "q": "Find the missing number in the table.<table style=\"border-collapse:collapse;margin:8px 0;font-size:16px;text-align:center\"><tr><td style=\"border:1.5px solid #13294b;padding:6px 16px\">3</td><td style=\"border:1.5px solid #13294b;padding:6px 16px\">4</td><td style=\"border:1.5px solid #13294b;padding:6px 16px\">25</td></tr><tr><td style=\"border:1.5px solid #13294b;padding:6px 16px\">5</td><td style=\"border:1.5px solid #13294b;padding:6px 16px\">12</td><td style=\"border:1.5px solid #13294b;padding:6px 16px\">169</td></tr><tr><td style=\"border:1.5px solid #13294b;padding:6px 16px\">6</td><td style=\"border:1.5px solid #13294b;padding:6px 16px\">8</td><td style=\"border:1.5px solid #13294b;padding:6px 16px\">?</td></tr></table>", "o": ["48", "100", "96", "64"], "a": 1, "e": "In each row, (1st)² + (2nd)² = 3rd: 9 + 16 = 25, 25 + 144 = 169 ⇒ 36 + 64 = <b>100</b>.", "f": null, "p": null}, {"s": "E", "t": "Curriculum", "q": "“The destiny of India is now being shaped in her classrooms” is the opening line of the report of which commission?", "o": ["Kothari Commission (1964–66)", "Mudaliar Commission (1952–53)", "Hunter Commission (1882)", "Radhakrishnan Commission (1948–49)"], "a": 0, "e": "The <b>Education Commission (1964–66)</b> chaired by D. S. Kothari begins with this line. The Mudaliar Commission dealt with secondary education; the Radhakrishnan Commission with university education.", "f": null, "p": null}, {"s": "E", "t": "Curriculum", "q": "The National Curriculum Framework 2005 (NCF-2005) was developed by NCERT under the chairmanship of:", "o": ["Prof. Yash Pal", "Dr C. N. R. Rao", "Prof. D. S. Kothari", "Dr K. Kasturirangan"], "a": 0, "e": "<b>Prof. Yash Pal</b> chaired the National Steering Committee for NCF-2005, which stressed ‘learning without burden’ and connecting knowledge to life outside school. Dr K. Kasturirangan chaired the committees for NEP 2020 and NCF-SE 2023.", "f": null, "p": null}, {"s": "E", "t": "Curriculum", "q": "NEP 2020 recommends that, wherever possible, the medium of instruction should be the home language/mother tongue/regional language at least until:", "o": ["Grade 10", "Grade 5, but preferably till Grade 8 and beyond", "Grade 2 only", "Grade 12"], "a": 1, "e": "NEP 2020 (para 4.11): medium of instruction in the home language or mother tongue <b>at least until Grade 5, preferably till Grade 8 and beyond</b>.", "f": null, "p": null}, {"s": "E", "t": "Learner & Learning", "q": "According to Vygotsky, the gap between what a learner can do alone and what he can do with the help of a more capable person is called the:", "o": ["Scaffold", "Schema", "Zone of Proximal Development", "Zone of Actual Development"], "a": 2, "e": "The <b>ZPD</b> is where teaching is most effective. The temporary support given by the teacher within it is called <b>scaffolding</b>.", "f": null, "p": null}, {"s": "E", "t": "Learner & Learning", "q": "A child understands that the amount of water stays the same when it is poured from a short wide glass into a tall thin one. According to Piaget, the child has reached the:", "o": ["Concrete operational stage (about 7–11 years)", "Pre-operational stage (about 2–7 years)", "Sensorimotor stage (0–2 years)", "Formal operational stage (11+ years)"], "a": 0, "e": "‘<b>Conservation</b>’ is acquired in the concrete operational stage. Pre-operational children are fooled by appearance (centration).", "f": null, "p": null}, {"s": "E", "t": "Planning", "q": "In the Indian model of micro-teaching (36-minute cycle), how long is the ‘teach’ phase?", "o": ["6 minutes", "12 minutes", "5 minutes", "10 minutes"], "a": 0, "e": "Indian model: Teach 6 min → Feedback 6 min → Re-plan 12 min → Re-teach 6 min → Re-feedback 6 min = 36 minutes. Micro-teaching was developed at Stanford University (D. W. Allen, 1963).", "f": null, "p": null}, {"s": "E", "t": "Planning", "q": "Asking a series of guiding questions to lead a pupil from an incomplete or wrong answer to the correct one is the skill of:", "o": ["Probing questioning", "Set induction", "Reinforcement", "Stimulus variation"], "a": 0, "e": "<b>Probing questioning</b> uses prompting, seeking further information, refocusing and redirection. Set induction is introducing a lesson; stimulus variation keeps attention by changing the teacher’s behaviour.", "f": null, "p": null}, {"s": "E", "t": "Planning", "q": "“Given an outline map of India, the pupil will correctly locate at least five major rivers.” Writing objectives with a condition, an observable behaviour and a criterion is associated with:", "o": ["Ralph Tyler", "Benjamin Bloom", "Robert F. Mager", "Robert Gagné"], "a": 2, "e": "<b>Robert Mager</b> (<i>Preparing Instructional Objectives</i>, 1962) said a behavioural objective should state the performance, the conditions and the criterion of acceptable performance.", "f": null, "p": null}, {"s": "E", "t": "Instructional Material", "q": "India’s Satellite Instructional Television Experiment (SITE), 1975–76, used which satellite?", "o": ["INSAT-1A", "APPLE", "Aryabhata", "ATS-6 (NASA)"], "a": 3, "e": "SITE broadcast educational programmes to about 2,400 villages through NASA’s <b>ATS-6</b>. Aryabhata (1975) was India’s first satellite; INSAT-1A came in 1982.", "f": null, "p": null}, {"s": "E", "t": "Instructional Material", "q": "In a ‘flipped classroom’:", "o": ["Pupils study the lecture material at home and use class time for activities and problem-solving", "Pupils teach the teacher", "The teacher teaches the lesson twice", "Classes are held only online"], "a": 0, "e": "Flipped learning reverses the traditional order: <b>direct instruction moves outside class</b> (videos/readings) and class time is used for discussion, practice and doubt-clearing.", "f": null, "p": null}, {"s": "E", "t": "Evaluation", "q": "During item analysis, an item has a NEGATIVE discrimination index. This means:", "o": ["The item is very easy", "All pupils answered it correctly", "The item is very difficult but valid", "More pupils of the lower group than of the upper group answered it correctly, so the item should be revised or rejected"], "a": 3, "e": "D = (R<sub>U</sub> − R<sub>L</sub>)/(N/2). A negative D means weak pupils did better than strong ones — usually a faulty key or an ambiguous item. It should be <b>revised or discarded</b>.", "f": null, "p": null}, {"s": "E", "t": "Evaluation", "q": "The split-half method of estimating the reliability of a test uses which formula to find the reliability of the whole test?", "o": ["Spearman–Brown prophecy formula", "Karl Pearson’s coefficient of skewness", "Chi-square formula", "Kuder–Richardson formula 20"], "a": 0, "e": "The split-half correlation gives the reliability of half the test; the <b>Spearman–Brown</b> formula (r = 2r<sub>h</sub>/(1 + r<sub>h</sub>)) corrects it for the full length. KR-20 measures internal consistency directly.", "f": null, "p": null}, {"s": "E", "t": "Evaluation", "q": "An achievement test whose questions represent the whole syllabus and all instructional objectives in proper proportion has high:", "o": ["Construct validity", "Content validity", "Predictive validity", "Concurrent validity"], "a": 1, "e": "<b>Content validity</b> is ensured by preparing a blueprint. Predictive validity concerns future performance; concurrent validity compares with another test given at the same time.", "f": null, "p": null}, {"s": "E", "t": "Evaluation", "q": "In the nine-point grading scale used by CBSE, grade A1 corresponds to marks in the range:", "o": ["81–90", "90–100", "95–100", "91–100"], "a": 3, "e": "CBSE nine-point scale: <b>A1 (91–100)</b>, A2 (81–90), B1 (71–80), B2 (61–70), C1 (51–60), C2 (41–50), D (33–40), E (32 and below, needs improvement).", "f": null, "p": null}, {"s": "E", "t": "Communication", "q": "In the communication process, converting an idea into words, symbols or gestures by the sender is called:", "o": ["Feedback", "Decoding", "Noise", "Encoding"], "a": 3, "e": "The sender <b>encodes</b> the message; the receiver <b>decodes</b> (interprets) it; the receiver’s response to the sender is feedback.", "f": null, "p": null}, {"s": "E", "t": "Communication", "q": "Which communication model emphasises that communication succeeds only when the sender and receiver share a common ‘field of experience’?", "o": ["Shannon–Weaver model", "Lasswell’s model", "Aristotle’s model", "Wilbur Schramm’s model"], "a": 3, "e": "<b>Schramm</b> (1954) showed communication as circular, with encoding, decoding and interpretation by both parties, and stressed the overlap of their fields of experience.", "f": null, "p": null}, {"s": "E", "t": "Communication", "q": "The informal communication network in a school or organisation, through which news and rumours spread, is known as the:", "o": ["Chain of command", "Grapevine", "Formal channel", "Feedback loop"], "a": 1, "e": "The <b>grapevine</b> is informal and fast, but often distorted. Formal channels follow the official hierarchy (chain of command).", "f": null, "p": null}, {"s": "E", "t": "Communication", "q": "Communication between two subject teachers of the same rank to plan a joint activity is an example of:", "o": ["Diagonal communication", "Upward communication", "Downward communication", "Horizontal (lateral) communication"], "a": 3, "e": "Between equals = <b>horizontal</b>. Downward = principal to teachers; upward = teachers to principal; diagonal = across levels and departments.", "f": null, "p": null}, {"s": "E", "t": "Communication", "q": "In which type of communication is feedback usually delayed and limited?", "o": ["Intrapersonal communication", "Group discussion", "Mass communication", "Interpersonal communication"], "a": 2, "e": "In <b>mass communication</b> (newspaper, radio, TV) the audience is large and scattered, so feedback is indirect and delayed. Face-to-face communication gives immediate feedback.", "f": null, "p": null}, {"s": "E", "t": "Communication", "q": "A teacher speaks fast in a monotone without pauses, and pupils lose track. Which aspect of non-verbal communication needs improvement?", "o": ["Kinesics", "Paralanguage", "Chronemics", "Proxemics"], "a": 1, "e": "<b>Paralanguage</b> covers how words are spoken — tone, pitch, speed, volume and pauses. Kinesics is body language; proxemics is use of space; chronemics is use of time.", "f": null, "p": null}]};
const EXAM = {

  return `<h3>General Instructions</h3><ol>
  <li>Total duration of the examination is <b>${EXAM.minutes} minutes</b>. There are <b>${QS.length} multiple-choice questions</b>, each with four options and only one correct answer.</li>

  ${legendItems()}
  <ol start="5"><li>You can click on the "&gt;" arrow / Question Palette button (on small screens) to show or hide the palette.</li></ol>

/* ---------- EXAM ---------- */
let tick=null;
function visit(i){ if(S.status[i]==="nv") S.status[i]="na"; S.cur=i; S.pending=S.saved[i]; }
function counts(from=0,to=QS.length-1){
  const c={an:0,na:0,nv:0,mk:0,am:0};
  for(let i=from;i<=to;i++) c[S.status[i]]++;
  return c;
}
function figHTML(q){
  const f=q.f; if(!f) return "";
  if(f.kind==="mirror") return `<div class="fig"><span class="word">${esc(f.text)}</span><span class="mirror-line"><span>M</span><i></i><span>N</span></span></div>`;
  if(f.kind==="water") return `<div class="fig"><div class="water-wrap"><span class="word">${esc(f.text)}</span><div class="water-line"></div><span class="note" style="text-align:center">water surface</span></div></div>`;
  if(f.kind==="img") return `<div class="fig" style="display:block"><img class="figimg" alt="Figure" src="${IMG[f.id]}"><p class="zhint">Tap the figure to enlarge.</p></div>`;
  if(f.kind==="svg") return `<div class="fig">${f.svg}</div>`;
  if(f.kind==="dice") return `<div class="fig dice"><figure>${dieSVG(f.a)}<figcaption>Position (i)</figcaption></figure><figure>${dieSVG(f.b)}<figcaption>Position (ii)</figcaption></figure></div>`;
  return "";
}
function dieSVG([top,front,right]){
  return `<svg viewBox="0 0 120 120" role="img" aria-label="Die showing ${top} on top, ${front} in front, ${right} on the right">
  <polygon points="20,38 60,18 100,38 60,58" fill="#dbe8f6" stroke="#13294b" stroke-width="2"/>
  <polygon points="20,38 60,58 60,108 20,88" fill="#ffffff" stroke="#13294b" stroke-width="2"/>
  <polygon points="60,58 100,38 100,88 60,108" fill="#c3d6ec" stroke="#13294b" stroke-width="2"/>
  <text x="60" y="44" text-anchor="middle" font-size="17" font-weight="700" fill="#13294b" font-family="Arial">${top}</text>
  <text x="40" y="81" text-anchor="middle" font-size="20" font-weight="700" fill="#13294b" font-family="Arial">${front}</text>
  <text x="80" y="81" text-anchor="middle" font-size="20" font-weight="700" fill="#13294b" font-family="Arial">${right}</text></svg>`;
}
function pasHTML(q,open){
  if(!q.p||!PAS[q.p]) return "";
  return open===false ? `<details class="passage"><summary>Show the data / directions</summary>${PAS[q.p]}</details>` : `<div class="passage">${PAS[q.p]}</div>`;
}
function optHTML(q,o){
  if(o[0]==="@" && q.f){
    const t=q.f.text, code=o[1];
    if(code==="P") return `<span class="optfig">${esc(t.split("").reverse().join(""))}</span>`;
    return `<span class="optfig ${code}">${esc(t)}</span>`;
  }
  return o;
}
function secOf(i){return secIdx[QS[i].s];}
function renderExam(){

  const opts=q.o.map((o,k)=>`<label class="opt ${S.pending===k?"sel":""}"><input type="radio" name="opt" value="${k}" ${S.pending===k?"checked":""}><span>${optHTML(q,o)}</span></label>`).join("");

  app.querySelectorAll('input[name="opt"]').forEach(r=>{

  $("#mark").onclick=()=>{ if(S.pending!==null){S.saved[i]=S.pending;S.status[i]="am";} else {S.saved[i]=null;S.status[i]="mk";} next(); };
  $("#clear").onclick=()=>{ S.pending=null; S.saved[i]=null; S.status[i]="na"; persist(); renderExam(); };

function applyFs(){ document.documentElement.style.setProperty("--fs", S.fs||1); }
function examLogout(){
  const d=modal("Logout", `<p>Do you want to leave the test?</p><ul style="line-height:1.7;padding-left:20px"><li><b>Submit &amp; Logout</b> — your test is submitted and you will see your score card and solutions.</li><li><b>Exit without saving</b> — this attempt is cleared from this device and the login screen opens.</li></ul>`,
    `<button class="btn" data-close>Cancel</button><button class="btn btn-out" id="lx">Exit without saving</button><button class="btn btn-primary" id="ls">Submit &amp; Logout</button>`);
  $("#ls",d).onclick=()=>{d.remove(); finish(false);};
  $("#lx",d).onclick=()=>{d.remove(); clearInterval(tick); tick=null; S=fresh(); try{localStorage.removeItem(KEY);}catch(e){} render();};

function go(k){ visit(k); persist(); renderExam(); const qb=$(".qbody"); if(qb) qb.scrollTop=0; }
function next(){ go(S.cur < QS.length-1 ? S.cur+1 : 0); }
function updateTimer(){
  const left=Math.max(0, S.endAt-Date.now()), m=Math.floor(left/60000), s=Math.floor(left/1000)%60;
  const t=$("#timer"); if(t){ t.innerHTML=`Time Left: <b>${pad2(m)}:${pad2(s)}</b>`; t.classList.toggle("low", left<5*60000); }
  if(S.stage==="exam"){
    if(left<=10*60000 && left>5*60000 && !S.w10){ S.w10=true; persist(); toast("Only 10 minutes left. Review your marked questions."); }
    if(left<=5*60000 && left>0 && !S.w5){ S.w5=true; persist(); toast("Only 5 minutes left! The test will be submitted automatically at 00:00."); }
  }
  if(left<=0 && S.stage==="exam"){ finish(true); }
}

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),6000); }
/* ---------- MODALS ---------- */
function modal(title, body, foot){
  const d=document.createElement("div"); d.className="scrim";
  d.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><span>${title}</span><button data-close aria-label="Close">×</button></div><div class="modal-b">${body}</div>${foot?`<div class="modal-f">${foot}</div>`:""}</div>`;

/* ---------- RESULT ---------- */
function evalAll(){
  const per=SECS.map(()=>({n:0,c:0,w:0,u:0}));
  let c=0,w=0,u=0;
  QS.forEach((q,k)=>{const p=per[secOf(k)]; p.n++; const a=S.saved[k];
    if(a===null||a===undefined){u++;p.u++;} else if(a===q.a){c++;p.c++;} else {w++;p.w++;}});
  return {c,w,u,per,score:c*EXAM.plus-w*EXAM.minus};
}

  $("#retake").onclick=()=>{
    const d=modal("Retake Test", `<p>Your current answers and score will be cleared and a fresh ${EXAM.minutes}-minute test will start from the login screen.</p>`, `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="rt">Clear and retake</button>`);
    $("#rt",d).onclick=()=>{const nm=S.name, rl=S.roll; S=fresh(); S.name=nm; S.roll=rl; persist(); d.remove(); render(); window.scrollTo(0,0);};
  };
  renderSolutions();
}
function topicsHTML(){
  const m={};
  QS.forEach((q,k)=>{ const a=S.saved[k]; const miss = a===null||a===undefined||a!==q.a; const t=q.t.replace(/\s*\(.*\)$/,"").replace(/\s*–.*$/,""); if(!m[t]) m[t]={miss:0,n:0}; m[t].n++; if(miss) m[t].miss++; });
  const list=Object.entries(m).filter(([t,v])=>v.miss>0).sort((x,y)=>y[1].miss-x[1].miss||x[0].localeCompare(y[0])).slice(0,12);
  if(!list.length) return `<div class="topics"><h3>Topics to revise</h3><p class="note">No weak topics — every question was answered correctly!</p></div>`;
  return `<div class="topics"><h3>Topics to revise (wrong or not attempted)</h3><div class="tchips">${list.map(([t,v])=>`<span class="tchip">${esc(t)} · <b>${v.miss}/${v.n}</b></span>`).join("")}</div></div>`;
}
function renderSolutions(){
  const F=[["all","All"],["wrong","Wrong"],["skip","Not attempted"],["right","Correct"]];
  const secs=[["all","All sections"]].concat(SECS.map(s=>[s[0],s[1]]));
  $("#filters").innerHTML = F.map(f=>`<button class="chip ${S.filter===f[0]?"on":""}" data-f="${f[0]}">${f[1]}</button>`).join("") +
    `<span style="width:10px"></span>` + secs.map(s=>`<button class="chip ${S.fsec===s[0]?"on":""}" data-s="${s[0]}">${s[1]}</button>`).join("");
  $("#filters").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;persist();renderSolutions();});
  $("#filters").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.fsec=b.dataset.s;persist();renderSolutions();});
  let html="";
  QS.forEach((q,k)=>{
    const a=S.saved[k], st = a===null||a===undefined ? "skip" : (a===q.a?"right":"wrong");
    if(S.filter!=="all" && S.filter!==st) return;
    if(S.fsec!=="all" && S.fsec!==q.s) return;
    const pill = st==="right"?`<span class="pill ok">Correct +${EXAM.plus}</span>`:st==="wrong"?`<span class="pill bad">Wrong</span>`:`<span class="pill skip">Not attempted</span>`;
    const opts=q.o.map((o,j)=>{const cls=j===q.a?"right":(j===a?"wrong":""); const tag=j===q.a?"Correct answer":(j===a?"Your answer":""); return `<div class="sopt ${cls}"><span class="L">${j+1}.</span><span>${optHTML(q,o)}</span>${tag?`<span class="tag">${tag}${j===q.a&&j===a?" · Your answer":""}</span>`:""}</div>`;}).join("");
    html+=`<article class="sol"><div class="sol-top"><span><b style="color:var(--ink)">Q${k+1}</b> · ${SECS[secOf(k)][1]} · ${q.t}</span>${pill}</div>
      ${pasHTML(q,false)}<div class="qtext">${q.q}</div>${figHTML(q)}<div class="sopts">${opts}</div><div class="exp"><h4>Explanation</h4>${q.e}</div></article>`;
  });
  $("#sollist").innerHTML = html || `<p class="empty">No questions match this filter.</p>`;
}

/* ---------- ROUTER ---------- */
const app=$("#app");
document.addEventListener("click",e=>{ const im=e.target.closest&&e.target.closest(".figimg"); if(!im) return; modal("Figure (scroll / pinch to zoom)", `<div class="zoomwrap"><img alt="Enlarged figure" src="${im.getAttribute("src")}"></div>`, `<button class="btn btn-primary" data-close>Close</button>`); });
function render(){
  window.scrollTo(0,0); applyFs();
  if(S.stage==="exam" && S.endAt && Date.now()>=S.endAt){ finish(true); return; }
  if(S.stage==="login") renderLogin();
  else if(S.stage==="instr") renderInstr();
  else if(S.stage==="exam"){ if(S.pending===undefined) S.pending=S.saved[S.cur]; renderExam(); if(!tick) tick=setInterval(updateTimer,1000); }
  else renderResult();
}
render();
</script>
</body>
</html>
