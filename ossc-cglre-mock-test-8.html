<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gyana Education Service – OSSC CGLRE (Specialist) 2025 Preliminary Examination – Free Online CBT Mock Test-8 (TCS pattern)">
<title>OSSC CGLRE (Specialist) Prelim – Mock Test-8 | Gyana Education Service</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: TCS iON-style exam console — header strip, question pane left, palette right; light-only by design (mirrors the real exam screen) */
:root{
  --ink:#1b2430; --muted:#5d6b7c; --line:#cfd8e3; --paper:#ffffff; --wash:#eef3f8;
  --brand:#0b4f8a; --brand-2:#1167b1; --brand-ink:#ffffff; --head:#e9eef4;
  --ans:#2e9e3f; --nans:#e2502b; --nv:#e3e6ea; --nv-b:#b9c1cb; --mark:#6a3fb5; --gold:#f4b400;
  --ok:#1f8a3b; --ok-wash:#e5f5e8; --bad:#c8352a; --bad-wash:#fdeceb; --info-wash:#fff8e1;
  --f:Arial, "Helvetica Neue", Helvetica, "Noto Sans", sans-serif;
  color-scheme: light;
}
html,body{height:100%}
#app{height:100%}
body{background:var(--wash);color:var(--ink);font-family:var(--f);font-size:14px;}
*{box-sizing:border-box}
button{font-family:var(--f);cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.screen{min-height:100%;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top brand strip */
.topbar{background:var(--brand);color:var(--brand-ink);padding-block:8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px;border:2px solid var(--gold);flex:none}
.tb-text{min-width:0;flex:1 1 220px}
.tb-org{font-weight:700;letter-spacing:1.2px;font-size:15px}
.tb-exam{font-size:12.5px;opacity:.92}
.tb-right{font-size:12px;text-align:right;opacity:.92}

/* login */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding-block:28px}
.login{display:grid;grid-template-columns:1fr 1fr;max-width:860px;width:100%;background:var(--paper);border:1px solid var(--line);box-shadow:0 2px 10px rgba(11,79,138,.08)}
.login-info{background:var(--head);padding:24px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line)}
.login-info .row{display:flex;gap:8px;font-size:13.5px}
.login-info .k{color:var(--muted);min-width:118px}
.login-info .v{font-weight:700}
.login-form{padding:24px;display:flex;flex-direction:column;gap:12px}
.login-form h2{margin:0 0 4px;font-size:18px;color:var(--brand)}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:9px 10px;border:1px solid var(--nv-b);border-radius:3px;font-size:14px;font-family:var(--f)}
.btn{border:1px solid var(--nv-b);background:var(--paper);color:var(--ink);padding:9px 16px;border-radius:3px;font-size:13.5px}
.btn:hover{background:var(--head)}
.btn-primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff;font-weight:700}
.btn-primary:hover{background:var(--brand)}
.btn-primary:disabled{background:#9db8d3;border-color:#9db8d3;cursor:not-allowed}
.btn-green{background:var(--ans);border-color:var(--ans);color:#fff;font-weight:700}
.btn-green:hover{filter:brightness(.92)}
.note{font-size:12px;color:var(--muted);line-height:1.5}

/* instructions */
.instr{flex:1;padding-block:18px;display:flex;justify-content:center}
.instr-card{background:var(--paper);border:1px solid var(--line);max-width:980px;width:100%;display:flex;flex-direction:column}
.instr-head{background:var(--head);padding:12px 18px;font-weight:700;color:var(--brand);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.instr-body{padding:16px 22px;line-height:1.6;font-size:13.5px;overflow:auto}
.instr-body h3{font-size:14px;margin:14px 0 6px;color:var(--brand)}
.instr-body ol{padding-left:22px;margin:6px 0}
.instr-body li{margin-bottom:5px}
.legend-list{display:grid;gap:8px;margin:8px 0 8px 4px}
.legend-list div{display:flex;align-items:center;gap:10px}
.pattern{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.pattern th,.pattern td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.pattern th{background:var(--head)}
.pattern td.n{text-align:center;font-variant-numeric:tabular-nums}
.instr-foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;flex-direction:column;gap:12px}
.declare{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5}
.declare input{margin-top:3px;width:16px;height:16px;flex:none}
.instr-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* exam */
.exam{height:100%;display:flex;flex-direction:column}
.exam-main{flex:1;display:flex;min-height:0}
.qpane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper);border-right:1px solid var(--line)}
.secbar{display:flex;align-items:center;gap:8px;background:var(--head);border-bottom:1px solid var(--line);padding-block:6px;flex-wrap:wrap}
.secbar .lbl{font-weight:700;font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.tab{border:1px solid var(--nv-b);background:var(--paper);padding:6px 10px;font-size:12.5px;border-radius:3px 3px 0 0;color:var(--brand)}
.tab.on{background:var(--brand-2);color:#fff;border-color:var(--brand-2);font-weight:700}
.timer{font-weight:700;font-size:13px;background:var(--paper);border:1px solid var(--nv-b);padding:6px 10px;border-radius:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer b{color:var(--brand)}
.timer.low b{color:var(--bad)}
.qtype{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;padding-block:7px;border-bottom:1px solid var(--line);color:var(--muted)}
.qtype .mk span{color:var(--ok);font-weight:700}
.qtype .mk em{color:var(--bad);font-style:normal;font-weight:700}
.qhead{display:flex;justify-content:space-between;align-items:center;padding-block:9px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.qhead h2{margin:0;font-size:15px}
.qhead .lang{font-size:12px;color:var(--muted)}
.qhead select{font-size:12px;padding:2px 4px}
.qbody{flex:1;overflow:auto;padding-block:14px 20px;min-height:0}
.qtext{font-size:calc(15.5px*var(--fs,1));line-height:1.65;max-width:78ch}
.qtext b{font-weight:700}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px;max-width:78ch}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border:1px solid transparent;border-radius:3px;cursor:pointer;font-size:calc(15px*var(--fs,1));line-height:1.5}
.opt:hover{background:#f3f7fb;border-color:var(--line)}
.opt input{margin-top:4px;width:16px;height:16px;flex:none;accent-color:var(--brand-2)}
.opt.sel{background:#eaf2fb;border-color:#a9c6e6}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--head);padding-block:9px;padding-bottom:max(9px,env(safe-area-inset-bottom,0px))}
.actions .l{display:flex;gap:8px;flex-wrap:wrap}

/* palette */
.palette{width:300px;flex:none;display:flex;flex-direction:column;background:#f7f9fc;min-height:0}
.cand{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.cand svg{width:50px;height:58px;flex:none;border:1px solid var(--line);background:var(--head)}
.cand .nm{font-weight:700;font-size:13.5px;word-break:break-word}
.cand .roll{font-size:12px;color:var(--muted)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:11.5px;line-height:1.25}
.legend .it{display:flex;align-items:center;gap:6px}
.legend .it.wide{grid-column:1/-1}
.pal-sec{background:var(--brand-2);color:#fff;font-weight:700;font-size:12.5px;padding:6px 12px}
.pal-choose{font-size:12px;color:var(--muted);padding:8px 12px 2px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:9px 6px;padding:8px 12px 12px;align-content:start;min-height:0}
.pal-foot{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:var(--head);padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.pal-foot .btn-green{grid-column:1/-1}

/* status shapes */
.st{width:38px;height:33px;display:inline-grid;place-items:center;font-size:12.5px;font-weight:700;position:relative;border:1px solid transparent;font-variant-numeric:tabular-nums;flex:none;padding:0}
.st.sm{width:28px;height:25px;font-size:11px}
.st.nv{background:var(--nv);border-color:var(--nv-b);color:var(--ink);border-radius:3px}
.st.na{background:var(--nans);color:#fff;border-radius:2px 2px 14px 14px / 2px 2px 9px 9px}
.st.an{background:var(--ans);color:#fff;border-radius:14px 14px 2px 2px / 9px 9px 2px 2px}
.st.mk{background:var(--mark);color:#fff;border-radius:50%}
.st.am{background:var(--mark);color:#fff;border-radius:50%}
.st.am::after{content:"";position:absolute;right:-3px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--ans);border:2px solid #fff;box-sizing:border-box}
.st.sm.am::after{width:10px;height:10px;right:-3px;bottom:-2px}
.grid .st{justify-self:center;cursor:pointer}
.grid .st.cur{outline:2px solid var(--gold);outline-offset:2px}

/* figures */
.fig{margin:14px 0 4px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.word{font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:30px;letter-spacing:2px;color:#13294b;padding:6px 14px;border:1px dashed var(--nv-b);background:#fff}
.mirror-line{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:2px}
.mirror-line i{display:block;width:4px;height:58px;background:linear-gradient(#6aa3db,#2b6cb0)}
.water-wrap{display:flex;flex-direction:column;gap:3px}
.water-line{height:5px;background:repeating-linear-gradient(90deg,#4a90d9 0 10px,#9cc5ef 10px 20px);border-radius:3px}
.optfig{display:inline-block;font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:22px;letter-spacing:2px;color:#13294b}
.optfig.M{transform:scaleX(-1)} .optfig.W{transform:scaleY(-1)} .optfig.R{transform:rotate(180deg)}
.dice{display:flex;gap:26px;flex-wrap:wrap}
.dice figure{margin:0;text-align:center;font-size:12px;color:var(--muted)}
.dice svg{width:120px;height:120px;display:block}

.figimg{display:block;max-width:100%;height:auto;border:1px solid var(--line);background:#fff;margin:8px 0;cursor:zoom-in}
.zoomwrap{overflow:auto;max-height:75vh}.zoomwrap img{display:block;width:760px;max-width:none;height:auto}
.zhint{font-size:11.5px;color:var(--muted);margin:2px 0 0}
.passage{background:#f6f9fd;border:1px solid #c9d8ea;border-left:4px solid var(--brand-2);padding:10px 12px;margin:0 0 14px;font-size:calc(14px*var(--fs,1));line-height:1.6;max-width:78ch}
.passage summary{cursor:pointer;font-weight:700;color:var(--brand)}
.ptitle{font-weight:700;color:var(--brand);margin-bottom:4px}
.ptbl{overflow-x:auto;margin-top:8px}
.ptbl table{border-collapse:collapse;font-size:13.5px;background:#fff;min-width:320px}
.ptbl th,.ptbl td{border:1px solid #b9c7d8;padding:5px 9px;text-align:center}
.ptbl th{background:#e3ecf6}
.ptbl td:first-child{text-align:left;font-weight:700}
.fsz{display:inline-flex;gap:4px;align-items:center;margin-left:8px}
.fsz button{padding:2px 8px;font-size:12px}
.btn-out{border-color:#c8352a;color:#c8352a;font-weight:700}
.btn-out:hover{background:#fdeceb}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,30,50,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--paper);max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal-h{background:var(--brand);color:#fff;padding:10px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-h button{background:transparent;border:0;color:#fff;font-size:20px;line-height:1}
.modal-b{padding:14px 16px;overflow:auto}
.modal-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
.sumtbl{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.sumtbl th,.sumtbl td{border:1px solid var(--line);padding:7px 8px;text-align:center;font-variant-numeric:tabular-nums}
.sumtbl th{background:var(--head);font-size:12px}
.sumtbl td:first-child,.sumtbl th:first-child{text-align:left}
.sumtbl tr.tot td{font-weight:700;background:#f7f9fc}
.qp-item{border-bottom:1px solid var(--line);padding:10px 0;font-size:13.5px;line-height:1.55}
.qp-item .n{font-weight:700;color:var(--brand)}

/* result */
.result{flex:1;padding-block:18px 30px;display:flex;flex-direction:column;align-items:center;gap:16px}
.rcard{background:var(--paper);border:1px solid var(--line);max-width:1000px;width:100%}
.rhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.rhead h2{margin:0;font-size:18px;color:var(--brand)}
.score-row{display:grid;grid-template-columns:auto 1fr;gap:22px;padding:18px;align-items:center}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:30px;display:block;font-variant-numeric:tabular-nums}
.ring .c span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;width:100%}
.stat{border:1px solid var(--line);padding:10px 12px}
.stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.stat.ok .v{color:var(--ok)} .stat.bad .v{color:var(--bad)}
.verdict{margin:0 18px 16px;padding:10px 14px;background:var(--info-wash);border:1px solid #f1d68a;font-size:13.5px;line-height:1.5}
.secbars{padding:4px 18px 18px;display:grid;gap:10px}
.sb{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.sb .bar{height:14px;background:var(--nv);position:relative;overflow:hidden;border-radius:2px}
.sb .bar i{position:absolute;inset:0 auto 0 0;background:var(--brand-2)}
.sb .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center}
.chip{border:1px solid var(--nv-b);background:var(--paper);padding:5px 10px;border-radius:14px;font-size:12.5px}
.chip.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.sol{padding:14px 18px;border-bottom:1px solid var(--line)}
.sol-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.pill{padding:2px 8px;border-radius:10px;font-weight:700;font-size:11.5px}
.pill.ok{background:var(--ok-wash);color:var(--ok)} .pill.bad{background:var(--bad-wash);color:var(--bad)} .pill.skip{background:var(--nv);color:var(--muted)}
.sol .qtext{font-size:14.5px}
.sopts{display:grid;gap:6px;margin:10px 0}
.sopt{padding:7px 10px;border:1px solid var(--line);border-radius:3px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.sopt .L{font-weight:700;color:var(--muted);flex:none}
.sopt.right{background:var(--ok-wash);border-color:#9fd3ac}
.sopt.wrong{background:var(--bad-wash);border-color:#efb1ab}
.sopt .tag{margin-left:auto;font-size:11.5px;font-weight:700;white-space:nowrap}
.sopt.right .tag{color:var(--ok)} .sopt.wrong .tag{color:var(--bad)}
.exp{background:#f4f8fc;border-left:3px solid var(--brand-2);padding:9px 12px;font-size:13.5px;line-height:1.6}
.exp h4{margin:0 0 4px;font-size:12px;letter-spacing:.6px;color:var(--brand);text-transform:uppercase}
.empty{padding:22px 18px;color:var(--muted)}

.palette-toggle{display:none}
.site-foot{flex:none;min-height:64px;display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;background:#0a3f6e;color:#dbe8f6;font-size:12px;padding-block:8px;padding-right:max(210px,env(safe-area-inset-right,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.site-foot b{color:#fff}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff8e1;border:1px solid #f1d68a;color:#5b4300;padding:10px 16px;font-weight:700;font-size:13.5px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.15);max-width:calc(100% - 32px);text-align:center}
.cta{margin:0 18px 16px;padding:12px 14px;border:1px solid #9fc0e3;background:#eef5fc;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:13.5px;line-height:1.5}
.cta a,.ractions a{text-decoration:none}
.btn-wa{background:#1f9d55;border-color:#1f9d55;color:#fff;font-weight:700;display:inline-block}
.btn-wa:hover{filter:brightness(.92)}
.topics{padding:0 18px 18px}
.topics h3{font-size:14px;margin:0 0 8px;color:var(--brand)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid #efb1ab;background:var(--bad-wash);color:#7a1f17;padding:4px 10px;border-radius:12px;font-size:12.5px}
.tchip b{font-variant-numeric:tabular-nums}
.ractions{display:flex;gap:8px;flex-wrap:wrap}
.result{padding-bottom:84px}
@media print{.topbar .tb-right,.site-foot,.ractions,#filters,.cta,#logout,#retake,.toast{display:none!important}body{background:#fff}.rcard{border:0}.sol{break-inside:avoid}}
@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login-info{border-right:0;border-bottom:1px solid var(--line)}
  .palette{position:fixed;top:0;right:0;bottom:0;width:min(320px,88vw);z-index:40;box-shadow:-6px 0 18px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px)}
  .palette.open{transform:none}
  .palette{bottom:64px}
  .site-foot{padding-right:max(170px,env(safe-area-inset-right,0px));font-size:11px}
  .site-foot span:nth-child(2){display:none}
  .palette-toggle{display:inline-block}
  .tb-right{flex:1 1 100%;text-align:left}
  .exam .tb-right{display:none}
  .secbar .lbl{display:none}
  .tabs{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .tab{white-space:nowrap;flex:none}
  .timer{margin-right:auto}
  .score-row{grid-template-columns:1fr;justify-items:center}
  .sb{grid-template-columns:110px 1fr 56px}
  .qtext{font-size:calc(15px*var(--fs,1))}
  .secbar{gap:6px}
  .timer{font-size:12.5px;padding:5px 8px}
}
@media (prefers-reduced-motion:reduce){.palette{transition:none}}
</style>
</head>
<body>

<script>
const DATA = {"sections": [["A", "Arithmetic"], ["B", "Data Interpretation"], ["C", "Reasoning & GMA"], ["D", "Current Events"], ["E", "Computer Awareness"]], "qs": [{"s": "A", "t": "Approximation", "q": "What approximate value will come in place of the question mark (?): (32.01² − 17.98²) ÷ 14.03 = ?", "o": ["60", "45", "55", "50"], "a": 3, "e": "≈ (32² − 18²) ÷ 14 = (32 + 18)(32 − 18) ÷ 14 = 50 × 14 ÷ 14 = <b>50<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Approximation", "q": "What approximate value will come in place of the question mark (?): 59.98% of 450.12 + 33.33% of 297.03 = ?", "o": ["349", "379", "369", "359"], "a": 2, "e": "≈ 60% of 450 + 1/3 of 297 = 270 + 99 = <b>369<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Average", "q": "The average of eight consecutive odd numbers is 40. What is the largest of these numbers?", "o": ["43", "45", "47", "49"], "a": 2, "e": "The numbers are 33, 35, 37, 39, 41, 43, 45, 47 (the middle two are 39 and 41) ⇒ largest = <b>47<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Average", "q": "The average marks of 40 students in a class is 62. If the marks of the top 5 students are removed, the average of the rest drops by 2. What is the average marks of the top 5 students?", "o": ["76", "72", "78", "74"], "a": 0, "e": "Total = 40 × 62 = 2,480; the other 35 total 35 × 60 = 2,100 ⇒ top 5 total 380 ⇒ average <b>76<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage", "q": "After paying 20% of his income as house rent and 25% of the remainder on food, a man is left with ₹10,800. What is his income?", "o": ["₹15,000", "₹18,000", "₹20,000", "₹16,000"], "a": 1, "e": "x × 0.80 × 0.75 = 0.6x = 10,800 ⇒ x = <b>₹18,000<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Profit & Loss", "q": "The cost price of 25 pens is equal to the selling price of 20 pens. What is the profit per cent?", "o": ["20%", "30%", "15%", "25%"], "a": 3, "e": "Profit = (25 − 20)/20 × 100 = <b>25%<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Time & Work", "q": "If 8 men working 6 hours a day can build a wall in 15 days, in how many days can 9 men working 8 hours a day build a wall twice as long?", "o": ["20", "16", "24", "18"], "a": 0, "e": "8 × 6 × 15 = 720 man-hours per wall ⇒ 2 walls = 1,440 ⇒ days = 1,440 ÷ (9 × 8) = <b>20<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Speed & Distance", "q": "Two buses start from the same place in the same direction, the first at 8:00 a.m. at 40 km/h and the second at 9:30 a.m. at 60 km/h. At what distance from the starting place will the second bus overtake the first?", "o": ["200 km", "150 km", "120 km", "180 km"], "a": 3, "e": "Lead at 9:30 = 40 × 1.5 = 60 km; relative speed 20 km/h ⇒ 3 hours ⇒ distance = 60 × 3 = <b>180 km<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Boats & Streams", "q": "A boat can travel at 16 km/h in still water. If the speed of the stream is 4 km/h, how long will it take to go 60 km upstream?", "o": ["3 hours", "5 hours", "6 hours", "4 hours"], "a": 1, "e": "Upstream speed = 16 − 4 = 12 km/h ⇒ 60 ÷ 12 = <b>5 hours<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Pipes & Cisterns", "q": "Three pipes A, B and C together fill a tank in 4 hours. Pipe B is twice as fast as A, and C is three times as fast as A. How long will pipe A alone take to fill the tank?", "o": ["36 hours", "18 hours", "24 hours", "12 hours"], "a": 2, "e": "Rates 1 : 2 : 3 ⇒ together = 6 × A's rate = 1/4 ⇒ A's rate = 1/24 ⇒ <b>24 hours<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage", "q": "A shopkeeper sold 30% of his oranges and was still left with 840 oranges. How many oranges did he have originally?", "o": ["1,120", "1,100", "1,260", "1,200"], "a": 3, "e": "70% = 840 ⇒ total = <b>1,200<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Ratio", "q": "A purse contains ₹360 in coins of ₹1, ₹2 and ₹5 in the ratio 3 : 4 : 5 (by number). How many ₹2 coins are there?", "o": ["45", "40", "50", "30"], "a": 1, "e": "Value = 3x + 8x + 25x = 36x = 360 ⇒ x = 10 ⇒ ₹2 coins = 4x = <b>40<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Linear Equations", "q": "The price of 6 pens is equal to the price of 4 notebooks. The price of 9 pens and 5 notebooks together is ₹330. What is the price of 3 pens and 2 notebooks?", "o": ["₹110", "₹150", "₹130", "₹120"], "a": 3, "e": "Notebook = 1.5 × pen ⇒ 9p + 7.5p = 16.5p = 330 ⇒ p = ₹20, notebook = ₹30 ⇒ 3p + 2n = 60 + 60 = <b>₹120<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "The length of a rectangular field is 15 m more than its breadth. If the cost of fencing it at ₹25 per metre is ₹4,750, what is the area of the field?", "o": ["2,100 m²", "2,200 m²", "2,000 m²", "2,250 m²"], "a": 1, "e": "Perimeter = 4,750 ÷ 25 = 190 m ⇒ 2(2b + 15) = 190 ⇒ b = 40, l = 55 ⇒ area = <b>2,200 m²<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Number Series", "q": "What will come in place of the question mark (?) in the series: 2, 7, 22, 67, 202, ?", "o": ["604", "607", "610", "606"], "a": 1, "e": "Each term = previous × 3 + 1 ⇒ 202 × 3 + 1 = <b>607<\/b>.", "f": null, "p": null}, {"s": "A", "t": "LCM & HCF", "q": "The ratio of two numbers is 3 : 4 and their HCF is 7. What is their LCM?", "o": ["84", "168", "112", "42"], "a": 0, "e": "Numbers 21 and 28 ⇒ LCM = 7 × 3 × 4 = <b>84<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Algebra", "q": "If 2x + 3y = 13 and 3x − 2y = 0, what is the value of x² + y²?", "o": ["25", "10", "13", "12"], "a": 2, "e": "From the second equation y = 1.5x ⇒ 2x + 4.5x = 13 ⇒ x = 2, y = 3 ⇒ x² + y² = <b>13<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Speed & Distance", "q": "A car travels 240 km in 4 hours. If its speed is increased by 20 km/h, how much time will it take to travel 300 km?", "o": ["3 h 45 min", "3 h 20 min", "3 h 30 min", "4 h"], "a": 0, "e": "Speed 60 → 80 km/h ⇒ 300 ÷ 80 = 3.75 h = <b>3 h 45 min<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Interest", "q": "The simple interest on a sum for 4 years at 6% per annum is ₹1,800. What is the compound interest on the same sum for 2 years at 10% per annum?", "o": ["₹1,500", "₹1,600", "₹1,650", "₹1,575"], "a": 3, "e": "Sum = 1,800 × 100 ÷ 24 = ₹7,500 ⇒ CI = 7,500 × (1.21 − 1) = <b>₹1,575<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Mixture", "q": "In a mixture of 60 litres, the ratio of milk to water is 2 : 1. How much water must be added to make the ratio 1 : 1?", "o": ["15 litres", "10 litres", "25 litres", "20 litres"], "a": 3, "e": "Milk 40 L, water 20 L ⇒ water must become 40 L ⇒ add <b>20 litres<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Profit & Loss", "q": "A sells an article to B at a profit of 20%, and B sells it to C at a loss of 10%. If C pays ₹540, what did A pay for it?", "o": ["₹450", "₹500", "₹480", "₹540"], "a": 1, "e": "A's cost × 1.2 × 0.9 = 1.08 × cost = 540 ⇒ cost = <b>₹500<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Ages", "q": "Five years ago, Ravi's age was three times his son's age. After 10 years, Ravi's age will be twice his son's age. What is Ravi's present age?", "o": ["55 years", "40 years", "50 years", "45 years"], "a": 2, "e": "R − 5 = 3(S − 5) and R + 10 = 2(S + 10) ⇒ S = 20, R = <b>50 years<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Ratio", "q": "The ratio of the incomes of A and B is 4 : 3 and the ratio of their expenditures is 3 : 2. If each saves ₹2,000, what is A's income?", "o": ["₹8,000", "₹10,000", "₹12,000", "₹6,000"], "a": 0, "e": "4x − 3y = 2,000 and 3x − 2y = 2,000 ⇒ x = y = 2,000 ⇒ A's income = 4 × 2,000 = <b>₹8,000<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Mensuration", "q": "A cylindrical tank of radius 7 m and height 10 m is full of water. How many kilolitres of water does it hold? (π = 22/7)", "o": ["15,400 kL", "1,540 kL", "1,450 kL", "154 kL"], "a": 1, "e": "Volume = 22/7 × 49 × 10 = 1,540 m³; 1 m³ = 1 kilolitre ⇒ <b>1,540 kL<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage", "q": "Two numbers differ by 20% of the larger number. If the smaller number is 48, what is the larger number?", "o": ["57.6", "64", "58", "60"], "a": 3, "e": "Smaller = 80% of larger ⇒ larger = 48 ÷ 0.8 = <b>60<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Probability", "q": "A bag contains 4 red and 6 green balls. Two balls are drawn at random. What is the probability that one is red and the other is green?", "o": ["7/15", "4/15", "2/5", "8/15"], "a": 3, "e": "(⁴C₁ × ⁶C₁) ÷ ¹⁰C₂ = 24/45 = <b>8/15<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Geometry", "q": "How many diagonals does a polygon with 12 sides have?", "o": ["54", "60", "66", "48"], "a": 0, "e": "n(n − 3)/2 = 12 × 9 ÷ 2 = <b>54<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage", "q": "If 40% of a number is 30 more than 25% of the same number, what is the number?", "o": ["120", "150", "200", "250"], "a": 2, "e": "15% of the number = 30 ⇒ number = <b>200<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Average Speed", "q": "A man walks at 5 km/h for 6 hours and then at 4 km/h for 12 hours. What is his average speed for the whole journey?", "o": ["4 km/h", "4 1/2 km/h", "4 2/3 km/h", "4 1/3 km/h"], "a": 3, "e": "Distance = 30 + 48 = 78 km; time = 18 h ⇒ 78/18 = <b>4 1/3 km/h<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Interest", "q": "At what rate per cent per annum, compounded annually, will ₹6,000 amount to ₹7,260 in 2 years?", "o": ["11%", "10%", "9.5%", "12%"], "a": 1, "e": "7,260/6,000 = 1.21 = (1.1)² ⇒ <b>10%<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Number System", "q": "The sum of the digits of a two-digit number is 12. If 18 is subtracted from the number, its digits are reversed. What is the number?", "o": ["57", "66", "84", "75"], "a": 3, "e": "a + b = 12 and 9(a − b) = 18 ⇒ a − b = 2 ⇒ a = 7, b = 5 ⇒ <b>75<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Ratio", "q": "If a : b = 5 : 7 and b : c = 3 : 4, what is a : c?", "o": ["15 : 28", "28 : 15", "5 : 4", "21 : 20"], "a": 0, "e": "a : c = (5 × 3) : (7 × 4) = <b>15 : 28<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Simplification", "q": "What is the value of 3 1/2 + 2 1/3 − 1 5/6?", "o": ["4 1/6", "4", "3 5/6", "5"], "a": 1, "e": "= 21/6 + 14/6 − 11/6 = 24/6 = <b>4<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Profit & Loss", "q": "A clock is bought for ₹1,200 and sold at a profit equal to 20% of the selling price. What is the selling price?", "o": ["₹1,400", "₹1,500", "₹1,440", "₹1,560"], "a": 1, "e": "CP = 80% of SP ⇒ SP = 1,200 ÷ 0.8 = <b>₹1,500<\/b>.", "f": null, "p": null}, {"s": "A", "t": "Percentage", "q": "A number is first increased by 10% and then by 20%, and becomes 1,320. What was the original number?", "o": ["1,050", "1,000", "960", "1,100"], "a": 1, "e": "x × 1.1 × 1.2 = 1.32x = 1,320 ⇒ x = <b>1,000<\/b>.", "f": null, "p": null}, {"s": "B", "t": "DI – Caselet", "q": "What is the total number of women employees in the company?", "o": ["267", "273", "257", "263"], "a": 0, "e": "Production 240 (women 30% = 72), Sales 150 (60% = 90), Administration 210 (50% = 105) ⇒ 72 + 90 + 105 = <b>267<\/b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Caselet", "q": "What is the ratio of men in Production to men in Administration?", "o": ["8 : 7", "7 : 5", "5 : 8", "8 : 5"], "a": 3, "e": "Men: Production 240 − 72 = 168; Administration 210 − 105 = 105 ⇒ 168 : 105 = <b>8 : 5<\/b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Caselet", "q": "Women in the Sales department are what per cent of all the employees of the company?", "o": ["12%", "18%", "15%", "25%"], "a": 2, "e": "90/600 × 100 = <b>15%<\/b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Caselet", "q": "If 20 more women join the Sales department, what will be the approximate percentage of women in Sales?", "o": ["66.7%", "62.9%", "64.7%", "63.5%"], "a": 2, "e": "Women 110 out of 170 ⇒ 110/170 × 100 ≈ <b>64.7%<\/b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Caselet", "q": "By how many does the number of men in the company exceed the number of women?", "o": ["66", "56", "72", "76"], "a": 0, "e": "Men = 600 − 267 = 333 ⇒ 333 − 267 = <b>66<\/b>.", "f": null, "p": "P1"}, {"s": "B", "t": "DI – Table", "q": "What is the total number of History books in the five libraries?", "o": ["490", "510", "530", "520"], "a": 1, "e": "History: L1 300 − 200 = 100, L2 90, L3 110, L4 80, L5 380 − 250 = 130 ⇒ <b>510<\/b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Table", "q": "What is the average number of Fiction books per library?", "o": ["150", "144", "140", "148"], "a": 1, "e": "Fiction in L2 = 400 − 240 = 160 ⇒ (120 + 160 + 200 + 90 + 150) ÷ 5 = 720 ÷ 5 = <b>144<\/b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Table", "q": "What is the ratio of Science books in L3 to History books in L5?", "o": ["14 : 11", "14 : 13", "7 : 6", "13 : 14"], "a": 1, "e": "Science L3 = 450 − 310 = 140; History L5 = 130 ⇒ <b>14 : 13<\/b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Table", "q": "The total number of books in L4 is what per cent of the total in L3?", "o": ["62 1/2%", "75%", "66 2/3%", "60%"], "a": 2, "e": "L4 total = 90 + 130 + 80 = 300 ⇒ 300/450 × 100 = <b>66 2/3%<\/b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Table", "q": "Which library has the largest number of Science books?", "o": ["L3", "L2", "L4", "L5"], "a": 1, "e": "Science: L1 80, L2 150, L3 140, L4 130, L5 100 ⇒ <b>L2<\/b>.", "f": null, "p": "P2"}, {"s": "B", "t": "DI – Pie & Bar", "q": "How many foreign tourists visited park S?", "o": ["10,200", "10,800", "9,600", "11,400"], "a": 1, "e": "S = 30% of 2,40,000 = 72,000; foreign = 15% of 72,000 = <b>10,800<\/b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie & Bar", "q": "What is the total number of foreign tourists who visited the five parks?", "o": ["43,800", "42,600", "41,800", "44,400"], "a": 0, "e": "P 12,000 + Q 4,800 + R 9,000 + S 10,800 + T 7,200 = <b>43,800<\/b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie & Bar", "q": "What is the ratio of domestic tourists in park P to domestic tourists in park R?", "o": ["16 : 9", "9 : 16", "16 : 11", "4 : 3"], "a": 0, "e": "P: 80% of 60,000 = 48,000; R: 75% of 36,000 = 27,000 ⇒ <b>16 : 9<\/b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie & Bar", "q": "Which park received the largest number of foreign tourists?", "o": ["R", "P", "S", "T"], "a": 1, "e": "P 12,000, Q 4,800, R 9,000, S 10,800, T 7,200 ⇒ <b>P<\/b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Pie & Bar", "q": "Domestic tourists in park T are approximately what per cent of domestic tourists in park Q?", "o": ["36.4%", "38.9%", "41.2%", "35.0%"], "a": 1, "e": "T: 70% of 24,000 = 16,800; Q: 90% of 48,000 = 43,200 ⇒ 16,800/43,200 × 100 ≈ <b>38.9%<\/b>.", "f": null, "p": "P3"}, {"s": "B", "t": "DI – Line Graph", "q": "What are the total marks obtained by Rina in the five tests?", "o": ["750", "770", "740", "730"], "a": 0, "e": "(65 + 72 + 80 + 70 + 88)% of 200 = 375% of 200 = <b>750<\/b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Line Graph", "q": "By how many marks did Sumit score more than Rina in Test 4?", "o": ["28", "24", "20", "12"], "a": 1, "e": "(82 − 70)% of 200 = <b>24<\/b> marks.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Line Graph", "q": "What is Sumit's average percentage of marks in the five tests?", "o": ["76%", "75%", "74%", "73.5%"], "a": 1, "e": "(70 + 68 + 75 + 82 + 80) ÷ 5 = 375 ÷ 5 = <b>75%<\/b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Line Graph", "q": "In how many tests did Rina score more than Sumit?", "o": ["3", "2", "1", "4"], "a": 0, "e": "Tests 2 (72 &gt; 68), 3 (80 &gt; 75) and 5 (88 &gt; 80) ⇒ <b>3<\/b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Line Graph", "q": "What is the ratio of Rina's marks in Tests 3 and 5 together to Sumit's marks in Tests 1 and 4 together?", "o": ["21 : 19", "19 : 21", "20 : 19", "7 : 6"], "a": 0, "e": "Rina: (80 + 88)% of 200 = 336; Sumit: (70 + 82)% of 200 = 304 ⇒ 336 : 304 = <b>21 : 19<\/b>.", "f": null, "p": "P4"}, {"s": "B", "t": "DI – Table", "q": "Students playing Badminton are approximately what per cent of all the students of Class X shown in the table?", "o": ["21.7%", "23.3%", "20.8%", "19.2%"], "a": 0, "e": "Class X total = 32 + 22 + 20 + 26 + 20 = 120 ⇒ 26/120 × 100 ≈ <b>21.7%<\/b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Table", "q": "What is the total number of students who play Hockey?", "o": ["65", "62", "60", "68"], "a": 0, "e": "15 + 12 + 18 + 20 = <b>65<\/b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Table", "q": "What is the ratio of Cricket players of Classes VII and VIII together to Football players of Classes IX and X together?", "o": ["52 : 75", "25 : 18", "75 : 52", "15 : 13"], "a": 2, "e": "(35 + 40) : (30 + 22) = <b>75 : 52<\/b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Table", "q": "Which game is played by the largest number of students in all four classes together?", "o": ["Badminton", "Cricket", "Hockey", "Football"], "a": 1, "e": "Cricket 135, Football 97, Hockey 65, Badminton 89, Kabaddi 59 ⇒ <b>Cricket<\/b>.", "f": null, "p": "P5"}, {"s": "B", "t": "DI – Table", "q": "What is the average number of Kabaddi players per class?", "o": ["14.25", "13.75", "15.25", "14.75"], "a": 3, "e": "(10 + 15 + 14 + 20) ÷ 4 = 59 ÷ 4 = <b>14.75<\/b>.", "f": null, "p": "P5"}, {"s": "B", "t": "Data Sufficiency", "q": "What is the value of x?<br>I. 3x − 7 = 2x + 5<br>II. x is a two-digit number.", "o": ["Both I and II together are needed", "Even I and II together are not sufficient", "Statement II alone is sufficient", "Statement I alone is sufficient"], "a": 3, "e": "I gives x = 12. II alone gives many values ⇒ <b>Statement I alone is sufficient<\/b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "How many children does Mr Rao have?<br>I. Each of his daughters has as many brothers as sisters.<br>II. Each of his sons has twice as many sisters as brothers.", "o": ["Even I and II together are not sufficient", "Statement II alone is sufficient", "Both I and II together are needed", "Statement I alone is sufficient"], "a": 2, "e": "I: sons = daughters − 1. II: daughters = 2(sons − 1). Together: 3 sons and 4 daughters = 7 children ⇒ <b>both are needed<\/b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "What is the cost price of an article?<br>I. Selling it for ₹560 gives a profit of 12%.<br>II. Selling it for ₹480 gives a loss of 4%.", "o": ["Both I and II together are needed", "Even I and II together are not sufficient", "Statement I alone is sufficient", "Either I or II alone is sufficient"], "a": 3, "e": "I: 560 ÷ 1.12 = ₹500. II: 480 ÷ 0.96 = ₹500 ⇒ <b>either alone is sufficient<\/b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "Is Q the brother of P?<br>I. P is the sister of Q.<br>II. Q is the son of P's mother.", "o": ["Either I or II alone is sufficient", "Statement II alone is sufficient", "Statement I alone is sufficient", "Both I and II together are needed"], "a": 1, "e": "I does not tell Q's gender. II: Q is a son of P's mother, i.e. P's brother ⇒ <b>Statement II alone is sufficient<\/b>.", "f": null, "p": "P6"}, {"s": "B", "t": "Data Sufficiency", "q": "What is Sunil's rank from the top in a class of 40 students?<br>I. Sunil is 5 ranks above Raju.<br>II. Raju is 28th from the bottom.", "o": ["Both I and II together are needed", "Statement I alone is sufficient", "Statement II alone is sufficient", "Even I and II together are not sufficient"], "a": 0, "e": "II: Raju is 40 − 28 + 1 = 13th from the top; with I, Sunil is 8th ⇒ <b>both are needed<\/b>.", "f": null, "p": "P6"}, {"s": "C", "t": "Number Analogy", "q": "Select the number that will replace the question mark: 4 : 20 :: 6 : ?", "o": ["40", "36", "48", "42"], "a": 3, "e": "n : n² + n ⇒ 4² + 4 = 20, so 6² + 6 = <b>42<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Classification", "q": "Find the odd number out: 121, 144, 169, 190, 225", "o": ["190", "144", "169", "225"], "a": 0, "e": "All others are perfect squares (11², 12², 13², 15²) ⇒ <b>190<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Word Formation", "q": "Which word cannot be formed using the letters of the word DETERMINATION?", "o": ["INTERNED", "MENTION", "ROTATION", "DOMINATE"], "a": 2, "e": "DETERMINATION has only one O; ROTATION needs two ⇒ <b>ROTATION<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Venn Diagram", "q": "In a survey of 100 people, 50 read newspaper A, 40 read B and 30 read C; 15 read both A and B, 10 read both B and C, 12 read both A and C, and 5 read all three. How many read none of the three?", "o": ["15", "8", "12", "10"], "a": 2, "e": "At least one = 50 + 40 + 30 − 15 − 10 − 12 + 5 = 88 ⇒ none = <b>12<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Puzzle", "q": "Box A weighs twice as much as box B. Box C weighs 10 kg more than box B but 5 kg less than box A. What is the weight of box A?", "o": ["25 kg", "30 kg", "35 kg", "20 kg"], "a": 1, "e": "B + 10 = 2B − 5 ⇒ B = 15 ⇒ A = <b>30 kg<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Scheduling", "q": "Five lectures P, Q, R, S and T are held on five days from Monday to Friday, one on each day. Q is held on Wednesday. There are two lectures between P and T, and P is held before T. R is held on the day immediately after T. Which lecture is held on Tuesday?", "o": ["S", "T", "R", "P"], "a": 0, "e": "P–T with two in between: (Mon, Thu) or (Tue, Fri). R must follow T, so T = Thursday, R = Friday, P = Monday ⇒ Tuesday = <b>S<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Scheduling", "q": "In the same arrangement, how many lectures are held between S and R?", "o": ["3", "1", "0", "2"], "a": 3, "e": "Mon P, Tue S, Wed Q, Thu T, Fri R ⇒ Q and T lie between S and R ⇒ <b>2<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Coding–Decoding", "q": "In a certain code, FRIEND is written as HUMJTK. How is CANDLE written in that code?", "o": ["ECRIRL", "EDQIRL", "EDRIRL", "EDRJRL"], "a": 2, "e": "Letters move +2, +3, +4, +5, +6, +7: C→E, A→D, N→R, D→I, L→R, E→L ⇒ <b>EDRIRL<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Coding–Decoding", "q": "In a code language, 'pi na sa' means 'you are good', 'na ka la' means 'they are bad' and 'sa ra' means 'good morning'. What is the code for 'you'?", "o": ["sa", "pi", "ka", "na"], "a": 1, "e": "'na' = are (1st & 2nd), 'sa' = good (1st & 3rd) ⇒ 'you' = <b>pi<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Blood Relation", "q": "X is the father of Y. W is the son of X. Z is the wife of W. N is the son of Z and W. How is N related to Y?", "o": ["Cousin", "Brother", "Nephew", "Son"], "a": 2, "e": "Y and W are children of X; N is W's son ⇒ N is Y's <b>nephew<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Symbol Substitution", "q": "If '−' stands for division, '+' for multiplication, '÷' for subtraction and '×' for addition, which of the following equations is correct?", "o": ["20 + 2 − 5 × 6 ÷ 3 = 12", "18 − 3 × 4 + 2 ÷ 6 = 10", "36 − 4 + 3 ÷ 5 × 2 = 24", "40 ÷ 8 − 2 × 5 + 3 = 25"], "a": 2, "e": "36 ÷ 4 × 3 − 5 + 2 = 27 − 5 + 2 = <b>24<\/b> ✓. The others give 11, 8 and 51.", "f": null, "p": null}, {"s": "C", "t": "Direction Sense", "q": "Meena walked 15 km South, turned left and walked 18 km, turned left again and walked 25 km, and then turned right and walked 6 km. How far and in which direction is she from her starting point?", "o": ["26 km, North-East", "34 km, North-East", "24 km, North-East", "26 km, South-East"], "a": 0, "e": "She ends 18 + 6 = 24 km East and 25 − 15 = 10 km North ⇒ √(24² + 10²) = <b>26 km, North-East<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Number Series", "q": "Find the next term: 4, 9, 19, 34, 54, ?", "o": ["84", "74", "79", "76"], "a": 2, "e": "Differences 5, 10, 15, 20 ⇒ next 25 ⇒ <b>79<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Letter Series", "q": "Find the next term: BDF, HJL, NPR, ?", "o": ["TVX", "SUW", "UWY", "TUW"], "a": 0, "e": "Alternate letters, each group starting 6 places after the last: N + 6 = T ⇒ <b>TVX<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Dictionary Order", "q": "Arrange the words in dictionary order: 1. Market 2. Marble 3. Marigold 4. Marine 5. Martyr", "o": ["2, 3, 4, 1, 5", "3, 2, 4, 1, 5", "2, 3, 1, 4, 5", "2, 4, 3, 1, 5"], "a": 0, "e": "Marble, Marigold, Marine, Market, Martyr ⇒ <b>2, 3, 4, 1, 5<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Syllogism", "q": "Statements: All teachers are graduates. Some graduates are unemployed.<br>Conclusions: I. Some teachers are unemployed. II. Some unemployed persons are graduates.", "o": ["Both I and II follow", "Only I follows", "Only II follows", "Neither follows"], "a": 2, "e": "II is the converse of 'Some graduates are unemployed' ⇒ follows. The unemployed graduates need not be teachers ⇒ I does not ⇒ <b>only II<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Syllogism", "q": "Statements: No apple is a mango. All mangoes are fruits.<br>Conclusions: I. Some fruits are not apples. II. No fruit is an apple.", "o": ["Both I and II follow", "Only I follows", "Only II follows", "Neither follows"], "a": 1, "e": "The fruits that are mangoes are not apples ⇒ I follows. II is not certain ⇒ <b>only I<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Classification", "q": "Find the odd one out: Milligram, Quintal, Tonne, Kilometre, Gram", "o": ["Kilometre", "Milligram", "Gram", "Tonne"], "a": 0, "e": "All others are units of mass; <b>kilometre<\/b> is a unit of length.", "f": null, "p": null}, {"s": "C", "t": "Ranking", "q": "Among the students who passed, Rita ranks 14th from the top and 23rd from the bottom. If 4 students failed and 2 were absent, how many students are there in the class?", "o": ["42", "40", "38", "36"], "a": 0, "e": "Passed = 14 + 23 − 1 = 36 ⇒ total = 36 + 4 + 2 = <b>42<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Clock", "q": "What is the smaller angle between the hands of a clock at 9:15?", "o": ["177.5°", "165°", "180°", "172.5°"], "a": 3, "e": "θ = |30H − 5.5M| = |270 − 82.5| = 187.5° ⇒ smaller angle = 360 − 187.5 = <b>172.5°<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Calendar", "q": "If the 3rd day of a month is a Monday, which day of the week will be 4 days after the 21st of that month?", "o": ["Thursday", "Monday", "Tuesday", "Wednesday"], "a": 2, "e": "21st = 3rd + 18 days ⇒ Monday + 4 = Friday; 25th = Friday + 4 = <b>Tuesday<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Coding–Decoding", "q": "If BOOK is written as 2151511, how is COOL written in that code?", "o": ["3151513", "3151612", "3141512", "3151512"], "a": 3, "e": "Each letter is replaced by its alphabet position: C 3, O 15, O 15, L 12 ⇒ <b>3151512<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Letter Series", "q": "Find the next term: AYB, CWD, EUF, ?", "o": ["HSI", "GTH", "GSH", "GSI"], "a": 2, "e": "First letters A, C, E, G; middle Y, W, U, S; last B, D, F, H ⇒ <b>GSH<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Linear Arrangement", "q": "Six friends A, B, C, D, E and F sit in a row facing North. C sits at the extreme left end. D sits second to the right of C. A sits immediately to the right of D. F is not an immediate neighbour of A. B sits at one of the ends. Who sits between A and B?", "o": ["F", "E", "D", "C"], "a": 1, "e": "Left to right: C, F, D, A, E, B ⇒ between A and B sits <b>E<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Linear Arrangement", "q": "In the same arrangement, who sits second to the left of B?", "o": ["E", "D", "A", "F"], "a": 2, "e": "C, F, D, A, E, B ⇒ second to the left of B is <b>A<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Statement & Assumption", "q": "Statement: Notice at a swimming pool — \"Children below 12 years must be accompanied by an adult.\"<br>Assumptions: I. Children below 12 may be at risk in the pool if alone. II. All adults know swimming.", "o": ["Both I and II are implicit", "Only I is implicit", "Only II is implicit", "Neither is implicit"], "a": 1, "e": "The notice exists because young children may be at risk (I). It does not assume every adult can swim (II) ⇒ <b>only I<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Number Series", "q": "Find the next term: 5, 11, 24, 51, 106, ?", "o": ["221", "212", "217", "213"], "a": 2, "e": "×2 + 1, ×2 + 2, ×2 + 3, ×2 + 4 ⇒ 106 × 2 + 5 = <b>217<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Analogy", "q": "Book : Library :: Painting : ?", "o": ["Artist", "Canvas", "Paintbrush", "Gallery"], "a": 3, "e": "Books are kept and displayed in a library; paintings in a <b>gallery<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Inequality", "q": "If M ≤ N &lt; O = P &gt; Q, which of the following is definitely true?<br>I. O &gt; M &nbsp; II. Q &lt; N", "o": ["Neither is true", "Only I is true", "Both I and II are true", "Only II is true"], "a": 1, "e": "M ≤ N &lt; O ⇒ O &gt; M (I true). Q and N are not linked (O &gt; Q and O &gt; N) ⇒ <b>only I<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Course of Action", "q": "Statement: Many accidents occur at an unmanned railway level crossing.<br>Courses of action: I. A gate with a gatekeeper should be provided there. II. The railway line should be closed down.", "o": ["Neither follows", "Only I follows", "Only II follows", "Both I and II follow"], "a": 1, "e": "I is practical; closing the line (II) is extreme ⇒ <b>only I<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Classification (Pairs)", "q": "Which pair is unlike the others? Cow : Calf, Dog : Puppy, Cat : Kitten, Lion : Den", "o": ["Cat : Kitten", "Lion : Den", "Dog : Puppy", "Cow : Calf"], "a": 1, "e": "The others are animal : young one; a den is the lion's home ⇒ <b>Lion : Den<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Classification", "q": "Find the odd number out: 15, 21, 27, 33, 38", "o": ["38", "21", "33", "27"], "a": 0, "e": "All others are odd multiples of 3 (3 × 5, 3 × 7, 3 × 9, 3 × 11); 38 is not ⇒ <b>38<\/b>.", "f": null, "p": null}, {"s": "C", "t": "Mirror Image (Non-verbal)", "q": "Choose the correct mirror image of the given figure when the mirror is placed on its right side.", "o": ["@M", "@R", "@W", "@P"], "a": 0, "e": "In a mirror image, left and right are interchanged — the characters appear in reverse order and each is laterally inverted, while top and bottom stay the same.", "f": {"kind": "mirror", "text": "VERBAL 64"}, "p": null}, {"s": "C", "t": "Dice (Non-verbal)", "q": "Two positions of the same dice are shown. Which number is opposite to 4?", "o": ["3", "1", "5", "6"], "a": 3, "e": "2 is on top in both positions. Face 1 has moved from the front to the right, so the face that was on the left (6) has come to the front. In the first position 4 is on the right and 6 on the left ⇒ <b>6<\/b> is opposite 4.", "f": {"kind": "dice", "a": [2, 1, 4], "b": [2, 6, 1]}, "p": null}, {"s": "C", "t": "Counting Figures (Non-verbal)", "q": "How many triangles are there in the given figure?", "o": ["16", "10", "14", "12"], "a": 3, "e": "Label the rectangle ABCD, the midpoints of the top and bottom M and N, and the centre O.<br>6 small (AMO, MBO, BOC, CON, NOD, DOA) + 2 (ABO, DOC) + 4 halves (ABC, BCD, CDA, DAB) = <b>12<\/b>.", "f": {"kind": "img", "id": "tri8"}, "p": null}, {"s": "D", "t": "Environment 2026", "q": "In 2026, which species was declared the State Amphibian of Karnataka?", "o": ["Indian Bullfrog", "Malabar Gliding Frog", "Purple Frog", "Malabar Tree Toad"], "a": 3, "e": "Karnataka declared the <b>Malabar Tree Toad<\/b> (Pedostibes tuberculosus), a Western Ghats endemic, as its State Amphibian (announced in May 2026; notified in October 2026).", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "Which country became the 116th member of the International Solar Alliance (ISA) at the 9th ISA Assembly held in New Delhi in 2026?", "o": ["Kazakhstan", "Mongolia", "Bhutan", "Bahamas"], "a": 3, "e": "The <b>Bahamas<\/b> joined as the 116th member country. The ISA was launched by India and France in 2015 and is headquartered in Gurugram.", "f": null, "p": null}, {"s": "D", "t": "Governance 2026", "q": "The Bharatiya Vayuyan Niyam, 2026, notified by the Ministry of Civil Aviation, will replace which rules from 1 January 2027?", "o": ["Aircraft Rules, 1937", "Aircraft Rules, 1920", "Carriage by Air Rules, 1972", "Aircraft Act, 1934"], "a": 0, "e": "The new rules replace the <b>Aircraft Rules, 1937<\/b>. (The Aircraft Act, 1934 was replaced earlier by the Bharatiya Vayuyan Adhiniyam, 2024.)", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "In November 2026, Bangladesh connected Unit 1 of its first nuclear power plant, Rooppur, to the national grid. The plant has been built with the help of which country?", "o": ["Russia", "China", "France", "Japan"], "a": 0, "e": "The Rooppur plant in Pabna district has been built by <b>Russia<\/b>'s Rosatom and has two 1,200 MW VVER reactors.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "Project 18A, which received the Defence Acquisition Council's in-principle approval in 2026, is for building:", "o": ["Fleet support ships", "Conventional diesel-electric submarines", "Next-generation destroyers", "An aircraft carrier"], "a": 2, "e": "Project 18A is for the Navy's <b>next-generation destroyers<\/b>, successors to the Project 15B (Visakhapatnam-class) ships; the programme is estimated at about ₹75,000–80,000 crore.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "The inaugural Commonwealth Kabaddi Championship, in which India won both the men's and the women's titles, was held in 2026 in:", "o": ["Birmingham", "Glasgow", "Patna", "Ahmedabad"], "a": 3, "e": "It was held in <b>Ahmedabad<\/b>, the host of the 2030 Commonwealth Games. India's men beat Sri Lanka and the women beat Uganda in the finals.", "f": null, "p": null}, {"s": "D", "t": "Rankings 2026", "q": "Which university was ranked first in the QS Asia University Rankings 2027?", "o": ["Peking University", "The University of Hong Kong", "National University of Singapore", "The University of Tokyo"], "a": 1, "e": "<b>The University of Hong Kong<\/b> was first; IIT Delhi was the top Indian institution at 66th.", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "The VISTAR scheme approved by the Union Cabinet in 2026 with an outlay of about ₹4,371 crore for 2026–31 aims to strengthen India's:", "o": ["Power transmission grid", "Rural road network", "Port infrastructure", "Statistical system"], "a": 3, "e": "VISTAR is a Central Sector scheme of the Ministry of Statistics and Programme Implementation to strengthen the <b>national statistical system<\/b>.", "f": null, "p": null}, {"s": "D", "t": "Energy 2026", "q": "In 2026, the Centre approved Viability Gap Funding of about ₹14,500 crore to support 92 GWh of:", "o": ["Offshore wind power plants", "Grid-scale energy storage", "Green hydrogen output", "Rooftop solar power"], "a": 1, "e": "The VGF supports 92 GWh of <b>grid-scale energy storage<\/b> capacity to help integrate renewable power into the grid.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "Assam's first defence park is being developed in which district?", "o": ["Dibrugarh", "Kamrup", "Morigaon", "Sonitpur"], "a": 2, "e": "Assam's first defence park is coming up in <b>Morigaon<\/b> district.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "'Pralay', which was test-fired from Chandipur (Odisha) in November 2026, is a:", "o": ["Air-to-air missile", "Anti-tank guided missile", "Surface-to-surface missile", "Submarine-launched cruise missile"], "a": 2, "e": "Pralay is a DRDO-developed short-range quasi-ballistic <b>surface-to-surface missile<\/b>.", "f": null, "p": null}, {"s": "D", "t": "Obituary 2026", "q": "Alan Jones, who died in 2026 aged 80, won the 1980 Formula One World Championship driving for which team?", "o": ["Team Lotus", "McLaren", "Williams", "Ferrari"], "a": 2, "e": "The Australian driver won the 1980 title with <b>Williams<\/b>, the team's first drivers' championship.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "Indian boxers topped the medal table with 14 medals at the 46th Tammer Boxing Tournament held in 2026 in:", "o": ["Serbia", "Bulgaria", "Poland", "Finland"], "a": 3, "e": "The Tammer tournament is held in Tampere, <b>Finland<\/b>.", "f": null, "p": null}, {"s": "D", "t": "Defence 2026", "q": "Exercise Tiger Triumph 2026, a tri-service amphibious exercise held at Visakhapatnam, is conducted between India and:", "o": ["Japan", "United Kingdom", "United States", "France"], "a": 2, "e": "Tiger Triumph is the India–<b>US<\/b> tri-service amphibious (HADR) exercise; 2026 was its 5th edition.", "f": null, "p": null}, {"s": "D", "t": "Agriculture 2026", "q": "The first International Maize Conference was held in 2026 in which city?", "o": ["New Delhi", "Hyderabad", "Bengaluru", "Ludhiana"], "a": 1, "e": "The 1st International Maize Conference was held from 2 to 4 November 2026 in <b>Hyderabad<\/b>.", "f": null, "p": null}, {"s": "D", "t": "Infrastructure 2026", "q": "Tanglang La, planned to have the world's highest railway station, lies on which proposed railway line?", "o": ["Bilaspur–Manali–Leh", "Rishikesh–Karnaprayag", "Udhampur–Srinagar–Baramulla", "Sivok–Rangpo"], "a": 0, "e": "Tanglang La station is planned on the strategic <b>Bilaspur–Manali–Leh<\/b> line in Ladakh.", "f": null, "p": null}, {"s": "D", "t": "International 2026", "q": "The 13th ADMM-Plus (ASEAN Defence Ministers' Meeting-Plus) was held in 2026 in:", "o": ["Jakarta, Indonesia", "Kuala Lumpur, Malaysia", "Hanoi, Vietnam", "Cebu, Philippines"], "a": 3, "e": "The Philippines, ASEAN chair for 2026, hosted the meeting in <b>Cebu<\/b>.", "f": null, "p": null}, {"s": "D", "t": "Governance 2026", "q": "In 2026, the Union Cabinet extended the Fast Track Special Courts (FTSCs), set up mainly for rape and POCSO Act cases, till:", "o": ["31 March 2030", "31 March 2028", "31 December 2029", "31 March 2031"], "a": 3, "e": "The FTSC scheme was extended till <b>31 March 2031<\/b> with an outlay of ₹3,788.04 crore.", "f": null, "p": null}, {"s": "D", "t": "Economy 2026", "q": "In 2026, the Competition Commission of India approved the acquisition of Deutsche Bank's retail and wealth management business in India by:", "o": ["Kotak Mahindra Bank", "HDFC Bank", "State Bank of India", "Axis Bank"], "a": 0, "e": "The CCI cleared <b>Kotak Mahindra Bank<\/b>'s acquisition of the business.", "f": null, "p": null}, {"s": "D", "t": "Environment 2026", "q": "'Exostoma nasibarbatum', a new species discovered in 2026 in Chandel district of Manipur, is a:", "o": ["Catfish", "Frog", "Freshwater crab", "Snake"], "a": 0, "e": "It is a new glyptosternine <b>catfish<\/b> (family Sisoridae) found in the Bupal stream, part of the Chindwin river system, in Chandel district.", "f": null, "p": null}, {"s": "D", "t": "Science & Tech 2026", "q": "Under the IndiaAI Mission, the foundation model 'EKA-1' was developed by:", "o": ["Gnani.ai", "Soket AI", "ZenteiQ", "Sarvam AI"], "a": 1, "e": "<b>Soket AI<\/b> developed EKA-1; ZenteiQ developed the 'Dhīr' model.", "f": null, "p": null}, {"s": "D", "t": "Sports 2026", "q": "India won a record sixth men's Asian Champions Trophy hockey title in 2026 by defeating which team 4–1 in the final?", "o": ["Pakistan", "Malaysia", "Japan", "China"], "a": 2, "e": "India beat <b>Japan<\/b> 4–1 in the final, played in Punjab (Mohali).", "f": null, "p": null}, {"s": "D", "t": "Governance 2026", "q": "Which State became the first in India to adopt a Silt Management Policy in 2026?", "o": ["Assam", "Uttar Pradesh", "Bihar", "West Bengal"], "a": 2, "e": "<b>Bihar<\/b>'s Water Source Restoration and Silt Management Policy 2026 targets floods in rivers such as the Ganga, Kosi and Gandak and allows river silt to be used in highway and other projects.", "f": null, "p": null}, {"s": "D", "t": "Science & Tech 2026", "q": "NASA's Neil Gehrels Swift Observatory, which re-entered Earth's atmosphere over North Sumatra on 4 November 2026 after nearly 22 years, was launched mainly to study:", "o": ["Exoplanet atmospheres", "Dark matter", "The solar wind", "Gamma-ray bursts"], "a": 3, "e": "Swift (launched 2004) was built to detect and study <b>gamma-ray bursts<\/b>. A robotic attempt to boost its orbit failed, and it re-entered due to increased atmospheric drag.", "f": null, "p": null}, {"s": "D", "t": "Days & Themes 2026", "q": "What was the theme of World Tsunami Awareness Day (5 November) 2026?", "o": ["Early Warning for All", "Be Tsunami Ready: Resilience Starts With You", "Coastal Safety for Every Child and Family", "Invest in Tsunami Preparedness for a Safer Tomorrow"], "a": 1, "e": "The 2026 theme was <b>'Be Tsunami Ready: Resilience Starts With You'<\/b>. The day was designated by the UN General Assembly in 2015.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "At the 2026 Youth Olympic Games in Dakar, Odisha's Tanvi Patri became the first Indian woman to win a Youth Olympics badminton medal. Which medal did she win?", "o": ["Silver", "Mixed-team gold", "Gold", "Bronze"], "a": 0, "e": "Tanvi Patri won <b>silver<\/b> in the girls' singles.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "Dr Ashok Kumar Mahapatra, who died in November 2026, was a noted neurosurgeon and the founding director of:", "o": ["AIIMS Bhubaneswar", "NIMHANS Bengaluru", "PGIMER Chandigarh", "SCB Medical College"], "a": 0, "e": "Dr Mahapatra, a Padma Shri awardee, was the founding director of <b>AIIMS Bhubaneswar<\/b>; he also served as director of SGPGIMS, Lucknow.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "In November 2026, the Odisha Government signed a three-year MoU with which organisation to use research evidence in policy-making?", "o": ["Asian Development Bank", "UNICEF India", "J-PAL South Asia", "World Bank"], "a": 2, "e": "The MoU was signed with <b>J-PAL South Asia<\/b> (Abdul Latif Jameel Poverty Action Lab).", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "In 2026, the Odisha Cabinet approved a Deep Sea Fishing Mission with an outlay of about ₹2,295 crore for the period:", "o": ["2025–2030", "2026–2031", "2027–2037", "2026–2036"], "a": 3, "e": "The ten-year mission (₹2,295.45 crore), approved on 1 July 2026, covers <b>2026–2036<\/b>.", "f": null, "p": null}, {"s": "D", "t": "Odisha 2026", "q": "The Integrated Anandpur Barrage project, meant to irrigate about 60,000 hectares in Keonjhar and Balasore districts, is on which river?", "o": ["Baitarani", "Subarnarekha", "Budhabalanga", "Rushikulya"], "a": 0, "e": "The Anandpur barrage is on the <b>Baitarani<\/b> river in Keonjhar district. In February 2026 the Odisha Cabinet approved tenders for the underground pipeline network of the integrated project.", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "In MS Word, the 'Drop Cap' option is found on which tab?", "o": ["Design", "References", "Insert", "Home"], "a": 2, "e": "<b>Drop Cap<\/b> (a large first letter of a paragraph) is in the Text group of the <b>Insert<\/b> tab.", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "In MS Word, which paragraph option keeps a heading on the same page as the paragraph that follows it?", "o": ["Keep lines together", "Widow/Orphan control", "Page break before", "Keep with next"], "a": 3, "e": "<b>Keep with next<\/b> (Paragraph → Line and Page Breaks) prevents a heading from being left alone at the bottom of a page.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "In MS Excel, which feature keeps the header row visible while you scroll down a long sheet?", "o": ["Hide Rows", "Group Rows", "Freeze Panes", "Split Window"], "a": 2, "e": "<b>Freeze Panes<\/b> (View tab) locks rows/columns so they stay visible while scrolling.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "In MS Excel, the 'Goal Seek' tool is found under which option on the Data tab?", "o": ["Remove Duplicates", "Data Validation", "Text to Columns", "What-If Analysis"], "a": 3, "e": "Data → <b>What-If Analysis<\/b> → Goal Seek finds the input value needed to get a desired result. Scenario Manager and Data Table are also here.", "f": null, "p": null}, {"s": "E", "t": "MS Office", "q": "The 'Format Painter' tool in MS Office is used to:", "o": ["Copy formatting to other text", "Change the theme of slides", "Draw shapes freehand", "Insert a painting or a picture file"], "a": 0, "e": "<b>Format Painter<\/b> (Home tab) copies the formatting of one selection and applies it to another.", "f": null, "p": null}, {"s": "E", "t": "MS PowerPoint", "q": "In MS PowerPoint, the 'Rehearse Timings' feature is used to:", "o": ["Record time spent on each slide", "Add a countdown timer to a slide", "Schedule a presentation meeting", "Set the time of the system clock"], "a": 0, "e": "<b>Rehearse Timings<\/b> (Slide Show tab) records how long each slide is shown so the show can advance automatically.", "f": null, "p": null}, {"s": "E", "t": "MS Access", "q": "In MS Access, which object is mainly used to enter and view data one record at a time in a user-friendly layout?", "o": ["Macro", "Report", "Form", "Query"], "a": 2, "e": "A <b>Form<\/b> is used for data entry and viewing; a Report is for printing, a Query for retrieving data.", "f": null, "p": null}, {"s": "E", "t": "MS Access", "q": "In MS Access, a field that uniquely identifies each record in a table is called the:", "o": ["Foreign key", "Index key", "Sort field", "Primary key"], "a": 3, "e": "The <b>primary key<\/b> uniquely identifies records; a foreign key links to the primary key of another table.", "f": null, "p": null}, {"s": "E", "t": "E-mail", "q": "In e-mail, the 'Reply All' option sends your reply to:", "o": ["Every contact saved in your address book", "The sender and all other recipients", "Only the people in the Bcc field", "Only the sender of the message"], "a": 1, "e": "<b>Reply All<\/b> goes to the sender and everyone in the To and Cc fields (Bcc recipients are not visible, so they are not included).", "f": null, "p": null}, {"s": "E", "t": "File Extensions", "q": "Which file extension is used by MS Access 2007 and later databases?", "o": [".onepkg", ".docx", ".accdb", ".xlsx"], "a": 2, "e": "Access 2007+ uses <b>.accdb<\/b> (earlier versions used .mdb).", "f": null, "p": null}, {"s": "E", "t": "Internet", "q": "Which keyboard shortcut opens a new incognito window in Google Chrome?", "o": ["Ctrl + Shift + N", "Ctrl + N", "Ctrl + Shift + T", "Ctrl + Shift + Delete"], "a": 0, "e": "<b>Ctrl + Shift + N<\/b> opens incognito; Ctrl + Shift + T reopens the last closed tab.", "f": null, "p": null}, {"s": "E", "t": "E-mail", "q": "Which of the following is a valid e-mail address format?", "o": ["user name@example.com", "user.name@example.com", "@user.example.com", "user.name@example"], "a": 1, "e": "An e-mail address needs a username, '@' and a domain with a suffix, without spaces ⇒ <b>user.name@example.com<\/b>.", "f": null, "p": null}, {"s": "E", "t": "Windows", "q": "Which Windows feature returns system files and settings to an earlier point without affecting personal files?", "o": ["Device Manager", "Windows Defender Firewall", "System Restore", "Disk Cleanup"], "a": 2, "e": "<b>System Restore<\/b> uses restore points to undo system changes; documents and photos are not affected.", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "In MS Word, what do the shortcuts Ctrl + Shift + C and Ctrl + Shift + V do?", "o": ["Copy and paste the entire document page", "Copy and paste formatting only", "Centre and justify the text", "Change the case of text"], "a": 1, "e": "They copy and paste <b>only the formatting<\/b> (a keyboard version of Format Painter).", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "In MS Excel, which option displays long text on multiple lines within a single cell?", "o": ["AutoFit", "Text to Columns", "Wrap Text", "Merge &amp; Center"], "a": 2, "e": "<b>Wrap Text<\/b> (Home tab) breaks the text into lines inside the cell.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "Which MS Excel function adds only those cells that meet a given condition?", "o": ["AVERAGEIF", "SUM", "COUNTIF", "SUMIF"], "a": 3, "e": "<b>SUMIF<\/b>(range, criteria, [sum_range]) adds the cells that meet the criteria.", "f": null, "p": null}, {"s": "E", "t": "MS Access", "q": "In MS Access, which data type is most suitable for storing amounts of money such as 1,250.75?", "o": ["Number", "Date/Time", "Currency", "Short Text"], "a": 2, "e": "The <b>Currency<\/b> data type stores money values accurately (up to 4 decimal places) and avoids rounding errors.", "f": null, "p": null}, {"s": "E", "t": "Cyber Security", "q": "A fraudulent e-mail aimed at a specific person or organisation, using their personal details to look genuine, is called:", "o": ["Vishing", "Denial of service", "Smishing", "Spear phishing"], "a": 3, "e": "<b>Spear phishing<\/b> is targeted phishing. Vishing uses voice calls, smishing uses SMS, and denial of service floods a server.", "f": null, "p": null}, {"s": "E", "t": "MS Word", "q": "In MS Word, which command adds a numbered label such as 'Figure 1' below a picture?", "o": ["Insert Footnote", "Cross-reference", "Bookmark", "Insert Caption"], "a": 3, "e": "<b>Insert Caption<\/b> (References tab) adds numbered labels like Figure 1, Table 1.", "f": null, "p": null}, {"s": "E", "t": "MS Excel", "q": "In MS Excel, pressing Ctrl + ; (semicolon) in a cell inserts the:", "o": ["Current date", "Sum of the column", "Name of the sheet", "Current time"], "a": 0, "e": "<b>Ctrl + ;<\/b> enters today's date as a fixed value; Ctrl + Shift + ; enters the current time.", "f": null, "p": null}], "passages": {"P1": "<div class=\"ptitle\">Directions (Q.36–40)<\/div><div>A company has 600 employees in three departments. 40% work in Production, 25% in Sales and the rest in Administration. Women make up 30% of Production, 60% of Sales and 50% of Administration. (Hypothetical data)<\/div>", "P2": "<div class=\"ptitle\">Directions (Q.41–45)<\/div><div>The table shows the number of books of three types in five libraries L1 to L5. Some values are missing (?); find them using the totals (hypothetical da
