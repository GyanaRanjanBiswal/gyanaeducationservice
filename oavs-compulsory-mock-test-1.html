<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Free OAVS 2026 PGT & TGT compulsory paper CBT mock test (120 questions: English, Odia, Current Affairs 2026, Reasoning, Teaching Methodology; 120 minutes, −0.25) by Gyana Education Service – TCS iON style with detailed solutions.">
<title>OAVS 2026 Compulsory Paper (120 Marks) – Mock Test-1 | Gyana Education Service</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: TCS iON-style exam console — header strip, question pane left, palette right; light-only by design (mirrors the real exam screen) */
:root{
  --ink:#1b2430; --muted:#5d6b7c; --line:#cfd8e3; --paper:#ffffff; --wash:#eef3f8;
  --brand:#0b4f8a; --brand-2:#1167b1; --brand-ink:#ffffff; --head:#e9eef4;
  --ans:#2e9e3f; --nans:#e2502b; --nv:#e3e6ea; --nv-b:#b9c1cb; --mark:#6a3fb5; --gold:#f4b400;
  --ok:#1f8a3b; --ok-wash:#e5f5e8; --bad:#c8352a; --bad-wash:#fdeceb; --info-wash:#fff8e1;
  --f:Arial, "Helvetica Neue", Helvetica, "GES Odia", "Noto Sans Oriya", "Noto Sans", sans-serif;
  color-scheme: light;
}
html,body{height:100%}
#app{height:100%}
body{background:var(--wash);color:var(--ink);font-family:var(--f);font-size:14px;}
*{box-sizing:border-box}
button{font-family:var(--f);cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.screen{min-height:100%;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top brand strip */
.topbar{background:var(--brand);color:var(--brand-ink);padding-block:8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px;border:2px solid var(--gold);flex:none}
.tb-text{min-width:0;flex:1 1 220px}
.tb-org{font-weight:700;letter-spacing:1.2px;font-size:15px}
.tb-exam{font-size:12.5px;opacity:.92}
.tb-right{font-size:12px;text-align:right;opacity:.92}

/* login */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding-block:28px}
.login{display:grid;grid-template-columns:1fr 1fr;max-width:860px;width:100%;background:var(--paper);border:1px solid var(--line);box-shadow:0 2px 10px rgba(11,79,138,.08)}
.login-info{background:var(--head);padding:24px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line)}
.login-info .row{display:flex;gap:8px;font-size:13.5px}
.login-info .k{color:var(--muted);min-width:118px}
.login-info .v{font-weight:700}
.login-form{padding:24px;display:flex;flex-direction:column;gap:12px}
.login-form h2{margin:0 0 4px;font-size:18px;color:var(--brand)}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:9px 10px;border:1px solid var(--nv-b);border-radius:3px;font-size:14px;font-family:var(--f)}
.btn{border:1px solid var(--nv-b);background:var(--paper);color:var(--ink);padding:9px 16px;border-radius:3px;font-size:13.5px}
.btn:hover{background:var(--head)}
.btn-primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff;font-weight:700}
.btn-primary:hover{background:var(--brand)}
.btn-primary:disabled{background:#9db8d3;border-color:#9db8d3;cursor:not-allowed}
.btn-green{background:var(--ans);border-color:var(--ans);color:#fff;font-weight:700}
.btn-green:hover{filter:brightness(.92)}
.note{font-size:12px;color:var(--muted);line-height:1.5}

/* instructions */
.instr{flex:1;padding-block:18px;display:flex;justify-content:center}
.instr-card{background:var(--paper);border:1px solid var(--line);max-width:980px;width:100%;display:flex;flex-direction:column}
.instr-head{background:var(--head);padding:12px 18px;font-weight:700;color:var(--brand);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.instr-body{padding:16px 22px;line-height:1.6;font-size:13.5px;overflow:auto}
.instr-body h3{font-size:14px;margin:14px 0 6px;color:var(--brand)}
.instr-body ol{padding-left:22px;margin:6px 0}
.instr-body li{margin-bottom:5px}
.legend-list{display:grid;gap:8px;margin:8px 0 8px 4px}
.legend-list div{display:flex;align-items:center;gap:10px}
.pattern{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.pattern th,.pattern td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.pattern th{background:var(--head)}
.pattern td.n{text-align:center;font-variant-numeric:tabular-nums}
.instr-foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;flex-direction:column;gap:12px}
.declare{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5}
.declare input{margin-top:3px;width:16px;height:16px;flex:none}
.instr-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* exam */
.exam{height:100%;display:flex;flex-direction:column}
.exam-main{flex:1;display:flex;min-height:0}
.qpane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper);border-right:1px solid var(--line)}
.secbar{display:flex;align-items:center;gap:8px;background:var(--head);border-bottom:1px solid var(--line);padding-block:6px;flex-wrap:wrap}
.secbar .lbl{font-weight:700;font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.tab{border:1px solid var(--nv-b);background:var(--paper);padding:6px 10px;font-size:12.5px;border-radius:3px 3px 0 0;color:var(--brand)}
.tab.on{background:var(--brand-2);color:#fff;border-color:var(--brand-2);font-weight:700}
.timer{font-weight:700;font-size:13px;background:var(--paper);border:1px solid var(--nv-b);padding:6px 10px;border-radius:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer b{color:var(--brand)}
.timer.low b{color:var(--bad)}
.qtype{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;padding-block:7px;border-bottom:1px solid var(--line);color:var(--muted)}
.qtype .mk span{color:var(--ok);font-weight:700}
.qtype .mk em{color:var(--bad);font-style:normal;font-weight:700}
.qhead{display:flex;justify-content:space-between;align-items:center;padding-block:9px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.qhead h2{margin:0;font-size:15px}
.qhead .lang{font-size:12px;color:var(--muted)}
.qhead select{font-size:12px;padding:2px 4px}
.qbody{flex:1;overflow:auto;padding-block:14px 20px;min-height:0}
.qtext{font-size:calc(15.5px*var(--fs,1));line-height:1.65;max-width:78ch}
.qtext b{font-weight:700}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px;max-width:78ch}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border:1px solid transparent;border-radius:3px;cursor:pointer;font-size:calc(15px*var(--fs,1));line-height:1.5}
.opt:hover{background:#f3f7fb;border-color:var(--line)}
.opt input{margin-top:4px;width:16px;height:16px;flex:none;accent-color:var(--brand-2)}
.opt.sel{background:#eaf2fb;border-color:#a9c6e6}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--head);padding-block:9px;padding-bottom:max(9px,env(safe-area-inset-bottom,0px))}
.actions .l{display:flex;gap:8px;flex-wrap:wrap}

/* palette */
.palette{width:300px;flex:none;display:flex;flex-direction:column;background:#f7f9fc;min-height:0}
.cand{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.cand svg{width:50px;height:58px;flex:none;border:1px solid var(--line);background:var(--head)}
.cand .nm{font-weight:700;font-size:13.5px;word-break:break-word}
.cand .roll{font-size:12px;color:var(--muted)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:11.5px;line-height:1.25}
.legend .it{display:flex;align-items:center;gap:6px}
.legend .it.wide{grid-column:1/-1}
.pal-sec{background:var(--brand-2);color:#fff;font-weight:700;font-size:12.5px;padding:6px 12px}
.pal-choose{font-size:12px;color:var(--muted);padding:8px 12px 2px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:9px 6px;padding:8px 12px 12px;align-content:start;min-height:0}
.pal-foot{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:var(--head);padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.pal-foot .btn-green{grid-column:1/-1}

/* status shapes */
.st{width:38px;height:33px;display:inline-grid;place-items:center;font-size:12.5px;font-weight:700;position:relative;border:1px solid transparent;font-variant-numeric:tabular-nums;flex:none;padding:0}
.st.sm{width:28px;height:25px;font-size:11px}
.st.nv{background:var(--nv);border-color:var(--nv-b);color:var(--ink);border-radius:3px}
.st.na{background:var(--nans);color:#fff;border-radius:2px 2px 14px 14px / 2px 2px 9px 9px}
.st.an{background:var(--ans);color:#fff;border-radius:14px 14px 2px 2px / 9px 9px 2px 2px}
.st.mk{background:var(--mark);color:#fff;border-radius:50%}
.st.am{background:var(--mark);color:#fff;border-radius:50%}
.st.am::after{content:"";position:absolute;right:-3px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--ans);border:2px solid #fff;box-sizing:border-box}
.st.sm.am::after{width:10px;height:10px;right:-3px;bottom:-2px}
.grid .st{justify-self:center;cursor:pointer}
.grid .st.cur{outline:2px solid var(--gold);outline-offset:2px}

/* figures */
.fig{margin:14px 0 4px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.word{font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:30px;letter-spacing:2px;color:#13294b;padding:6px 14px;border:1px dashed var(--nv-b);background:#fff}
.mirror-line{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:2px}
.mirror-line i{display:block;width:4px;height:58px;background:linear-gradient(#6aa3db,#2b6cb0)}
.water-wrap{display:flex;flex-direction:column;gap:3px}
.water-line{height:5px;background:repeating-linear-gradient(90deg,#4a90d9 0 10px,#9cc5ef 10px 20px);border-radius:3px}
.optfig{display:inline-block;font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:22px;letter-spacing:2px;color:#13294b}
.optfig.M{transform:scaleX(-1)} .optfig.W{transform:scaleY(-1)} .optfig.R{transform:rotate(180deg)}
.dice{display:flex;gap:26px;flex-wrap:wrap}
.dice figure{margin:0;text-align:center;font-size:12px;color:var(--muted)}
.dice svg{width:120px;height:120px;display:block}

.figimg{display:block;max-width:100%;height:auto;border:1px solid var(--line);background:#fff;margin:8px 0;cursor:zoom-in}
.zoomwrap{overflow:auto;max-height:75vh}.zoomwrap img{display:block;width:760px;max-width:none;height:auto}
.zhint{font-size:11.5px;color:var(--muted);margin:2px 0 0}
.passage{background:#f6f9fd;border:1px solid #c9d8ea;border-left:4px solid var(--brand-2);padding:10px 12px;margin:0 0 14px;font-size:calc(14px*var(--fs,1));line-height:1.6;max-width:78ch}
.passage summary{cursor:pointer;font-weight:700;color:var(--brand)}
.ptitle{font-weight:700;color:var(--brand);margin-bottom:4px}
.ptbl{overflow-x:auto;margin-top:8px}
.ptbl table{border-collapse:collapse;font-size:13.5px;background:#fff;min-width:320px}
.ptbl th,.ptbl td{border:1px solid #b9c7d8;padding:5px 9px;text-align:center}
.ptbl th{background:#e3ecf6}
.ptbl td:first-child{text-align:left;font-weight:700}
.fsz{display:inline-flex;gap:4px;align-items:center;margin-left:8px}
.fsz button{padding:2px 8px;font-size:12px}
.btn-out{border-color:#c8352a;color:#c8352a;font-weight:700}
.btn-out:hover{background:#fdeceb}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,30,50,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--paper);max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal-h{background:var(--brand);color:#fff;padding:10px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-h button{background:transparent;border:0;color:#fff;font-size:20px;line-height:1}
.modal-b{padding:14px 16px;overflow:auto}
.modal-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
.sumtbl{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.sumtbl th,.sumtbl td{border:1px solid var(--line);padding:7px 8px;text-align:center;font-variant-numeric:tabular-nums}
.sumtbl th{background:var(--head);font-size:12px}
.sumtbl td:first-child,.sumtbl th:first-child{text-align:left}
.sumtbl tr.tot td{font-weight:700;background:#f7f9fc}
.qp-item{border-bottom:1px solid var(--line);padding:10px 0;font-size:13.5px;line-height:1.55}
.qp-item .n{font-weight:700;color:var(--brand)}

/* result */
.result{flex:1;padding-block:18px 30px;display:flex;flex-direction:column;align-items:center;gap:16px}
.rcard{background:var(--paper);border:1px solid var(--line);max-width:1000px;width:100%}
.rhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.rhead h2{margin:0;font-size:18px;color:var(--brand)}
.score-row{display:grid;grid-template-columns:auto 1fr;gap:22px;padding:18px;align-items:center}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:30px;display:block;font-variant-numeric:tabular-nums}
.ring .c span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;width:100%}
.stat{border:1px solid var(--line);padding:10px 12px}
.stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.stat.ok .v{color:var(--ok)} .stat.bad .v{color:var(--bad)}
.verdict{margin:0 18px 16px;padding:10px 14px;background:var(--info-wash);border:1px solid #f1d68a;font-size:13.5px;line-height:1.5}
.secbars{padding:4px 18px 18px;display:grid;gap:10px}
.sb{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.sb .bar{height:14px;background:var(--nv);position:relative;overflow:hidden;border-radius:2px}
.sb .bar i{position:absolute;inset:0 auto 0 0;background:var(--brand-2)}
.sb .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center}
.chip{border:1px solid var(--nv-b);background:var(--paper);padding:5px 10px;border-radius:14px;font-size:12.5px}
.chip.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.sol{padding:14px 18px;border-bottom:1px solid var(--line)}
.sol-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.pill{padding:2px 8px;border-radius:10px;font-weight:700;font-size:11.5px}
.pill.ok{background:var(--ok-wash);color:var(--ok)} .pill.bad{background:var(--bad-wash);color:var(--bad)} .pill.skip{background:var(--nv);color:var(--muted)}
.sol .qtext{font-size:14.5px}
.sopts{display:grid;gap:6px;margin:10px 0}
.sopt{padding:7px 10px;border:1px solid var(--line);border-radius:3px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.sopt .L{font-weight:700;color:var(--muted);flex:none}
.sopt.right{background:var(--ok-wash);border-color:#9fd3ac}
.sopt.wrong{background:var(--bad-wash);border-color:#efb1ab}
.sopt .tag{margin-left:auto;font-size:11.5px;font-weight:700;white-space:nowrap}
.sopt.right .tag{color:var(--ok)} .sopt.wrong .tag{color:var(--bad)}
.exp{background:#f4f8fc;border-left:3px solid var(--brand-2);padding:9px 12px;font-size:13.5px;line-height:1.6}
.exp h4{margin:0 0 4px;font-size:12px;letter-spacing:.6px;color:var(--brand);text-transform:uppercase}
.empty{padding:22px 18px;color:var(--muted)}

.palette-toggle{display:none}
.site-foot{flex:none;min-height:64px;display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;background:#0a3f6e;color:#dbe8f6;font-size:12px;padding-block:8px;padding-right:max(210px,env(safe-area-inset-right,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.site-foot b{color:#fff}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff8e1;border:1px solid #f1d68a;color:#5b4300;padding:10px 16px;font-weight:700;font-size:13.5px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.15);max-width:calc(100% - 32px);text-align:center}
.cta{margin:0 18px 16px;padding:12px 14px;border:1px solid #9fc0e3;background:#eef5fc;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:13.5px;line-height:1.5}
.cta a,.ractions a{text-decoration:none}
.btn-wa{background:#1f9d55;border-color:#1f9d55;color:#fff;font-weight:700;display:inline-block}
.btn-wa:hover{filter:brightness(.92)}
.topics{padding:0 18px 18px}
.topics h3{font-size:14px;margin:0 0 8px;color:var(--brand)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid #efb1ab;background:var(--bad-wash);color:#7a1f17;padding:4px 10px;border-radius:12px;font-size:12.5px}
.tchip b{font-variant-numeric:tabular-nums}
.ractions{display:flex;gap:8px;flex-wrap:wrap}
.result{padding-bottom:84px}
@media print{.topbar .tb-right,.site-foot,.ractions,#filters,.cta,#logout,#retake,.toast{display:none!important}body{background:#fff}.rcard{border:0}.sol{break-inside:avoid}}
@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login-info{border-right:0;border-bottom:1px solid var(--line)}
  .palette{position:fixed;top:0;right:0;bottom:0;width:min(320px,88vw);z-index:40;box-shadow:-6px 0 18px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px)}
  .palette.open{transform:none}
  .palette{bottom:64px}
  .site-foot{padding-right:max(170px,env(safe-area-inset-right,0px));font-size:11px}
  .site-foot span:nth-child(2){display:none}
  .palette-toggle{display:inline-block}
  .tb-right{flex:1 1 100%;text-align:left}
  .exam .tb-right{display:none}
  .secbar .lbl{display:none}
  .tabs{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .tab{white-space:nowrap;flex:none}
  .timer{margin-right:auto}
  .score-row{grid-template-columns:1fr;justify-items:center}
  .sb{grid-template-columns:110px 1fr 56px}
  .qtext{font-size:calc(15px*var(--fs,1))}
  .secbar{gap:6px}
  .timer{font-size:12.5px;padding:5px 8px}
}
@media (prefers-reduced-motion:reduce){.palette{transition:none}}

<script>
const DATA = {"sections": [["A", "English"], ["B", "Odia"], ["C", "Current Affairs"], ["D", "Reasoning"], ["E", "Teaching Methodology"]], "qs": [{"s": "A", "t": "Spot the Error", "q": "The following sentence has been split into four segments. Identify the segment that contains a grammatical error.<br><i>One of my friends / have gone / to Delhi / for higher studies.</i>", "o": ["One of my friends", "have gone", "to Delhi", "for higher studies."], "a": 1, "e": "The subject is ‘<b>One</b> (of my friends)’, which is singular, so the verb must be ‘<b>has</b> gone’.", "f": null, "p": null}, {"s": "A", "t": "Spot the Error", "q": "The following sentence has been split into four segments. Identify the segment that contains a grammatical error.<br><i>He is senior than me / in service / although he / is younger in age.</i>", "o": ["He is senior than me", "in service", "although he", "is younger in age."], "a": 0, "e": "Latin comparatives such as <i>senior, junior, superior, inferior, prior</i> take ‘<b>to</b>’, not ‘than’: ‘He is senior <b>to</b> me’.", "f": null, "p": null}, {"s": "A", "t": "Fill in the Blanks", "q": "Select the most appropriate option to fill in the blank.<br>She has been living in Bhubaneswar ______ 2019.", "o": ["from", "by", "since", "for"], "a": 2, "e": "With the present perfect continuous, a <b>point of time</b> takes ‘since’ (since 2019); a <b>period</b> takes ‘for’ (for six years).", "f": null, "p": null}, {"s": "A", "t": "Fill in the Blanks", "q": "Select the most appropriate option to fill in the blank.<br>The jury ______ divided in their opinions.", "o": ["has", "were", "is", "was"], "a": 1, "e": "A collective noun takes a plural verb when its members act separately or disagree. ‘Divided in <b>their</b> opinions’ shows the members are acting individually ⇒ ‘were’.", "f": null, "p": null}, {"s": "A", "t": "Synonyms", "q": "Select the most appropriate SYNONYM of the given word.<br><b>Candid</b>", "o": ["Secretive", "Cunning", "Polite", "Frank"], "a": 3, "e": "<b>Candid</b> = truthful and straightforward; frank. Secretive and cunning are nearly opposite.", "f": null, "p": null}, {"s": "A", "t": "Synonyms", "q": "Select the most appropriate SYNONYM of the given word.<br><b>Lethargic</b>", "o": ["Cheerful", "Energetic", "Anxious", "Sluggish"], "a": 3, "e": "<b>Lethargic</b> = lacking energy; sluggish, drowsy. ‘Energetic’ is its antonym.", "f": null, "p": null}, {"s": "A", "t": "Antonyms", "q": "Select the most appropriate ANTONYM of the given word.<br><b>Benevolent</b>", "o": ["Generous", "Malevolent", "Kind", "Charitable"], "a": 1, "e": "<b>Benevolent</b> (bene = good) = well-meaning and kind. Its opposite is <b>malevolent</b> (male = bad), wishing harm to others.", "f": null, "p": null}, {"s": "A", "t": "Antonyms", "q": "Select the most appropriate ANTONYM of the given word.<br><b>Lucid</b>", "o": ["Transparent", "Clear", "Intelligible", "Obscure"], "a": 3, "e": "<b>Lucid</b> = clearly expressed and easy to understand. Clear, transparent and intelligible are synonyms; the antonym is <b>obscure</b>.", "f": null, "p": null}, {"s": "A", "t": "Spelling", "q": "Select the correctly spelt word.", "o": ["Bureacracy", "Burocracy", "Beaurocracy", "Bureaucracy"], "a": 3, "e": "Correct: <b>Bureau</b> + <b>cracy</b> = Bureaucracy (from French <i>bureau</i>, office).", "f": null, "p": null}, {"s": "A", "t": "Spelling", "q": "Select the INCORRECTLY spelt word.", "o": ["Committment", "Entrepreneur", "Questionnaire", "Mischievous"], "a": 0, "e": "The correct spelling is Co<b>mm</b>i<b>t</b>ment (single ‘t’ before -ment). Questionnaire, Entrepreneur and Mischievous are correctly spelt.", "f": null, "p": null}, {"s": "A", "t": "One Word Substitution", "q": "Select the option that can be used as a one-word substitute for the given group of words.<br>A place where bees are kept", "o": ["Granary", "Apiary", "Aquarium", "Aviary"], "a": 1, "e": "<b>Apiary</b> (Latin <i>apis</i> = bee). Aviary – birds; aquarium – fish; granary – grain ded by 15 days of self-enumeration). The reference date for population enumeration is 1 March 2027. It is the 16th Census and the 8th since Independence.", "f": null, "p": null}, {"s": "C", "t": "International", "q": "The 18th BRICS Summit was hosted by India at Bharat Mandapam, New Delhi on:", "o": ["12–13 September 2026", "22–24 October 2026", "6–7 July 2026", "1–2 February 2026"], "a": 0, "e": "India hosted the summit on <b>12–13 September 2026</b> under its 2026 chairship (its fourth), with the theme ‘Building for Resilience, Innovation, Cooperation and Sustainability’. The 17th summit was in Rio de Janeiro (2025).", "f": null, "p": null}, {"s": "C", "t": "International", "q": "COP31, the UN Climate Change Conference of November 2026, is being held in which city?", "o": ["Adelaide, Australia", "Baku, Azerbaijan", "Belém, Brazil", "Antalya, Türkiye"], "a": 3, "e": "COP31 (9–20 Nov 2026) is in <b>Antalya, Türkiye</b>, presided by Murat Kurum, with Australia’s Chris Bowen as President of Negotiations; the pre-COP was in Fiji.", "f": null, "p": null}, {"s": "C", "t": "International", "q": "António Guterres’s term as UN Secretary-General ends on 31 December 2026. Under which Article of the UN Charter is the next Secretary-General appointed by the General Assembly on the Security Council’s recommendation?", "o": ["Article 25", "Article 99", "Article 97", "Article 51"], "a": 2, "e": "<b>Article 97</b>: the Secretary-General is appointed by the General Assembly upon the recommendation of the Security Council. The 10th Secretary-General takes office on 1 January 2027. (Article 99 lets the SG bring threats to peace to the Security Council.)", "f": null, "p": null}, {"s": "C", "t": "Defence", "q": "Exercise ‘DUSTLIK 2026’ (7th edition), which concluded at Namangan in April 2026, is a joint military exercise between India and:", "o": ["Uzbekistan", "Tajikistan", "Kyrgyzstan", "Kazakhstan"], "a": 0, "e": "DUSTLIK (‘friendship’ in Uzbek) is the India–<b>Uzbekistan</b> exercise. KAZIND is with Kazakhstan, KHANJAR with Kyrgyzstan.", "f": null, "p": null}, {"s": "C", "t": "Defence", "q": "‘PRAGATI 2026’, the maiden multilateral military exercise of 13 Indian Ocean Region nations, was held in May 2026 at:", "o": ["Chaubattia, Uttarakhand", "Mahajan, Rajasthan", "Bakloh, Himachal Pradesh", "Umroi, Meghalaya"], "a": 3, "e": "PRAGATI (Partnership of Regional Armies for Growth and Transformation in IOR) 2026 concluded at <b>Umroi, Meghalaya</b> on 30 May 2026. Chaubattia hosted India–Japan ‘Dharma Guardian 2026’.", "f": null, "p": null}, {"s": "C", "t": "Defence", "q": "‘Nomadic Elephant 2026’ (18th edition), concluded at Pithoragarh in October 2026, is a joint exercise between India and:", "o": ["Bhutan", "Myanmar", "Mongolia", "Nepal"], "a": 2, "e": "Nomadic Elephant is the India–<b>Mongolia</b> exercise. Surya Kiran is with Nepal; Garuda Shakti 2026 (with Indonesia) concluded at Banyuwangi in November 2026.", "f": null, "p": null}, {"s": "C", "t": "Sports", "q": "Which country topped the medal table at the 2026 Winter Olympics held in Milan–Cortina, Italy?", "o": ["Norway", "Germany", "United States", "Italy"], "a": 0, "e": "<b>Norway</b> topped the table with 18 gold and 41 medals; the USA was second with 12 gold. Norway has now topped three Winter Games in a row.", "f": null, "p": null}, {"s": "C", "t": "Sports", "q": "India won the ICC Men’s T20 World Cup 2026, its third T20 world title, by defeating which team in the final at Ahmedabad on 8 March 2026?", "o": ["Australia", "England", "New Zealand", "South Africa"], "a": 2, "e": "India beat <b>New Zealand by 96 runs</b> at the Narendra Modi Stadium. Jasprit Bumrah (4/15) was Player of the Final and Sanju Samson Player of the Tournament.", "f": null, "p": null}, {"s": "C", "t": "Sports", "q": "Which team won the ICC Women’s T20 World Cup 2026, beating hosts England in the final at Lord’s?", "o": ["India", "South Africa", "New Zealand", "Australia"], "a": 3, "e": "<b>Australia</b> beat England by 7 wickets on 5 July 2026 to win a record seventh Women’s T20 World Cup; Beth Mooney top-scored with 64.", "f": null, "p": null}, {"s": "C", "t": "Sports", "q": "Who won the Orange Cap in IPL 2026, which was won by Royal Challengers Bengaluru?", "o": ["Vaibhav Sooryavanshi", "Shubman Gill", "Virat Kohli", "Sai Sudharsan"], "a": 0, "e": "RCB beat Gujarat Titans by 5 wickets in the final at Ahmedabad (31 May 2026) to win back-to-back titles. <b>Vaibhav Sooryavanshi</b> (Rajasthan Royals) won the Orange Cap with 776 runs; Kagiso Rabada won the Purple Cap (29 wickets).", "f": null, "p": null}, {"s": "C", "t": "Sports", "q": "Which country won the FIH Men’s Hockey World Cup 2026 held in Belgium and the Netherlands?", "o": ["Netherlands", "Spain", "Belgium", "Germany"], "a": 3, "e": "<b>Germany</b> beat Spain 1–0 in the final to win their fourth title, equalling Pakistan’s record. Argentina won the women’s title. India’s men finished eighth.", "f": null, "p": null}, {"s": "C", "t": "Sports", "q": "FIFA World Cup 2026 was won by Spain. In which stadium was the final played on 19 July 2026?", "o": ["BC Place, Vancouver", "New York New Jersey Stadium (MetLife), East Rutherford", "Estadio Azteca, Mexico City", "SoFi Stadium, Los Angeles"], "a": 1, "e": "Spain beat Argentina 1–0 after extra time at <b>New York New Jersey Stadium</b> (MetLife Stadium). The tournament, co-hosted by the USA, Canada and Mexico, was the first with 48 teams.", "f": null, "p": null}, {"s": "C", "t": "Sports", "q": "The 2026 Asian Games, in which India won 85 medals (21 gold) and finished fourth, were hosted by:", "o": ["Aichi–Nagoya, Japan", "Doha, Qatar", "Hangzhou, China", "Riyadh, Saudi Arabia"], "a": 0, "e": "The 20th Asian Games were held in <b>Aichi–Nagoya, Japan</b> (19 Sept–4 Oct 2026). Hangzhou hosted 2022; Doha will host 2030 and Riyadh 2034.", "f": null, "p": null}, {"s": "C", "t": "Sports", "q": "The 2026 Commonwealth Games, where India finished fourth with 39 medals, were held in:", "o": ["Birmingham", "Glasgow", "Victoria", "Gold Coast"], "a": 1, "e": "<b>Glasgow</b> (23 July–2 August 2026) hosted a reduced 10-sport Games. Birmingham hosted 2022; Ahmedabad will host 2030.", "f": null, "p": null}, {"s": "C", "t": "Sports", "q": "What is the name of the mascot of the 8th Khelo India Youth Games (December 2026, Telangana)?", "o": ["Ujjwala", "Neelamani", "Gajasimha", "Ashtalakshmi"], "a": 1, "e": "The logo and mascot <b>Neelamani</b> were unveiled on 15 Nov 2026 by Mansukh Mandaviya and CM A. Revanth Reddy. The Games will be held in six cities of Telangana from 11–22 Dec 2026.", "f": null, "p": null}, {"s": "C", "t": "Awards", "q": "Who received the Nobel Peace Prize 2026?", "o": ["María Corina Machado", "Nihon Hidankyo", "Narges Mohammadi", "Navi Pillay"], "a": 3, "e": "South African jurist <b>Navanethem ‘Navi’ Pillay</b>, former UN High Commissioner for Human Rights, won ‘for her efforts to promote peace and international law’. Machado (2025), Nihon Hidankyo (2024) and Mohammadi (2023) were earlier laureates.", "f": null, "p": null}, {"s": "C", "t": "Awards", "q": "The Nobel Prize in Chemistry 2026 (Henri B. Kagan and Kenso Soai) was awarded for work on:", "o": ["Click chemistry", "Computational protein design", "Non-linear effects and autocatalysis in asymmetric organic synthesis", "Metal–organic frameworks"], "a": 2, "e": "The prize recognised discoveries that drive reactions towards one mirror-image form (<b>molecular chirality</b>). MOFs won in 2025, protein design in 2024 and click chemistry in 2022.", "f": null, "p": null}, {"s": "C", "t": "Awards", "q": "The Nobel Prize in Physics 2026 was awarded for decisive contributions to which observatory and the discovery of high-energy astrophysical neutrinos?", "o": ["James Webb Space Telescope", "IceCube Neutrino Observatory", "Super-Kamiokande", "LIGO"], "a": 1, "e": "The prize (laureates include Francis Halzen) honoured the <b>IceCube Neutrino Observatory</b> at the South Pole and its discovery of high-energy neutrinos of astrophysical origin.", "f": null, "p": null}, {"s": "C", "t": "Awards", "q": "‘The End of Everything’, winner of the Booker Prize 2026, was written by:", "o": ["Douglas Stuart", "M. John Harrison", "David Szalay", "Marlon James"], "a": 1, "e": "<b>M. John Harrison</b> (81) won on 9 Nov 2026 — the oldest winner and the first from the science-fiction world. David Szalay won in 2025 for <i>Flesh</i>.", "f": null, "p": null}, {"s": "C", "t": "Awards", "q": "In March 2026, which Tamil poet-lyricist was named for the 60th Jnanpith Award (for 2025)?", "o": ["Gulzar", "Vinod Kumar Shukla", "Perumal Murugan", "R. Vairamuthu"], "a": 3, "e": "<b>R. Vairamuthu</b> became the third Tamil writer to receive the Jnanpith after Akilan (1975) and Jayakanthan (2002). Vinod Kumar Shukla received the 59th award.", "f": null, "p": null}, {"s": "C", "t": "Awards", "q": "Which Indian cricketer was conferred the Padma Shri in 2026 in the sports category, months after captaining India to the Women’s ODI World Cup title?", "o": ["Mithali Raj", "Smriti Mandhana", "Jhulan Goswami", "Harmanpreet Kaur"], "a": 3, "e": "<b>Harmanpreet Kaur</b> received the Padma Shri 2026 (sports). She led India to its first Women’s ODI World Cup title in November 2025.", "f": null, "p": null}, {"s": "D", "t": "Number Series", "q": "What should come in place of the question mark (?) in the given series?<br>5, 11, 23, 47, 95, ?", "o": ["191", "190", "189", "193"], "a": 0, "e": "Each term = previous × 2 + 1: 95 × 2 + 1 = <b>191</b>.", "f": null, "p": null}, {"s": "D", "t": "Number Series", "q": "What should come in place of the question mark (?) in the given series?<br>4, 9, 25, 49, 121, ?", "o": ["196", "169", "144", "225"], "a": 1, "e": "Squares of consecutive primes: 2², 3², 5², 7², 11², next 13² = <b>169</b>. (144 = 12² is a trap.)", "f": null, "p": null}, {"s": "D", "t": "Number Series", "q": "What should come in place of the question mark (?) in the given series?<br>6, 11, 21, 36, 56, ?", "o": ["71", "86", "76", "81"], "a": 3, "e": "Differences: 5, 10, 15, 20, next 25 ⇒ 56 + 25 = <b>81</b>.", "f": null, "p": null}, {"s": "D", "t": "Number Series", "q": "What should come in place of the question mark (?) in the given series?<br>1, 8, 27, 64, 125, ?", "o": ["225", "343", "216", "196"], "a": 2, "e": "Cubes: 1³, 2³, …, 5³; next 6³ = <b>216</b>.", "f": null, "p": null}, {"s": "D", "t": "Letter Series", "q": "What should come in place of the question mark (?) in the given series?<br>B, E, J, Q, ?", "o": ["X", "Y", "W", "Z"], "a": 3, "e": "Positions 2, 5, 10, 17 (differences +3, +5, +7). Next +9 ⇒ 26 = <b>Z</b>. (They are n² + 1.)", "f": null, "p": null}, {"s": "D", "t": "Letter Series", "q": "What should come in place of the question mark (?) in the given series?<br>AB, DE, HI, MN, ?", "o": ["ST", "TU", "RS", "QR"], "a": 0, "e": "Letters skipped between pairs: 1 (C), 2 (F G), 3 (J K L), next 4 (O P Q R) ⇒ <b>ST</b>.", "f": null, "p": null}, {"s": "D", "t": "Analogy", "q": "Select the option related to the third term in the same way as the second is related to the first.<br>Ornithology : Birds :: Entomology : ?", "o": ["Words", "Fishes", "Insects", "Reptiles"], "a": 2, "e": "Ornithology is the study of birds; <b>entomology</b> is the study of insects. (Etymology – words; ichthyology – fishes; herpetology – reptiles.)", "f": null, "p": null}, {"s": "D", "t": "Number Analogy", "q": "Select the number related to the third number in the same way as the second is related to the first.<br>13 : 170 :: 15 : ?", "o": ["196", "226", "240", "225"], "a": 1, "e": "13² + 1 = 170 ⇒ 15² + 1 = <b>226</b>.", "f": null, "p": null}, {"s": "D", "t": "Letter Analogy", "q": "Select the option related to the third letter-cluster in the same way as the second is related to the first.<br>CAT : DCW :: DOG : ?", "o": ["EPH", "FQJ", "EQJ", "EQI"], "a": 2, "e": "Shifts +1, +2, +3: C→D, A→C, T→W. So D→E, O→Q, G→J ⇒ <b>EQJ</b>.", "f": null, "p": null}, {"s": "D", "t": "Classification", "q": "Select the odd one out.<br>17, 29, 37, 51, 61", "o": ["29", "37", "51", "61"], "a": 2, "e": "All are prime except <b>51 = 3 × 17</b>.", "f": null, "p": null}, {"s": "D", "t": "Classification", "q": "Select the odd one out.", "o": ["Venus", "Moon", "Mars", "Mercury"], "a": 1, "e": "Mercury, Venus and Mars are planets; the <b>Moon</b> is a natural satellite.", "f": null, "p": null}, {"s": "D", "t": "Coding–Decoding", "q": "In a certain code language, TEACHER is written as VGCEJGT. How will STUDENT be written in that language?", "o": ["UVWFGOV", "UVWFGPV", "UVWEGPV", "TUVEFOU"], "a": 1, "e": "Each letter moves +2: T→V, E→G, A→C, C→E, H→J, E→G, R→T. STUDENT ⇒ <b>UVWFGPV</b>.", "f": null, "p": null}, {"s": "D", "t": "Coding–Decoding", "q": "In a certain code language, PUPIL is written as LIPUP. How will STUDENT be written in that language?", "o": ["TENDUTS", "STNEDUT", "TNEDUST", "TNEDUTS"], "a": 3, "e": "The word is written in <b>reverse order</b>: STUDENT ⇒ TNEDUTS.", "f": null, "p": null}, {"s": "D", "t": "Coding–Decoding", "q": "If the letters A to Z are numbered 1 to 26 and FACE = 90, what is BEAD?", "o": ["20", "40", "12", "60"], "a": 1, "e": "Code = product of positions: FACE = 6 × 1 × 3 × 5 = 90. BEAD = 2 × 5 × 1 × 4 = <b>40</b>. (12 is the sum – a trap.)", "f": null, "p": null}, {"s": "D", "t": "Blood Relation", "q": "Introducing a man, a woman says, “His wife is the only daughter of my father.” How is the man related to the woman?", "o": ["Brother-in-law", "Husband", "Brother", "Father-in-law"], "a": 1, "e": "The only daughter of her father is the woman herself. So the man’s wife is the woman ⇒ he is her <b>husband</b>.", "f": null, "p": null}, {"s": "D", "t": "Coded Blood Relation", "q": "P × Q means P is the father of Q; P + Q means P is the sister of Q; P − Q means P is the brother of Q. If A + B × C, how is A related to C?", "o": ["Grandmother", "Sister", "Mother", "Aunt (father’s sister)"], "a": 3, "e": "A + B: A is B’s sister. B × C: B is C’s father. So A is the sister of C’s father ⇒ C’s <b>aunt</b>.", "f": null, "p": null}, {"s": "D", "t": "Direction Sense", "q": "A man walks 5 km South, turns right and walks 3 km, then turns left and walks 5 km. In which direction is he now from his starting point?", "o": ["North-West", "South-West", "South-East", "South"], "a": 1, "e": "South 5 → (0, −5); right of South is West: 3 km → (−3, −5); left of West is South: 5 km → (−3, −10). He is West and South of the start ⇒ <b>South-West</b>.", "f": null, "p": null}, {"s": "D", "t": "Direction Sense", "q": "Facing North, Rina turns 90° clockwise, then 180° anticlockwise, and then 45° clockwise. Which direction is she facing now?", "o": ["West", "North-East", "North-West", "South-West"], "a": 2, "e": "North → (90° clockwise) East → (180° anticlockwise) West → (45° clockwise) <b>North-West</b>.", "f": null, "p": null}, {"s": "D", "t": "Ranking", "q": "In a row of girls, Rita is 12th from the left and Sita is 15th from the right. When they interchange places, Rita becomes 20th from the left. How many girls are there in the row?", "o": ["27", "34", "35", "32"], "a": 1, "e": "After interchange Rita takes Sita’s place: 20th from left and 15th from right ⇒ total = 20 + 15 − 1 = <b>34</b>.", "f": null, "p": null}, {"s": "D", "t": "Ranking", "q": "Among P, Q, R, S and T: P is taller than Q, R is shorter than S, T is taller than P, and S is shorter than Q. Who is the tallest?", "o": ["T", "P", "Q", "S"], "a": 0, "e": "T > P > Q > S > R ⇒ <b>T</b> is the tallest and R the shortest.", "f": null, "p": null}, {"s": "D", "t": "Seating Arrangement", "q": "Five persons A, B, C, D and E sit in a row facing North. B sits at the extreme left. D sits second to the right of B. C sits immediately to the right of D. A is not at either end. Who sits at the extreme right?", "o": ["C", "E", "A", "D"], "a": 1, "e": "Positions 1–5: B = 1, D = 3, C = 4. A is not at an end ⇒ A = 2. The remaining seat 5 goes to <b>E</b>.", "f": null, "p": null}, {"s": "D", "t": "Syllogism", "q": "Statements: Some pens are books. All books are papers.<br>Conclusions: I. Some pens are papers. II. All papers are pens.", "o": ["Only conclusion I follows", "Only conclusion II follows", "Both I and II follow", "Neither I nor II follows"], "a": 0, "e": "The pens that are books are also papers ⇒ I follows. Nothing says all papers are pens ⇒ II does not follow.", "f": null, "p": null}, {"s": "D", "t": "Syllogism", "q": "Statements: All roses are flowers. No flower is a tree.<br>Conclusions: I. No rose is a tree. II. Some trees are roses.", "o": ["Only conclusion I follows", "Only conclusion II follows", "Neither I nor II follows", "Both I and II follow"], "a": 0, "e": "Roses lie inside ‘flowers’, which has no overlap with ‘trees’ ⇒ no rose is a tree (I follows), and II is directly contradicted.", "f": null, "p": null}, {"s": "D", "t": "Statement & Assumption", "q": "Statement: “Join our coaching centre for guaranteed success in the OAVS examination.” — an advertisement.<br>Assumptions: I. Candidates want to succeed in the OAVS examination. II. All other coaching centres are useless.", "o": ["Only assumption I is implicit", "Both I and II are implicit", "Only assumption II is implicit", "Neither I nor II is implicit"], "a": 0, "e": "An advertisement promising success assumes candidates want success (I). It does not assume that all others are useless (II).", "f": null, "p": null}, {"s": "D", "t": "Calendar", "q": "15 August 2026 is a Saturday. What day of the week is 2 October 2026?", "o": ["Saturday", "Sunday", "Thursday", "Friday"], "a": 3, "e": "Days after 15 Aug: 16 (rest of August) + 30 (September) + 2 = 48 days = 6 weeks + 6 days ⇒ Saturday + 6 = <b>Friday</b>.", "f": null, "p": null}, {"s": "D", "t": "Clock", "q": "How many times in a day (24 hours) are the hour and minute hands of a clock at right angles?", "o": ["44", "22", "24", "48"], "a": 0, "e": "In 12 hours the hands are at right angles 22 times (twice every hour except around 3 and 9, where the two positions coincide). In 24 hours: 2 × 22 = <b>44</b>.", "f": null, "p": null}, {"s": "D", "t": "Water Image (Non-verbal)", "q": "Select the correct water image of the given word.", "o": ["@W", "@P", "@M", "@R"], "a": 0, "e": "A water image is formed by a horizontal mirror below the object: the letters turn <b>upside down</b> but keep their left-to-right order. Lateral flipping is the mirror image; flipping both ways is a 180° rotation.", "f": {"kind": "water", "text": "OAVS"}, "p": null}, {"s": "D", "t": "Dice (Non-verbal)", "q": "Two positions of the same dice are shown. Which number is on the face opposite to 1?", "o": ["3", "5", "2", "6"], "a": 2, "e": "In both positions 4 is on top. In (i) 1 is in front and 6 on the right; in (ii) 6 has moved to the front and 2 is on the right. The dice has turned so that right → front and back → right. So 2 was at the back in (i), i.e. opposite 1 ⇒ <b>2</b>.", "f": {"kind": "dice", "a": [4, 1, 6], "b": [4, 6, 2]}, "p": null}, {"s": "D", "t": "Counting Figures (Non-verbal)", "q": "How many squares are there in the given figure?", "o": ["9", "16", "14", "13"], "a": 2, "e": "Small squares (1 × 1): 9; 2 × 2 squares: 4; the whole 3 × 3 square: 1 ⇒ 9 + 4 + 1 = <b>14</b>.", "f": {"kind": "svg", "svg": "<svg viewBox=\"0 0 170 170\" width=\"170\" height=\"170\" role=\"img\" aria-label=\"3 by 3 grid\"><g fill=\"none\" stroke=\"#13294b\" stroke-width=\"2.4\"><rect x=\"10\" y=\"10\" width=\"150\" height=\"150\"/><line x1=\"60\" y1=\"10\" x2=\"60\" y2=\"160\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"160\"/><line x1=\"10\" y1=\"60\" x2=\"160\" y2=\"60\"/><line x1=\"10\" y1=\"110\" x2=\"160\" y2=\"110\"/></g></svg>"}, "p": null}, {"s": "D", "t": "Mathematical Operations", "q": "If 2 ★ 3 = 13 and 3 ★ 4 = 25, then 4 ★ 5 = ?", "o": ["41", "45", "20", "36"], "a": 0, "e": "a ★ b = a² + b²: 4 + 9 = 13, 9 + 16 = 25 ⇒ 16 + 25 = <b>41</b>.", "f": null, "p": null}, {"s": "E", "t": "Curriculum", "q": "The National Education Policy (NEP) 2020 replaces the 10+2 school structure with which pedagogical structure?", "o": ["3+5+3+4", "4+4+4+3", "5+3+3+4", "5+3+4+3"], "a": 2, "e": "NEP 2020 adopts <b>5+3+3+4</b>: Foundational (ages 3–8), Preparatory (8–11), Middle (11–14) and Secondary (14–18).", "f": null, "p": null}, {"s": "E", "t": "Curriculum", "q": "Under NEP 2020, the ‘Foundational Stage’ covers children of which age group?", "o": ["3 to 8 years", "6 to 10 years", "3 to 6 years", "5 to 9 years"], "a": 0, "e": "The Foundational Stage (5 years) = 3 years of pre-school/Anganwadi/Balvatika + Classes 1 and 2, i.e. <b>ages 3–8</b>.", "f": null, "p": null}, {"s": "E", "t": "Curriculum", "q": "The values, attitudes and behaviour that pupils learn unintentionally from the school environment and the teacher’s conduct form the:", "o": ["Core curriculum", "Hidden curriculum", "Spiral curriculum", "Null curriculum"], "a": 1, "e": "The <b>hidden curriculum</b> is the unwritten, unofficial learning (punctuality, obedience, gender roles…). The null curriculum is what is deliberately left out.", "f": null, "p": null}, {"s": "E", "t": "Curriculum", "q": "‘Learning by doing’ and a child-centred, experience-based curriculum are most closely associated with:", "o": ["B. F. Skinner", "Edward Thorndike", "Ivan Pavlov", "John Dewey"], "a": 3, "e": "John Dewey, the pragmatist philosopher, advocated experience and activity as the basis of learning (<i>Democracy and Education</i>, 1916). The project method was developed by his follower W. H. Kilpatrick.", "f": null, "p": null}, {"s": "E", "t": "Curriculum", "q": "The ‘Project Method’ of teaching, based on purposeful activity carried out in a natural setting, was developed by:", "o": ["H. E. Armstrong", "Maria Montessori", "Friedrich Froebel", "William H. Kilpatrick"], "a": 3, "e": "<b>W. H. Kilpatrick</b> (1918) defined a project as ‘a wholehearted purposeful activity proceeding in a social environment’. Armstrong gave the heuristic method; Froebel the kinderg   const tabs=SECS.map((s,k)=>`<button class="tab ${k===si?"on":""}" data-sec="${k}" title="${s[1]}: Q${secRange[k][0]+1}–${secRange[k][1]+1}">${s[1]}</button>`).join("");
  let grid=""; for(let k=a;k<=b;k++) grid+=`<button class="st ${S.status[k]} ${k===i?"cur":""}" data-q="${k}" aria-label="Question ${k+1}">${k+1}</button>`;
  const opts=q.o.map((o,k)=>`<label class="opt ${S.pending===k?"sel":""}"><input type="radio" name="opt" value="${k}" ${S.pending===k?"checked":""}><span>${optHTML(q,o)}</span></label>`).join("");
  app.innerHTML = `<div class="exam">${topbar(`Candidate: <b>${esc(S.name)}</b> &nbsp;|&nbsp; Roll No: ${esc(S.roll)}`)}
  <div class="exam-main">
    <section class="qpane">
      <div class="secbar pad"><span class="lbl">Sections</span><div class="tabs">${tabs}</div>
        <span class="timer" id="timer">Time Left: <b>--:--</b></span>
        <button class="btn palette-toggle" id="ptog" aria-controls="pal">Question Palette ›</button>
        <button class="btn btn-out" id="xlogout">Logout</button></div>
      <div class="qtype pad"><span>Question Type: <b>MCQ</b></span><span class="mk">Marks for correct answer: <span>${EXAM.plus}</span> &nbsp;|&nbsp; Negative Marks: <em>${EXAM.minus}</em></span></div>
      <div class="qhead pad"><h2>Question No. ${i+1}</h2><span class="lang">View in: <select aria-label="Language"><option>English</option></select><span class="fsz"><button class="btn" id="fsm" aria-label="Smaller text">A−</button><button class="btn" id="fsp" aria-label="Larger text">A+</button></span></span></div>
      <div class="qbody pad">${pasHTML(q)}<div class="qtext">${q.q}</div>${figHTML(q)}<div class="opts" role="radiogroup" aria-label="Options">${opts}</div></div>
      <div class="actions pad"><div class="l"><button class="btn" id="mark">Mark for Review &amp; Next</button><button class="btn" id="clear">Clear Response</button></div>
        <button class="btn btn-primary" id="save">Save &amp; Next</button></div>
    </section>
    <aside class="palette" id="pal">
      <div class="cand">${PHOTO}<div style="flex:1;min-width:0"><div class="nm">${esc(S.name)}</div><div class="roll">Roll No: ${esc(S.roll)}</div></div><button class="btn palette-toggle" id="pclose" aria-label="Close palette">×</button></div>
      <div class="legend">
        <div class="it"><span class="st sm an">${c.an}</span>Answered</div>
        <div class="it"><span class="st sm na">${c.na}</span>Not Answered</div>
        <div class="it"><span class="st sm nv">${c.nv}</span>Not Visited</div>
        <div class="it"><span class="st sm mk">${c.mk}</span>Marked for Review</div>
        <div class="it wide"><span class="st sm am">${c.am}</span>Answered &amp; Marked for Review (will also be evaluated)</div>
      </div>
      <div class="pal-sec">${SECS[si][1]}</div>
      <div class="pal-choose">Choose a Question</div>
      <div class="grid">${grid}</div>
      <div class="pal-foot"><button class="btn" id="qp">Question Paper</button><button class="btn" id="ins">Instructions</button><button class="btn btn-green" id="sub">Submit</button></div>
    </aside>
  </div>${footer()}</div>`;
  app.querySelectorAll('input[name="opt"]').forEach(r=>{
    r.addEventListener("click",e=>{const v=+e.target.value; if(S.pending===v){S.pending=null;e.target.checked=false;} else S.pending=v; app.querySelectorAll(".opt").forEach((l,k)=>l.classList.toggle("sel",S.pending===k)); persist();});
  });
  app.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{go(secRange[+t.dataset.sec][0]);});
  app.querySelectorAll(".grid .st").forEach(t=>t.onclick=()=>{go(+t.dataset.q);});
  $("#save").onclick=()=>{ if(S.pending!==null){S.saved[i]=S.pending;S.status[i]="an";} else {S.saved[i]=null;S.status[i]="na";} next(); };
  $("#mark").onclick=()=>{ if(S.pending!==null){S.saved[i]=S.pending;S.status[i]="am";} else {S.saved[i]=null;S.status[i]="mk";} next(); };
  $("#clear").onclick=()=>{ S.pending=null; S.saved[i]=null; S.status[i]="na"; persist(); renderExam(); };
  $("#sub").onclick=()=>confirmSubmit();
  $("#qp").onclick=()=>showQP();
  $("#ins").onclick=()=>modal("Instructions", instrHTML(), `<button class="btn btn-primary" data-close>Close</button>`);
  $("#ptog").onclick=()=>$("#pal").classList.add("open");
  $("#fsm").onclick=()=>{S.fs=Math.max(0.85,+((S.fs||1)-0.1).toFixed(2));applyFs();persist();};
  $("#fsp").onclick=()=>{S.fs=Math.min(1.4,+((S.fs||1)+0.1).toFixed(2));applyFs();persist();};
  $("#xlogout").onclick=()=>examLogout();
  $("#pclose").onclick=()=>$("#pal").classList.remove("open");
  updateTimer();
}
function applyFs(){ document.documentElement.style.setProperty("--fs", S.fs||1); }
function examLogout(){
  const d=modal("Logout", `<p>Do you want to leave the test?</p><ul style="line-height:1.7;padding-left:20px"><li><b>Submit &amp; Logout</b> — your test is submitted and you will see your score card and solutions.</li><li><b>Exit without saving</b> — this attempt is cleared from this device and the login screen opens.</li></ul>`,
    `<button class="btn" data-close>Cancel</button><button class="btn btn-out" id="lx">Exit without saving</button><button class="btn btn-primary" id="ls">Submit &amp; Logout</button>`);
  $("#ls",d).onclick=()=>{d.remove(); finish(false);};
  $("#lx",d).onclick=()=>{d.remove(); clearInterval(tick); tick=null; S=fresh(); try{localStorage.removeItem(KEY);}catch(e){} render();};
}
function go(k){ visit(k); persist(); renderExam(); const qb=$(".qbody"); if(qb) qb.scrollTop=0; }
function next(){ go(S.cur < QS.length-1 ? S.cur+1 : 0); }
function updateTimer(){
  const left=Math.max(0, S.endAt-Date.now()), m=Math.floor(left/60000), s=Math.floor(left/1000)%60;
  const t=$("#timer"); if(t){ t.innerHTML=`Time Left: <b>${pad2(m)}:${pad2(s)}</b>`; t.classList.toggle("low", left<5*60000); }
  if(S.stage==="exam"){
    if(left<=10*60000 && left>5*60000 && !S.w10){ S.w10=true; persist(); toast("Only 10 minutes left. Review your marked questions."); }
    if(left<=5*60000 && left>0 && !S.w5){ S.w5=true; persist(); toast("Only 5 minutes left! The test will be submitted automatically at 00:00."); }
  }
  if(left<=0 && S.stage==="exam"){ finish(true); }
}

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),6000); }
/* ---------- MODALS ---------- */
function modal(title, body, foot){
  const d=document.createElement("div"); d.className="scrim";
  d.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><span>${title}</span><button data-close aria-label="Close">×</button></div><div class="modal-b">${body}</div>${foot?`<div class="modal-f">${foot}</div>`:""}</div>`;
  document.body.appendChild(d);
  d.addEventListener("click",e=>{ if(e.target===d || e.target.hasAttribute("data-close")) d.remove(); });
  return d;
}
function summaryTable(){
  let rows="", T={an:0,na:0,nv:0,mk:0,am:0,n:0};
  SECS.forEach((s,k)=>{const [a,b]=secRange[k], c=counts(a,b), n=b-a+1; for(const x in c) T[x]+=c[x]; T.n+=n;
    rows+=`<tr><td>${s[1]}</td><td>${n}</td><td>${c.an}</td><td>${c.na}</td><td>${c.mk}</td><td>${c.am}</td><td>${c.nv}</td></tr>`;});
  rows+=`<tr class="tot"><td>Total</td><td>${T.n}</td><td>${T.an}</td><td>${T.na}</td><td>${T.mk}</td><td>${T.am}</td><td>${T.nv}</td></tr>`;
  return `<div class="tbl-wrap"><table class="sumtbl"><thead><tr><th>Section Name</th><th>No. of Questions</th><th>Answered</th><th>Not Answered</th><th>Marked for Review</th><th>Answered &amp; Marked for Review (will be evaluated)</th><th>Not Visited</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function confirmSubmit(){
  const d=modal("Exam Summary", summaryTable()+`<p style="margin:14px 0 0;font-weight:700;text-align:center">Are you sure you want to submit for final marking? No changes will be allowed after submission.</p>`,
    `<button class="btn" data-close>No</button><button class="btn btn-primary" id="yes">Yes</button>`);
  $("#yes",d).onclick=()=>{d.remove(); finish(false);};
}
function showQP(){
  const body=QS.map((q,k)=>`<div class="qp-item"><span class="n">Q${k+1}.</span> <span class="note">[${SECS[secOf(k)][1]}]</span>${q.p&&(k===0||QS[k-1].p!==q.p)?pasHTML(q):""}<div>${q.q}</div>${figHTML(q)}<div class="note">${q.o.map((o,j)=>`(${j+1}) ${q.f&&o[0]==="@"?optHTML(q,o):o}`).join(" &nbsp; ")}</div></div>`).join("");
  modal("Question Paper", body, `<button class="btn btn-primary" data-close>Close</button>`);
}
function finish(auto){
  if(S.stage!=="exam") return;
  S.stage="result"; S.submittedAt=Math.min(Date.now(), S.endAt); persist();
  clearInterval(tick); tick=null;
  render();
  if(auto) modal("Time Over", `<p>Your time is over. The test has been submitted automatically.</p>`, `<button class="btn btn-primary" data-close>View Result</button>`);
}

/* ---------- RESULT ---------- */
function evalAll(){
  const per=SECS.map(()=>({n:0,c:0,w:0,u:0}));
  let c=0,w=0,u=0;
  QS.forEach((q,k)=>{const p=per[secOf(k)]; p.n++; const a=S.saved[k];
    if(a===null||a===undefined){u++;p.u++;} else if(a===q.a){c++;p.c++;} else {w++;p.w++;}});
  return {c,w,u,per,score:c*EXAM.plus-w*EXAM.minus};
}
function fmtDur(ms){const t=Math.round(ms/1000);return `${Math.floor(t/60)} min ${pad2(t%60)} s`;}
function renderResult(){
  const R=evalAll(), att=R.c+R.w, acc=att?Math.round(R.c/att*100):0, pct=Math.max(0,R.score)/QS.length;
  const C=2*Math.PI*62;
  const sc=k=>{const p=R.per[k];return p.c*EXAM.plus-p.w*EXAM.minus;};
  const eng=sc(0), odi=sc(1), p1=eng+odi, merit=sc(2)+sc(3)+sc(4), qual=(eng>=5&&odi>=5&&p1>=13);
  const qualHTML=`<div class="qual ${qual?"ok":"bad"}"><b>Part-I (qualifying):</b> English ${fmt(eng)}/20 · Odia ${fmt(odi)}/20 · Total ${fmt(p1)}/40 — ${qual?"<b style=\"color:var(--ok)\">QUALIFIED</b>":"<b style=\"color:var(--bad)\">NOT QUALIFIED</b> (need 5 in each and 13 in aggregate)"}<br><b>Merit score (Current Affairs + Reasoning + Methodology):</b> <b class="big">${qual?fmt(merit):"—"}</b>${qual?" / 80":" (the rest is not evaluated if Part-I is not cleared; your unofficial score in these sections is "+fmt(merit)+"/80)"}</div>`;
  const verdict = (qual?(merit>=55?"Strong! 55+ out of 80 in the scoring compulsory sections gives you a solid base. ":"Target 55+ out of 80 in Current Affairs, Reasoning and Methodology — these marks decide the merit list along with your subject. "):"First secure Part-I: it is qualifying, and a weak Odia/English score can cancel your whole paper. ") + (pct>=0.75?"Excellent preparation — revise the few explanations you missed.":
    pct>=0.6?"Good attempt. Work on the sections with the lowest score below, then take the next mock.":
    pct>=0.4?"Fair. Go through every explanation carefully; these topics repeat in every OAVS paper.":
    "Keep practising. Study the solutions section by section and retake the test after revision.");
  const bars=SECS.map((s,k)=>{const p=R.per[k], v=p.c/p.n*100; return `<div class="sb"><span>${s[1]}</span><span class="bar" role="img" aria-label="${p.c} of ${p.n}"><i style="width:${v}%"></i></span><span class="pc">${p.c}/${p.n}</span></div>`;}).join("");
  const sec=SECS.map((s,k)=>{const p=R.per[k];return `<tr><td>${s[1]}</td><td>${p.n}</td><td>${p.c+p.w}</td><td style="color:var(--ok);font-weight:700">${p.c}</td><td style="color:var(--bad);font-weight:700">${p.w}</td><td>${p.u}</td><td><b>${fmt(p.c*EXAM.plus-p.w*EXAM.minus)}</b></td></tr>`}).join("");
  app.innerHTML = `<div class="screen">${topbar(`Candidate: <b>${esc(S.name)}</b> &nbsp;|&nbsp; Roll No: ${esc(S.roll)}`)}
  <main class="result pad">
    <section class="rcard">
      <div class="rhead"><h2>Score Card — ${EXAM.test}</h2><span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="note">Submitted: ${new Date(S.submittedAt).toLocaleString("en-IN")}</span><span class="ractions"><a class="btn btn-wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent("I scored "+fmt(R.score)+"/"+QS.length+" in the GES OAVS 2026 Compulsory Paper "+EXAM.test+" (TCS pattern CBT). Try it free: "+location.href.split("#")[0])}">Share score</a><button class="btn" id="print">Print / Save PDF</button><button class="btn" id="logout">Logout</button></span></span></div>
      <div class="score-row">
        <div class="ring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" fill="none" stroke="#e3e6ea" stroke-width="14"/><circle cx="75" cy="75" r="62" fill="none" stroke="#1167b1" stroke-width="14" stroke-dasharray="${C*pct} ${C}" stroke-linecap="butt"/></svg>
          <div class="c"><div><b>${fmt(R.score)}</b><span>out of ${QS.length}</span></div></div></div>
        <div class="stats">
          <div class="stat ok"><div class="k">Correct</div><div class="v">${R.c}</div></div>
          <div class="stat bad"><div class="k">Wrong</div><div class="v">${R.w}</div></div>
          <div class="stat"><div class="k">Not attempted</div><div class="v">${R.u}</div></div>
          <div class="stat bad"><div class="k">Negative marks</div><div class="v">−${fmt(R.w*EXAM.minus)}</div></div>
          <div class="stat"><div class="k">Accuracy</div><div class="v">${acc}%</div></div>
          <div class="stat"><div class="k">Time taken</div><div class="v" style="font-size:16px">${fmtDur(S.submittedAt-S.startedAt)}</div></div>
          <div class="stat"><div class="k">Percentage</div><div class="v">${(pct*100).toFixed(1)}%</div></div>
        </div>
      </div>
      ${qualHTML}<div class="verdict">${verdict}</div>
      ${topicsHTML()}
      <div class="secbars">${bars}</div>
      <div class="pad" style="padding-bottom:16px"><div class="tbl-wrap"><table class="sumtbl"><thead><tr><th>Section</th><th>Questions</th><th>Attempted</th><th>Correct</th><th>Wrong</th><th>Not attempted</th><th>Score</th></tr></thead><tbody>${sec}</tbody></table></div></div>
      <div class="cta"><span>Want more 120-mark compulsory mock tests, 2026 current affairs sets and PYQs for <b>OAVS PGT &amp; TGT 2026</b>? Join the GES OAVS Compulsory 120 Marks preparation group (one-time ₹500).</span>
        <span class="ractions"><a class="btn btn-wa" target="_blank" rel="noopener" href="https://wa.me/919776188019?text=${encodeURIComponent("Hello Sir, I took the GES OAVS Compulsory Paper "+EXAM.test+" and scored "+fmt(R.score)+"/"+QS.length+". I want to join the OAVS preparation group.")}">Join on WhatsApp</a></span></div>
    </section>
    <section class="rcard" id="sols">
      <div class="rhead"><h2>Solutions &amp; Explanations</h2><button class="btn" id="retake">Retake Test</button></div>
      <div class="filters" id="filters"></div>
      <div id="sollist"></div>
    </section>
  </main>${footer()}</div>`;
  $("#print").onclick=()=>{ try{ window.print(); }catch(e){} };
  $("#logout").onclick=()=>{
    const d=modal("Logout", `<p>You will be logged out and this result will be cleared from this device. The next candidate can then sign in with a new name.</p>`, `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="lo">Logout</button>`);
    $("#lo",d).onclick=()=>{S=fresh(); try{localStorage.removeItem(KEY);}catch(e){} d.remove(); render();};
  };
  $("#retake").onclick=()=>{
    const d=modal("Retake Test", `<p>Your current answers and score will be cleared and a fresh ${EXAM.minutes}-minute test will start from the login screen.</p>`, `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="rt">Clear and retake</button>`);
    $("#rt",d).onclick=()=>{const nm=S.name, rl=S.roll; S=fresh(); S.name=nm; S.roll=rl; persist(); d.remove(); render(); window.scrollTo(0,0);};
  };
  renderSolutions();
}
function topicsHTML(){
  const m={};
  QS.forEach((q,k)=>{ const a=S.saved[k]; const miss = a===null||a===undefined||a!==q.a; const t=q.t.replace(/\s*\(.*\)$/,"").replace(/\s*–.*$/,""); if(!m[t]) m[t]={miss:0,n:0}; m[t].n++; if(miss) m[t].miss++; });
  const list=Object.entries(m).filter(([t,v])=>v.miss>0).sort((x,y)=>y[1].miss-x[1].miss||x[0].localeCompare(y[0])).slice(0,12);
  if(!list.length) return `<div class="topics"><h3>Topics to revise</h3><p class="note">No weak topics — every question was answered correctly!</p></div>`;
  return `<div class="topics"><h3>Topics to revise (wrong or not attempted)</h3><div class="tchips">${list.map(([t,v])=>`<span class="tchip">${esc(t)} · <b>${v.miss}/${v.n}</b></span>`).join("")}</div></div>`;
}
function renderSolutions(){
  const F=[["all","All"],["wrong","Wrong"],["skip","Not attempted"],["right","Correct"]];
  const secs=[["all","All sections"]].concat(SECS.map(s=>[s[0],s[1]]));
  $("#filters").innerHTML = F.map(f=>`<button class="chip ${S.filter===f[0]?"on":""}" data-f="${f[0]}">${f[1]}</button>`).join("") +
    `<span style="width:10px"></span>` + secs.map(s=>`<button class="chip ${S.fsec===s[0]?"on":""}" data-s="${s[0]}">${s[1]}</button>`).join("");
  $("#filters").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;persist();renderSolutions();});
  $("#filters").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.fsec=b.dataset.s;persist();renderSolutions();});
  let html="";
  QS.forEach((q,k)=>{
    const a=S.saved[k], st = a===null||a===undefined ? "skip" : (a===q.a?"right":"wrong");
    if(S.filter!=="all" && S.filter!==st) return;
    if(S.fsec!=="all" && S.fsec!==q.s) return;
    const pill = st==="right"?`<span class="pill ok">Correct +${EXAM.plus}</span>`:st==="wrong"?`<span class="pill bad">Wrong</span>`:`<span class="pill skip">Not attempted</span>`;
    const opts=q.o.map((o,j)=>{const cls=j===q.a?"right":(j===a?"wrong":""); const tag=j===q.a?"Correct answer":(j===a?"Your answer":""); return `<div class="sopt ${cls}"><span class="L">${j+1}.</span><span>${optHTML(q,o)}</span>${tag?`<span class="tag">${tag}${j===q.a&&j===a?" · Your answer":""}</span>`:""}</div>`;}).join("");
    html+=`<article class="sol"><div class="sol-top"><span><b style="color:var(--ink)">Q${k+1}</b> · ${SECS[secOf(k)][1]} · ${q.t}</span>${pill}</div>
      ${pasHTML(q,false)}<div class="qtext">${q.q}</div>${figHTML(q)}<div class="sopts">${opts}</div><div class="exp"><h4>Explanation</h4>${q.e}</div></article>`;
  });
  $("#sollist").innerHTML = html || `<p class="empty">No questions match this filter.</p>`;
}

/* ---------- ROUTER ---------- */
const app=$("#app");
document.addEventListener("click",e=>{ const im=e.target.closest&&e.target.closest(".figimg"); if(!im) return; modal("Figure (scroll / pinch to zoom)", `<div class="zoomwrap"><img alt="Enlarged figure" src="${im.getAttribute("src")}"></div>`, `<button class="btn btn-primary" data-close>Close</button>`); });
function render(){
  window.scrollTo(0,0); applyFs();
  if(S.stage==="exam" && S.endAt && Date.now()>=S.endAt){ finish(true); return; }
  if(S.stage==="login") renderLogin();
  else if(S.stage==="instr") renderInstr();
  else if(S.stage==="exam"){ if(S.pending===undefined) S.pending=S.saved[S.cur]; renderExam(); if(!tick) tick=setInterval(updateTimer,1000); }
  else renderResult();
}
render();
</script>
</body>
</html>
